<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>At the cafe - explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   At the cafe - explainer prototype
   Board look: bold flat colour blocks, ink outlines, hand-drawn
   characters, black pill buttons, springy motion under 400 ms.
   One block colour per screen: sun. Ink and cream do the rest.
   --------------------------------------------------------------- */
:root{
  --sun:#FFD93D;
  --ink:#121212;
  --cream:#FFF7E8;
  --paper:#FFFFFF;

  --page:var(--cream);
  --on-page:var(--ink);
  --btn-bg:var(--ink);
  --btn-fg:var(--cream);
  --soft:rgba(18,18,18,.14);

  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.7,.3,1);
}
html[data-theme="dark"]{
  --page:#121212;
  --on-page:#FFF7E8;
  --btn-bg:var(--sun);
  --btn-fg:var(--ink);
  --soft:rgba(255,247,232,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  background:var(--page);
  color:var(--on-page);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:600;
  transition:background .3s var(--ease),color .3s var(--ease);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--on-page);outline-offset:3px;border-radius:12px}
.stage :focus-visible{outline-color:var(--ink)}

/* ---------- shell ---------- */
.app{
  height:100dvh;height:100vh;
  max-width:430px;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;flex:0 0 auto;height:44px}
.icon-btn{
  width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--on-page);
  display:grid;place-items:center;flex:0 0 auto;
  transition:transform .28s var(--spring),background .2s var(--ease);
}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--on-page);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.title{
  flex:1;text-align:center;font-weight:800;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;opacity:.75;
}

/* ---------- stage ---------- */
.stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{
  position:relative;width:100%;aspect-ratio:360/480;max-height:100%;
  background:var(--sun);
  border:3px solid var(--ink);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 10px 0 -2px rgba(18,18,18,.18);
  animation:popIn .4s var(--spring) both;
}
@keyframes popIn{0%{transform:scale(.92) translateY(14px);opacity:0}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- hand-drawn ink defaults ---------- */
.ink{fill:none;stroke:#121212;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:#121212}
.cream{fill:#FFF7E8;stroke:#121212;stroke-width:3.2;stroke-linejoin:round}
.paper{fill:#FFFFFF;stroke:#121212;stroke-width:3.2;stroke-linejoin:round}
.sun{fill:#FFD93D;stroke:#121212;stroke-width:3.2;stroke-linejoin:round}

/* groups animate from the beat attribute, so scrubbing is always correct */
#g-wall,#g-counter,#g-leo,#g-you,#g-maya,#g-bubble,#g-cup,#g-star{
  transition:transform .36s var(--spring),opacity .3s var(--ease);
}
#g-wall,#g-counter,#g-leo,#g-you{transform-box:fill-box;transform-origin:center}
#g-maya{transform-box:view-box}

/* beat 0: the room draws itself in */
.stage[data-beat="0"] #g-leo{transform:translateY(0)}
#g-you{transform:translateY(0)}
.stage[data-beat="0"] #g-maya{opacity:0;transform:translate(276px,470px) scale(.6)}
#g-maya{opacity:0;transform:translate(276px,470px) scale(.6)}
.stage[data-beat="2"] #g-maya,
.stage[data-beat="3"] #g-maya,
.stage[data-beat="4"] #g-maya{opacity:1;transform:translate(276px,238px) scale(.78)}
.stage[data-beat="5"] #g-maya{opacity:1;transform:translate(184px,250px) scale(1.18)}

/* beat 5: the cafe steps back so the coach is the only thing to look at */
.stage[data-beat="5"] #g-wall,
.stage[data-beat="5"] #g-counter,
.stage[data-beat="5"] #g-leo,
.stage[data-beat="5"] #g-you{opacity:.22}

/* speech bubble from "you" */
#g-bubble{opacity:0;transform-box:fill-box;transform-origin:85% 100%;transform:scale(.3)}
.stage[data-beat="1"] #g-bubble{opacity:1;transform:scale(1)}

/* the cup Leo hands over */
#g-cup{opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(10px) scale(.4)}
.stage[data-beat="4"] #g-cup,.stage[data-beat="5"] #g-cup{opacity:1;transform:none}

/* mouths */
.mouth{transform-box:fill-box;transform-origin:center}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
.stage[data-beat="1"] #you-mouth,
.stage[data-beat="2"] #maya-mouth,
.stage[data-beat="3"] #maya-mouth,
.stage[data-beat="4"] #leo-mouth{animation:talk .3s infinite var(--ease)}

/* Maya's pointing arm and her listening ear */
#maya-arm{transform-box:fill-box;transform-origin:14% 14%;transition:transform .36s var(--spring)}
.stage[data-beat="2"] #maya-arm,.stage[data-beat="3"] #maya-arm{transform:rotate(-26deg)}
.stage[data-beat="5"] #maya-arm{transform:rotate(8deg)}
#maya-ear{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3);transition:all .34s var(--spring)}
.stage[data-beat="5"] #maya-ear{opacity:1;transform:none}

/* idle: everyone breathes */
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#g-leo{animation:breathe 2.6s infinite var(--ease)}
#g-you{animation:breathe 3.1s .4s infinite var(--ease)}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.6);opacity:.35}}
.sticker{transform-box:fill-box;transform-origin:center;animation:twinkle 4s infinite var(--ease)}
.sticker:nth-of-type(2n){animation-delay:1.3s}
.sticker:nth-of-type(3n){animation-delay:2.4s}

/* the star that pops when the learner says it */
#g-star{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2) rotate(-40deg)}
.stage.won #g-star{opacity:1;transform:scale(1) rotate(0)}

/* ---------- the line, the only text in the picture ---------- */
.strip{
  position:absolute;left:14px;right:14px;bottom:14px;
  min-height:92px;padding:14px 16px;
  background:var(--cream);
  border:3px solid var(--ink);border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s var(--spring);
}
.stage[data-beat="4"] .strip{transform:scale(1.03)}
.line{
  margin:0;color:var(--ink);
  font-size:25px;font-weight:800;line-height:1.12;letter-spacing:-.01em;
  text-align:center;text-wrap:balance;
}
.w{
  display:inline-block;margin:0 .12em;
  opacity:0;transform:translateY(10px) scale(.86);
  transition:opacity .26s var(--ease),transform .3s var(--spring);
  transition-delay:0s;
}
.line.show .w{opacity:1;transform:none}
.w[hidden]{display:none}
.comma{font-style:normal;opacity:0;transition:opacity .2s var(--ease)}
.line.commas .comma{opacity:1}
.w.struck{position:relative;opacity:.4}
.w.struck::after{
  content:"";position:absolute;left:-4%;top:52%;width:0;height:3px;
  background:var(--ink);border-radius:3px;transition:width .3s var(--ease) .1s;
}
.line.cross .w.struck::after{width:108%}
/* word by word: each word waits its turn */
.line.build .w{transition-delay:calc(var(--i) * .62s + .35s)}
@keyframes linePulse{0%,100%{transform:none}45%{transform:scale(1.05)}}
.stage[data-beat="4"] .line.show{animation:linePulse .5s var(--spring)}

/* interim speech from the learner, over the coach */
.heard{
  position:absolute;left:16px;right:16px;top:14px;
  padding:10px 14px;border-radius:18px;
  background:var(--paper);border:3px solid var(--ink);color:var(--ink);
  font-size:15px;font-weight:700;text-align:center;
  opacity:0;transform:translateY(-8px) scale(.9);pointer-events:none;
  transition:all .3s var(--spring);
}
.heard.on{opacity:1;transform:none}

/* ---------- beat bar ---------- */
.beats{display:flex;gap:6px;flex:0 0 auto;height:46px}
.beat{
  position:relative;flex:1 1 0;height:100%;
  border:2.5px solid var(--on-page);border-radius:999px;
  overflow:hidden;background:transparent;
  transition:transform .28s var(--spring);
  display:grid;place-items:center;
}
.beat:active{transform:scale(.95)}
.beat .fillbar{
  position:absolute;inset:0;right:auto;width:0;
  background:var(--on-page);
}
.beat[data-state="done"] .fillbar{width:100%}
.beat .num{
  position:relative;font-size:14px;font-weight:800;
  color:var(--on-page);mix-blend-mode:difference;filter:invert(1) grayscale(1) contrast(9);
}
.beat[data-state="now"]{box-shadow:0 0 0 2.5px var(--on-page)}

/* ---------- action area ---------- */
.actions{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;min-height:120px;justify-content:flex-end}
.pill{
  height:56px;width:100%;border-radius:999px;
  background:var(--btn-bg);color:var(--btn-fg);
  font-size:18px;font-weight:800;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .28s var(--spring),background .25s var(--ease);
}
.pill:active{transform:scale(.96)}
.pill svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill .chev{margin-left:2px;font-weight:800}
.pill.listening{animation:pulse 1.1s infinite var(--ease)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.hint{
  height:24px;display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:14px;font-weight:700;opacity:.8;text-align:center;
}
.linkbtn{text-decoration:underline;text-underline-offset:4px;font-weight:800;padding:4px 6px}
.typerow{display:flex;gap:8px}
.typerow[hidden]{display:none}
.typerow input{
  flex:1;height:52px;border-radius:999px;padding:0 20px;
  border:2.5px solid var(--on-page);background:transparent;color:var(--on-page);
  font:700 16px "Plus Jakarta Sans",sans-serif;
}
.typerow input::placeholder{color:var(--on-page);opacity:.45}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important}
}
/* short phones: the picture gives up height first */
@media (max-height:720px){
  .strip{min-height:78px}.line{font-size:21px}.actions{min-height:112px}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <button class="icon-btn" id="back" aria-label="Back to the lesson">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h1 class="title">At the cafe</h1>
    <button class="icon-btn" id="sound" aria-label="Sound on" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h3l4 4V5L8 9H5Z"/><path class="wave" d="M16 9.5a4 4 0 0 1 0 5"/></svg>
    </button>
    <button class="icon-btn" id="theme" aria-label="Dark mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage" data-beat="0">
      <svg class="scene" viewBox="0 0 360 480" role="img" aria-labelledby="sceneTitle">
        <title id="sceneTitle">Leo the barista and you at the cafe counter, with Maya the coach</title>
        <defs>
          <filter id="wob" x="-6%" y="-6%" width="112%" height="112%">
            <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="9" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <clipPath id="cardClip"><rect x="0" y="0" width="360" height="480" rx="25"/></clipPath>
        </defs>

        <g clip-path="url(#cardClip)" filter="url(#wob)">

          <!-- back wall: lamp, shelf, menu -->
          <g id="g-wall">
            <path class="ink" d="M300 0v44"/>
            <path class="sun" d="M278 46h44l-12 24h-20Z"/>
            <circle class="ink" cx="300" cy="78" r="7"/>
            <path class="ink" d="M24 112h312"/>
            <path class="cream" d="M58 86h26l-3 24H61Z"/>
            <path class="cream" d="M104 88h24l-3 22h-18Z"/>
            <path class="cream" d="M300 86h26l-3 24h-20Z"/>
            <rect class="paper" x="26" y="40" width="92" height="60" rx="12"/>
            <path class="ink" d="M42 60h44M42 72h58M42 84h30"/>
            <circle class="fill sticker" cx="166" cy="52" r="5"/>
            <path class="fill sticker" d="M214 34l5 11 11 5-11 5-5 11-5-11-11-5 11-5Z"/>
            <path class="ink sticker" d="M136 148c6-8 14-4 10 4"/>
          </g>

          <!-- counter, machine -->
          <g id="g-counter">
            <rect class="cream" x="186" y="236" width="88" height="84" rx="12"/>
            <circle class="ink" cx="208" cy="260" r="8"/>
            <circle class="ink" cx="232" cy="260" r="8"/>
            <path class="ink" d="M206 288h48M230 296v14"/>
            <path class="cream" d="M4 318h352v26H4Z"/>
            <path class="cream" d="M14 344h332v140H14Z"/>
            <path class="ink" d="M14 382h332"/>
          </g>

          <!-- Leo the barista -->
          <g id="g-leo">
            <path class="cream" d="M62 318c0-34 16-52 40-52s40 18 40 52Z"/>
            <path class="ink" d="M86 282v36M118 282v36"/>
            <path class="cream" d="M80 232c0-20 10-30 22-30s22 10 22 30-10 30-22 30-22-10-22-30Z"/>
            <path class="fill" d="M78 214c2-20 14-28 24-28s22 8 24 28c-8-8-16-10-24-10s-16 2-24 10Z"/>
            <circle class="fill" cx="93" cy="230" r="3.6"/>
            <circle class="fill" cx="113" cy="230" r="3.6"/>
            <ellipse id="leo-mouth" class="fill mouth" cx="103" cy="246" rx="7" ry="4.6"/>
            <path class="ink" d="M86 220l10-3M110 217l10 3"/>
            <path class="ink" d="M140 278c14 2 20 10 20 22"/>
            <g id="g-cup">
              <path class="paper" d="M150 294h30l-4 26h-22Z"/>
              <path class="ink" d="M152 300h26"/>
              <path class="ink" d="M160 286c-3-6 2-8 0-14M172 286c-3-6 2-8 0-14"/>
            </g>
          </g>

          <!-- you, seen from behind at the counter -->
          <g id="g-you">
            <path class="cream" d="M248 484c0-54 20-78 50-78s50 24 50 78Z"/>
            <path class="cream" d="M270 352c0-24 12-36 28-36s28 12 28 36-12 36-28 36-28-12-28-36Z"/>
            <path class="fill" d="M266 346c0-30 14-42 32-42s32 12 32 42c-6-16-16-22-32-22s-26 6-32 22Z"/>
            <ellipse class="ink" cx="272" cy="356" rx="7" ry="9"/>
            <ellipse id="you-mouth" class="fill mouth" cx="292" cy="372" rx="5" ry="3.4"/>
            <circle class="fill" cx="284" cy="356" r="3.2"/>
          </g>

          <!-- what you say first -->
          <g id="g-bubble">
            <path class="paper" d="M196 132h118a14 14 0 0 1 14 14v42a14 14 0 0 1-14 14h-40l-8 18-10-18h-60a14 14 0 0 1-14-14v-42a14 14 0 0 1 14-14Z"/>
            <circle class="fill" cx="226" cy="168" r="6"/>
            <circle class="fill" cx="254" cy="168" r="6"/>
            <circle class="fill" cx="282" cy="168" r="6"/>
          </g>

          <!-- Maya the coach -->
          <g id="g-maya">
            <g transform="translate(-54,-108)">
              <path class="sun" d="M8 230c0-46 20-68 46-68s46 22 46 68Z"/>
              <path id="maya-arm" class="ink" d="M96 176c22 2 34-10 36-28" stroke-width="6"/>
              <path class="sun" d="M22 96c0-26 14-40 32-40s32 14 32 40-14 40-32 40-32-14-32-40Z"/>
              <path class="fill" d="M16 92C16 50 32 34 54 34s38 16 38 58c-6-22-18-30-38-30s-32 8-38 30Z"/>
              <circle class="fill" cx="40" cy="26" r="13"/>
              <circle class="fill" cx="42" cy="92" r="4.2"/>
              <circle class="fill" cx="68" cy="92" r="4.2"/>
              <path class="ink" d="M34 80l10-4M64 76l10 4"/>
              <ellipse id="maya-mouth" class="fill mouth" cx="55" cy="112" rx="8" ry="5"/>
              <circle class="ink" cx="18" cy="104" r="7"/>
              <g id="maya-ear">
                <path class="ink" d="M-6 96c-14 0-22 10-22 22s8 20 18 18" stroke-width="5"/>
                <path class="fill" d="M-28 150l5 11 11 5-11 5-5 11-5-11-11-5 11-5Z"/>
              </g>
            </g>
          </g>

          <!-- the reward sticker -->
          <g id="g-star">
            <path class="fill" d="M300 150l12 26 26 12-26 12-12 26-12-26-26-12 26-12Z"/>
          </g>

        </g>
      </svg>

      <div class="heard" id="heard" aria-live="polite"></div>

      <div class="strip">
        <p class="line" id="line">
          <span class="w" data-w="I" style="--i:0">I</span>
          <span class="w" data-w="want" id="wWant" style="--i:1">want</span>
          <span class="w" data-w="would" id="wWould" style="--i:1">would like</span>
          <span class="w" data-w="a" style="--i:2">a</span>
          <span class="w" data-w="coffee" style="--i:3">coffee<i class="comma">,</i></span>
          <span class="w" data-w="please" id="wPlease" style="--i:4">please</span>
        </p>
      </div>
    </div>
  </div>

  <div class="beats" id="beats" role="group" aria-label="Beats, tap one to play it again"></div>

  <div class="actions">
    <div class="typerow" id="typerow" hidden>
      <label class="sr-only" for="typed" style="position:absolute;left:-9999px">Type what you would say</label>
      <input id="typed" type="text" autocomplete="off" autocapitalize="off" placeholder="Type it instead" enterkeyhint="done">
    </div>
    <button class="pill" id="main">
      <svg id="mainIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19 12 7 19.5Z" fill="currentColor" stroke-linejoin="round"/></svg>
      <span id="mainLabel">Play</span>
    </button>
    <div class="hint" id="hint">25 seconds. Tap a number to hear it again.</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- the 25 second timeline ---------- */
  var BEATS = [
    {t:0,    d:4.2, say:null,                               label:"At the cafe"},
    {t:4.2,  d:4.6, say:"I want a coffee.",                 label:"You order"},
    {t:8.8,  d:5.0, say:"Softer: I would like.",            label:"Say it softer"},
    {t:13.8, d:5.8, say:"I would like a coffee, please.",   label:"Word by word"},
    {t:19.6, d:3.0, say:"Of course. Here you are.",         label:"Leo answers"},
    {t:22.6, d:2.4, say:"Now you.",                         label:"Your turn"}
  ];
  var TOTAL = 25;
  var TARGET = "i would like a coffee please";

  var stage   = document.getElementById("stage");
  var line    = document.getElementById("line");
  var beatsEl = document.getElementById("beats");
  var mainBtn = document.getElementById("main");
  var mainLbl = document.getElementById("mainLabel");
  var mainIco = document.getElementById("mainIcon");
  var hint    = document.getElementById("hint");
  var heard   = document.getElementById("heard");
  var typerow = document.getElementById("typerow");
  var typed   = document.getElementById("typed");

  var wWant = document.getElementById("wWant");
  var wWould = document.getElementById("wWould");
  var wPlease = document.getElementById("wPlease");

  var t = 0, beat = -1, playing = false, last = 0, mode = "idle", sound = true;

  var ICONS = {
    play:'<path d="M7 4.5 19 12 7 19.5Z" fill="currentColor" stroke-linejoin="round"/>',
    pause:'<path d="M9 5v14M15 5v14"/>',
    mic:'<path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    check:'<path d="M5 13l4 4 10-10"/>',
    again:'<path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 5v6h-6"/>'
  };

  /* ---------- beat bar ---------- */
  BEATS.forEach(function(b,i){
    var el = document.createElement("button");
    el.className = "beat";
    el.style.flexGrow = b.d;
    el.type = "button";
    el.setAttribute("aria-label", "Beat " + (i+1) + ", " + b.label + ", play it again");
    el.innerHTML = '<span class="fillbar"></span><span class="num">' + (i+1) + '</span>';
    el.addEventListener("click", function(){ seek(i); });
    beatsEl.appendChild(el);
  });
  var beatEls = Array.prototype.slice.call(beatsEl.children);

  /* ---------- words ---------- */
  function showWords(list, opts){
    opts = opts || {};
    line.classList.toggle("build", !!opts.build);
    line.classList.toggle("cross", !!opts.cross);
    line.classList.toggle("commas", list.indexOf("please") > -1);
    [wWant, wWould, wPlease].forEach(function(el){ el.hidden = true; });
    Array.prototype.forEach.call(line.children, function(el){
      var w = el.getAttribute("data-w");
      var on = list.indexOf(w) > -1;
      el.hidden = !on;
      el.classList.toggle("struck", !!opts.cross && w === "want");
    });
    // renumber so the stagger always runs left to right
    var i = 0;
    Array.prototype.forEach.call(line.children, function(el){
      if (!el.hidden) el.style.setProperty("--i", i++);
    });
    void line.offsetWidth;
    line.classList.toggle("show", list.length > 0);
  }

  var SCRIPT = [
    function(){ showWords([]); },
    function(){ showWords(["I","want","a","coffee"]); },
    function(){ showWords(["I","want","would","a","coffee"], {cross:true}); },
    function(){ showWords(["I","would","a","coffee","please"], {build:true}); },
    function(){ showWords(["I","would","a","coffee","please"]); },
    function(){ showWords(["I","would","a","coffee","please"]); }
  ];

  function applyBeat(i){
    beat = i;
    stage.setAttribute("data-beat", i);
    SCRIPT[i]();
    beatEls.forEach(function(el,n){
      el.setAttribute("data-state", n < i ? "done" : (n === i ? "now" : "next"));
      if (n !== i) el.querySelector(".fillbar").style.width = n < i ? "100%" : "0";
    });
    if (BEATS[i].say) speak(BEATS[i].say, i === 3 ? 0.78 : 0.95);
  }

  function beatAt(time){
    for (var i = BEATS.length - 1; i >= 0; i--) if (time >= BEATS[i].t) return i;
    return 0;
  }

  /* ---------- clock ---------- */
  function frame(now){
    if (!playing) return;
    var dt = (now - last) / 1000; last = now;
    t = Math.min(TOTAL, t + dt);
    var b = beatAt(t);
    if (b !== beat) applyBeat(b);
    var p = Math.max(0, Math.min(1, (t - BEATS[beat].t) / BEATS[beat].d));
    beatEls[beat].querySelector(".fillbar").style.width = (p * 100) + "%";
    if (t >= TOTAL) { finish(); return; }
    requestAnimationFrame(frame);
  }

  function play(){
    if (mode === "listen" || mode === "done") reset();
    playing = true; mode = "playing";
    last = performance.now();
    setButton("pause", "Pause");
    hint.textContent = "Tap a number to hear it again.";
    requestAnimationFrame(frame);
  }

  function pause(){
    playing = false; mode = "paused";
    setButton("play", "Play");
  }

  function seek(i){
    t = BEATS[i].t;
    if (mode === "listen" || mode === "done") clearListen();
    applyBeat(i);
    if (!playing) play(); else { last = performance.now(); }
  }

  function reset(){
    clearListen();
    stage.classList.remove("won");
    t = 0; applyBeat(0);
  }

  /* ---------- the talk-like pause ---------- */
  function finish(){
    playing = false; mode = "listen";
    stopSpeech();
    setButton("mic", hasSpeech() ? "Speak now" : "Type it");
    mainBtn.classList.add("listening");
    hint.innerHTML = hasSpeech()
      ? 'Say the line. <button class="linkbtn" id="toType" type="button">or type it</button>'
      : 'Type the line, then tap Check.';
    var toType = document.getElementById("toType");
    if (toType) toType.addEventListener("click", openType);
    if (!hasSpeech()) openType();
    show(heard, "Your turn");
  }

  function clearListen(){
    mode = "paused";
    mainBtn.classList.remove("listening");
    typerow.hidden = true;
    heard.classList.remove("on");
    stopRecog();
  }

  function show(el, text){ el.textContent = text; el.classList.add("on"); }

  function openType(){
    typerow.hidden = false;
    setButton("check", "Check it");
    mode = "typing";
    mainBtn.classList.remove("listening");
    hint.textContent = "Type the line, then tap Check it.";
    typed.focus();
  }

  function setButton(icon, label){
    mainIco.innerHTML = ICONS[icon];
    mainLbl.textContent = label;
    mainBtn.setAttribute("aria-label", label);
  }

  /* ---------- did they say it ---------- */
  function judge(text){
    var said = (text || "").toLowerCase().replace(/[^a-z\s]/g, " ").split(/\s+/).filter(Boolean);
    var want = TARGET.split(" ");
    var hits = want.filter(function(w){ return said.indexOf(w) > -1; }).length;
    return hits / want.length >= 0.7;
  }

  function answer(text){
    stopRecog();
    show(heard, text ? '"' + text + '"' : "...");
    var good = judge(text);
    mode = "done";
    typerow.hidden = true;
    mainBtn.classList.remove("listening");
    if (good){
      stage.classList.add("won");
      hint.textContent = "You did it. That is the polite way.";
      speak("You did it.", 1);
      setButton("again", "Play again");
    } else {
      hint.innerHTML = 'Nearly. <button class="linkbtn" id="toType" type="button">Try again</button>';
      document.getElementById("toType").addEventListener("click", function(){ finish(); });
      setButton("mic", hasSpeech() ? "Speak now" : "Type it");
      mode = "listen";
      speak("Nearly. I would like a coffee, please.", 0.8);
    }
  }

  /* ---------- Web Speech, with a typed fallback ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;
  function hasSpeech(){ return !!SR; }

  function listen(){
    if (!SR) { openType(); return; }
    try {
      recog = new SR();
      recog.lang = "en-GB";
      recog.interimResults = true;
      recog.maxAlternatives = 1;
      recog.onresult = function(e){
        var txt = "";
        for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
        show(heard, '"' + txt.trim() + '"');
        if (e.results[e.results.length - 1].isFinal) answer(txt.trim());
      };
      recog.onerror = function(){ openType(); };
      recog.onend = function(){ if (mode === "listen") { mainBtn.classList.remove("listening"); } };
      recog.start();
      mainBtn.classList.add("listening");
      setButton("mic", "Listening");
      show(heard, "Listening...");
    } catch (err) { openType(); }
  }
  function stopRecog(){ if (recog) { try { recog.stop(); } catch (e) {} recog = null; } }

  /* ---------- the coach's voice ---------- */
  function speak(text, rate){
    if (!sound || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = rate || 1; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stopSpeech(){ try { window.speechSynthesis.cancel(); } catch (e) {} }

  /* ---------- controls ---------- */
  mainBtn.addEventListener("click", function(){
    if (mode === "playing") pause();
    else if (mode === "listen") listen();
    else if (mode === "typing") answer(typed.value);
    else if (mode === "done") { reset(); play(); }
    else play();
  });

  typed.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); answer(typed.value); }
  });

  document.addEventListener("keydown", function(e){
    if (e.target.tagName === "INPUT") return;
    if (e.key === " " || e.key === "Spacebar"){ e.preventDefault(); mainBtn.click(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); seek(Math.min(BEATS.length - 1, beat + 1)); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); seek(Math.max(0, beat - 1)); }
    else if (e.key.toLowerCase() === "r"){ e.preventDefault(); seek(beat); }
  });

  document.getElementById("theme").addEventListener("click", function(){
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    this.setAttribute("aria-pressed", String(!dark));
    this.setAttribute("aria-label", dark ? "Dark mode" : "Light mode");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#FFF7E8" : "#121212");
  });

  document.getElementById("sound").addEventListener("click", function(){
    sound = !sound;
    if (!sound) stopSpeech();
    this.setAttribute("aria-pressed", String(sound));
    this.setAttribute("aria-label", sound ? "Sound on" : "Sound off");
    this.querySelector(".wave").style.opacity = sound ? 1 : 0.2;
  });

  document.getElementById("back").addEventListener("click", function(){
    pause(); stopSpeech(); reset();
  });

  applyBeat(0);
})();
</script>
</body>
</html>
