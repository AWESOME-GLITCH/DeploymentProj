<!doctype html>
<!--
  At the counter - Learning Path prototype 08 (role play with Leo the barista).
  Standalone: open this file in a phone browser. The cast SVGs are inlined from docs/design/cast/
  (Open Peeps by Pablo Stanley and Open Doodles, both CC0, pre-rendered in the palette by scripts/lp/cast.mjs).
  Blobert (docs/design/cast/blobert.svg) is inlined once and animated by group.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>At the counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink);
  --pill:var(--ink); --on-pill:var(--cream);
  --block:var(--tangerine);
  --spring:cubic-bezier(.2,1.4,.4,1);
  --ease:cubic-bezier(.3,.7,.3,1);
}
html[data-theme="dark"]{
  --page:#121212; --on-page:var(--cream);
  --pill:var(--cream); --on-pill:var(--ink);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overflow:hidden}
body{
  margin:0; background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition:background .3s ease, color .3s ease;
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0}
:focus-visible{outline:3px solid var(--on-page); outline-offset:3px; border-radius:8px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.hide{display:none !important}

/* ---------- shell ---------- */
.phone{
  width:min(100vw,430px); height:100dvh; max-height:100dvh;
  display:flex; flex-direction:column; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
}

/* ---------- top strip: three turns + theme ---------- */
.top{display:flex; align-items:center; gap:14px; height:28px; flex:none}
.prog{display:flex; gap:7px; flex:1}
.seg{
  height:12px; flex:1; border-radius:99px; border:2.5px solid var(--on-page); background:transparent;
  transition:background .3s var(--spring);
}
.seg.on{background:var(--on-page)}
.theme{
  width:34px; height:34px; margin-right:-4px; border-radius:99px;
  border:2.5px solid var(--on-page); display:grid; place-items:center; flex:none;
}
.theme svg{width:17px; height:17px; display:block}
.theme .moon{display:block} .theme .sun{display:none}
html[data-theme="dark"] .theme .moon{display:none}
html[data-theme="dark"] .theme .sun{display:block}

/* ---------- the card ---------- */
.card{
  position:relative; flex:1; min-height:0; overflow:hidden;
  border:3px solid var(--ink); border-radius:28px; background:var(--block); color:var(--ink);
  transition:background .4s ease;
  animation:cardIn .42s var(--spring) both;
}
@keyframes cardIn{from{opacity:0; transform:translateY(16px) scale(.97)} to{opacity:1; transform:none}}
.card[data-state="done"]{--block:var(--mint)}

.head{position:relative; z-index:5; padding:20px 20px 0}
h1{
  margin:0; font-weight:800; font-size:36px; line-height:1.04; letter-spacing:-.02em;
  animation:rise .36s var(--spring) both;
}
.lede{margin:8px 0 0; font-size:16px; line-height:1.35; max-width:17em; animation:rise .36s var(--spring) .06s both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

/* speech bubbles */
.bubble{
  position:relative; padding:12px 16px 13px;
  background:var(--cream); border:3px solid var(--ink); border-radius:22px;
  box-shadow:5px 5px 0 var(--ink);
  font-size:20px; font-weight:700; line-height:1.25; letter-spacing:-.01em;
  animation:bubbleIn .34s var(--spring) both;
}
@keyframes bubbleIn{from{opacity:0; transform:translateY(10px) scale(.92)} to{opacity:1; transform:none}}
.bubble:after,.bubble:before{content:""; position:absolute; width:0; height:0; border-style:solid}
.bubble.leo{margin:12px 0 0; max-width:300px}
.bubble.leo:before{left:34px; bottom:-19px; border-width:19px 15px 0 0; border-color:var(--ink) transparent transparent transparent}
.bubble.leo:after{left:38px; bottom:-13px; border-width:13px 10px 0 0; border-color:var(--cream) transparent transparent transparent}
.bubble.leo .w{opacity:.3; transition:opacity .1s linear; display:inline-block}
.bubble.leo .w.said,.bubble.leo .w.now{opacity:1}
.bubble.leo .w.now{animation:wordPop .2s var(--spring)}
@keyframes wordPop{from{transform:scale(.9)} 60%{transform:scale(1.08)} to{transform:scale(1)}}
.card:not([data-state="speak"]) .bubble.leo .w{opacity:1}

/* the learner's line: bottom right, over the counter */
.bubble.mine{
  position:absolute; z-index:6; left:16px; bottom:96px; max-width:240px;
  background:var(--paper); transform-origin:100% 100%;
}
.bubble.mine:before{right:30px; bottom:-19px; border-width:0 15px 19px 0; border-color:transparent var(--ink) transparent transparent}
.bubble.mine:after{right:34px; bottom:-13px; border-width:0 10px 13px 0; border-color:transparent var(--cream) transparent transparent}
.bubble.mine:after{border-right-color:var(--paper)}
.bubble.mine.sweep{animation:sweepOff .38s var(--ease) both}
@keyframes sweepOff{to{transform:translateX(-440px) rotate(-14deg); opacity:0}}
.bubble.mine.munch{animation:munch .36s var(--ease) both}
@keyframes munch{60%{opacity:1} to{transform:translate(200px,60px) scale(.05) rotate(20deg); opacity:0}}
.bubble.mine.mop{animation:mop .42s var(--ease) both}
@keyframes mop{45%{transform:scale(1.1,.1) translateY(10px); border-radius:99px; opacity:1} to{transform:scale(1.3,.02) translateY(10px); opacity:0}}
.bubble.mine.out{animation:bubbleOut .26s var(--ease) both}
@keyframes bubbleOut{to{opacity:0; transform:scale(.85) translateY(8px)}}

/* ---------- Leo behind the counter ---------- */
.scene{
  position:absolute; z-index:1; left:-96px; bottom:58px; width:520px; height:520px;
  pointer-events:none; transform-origin:50% 90%;
  transition:transform .4s var(--spring);
  animation:popIn .5s var(--spring) .06s both;
}
@keyframes popIn{from{opacity:0; transform:translateY(34px) scale(.9)} to{opacity:1; transform:none}}
.card[data-state="listen"] .scene{transform:translate(10px,14px) scale(1.06) rotate(-3deg)}
.card[data-state="good"] .scene{transform:translateY(-8px) scale(1.03)}
.card[data-state="miss"] .scene{transform:translate(-6px,4px) rotate(2deg)}
.card[data-state="done"] .scene{display:none}
.breathe{width:100%; height:100%; animation:breathe 3s ease-in-out infinite; transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-.6deg)} 50%{transform:scale(1.018) rotate(.6deg) translateY(-3px)}}
.face{position:absolute; inset:0; opacity:0}
.face.on{opacity:1}
.art{width:100%; height:100%; display:block}

/* counter: a cream slab with an ink edge, cups and a till in crisp outline */
.counter{
  position:absolute; z-index:3; left:-3px; right:-3px; bottom:-3px; height:64px;
  background:var(--cream); border-top:3px solid var(--ink);
  animation:rise .4s var(--spring) .1s both;
}
.card[data-state="done"] .counter{display:none}
.things{position:absolute; z-index:4; left:0; right:0; bottom:60px; height:96px; pointer-events:none}
.card[data-state="done"] .things{display:none}
.things svg{position:absolute; bottom:0; display:block; overflow:visible}
.cups{left:22px; width:120px; height:70px}
.till{right:22px; width:96px; height:92px}
.order{left:50%; margin-left:-30px; width:60px; height:96px; opacity:0; transform:translateY(20px) scale(.6); transform-origin:50% 100%}
.order.in{animation:orderIn .4s var(--spring) both}
@keyframes orderIn{to{opacity:1; transform:none}}
.steam path{opacity:0}
.steam.go path{animation:steam 1.6s ease-in-out infinite}
.steam.go path:nth-child(2){animation-delay:.4s}
.steam.go path:nth-child(3){animation-delay:.8s}
@keyframes steam{0%{opacity:0; transform:translateY(6px)} 30%{opacity:1} 100%{opacity:0; transform:translateY(-16px)}}

/* ---------- stickers ---------- */
.stick{position:absolute; z-index:2; color:var(--ink); pointer-events:none}
.stick svg{display:block}
.tw{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)} 42%{transform:scale(1.2) rotate(11deg)} 68%{transform:scale(.93) rotate(-5deg)}}
.s-star{top:16px; right:22px}
.s-sparkle{top:210px; right:30px; animation-delay:1.3s}
.s-squiggle{top:270px; left:16px; animation-delay:.7s}
.s-ear{top:250px; right:26px; opacity:0; transform:scale(.5); transition:opacity .24s, transform .34s var(--spring)}
.card[data-state="listen"] .s-ear{opacity:1; transform:none}
.s-q{top:196px; right:48px; opacity:0; transform:scale(.4) rotate(-20deg); transition:opacity .24s, transform .34s var(--spring)}
.card[data-state="miss"] .s-q{opacity:1; transform:none}
.burst{
  position:absolute; z-index:7; top:200px; right:40px; width:120px; height:120px;
  opacity:0; pointer-events:none; color:var(--ink);
}
.burst.go{animation:burst .7s var(--spring) both}
@keyframes burst{0%{opacity:0; transform:scale(.3) rotate(-30deg)} 55%{opacity:1; transform:scale(1.15) rotate(10deg)} 100%{opacity:0; transform:scale(1.3) rotate(16deg)}}

/* ---------- Blobert ---------- */
.blob{
  position:absolute; z-index:8; right:-8px; bottom:-10px; width:176px; height:160px;
  pointer-events:none; opacity:0; transform:translateX(220px);
}
.blob svg{width:100%; height:100%; display:block; overflow:visible; transform:scaleX(-1)}
.blob.in{animation:blobIn .3s var(--spring) both}
@keyframes blobIn{from{opacity:0; transform:translateX(220px) rotate(14deg)} to{opacity:1; transform:none}}
.blob.out{animation:blobOut .26s var(--ease) both}
@keyframes blobOut{to{opacity:0; transform:translateX(240px) rotate(-10deg)}}
#bb-body{transform-box:view-box; transform-origin:120px 180px; animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.05,.95) rotate(-2deg)}}
#bb-eyes{transform-box:view-box; transform-origin:120px 102px; animation:blink 3.2s steps(1) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)} 94%,98%{transform:scaleY(.1)}}
#bb-tool{transform-box:view-box; transform-origin:184px 120px; transition:transform .2s}
.blob.sweep #bb-tool{animation:sweep .46s ease-in-out .18s 1}
@keyframes sweep{0%{transform:rotate(0)} 30%{transform:rotate(38deg)} 65%{transform:rotate(-34deg)} 100%{transform:rotate(0)}}
.blob.mop #bb-tool{animation:mopSwing .5s ease-in-out .16s 1}
@keyframes mopSwing{0%{transform:rotate(0)} 25%{transform:rotate(80deg)} 55%{transform:rotate(60deg) translateX(-30px)} 80%{transform:rotate(85deg) translateX(10px)} 100%{transform:rotate(0)}}
#bb-mouth{transform-box:view-box; transform-origin:124px 124px; transition:transform .16s var(--spring)}
.blob.munch #bb-mouth{transform:scale(1.5,1.7)}
#bb-arm-left{transform-box:view-box; transform-origin:62px 128px}
.blob.wave #bb-arm-left{animation:wave .34s ease-in-out 2}
@keyframes wave{0%,100%{transform:rotate(0)} 50%{transform:rotate(-60deg)}}
.blob .burp{opacity:0; transform-box:view-box; transform-origin:120px 130px}
.blob.munch .burp{animation:burp .5s var(--ease) .36s both}
@keyframes burp{0%{opacity:0; transform:translateY(0) scale(.4)} 40%{opacity:1} 100%{opacity:0; transform:translateY(-70px) scale(1.2) rotate(30deg)}}
.puddle{
  position:absolute; z-index:5; left:30px; bottom:70px; width:170px; height:22px;
  border:3px solid var(--ink); border-radius:99px; background:var(--paper); opacity:0;
}
.puddle.go{animation:puddle .5s var(--ease) .3s both}
@keyframes puddle{0%{opacity:0; transform:scaleX(.5)} 35%{opacity:1; transform:scaleX(1)} 100%{opacity:0; transform:scaleX(.6) translateY(-8px)}}
.caption{
  position:absolute; z-index:9; right:150px; bottom:140px; padding:5px 11px;
  background:var(--ink); color:var(--cream); font-size:14px; font-weight:800; letter-spacing:.04em;
  border-radius:99px; opacity:0; transform:scale(.5) rotate(-8deg); transform-origin:100% 100%;
}
.caption.go{animation:captionIn .5s var(--spring) .2s both}
@keyframes captionIn{20%{opacity:1; transform:scale(1.1) rotate(-8deg)} 70%{opacity:1; transform:scale(1) rotate(-8deg)} 100%{opacity:0; transform:scale(.8) rotate(-8deg)}}

/* ---------- Maya pops in from the corner with the model line ---------- */
.coach{
  position:absolute; z-index:7; left:-70px; bottom:-120px; width:330px; height:330px;
  pointer-events:none; opacity:0; transform:translate(-80px,140px) rotate(-18deg); transform-origin:30% 100%;
}
.coach.in{animation:coachIn .42s var(--spring) both}
@keyframes coachIn{to{opacity:1; transform:none}}
.coach.out{animation:coachOut .3s var(--ease) both}
@keyframes coachOut{from{opacity:1; transform:none} to{opacity:0; transform:translate(-60px,140px) rotate(-12deg)}}
.coach .face{inset:0}
.model:not(.in):not(.out){display:none}
.model{
  position:absolute; z-index:8; left:118px; right:14px; bottom:200px; opacity:0;
  transform:scale(.8) translateY(14px); transform-origin:30% 100%;
}
.model.in{animation:modelIn .36s var(--spring) .14s both}
@keyframes modelIn{to{opacity:1; transform:none}}
.model.out{animation:bubbleOut .22s var(--ease) both}
.model .tag{display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.7; margin-bottom:3px}
.model.bubble:before{left:26px; bottom:-19px; border-width:19px 15px 0 0; border-color:var(--ink) transparent transparent transparent}
.model.bubble:after{left:30px; bottom:-13px; border-width:13px 10px 0 0; border-color:var(--cream) transparent transparent transparent}
.model.bubble{padding:10px 16px 12px; background:var(--sun)}
.model.bubble:after{border-top-color:var(--sun)}

/* ---------- done card ---------- */
.doodle{
  position:absolute; z-index:1; right:-150px; bottom:-30px; width:600px; height:450px;
  pointer-events:none; display:none; transform-origin:60% 100%;
}
.card[data-state="done"] .doodle{display:block; animation:popIn .5s var(--spring) .08s both}
.doodle .drift{width:100%; height:100%; animation:drift 3.4s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-8px) rotate(1deg)}}
.card[data-state="done"] .s-star,.card[data-state="done"] .s-sparkle{display:none}
.s-heart,.s-star2,.s-sparkle2{display:none}
.card[data-state="done"] .s-heart{display:block; top:124px; right:28px; animation-delay:.6s}
.card[data-state="done"] .s-star2{display:block; top:170px; left:24px; animation-delay:1.4s}
.card[data-state="done"] .s-sparkle2{display:block; top:118px; right:92px; animation-delay:2.2s}
.card[data-state="done"] .s-squiggle{top:250px; left:auto; right:40px}

/* ---------- dock ---------- */
.dock{flex:none; display:flex; align-items:center; gap:10px; height:58px}
.pill{
  position:relative; flex:1; height:58px; border-radius:99px;
  background:var(--pill); color:var(--on-pill);
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:19px; font-weight:800; letter-spacing:-.01em;
  transition:transform .14s var(--spring), opacity .2s;
}
.pill:active{transform:translateY(2px) scale(.985)}
.pill[disabled]{opacity:.68; cursor:default}
.pill .chev{font-size:22px; line-height:1; margin-top:-2px}
.pill svg{width:22px; height:22px; display:block}
.pill .ring{position:absolute; inset:-3px; border-radius:99px; border:3px solid var(--pill); opacity:0; pointer-events:none}
.pill.live .ring{animation:ring 1.5s ease-out infinite}
.pill.live .ring.b{animation-delay:.75s}
@keyframes ring{0%{opacity:.5; transform:scale(1)} 100%{opacity:0; transform:scale(1.14)}}
.icon{
  width:58px; height:58px; flex:none; border-radius:99px; border:3px solid var(--on-page);
  display:grid; place-items:center; color:var(--on-page);
  transition:transform .14s var(--spring);
}
.icon:active{transform:scale(.94)}
.icon svg{width:26px; height:26px; display:block}
.icon[aria-pressed="true"]{background:var(--on-page); color:var(--page)}
.typed{display:none; flex:1; min-width:0; gap:8px; height:58px}
.dock.typing .typed{display:flex}
.dock.typing .pill{display:none}
.typed input{
  flex:1; min-width:0; height:58px; padding:0 18px; border-radius:99px;
  border:3px solid var(--on-page); background:var(--paper); color:var(--ink);
  font:inherit; font-size:17px; font-weight:700;
}
.typed button{
  height:58px; padding:0 22px; border-radius:99px; background:var(--pill); color:var(--on-pill);
  font-size:17px; font-weight:800; flex:none;
}

@media (prefers-reduced-motion:reduce){
  .breathe,.tw,.drift,.pill.live .ring,#bb-body,#bb-eyes,.steam.go path{animation:none !important}
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.12s !important}
  .bubble.mine.sweep,.bubble.mine.munch,.bubble.mine.mop{animation:bubbleOut .12s both !important}
}
@media (max-height:720px){
  h1{font-size:30px} .bubble{font-size:18px} .scene{bottom:-60px}
}
</style>
</head>
<body>

<div class="phone">
  <header class="top">
    <div class="prog" id="prog" role="img" aria-label="Turn 1 of 3">
      <i class="seg on"></i><i class="seg"></i><i class="seg"></i>
    </div>
    <button class="theme" id="theme" aria-pressed="false">
      <span class="sr">Dark mode</span>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/></g></svg>
    </button>
  </header>

  <main class="card" id="card" data-state="intro">
    <div class="head">
      <h1 id="headline">At the counter</h1>
      <p class="lede" id="lede">Order a drink from Leo.</p>
      <div class="bubble leo hide" id="leoBubble" aria-live="polite" aria-atomic="true"><span id="leoText"></span></div>
    </div>

    <!-- Leo, cropped big, behind the counter -->

    goIcon.classList.toggle("hide", !opts.mic);
    goChev.classList.toggle("hide", !!opts.mic || !!opts.plain);
    go.classList.toggle("live", !!opts.live);
    go.disabled = !!opts.off;
  }

  function speakAloud(text, rate) {
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = rate || 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* no voice: the written line still carries the turn */ }
  }

  function syllables(w) {
    var m = w.toLowerCase().replace(/[^a-z]/g, "").match(/[aeiouy]+/g);
    return Math.max(1, m ? m.length : 1);
  }

  /* Leo speaks: his line lights up word by word while his mouth swaps at about 8 Hz. */
  function leoSays(text, done) {
    clearTimers();
    leoBubble.classList.remove("hide");
    leoText.innerHTML = "";
    var words = text.split(" ").map(function (w, i, a) {
      var s = document.createElement("span"); s.className = "w"; s.textContent = w;
      leoText.appendChild(s);
      if (i < a.length - 1) leoText.appendChild(document.createTextNode(" "));
      return s;
    });
    setState("speak");
    speakAloud(text, 1);
    var at = 0;
    words.forEach(function (w, i) {
      var hold = 170 + syllables(w.textContent) * 140;
      later(function () {
        if (i) { words[i - 1].classList.remove("now"); words[i - 1].classList.add("said"); }
        w.classList.add("now");
      }, at);
      at += hold + 60;
    });
    var open = false;
    setFace("talk");
    if (!reduced) mouth = setInterval(function () { open = !open; setFace(open ? "idle" : "talk"); }, 125);
    later(function () {
      stopMouth(); setFace("idle");
      words[words.length - 1].classList.remove("now"); words[words.length - 1].classList.add("said");
      done();
    }, at + 320);
  }

  /* ---------- the exercise ---------- */
  function start() {
    phase = "play";
    turn = 0;
    setProgress(1);
    el("lede").classList.add("hide");
    askTurn();
  }

  function askTurn() {
    hideMine();
    leoSays(TURNS[turn].leo, yourTurn);
    button("Leo is talking", { off: true, plain: true });
  }

  function yourTurn() {
    phase = "await";
    setState("await");
    button("Say it", { mic: true });
    go.onclick = startListening;
    if (dock.classList.contains("typing")) typedIn.focus();
  }

  function startListening() {
    if (listening) { stopListening(); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    button("Listening", { mic: true, live: true });
    setState("listen"); setFace("listen");
    listening = true;
    if (!SR) { useTyping(); return; }
    try {
      rec = new SR();
      rec.lang = "en-GB"; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = function (e) { listening = false; judge(e.results[0][0].transcript); };
      rec.onerror = function () { listening = false; useTyping(); };
      rec.onend = function () { if (listening) { listening = false; useTyping(); } };
      rec.start();
      later(function () { if (listening) stopListening(); }, 7000);
    } catch (e) { listening = false; useTyping(); }
  }

  function stopListening() {
    listening = false;
    try { if (rec) rec.stop(); } catch (e) { /* already stopped */ }
    useTyping();
  }

  function useTyping() {
    setState("await"); setFace("idle");
    button("Say it", { mic: true });
    dock.classList.add("typing");
    kb.setAttribute("aria-pressed", "true");
    typedIn.focus();
  }

  function showMine(text) {
    mine.className = "bubble mine";
    mineText.textContent = text;
  }
  function hideMine() {
    if (mine.classList.contains("hide")) return;
    mine.classList.add("out");
    var m = mine;
    later(function () { m.classList.add("hide"); m.classList.remove("out"); }, 260);
  }

  function judge(said) {
    clearTimers();
    try { if (rec) rec.abort(); } catch (e) { /* nothing to abort */ }
    listening = false;
    said = (said || "").trim();
    if (!said) { yourTurn(); return; }
    var line = said.charAt(0).toUpperCase() + said.slice(1);
    if (!/[.!?]$/.test(line)) line += ".";
    showMine(line);
    button("Listen", { off: true, plain: true });
    var ok = TURNS[turn].keys.test(said.toLowerCase());
    later(ok ? good : miss, 420);
  }

  function good() {
    phase = "good";
    setState("good"); setFace(TURNS[turn].face);
    var b = el("burst"); b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
    if (coachIn) coachOut();
    turn += 1;
    setProgress(Math.min(turn + 1, 3));
    later(function () {
      if (turn < TURNS.length) { askTurn(); return; }
      serve();
    }, 900);
  }

  /* a weak answer: Blobert clears it with one gag, then Maya pops in with the line to repeat */
  function miss() {
    phase = "miss";
    setState("miss"); setFace("think");
    var pool = GAGS.filter(function (g) { return g !== lastGag; });
    var gag = pool[Math.floor(Math.random() * pool.length)];
    lastGag = gag;
    blob.className = "blob in";
    caption.textContent = CAPTIONS[gag];
    caption.classList.remove("go"); void caption.offsetWidth; caption.classList.add("go");
    later(function () {
      blob.classList.add(gag);
      mine.classList.add(gag);
      if (gag === "mop") { puddle.classList.remove("go"); void puddle.offsetWidth; puddle.classList.add("go"); }
    }, 180);
    later(function () { blob.classList.add("wave"); mine.classList.add("hide"); mine.classList.remove(gag); }, 640);
    later(function () { blob.className = "blob out"; }, 880);
    later(coachSays, 760);
  }

  function coachSays() {
    coachIn = true;
    var line = TURNS[turn].model;
    coach.className = "coach in";
    setCoachFace("idle");
    modelText.textContent = line;
    model.className = "bubble model in";
    later(function () {
      speakAloud(line, 0.85);
      var open = false;
      setCoachFace("talk");
      if (!reduced) mouth = setInterval(function () { open = !open; setCoachFace(open ? "idle" : "talk"); }, 125);
      later(function () { stopMouth(); setCoachFace("cheeky"); yourTurn(); }, 340 * line.split(" ").length + 300);
    }, 380);
  }

  function coachOut() {
    coachIn = false;
    coach.className = "coach out";
    model.className = "bubble model out";
    later(function () { coach.className = "coach"; model.className = "bubble model"; }, 320);
  }

  /* the order lands on the counter, then the end card */
  function serve() {
    phase = "serve";
    setState("good"); setFace("happy");
    hideMine();
    leoSays("Here you go. Enjoy!", function () {});
    el("order").classList.add("in");
    later(function () { el("steamOrder").classList.add("go"); el("steamCups").classList.add("go"); }, 300);
    later(done, 2300);
  }

  function done() {
    clearTimers();
    phase = "done";
    setState("done");
    setProgress(3);
    leoBubble.classList.add("hide");
    el("headline").textContent = "You did it";
    el("lede").textContent = "You ordered a drink in English.";
    el("lede").classList.remove("hide");
    [el("headline"), el("lede")].forEach(function (n) { n.style.animation = "none"; void n.offsetWidth; n.style.animation = ""; });
    dock.classList.remove("typing"); kb.setAttribute("aria-pressed", "false");
    button("Again", {});
    go.onclick = reset;
  }

  function reset() {
    clearTimers();
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* fine */ }
    setState("intro"); setFace("idle");
    el("headline").textContent = "At the counter";
    el("lede").textContent = "Order a drink from Leo.";
    el("lede").classList.remove("hide");
    leoBubble.classList.add("hide");
    mine.className = "bubble mine hide";
    el("order").classList.remove("in"); el("steamOrder").classList.remove("go"); el("steamCups").classList.remove("go");
    coach.className = "coach"; model.className = "bubble model"; coachIn = false;
    blob.className = "blob";
    turn = 0; setProgress(1);
    phase = "intro";
    button("Start", {});
    go.onclick = start;
  }

  /* ---------- wiring ---------- */
  go.onclick = start;
  typed.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = typedIn.value; typedIn.value = "";
    if (phase === "await" || phase === "listen") judge(v);
  });
  kb.onclick = function () {
    var on = !dock.classList.contains("typing");
    if (on) { if (listening) { listening = false; try { rec && rec.abort(); } catch (e) {} } useTyping(); }
    else { dock.classList.remove("typing"); kb.setAttribute("aria-pressed", "false"); if (phase === "await") { button("Say it", { mic: true }); go.focus(); } }
  };
  el("theme").onclick = function () {
    var dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    this.setAttribute("aria-pressed", String(!dark));
    document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#FFF7E8" : "#121212");
  };
  /* tester hook: window.dispatchEvent(new CustomEvent("lp:auto", { detail: { correct: true } })) */
  window.addEventListener("lp:auto", function (e) {
    var ok = !(e.detail && e.detail.correct === false);
    if (phase === "intro") { start(); return; }
    if (phase === "done") { reset(); return; }
    if (phase !== "await" && phase !== "listen") return;
    judge(ok ? TURNS[turn].model : "Hello, um, yes?");
  });
})();
</script>
