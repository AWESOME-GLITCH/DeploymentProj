<script>
/* ---------- shared lesson view ---------- */
const LXTYPE={Page:['Reading','page'],Video:['Video','video'],Quiz:['Practice quiz','quiz'],Speaking:['Speaking','speak'],Writing:['Writing','write'],Live:['Review in class','star']};
const lxT=type=>LXTYPE[type]||LXTYPE.Page;
function lxOutcome(n,code){const M=UNITMETA[n]||UNITMETA[5];return code==='a'?`use the unit vocabulary about ${M.v.split(';')[0].trim()} and understand a short text`:code==='b'?`use ${M.g.split(';')[0].trim()} to talk about experiences`:code==='c'?'use the unit grammar accurately in ten short questions':code==='d'?`handle ${M.f} in a short conversation`:code==='e'?`write ${M.w} with a clear request`:'say what you can do in this unit and revise what you cannot yet'}
function lxOutline(l){const steps=[...l.inclass.map(x=>[x,'In class']),...l.athome.map(x=>[x,'At home'])];return`<ol class="lx-flow">${steps.map(([x,w],i)=>`<li><span class="n">${i+1}</span><div><b>${x}</b><small>${w}</small></div></li>`).join('')}</ol><p class="note-s" style="margin:0">Teachers add their slides and handouts to this lesson. Students see the same steps on their portal.</p>`}

function lessonView(page,V){
 const prev=V.list[V.li-1],next=V.list[V.li+1];const done=V.list.filter(x=>x.st==='done').length;
 const tabs=[...(V.noPlan?[]:[['plan',V.student?'In class and at home':'Lesson plan']]),...(V.key&&V.key.length?[['key','Key language']]:[]),['mats','Materials'],...(V.notes?[['notes','Teacher notes']]:[])];
 const tab=tabs.some(t=>t[0]===S.lxTab)?S.lxTab:tabs[0][0];
 const panel=k=>k==='plan'?`<div class="lx-plan"><div><h4>${ic('users')}In class</h4><ul>${V.plan.inclass.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>${ic('home')}At home</h4><ul>${V.plan.athome.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`
  :k==='key'?`<div class="lx-key">${V.key.map(x=>`<span>${x}</span>`).join('')}</div>`
  :k==='mats'?`<div>${V.mats.map(m=>`<div class="lx-mat"><span class="i">${ic(/audio/i.test(m)?'play':/video/i.test(m)?'video':/quiz/i.test(m)?'quiz':/slides/i.test(m)?'page':'clip')}</span><b>${m}</b></div>`).join('')}${V.matsHref?`<a class="lx-link" href="${V.matsHref}">All unit materials and page numbers${ic('chev')}</a>`:''}</div>`
  :`<div class="lx-notes"><span class="dot"></span><p>${V.notes}</p></div>`;
 const el=content(page,`${V.crumbs}
 <div class="lx">
  <div class="lx-main">
   <header class="lx-head"><div><div class="lx-eyebrow">${V.eyebrow}</div><h1>${V.title}</h1><p class="lx-out">${V.outcome}</p><div class="lx-meta">${V.meta.map(([i,t])=>`<span>${ic(i)}${t}</span>`).join('')}</div></div>${V.status||V.actions?`<div class="lx-act">${V.status||''}${V.actions||''}</div>`:''}</header>
   ${V.room||''}
   <section class="lx-stage" aria-labelledby="lxS"><div class="lx-stage-h"><span class="ti">${ic(V.stage.icon)}</span><h2 id="lxS">${V.stage.title}</h2></div><div class="lx-body">${V.stage.html}</div></section>
   <div class="lx-tabs" role="tablist" aria-label="About this lesson">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" class="${k===tab?'on':''}" data-lxt="${k}">${l}</button>`).join('')}</div>
   <div class="lx-panel" id="lxp" role="tabpanel">${panel(tab)}</div>
   <nav class="lx-nav" aria-label="Lessons">${prev?`<a href="${prev.href}"><span class="k">${ic('left')}Previous</span><b>${prev.lab} · ${prev.title}</b></a>`:'<span></span>'}${next?`<a class="nx" href="${next.href}"><span class="k">Next${ic('chev')}</span><b>${next.lab} · ${next.title}</b></a>`:`<a class="nx" href="${V.unitHref}"><span class="k">${V.progress===false?'Last lesson':'All lessons done'}${ic('chev')}</span><b>Back to ${V.unitTitle}</b></a>`}</nav>
  </div>
  <aside class="lx-side" aria-label="${esc(V.unitTitle)}">
   <div class="lx-card"><a class="lx-ut" href="${V.unitHref}"><small>${V.unitKicker}</small><b>${V.unitTitle}${ic('chev')}</b></a>
    ${V.progress===false?`<div class="lx-pt">${V.list.length} lessons</div>`:`<div class="lx-prog"><i style="width:${Math.round(100*done/V.list.length)}%"></i></div><div class="lx-pt">${done} of ${V.list.length} lessons done</div>`}
    <ol class="lx-list">${V.list.map((x,i)=>`<li><a href="${x.href}" class="${i===V.li?'on':''} ${x.st||''}" ${i===V.li?'aria-current="page"':''}><span class="n">${x.st==='done'&&i!==V.li?ic('check'):x.lab}</span><span class="t"><b>${x.title}</b><small>${x.sub}</small></span></a></li>`).join('')}</ol>
    ${V.side||''}
   </div>
  </aside>
 </div>`);
 el.querySelectorAll('[data-lxt]').forEach(b=>b.onclick=()=>{S.lxTab=b.dataset.lxt;el.querySelectorAll('[data-lxt]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});el.querySelector('#lxp').innerHTML=panel(b.dataset.lxt)});
 wireQuiz(el);if(V.room)srWire(el);
 return el}

/* ---------- lesson page inside a class (teacher, admin, student) ---------- */
lessonPage=function(page,r,X){const {n,u,c,lessons}=X;const role=S.role;const isS=role==='s';const code=LCODES.includes(r.d)?r.d:'a';const li=LCODES.indexOf(code);const l=lessons[li];const it=u.items[li]||u.items[0];
 const cur=c.unit||0;const tIdx=Math.min(4,Math.max(0,classDays(c).indexOf(TODAY.toLocaleDateString('en-GB',{weekday:'short'}))));
 const lst=i=>n<cur?'done':n>cur?'':i<tIdx?'done':i===tIdx?'cur':'';
 const list=lessons.map((x,i)=>({lab:n+x.code,title:x.title,sub:`${lxT((u.items[i]||{}).type)[0]} · ${(u.items[i]||{min:30}).min} min`,href:unitHref(n,c,'lesson',x.code),st:lst(i)}));
 const k=lst(li);const T=lxT(it.type);
 const status=k==='done'?pill('Done','ok','check'):k==='cur'?pill('Today','violet'):n>cur?pill(`Week of ${fmtD(addDays(new Date(c.start),(n-1)*7))}`,'neutral'):'';
 const s=isS?curStudent():null;const tasks=tasksOfCls(c).filter(t=>t.unit===n&&t.verb!=='suggest'&&TASK_LESSON[t.type]===code);
 const chev=ic('chev','ic small');
 const crumbs=isS?`<div class="crumbs"><a href="#/s/classes">My course</a>${chev}<a href="${unitHref(n,c)}">Unit ${n}: ${esc(u.title)}</a>${chev}<b>Lesson ${n}${code}</b></div>`
  :`<div class="crumbs"><a href="#/${role}/curriculum">${role==='a'?'Course templates':'Curriculum'}</a>${chev}${role==='a'?`<a href="#/a/curriculum/${c.id}">${c.name}</a>${chev}`:''}<a href="${unitHref(n,c)}">Unit ${n}: ${esc(u.title)}</a>${chev}<b>Lesson ${n}${code}</b></div>`;
 const verb={Video:'Watching',Quiz:'Practising',Speaking:'Speaking',Writing:'Writing',Live:'Reviewing'}[it.type]||'Reading';
 const el=lessonView(page,{crumbs,eyebrow:`Unit ${n} · Lesson ${li+1} of 6`,title:l.title,
  outcome:`${isS?'You will be able to':'Students will be able to'} ${lxOutcome(n,code)}.`,
  meta:[[T[1],`${T[0]} · ${it.min} min`],['users',l.mode],['book',`Coursebook p.${l.cb}`],...(l.wb?[['write',`Workbook p.${l.wb}`]]:[])],
  status,actions:isS?'':`<button class="btn" id="lprev">${ic('eye')}Preview as student</button>`,
  list,li,unitTitle:`Unit ${n}: ${u.title}`,unitKicker:isS?'Your course':c.name,unitHref:unitHref(n,c),
  room:isS?studyRoom({you:`${verb} · lesson ${n}${code}`,them:li<5?`Lesson ${n}${LCODES[li+1]} · ${lessons[li+1].title}`:`Unit ${n} review`}):'',
  stage:{title:T[0],icon:T[1],html:previewBody(it,u)},
  plan:{inclass:l.inclass,athome:l.athome},key:l.key,mats:l.mats,notes:isS?'':l.notes,matsHref:unitHref(n,c,'materials'),student:isS,
  side:tasks.length?`<div class="lx-hw"><h4>Homework from this lesson</h4>${tasks.map(t=>`<a href="${isS?`#/s/task/${t.id}`:`#/${role}/task/${t.id}/${c.id}`}"><span class="ti ${t.type}">${ic(TYPEICON[t.type])}</span><span><b>${t.title}</b><small>${isS?hwStatus(t,s).l:`${t.due<TODAY?'Was due':'Due'} ${fmtD(t.due)}`}</small></span></a>`).join('')}</div>`:''});
 const lp=el.querySelector('#lprev');if(lp)lp.onclick=()=>viewAs(stOfCls(c)[0],`#/s/unit/${n}/${c.id}/lesson/${code}`)};

/* ---------- Course templates: open a unit, then a lesson ---------- */
const tplIsGE=t=>!!(t.ge||['flexd','flexl','skills'].includes(t.id));
const tplUW=t=>({lessons:'Lesson',modules:'Module',topics:'Topic',weeks:'Week'})[t.uw]||'Unit';
function tplLessonsFor(t,n){
 if(tplIsGE(t)){const u=S.curriculum[n-1];return unitLessons(n,u).map((l,i)=>({...l,type:u.items[i].type,min:u.items[i].min}))}
 const T=(tplUnits(t)[n-1]||{title:''}).title;const sp=t.id==='speak';const wr=/Writing|essay|Email|Report|Referenc|Paraphras/i.test(T);const last=sp?'Speaking':wr?'Writing':/Listening|Reading/.test(T)?'Quiz':'Speaking';
 return[
  {code:'a',title:sp?'Warm-up and useful language':'Key ideas',type:'Page',min:30,focus:'The key ideas and language',mode:'In class',inclass:['Lead-in: a short discussion to find out what students already know','Present the key ideas with examples','Check understanding with three quick questions'],athome:['Read the short summary on the portal'],key:sp?['Can I just add something?','What I mean is…','That is a good point, but…']:[],mats:['Slides','Short reading text'],notes:'Keep the input under 20 minutes so there is time to practise.'},
  {code:'b',title:sp?'Listen to a model':'A worked example',type:'Video',min:20,focus:'A model to notice and copy',mode:'Watch at home, use in class',inclass:['Replay the model and notice useful phrases','Pairs compare what they noticed'],athome:['Watch the model video before class'],key:[],mats:['Model video with transcript'],notes:''},
  {code:'c',title:'Guided practice',type:'Quiz',min:20,focus:'Short practice with instant feedback',mode:'In class or at home',inclass:['Controlled practice in pairs','Go over the most-missed questions together'],athome:['Practice quiz on the portal, two attempts'],key:[],mats:['Practice quiz (auto-marked)'],notes:'The quiz report shows the most-missed question.'},
  {code:'d',title:sp?'Speak and get feedback':wr?'Write and get feedback':'Real task',type:last,min:40,focus:'Use it in a real task',mode:'In class, finish at home',inclass:['Plan in pairs','Do the task, then give each other feedback'],athome:[`Finish the ${last==='Writing'?'writing':last==='Quiz'?'practice':'speaking'} task on the portal`],key:[],mats:['Task sheet','Checklist'],notes:'Give whole-class feedback at the start of the next lesson.'}]}

function tplUnitView(page,t,n){const units=tplUnits(t);const U=units[n-1];if(!U){go('/a/curriculum/tpl/'+t.id);return}
 const ge=tplIsGE(t);const L=tplLessonsFor(t,n);const uw=tplUW(t);const inner=t.uw==='lessons'?'part':'lesson';const chev=ic('chev','ic small');const base=`#/a/curriculum/tpl/${t.id}`;
 const el=content(page,`<div class="crumbs"><a href="#/a/curriculum">Course templates</a>${chev}<a href="${base}">${t.name}</a>${chev}<b>${uw} ${n}: ${U.title}</b></div>
 <section class="fz-hero compact">${coverArt(String(n),t.fam)}<div><span class="fz-eyebrow">${uw} ${n} of ${t.units} · ${t.name}</span><h1>${U.title}</h1><div class="fz-meta"><span>${ic('book')}${L.length} ${inner}s</span>${ge?`<span>${ic('page')}Coursebook p.${unitRefs(n).cb.join(' to ')}</span>`:`<span>${ic('page')}${t.book}</span>`}<span>${ic('eye')}Template, version ${t.ver}</span></div></div>
  <div class="fz-card"><div class="k">By the end of this ${uw.toLowerCase()} students can</div><ul>${(ge?unitICan(n):[`explain the key ideas of "${U.title}"`,'use the language in guided practice','do a real task and act on feedback']).map(x=>`<li>${x}</li>`).join('')}</ul>
  <a class="btn primary" href="${base}/${n}/a">${ic('play')}Open ${inner} 1</a><a class="alt" href="#" id="editU">Edit this ${uw.toLowerCase()}</a></div></section>

const PLAIN_SKIP='script,style,textarea,input,select,.rep,.lx-body,.paper,.transcript,.qopt,.opt,.qs,.q,.seg,.chip,kbd,.sr-tag b';

 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const v=n.nodeValue;const lead=v.match(/^\s*/)[0],trail=v.match(/\s*$/)[0];const t0=v.trim();let t=t0;
  for(const [re,rep] of PLAIN){if(re.global)t=t.replace(re,rep);else if(re.test(t))t=t.replace(re,rep)}
  if(t!==t0)n.nodeValue=(t.startsWith(':')?'':lead)+t+trail})}

 plainText(app)}

function pathOverlay(P,s){
 const steps=(P.flat||[]).slice(0,8);if(!steps.length)return'';
 let cur=steps.findIndex(x=>x.state==='now');if(cur<0)cur=Math.max(0,steps.findIndex(x=>x.state!=='done'));

 const d=xs.map((x,i)=>i?`S${(xs[i-1]+x)/2} ${ys[i-1]} ${x} ${ys[i]}`:`M${x} ${ys[i]}`).join(' ');
 const doneN=steps.filter(x=>x.state==='done').length;

 return`<svg class="wpath" viewBox="0 0 700 250" preserveAspectRatio="xMidYMid meet">

  <filter id="wgl" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="wsh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2A1360" flood-opacity=".18"/></filter>
 </defs>
 <path d="${d}" fill="none" stroke="rgba(42,19,96,.10)" stroke-width="16" stroke-linecap="round" transform="translate(0,7)"/>
 <path d="${d}" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
 <path d="${d}" fill="none" stroke="url(#wpg)" stroke-width="13" stroke-linecap="round" filter="url(#wgl)" pathLength="100" stroke-dasharray="${(frac*100).toFixed(1)} 100"/>
 <path class="wspark" d="${d}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="2.5 97.5"/>
 ${steps.map((st,i)=>{const x=xs[i],y=ys[i];const dn=st.state==='done',now=i===cur,lock=st.state==='lock'||st.state==='preview';
  const open=!lock;const r=now?27:19;
  const face=dn?`<circle cx="${x}" cy="${y}" r="${r}" fill="#22C55E" filter="url(#wsh)"/>${glyph('check',x,y,'#fff')}`
   :now?`<circle class="wpulse" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#EC4899" stroke-width="3"/>
     <circle cx="${x}" cy="${y}" r="${r}" fill="url(#wnow)" filter="url(#wgl)"/>${glyph(st.icon||'play',x,y,'#fff',1.15)}`
   :lock?`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(255,255,255,.7)" stroke="rgba(42,19,96,.12)" stroke-width="2"/>${glyph('lock',x,y,'#9A93BC')}`
   :`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" filter="url(#wsh)"/>${glyph(st.icon||'star',x,y,'#7C3AED')}`;
  const mins=st.mins?`<text x="${x}" y="${y+r+20}" text-anchor="middle" style="font:700 12px var(--font);fill:${now?'#9D174D':'#4A4766'}">${st.mins} min</text>`:'';
  const tip=now?`<g class="wflag"><rect x="${Math.max(6,Math.min(694-236,x-118))}" y="${y-r-52}" width="236" height="34" rx="17" fill="#12112A" filter="url(#wsh)"/>
    <text x="${Math.max(124,Math.min(694-118,x))}" y="${y-r-29}" text-anchor="middle" style="font:700 13px var(--font);fill:#fff">${esc(clean(st.title)).slice(0,32)}</text>
    <path d="M${x-8} ${y-r-18} L${x+8} ${y-r-18} L${x} ${y-r-7}Z" fill="#12112A"/></g>`:'';
  const g=`<g class="wnode ${now?'is-now':''}">${face}${mins}${tip}</g>`;
  return open?`<a href="#/s/path/${st.id}" aria-label="${esc(clean(st.title))}">${g}</a>`:g}).join('')}
 <g transform="translate(${x1+46} ${ys[n-1]})"><g class="wflagpole">

 </svg>`}

/* ---------- the learning path as a picture ---------- */
function journeyMap(P,s){const st=P.stages;const W=920,H=180;
 let cur=st.findIndex(sg=>(sg.steps||[]).some(x=>x.state==='now'));if(cur<0)cur=st.findIndex(sg=>(sg.steps||[]).some(x=>x.state!=='done'));if(cur<0)cur=0;
 const names=['Check','Practise','Use it','Unit test'];const icons=['✓','✎','🗣','🏁'];
 const xs=st.map((_,i)=>90+i*((W-180)/(st.length-1||1)));
 const ys=st.map((_,i)=>[112,74,116,66][i%4]);
 const path=xs.map((x,i)=>i?`S${(xs[i-1]+x)/2} ${ys[i-1]} ${x} ${ys[i]}`:`M${x} ${ys[i]}`).join(' ');
 const done=i=>(st[i].steps||[]).length&&(st[i].steps||[]).every(x=>x.state==='done');
 return`<div class="jmap"><h3>My road through Unit ${clsById[s.cls].unit}</h3><div class="sub2">Four stops. You are on stop ${cur+1}.</div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your path: ${names.join(', ')}">

  <path d="${path}" fill="none" stroke="var(--surface-3)" stroke-width="16" stroke-linecap="round"/>
  <path d="${path}" fill="none" stroke="url(#jg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="${1400-(cur/(st.length-1||1))*1400*0.92}"/>
  ${xs.map((x,i)=>{const y=ys[i];const isDone=done(i);const isNow=i===cur;
   return`<g><circle cx="${x}" cy="${y}" r="${isNow?30:24}" fill="${isDone?'#22C55E':isNow?'url(#jg2)':'var(--card-solid)'}" stroke="${isDone||isNow?'transparent':'var(--line-strong)'}" stroke-width="3"/>
   <text x="${x}" y="${y+6}" text-anchor="middle" style="font:700 ${isNow?18:16}px var(--font);fill:${isDone||isNow?'#fff':'var(--ink-3)'}">${isDone?'✓':icons[i]||i+1}</text>
   <text x="${x}" y="${y+(isNow?54:46)}" text-anchor="middle" style="font:700 13.5px var(--font);fill:var(--ink-2)">${names[i]||st[i].t}</text>

    <path d="M${x-6} ${y-42} L${x+6} ${y-42} L${x} ${y-34}Z" fill="#12112A"/></g>`:''}</g>`}).join('')}
 </svg>
 ${badgeStrip(P,s)}</div>`}

.sw.on i{transform:translateX(23px)}
.sopt{display:flex;gap:8px;flex-wrap:wrap}
.sopt button{height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--edge1);background:var(--card);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.sopt button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 24px -14px rgba(217,70,239,.95)}
.sfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.sfield{padding:14px 16px;border-radius:18px;background:var(--surface-2)}
.sfield span{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sfield b{display:block;font-size:15.5px;font-weight:600;margin-top:4px;word-break:break-word}
.sme{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.sme .av3{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:24px;font-weight:600;flex:0 0 66px}
.sme h3{font-family:var(--display);font-size:22px;font-weight:600;margin:0}
.sme p{font-size:14px;color:var(--ink-3);margin:3px 0 0}
.sfoot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:20px 0 6px}
.sfoot .grow2{flex:1}
.snote{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-3);margin:14px 0 0;line-height:19px}
.snote svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 17px;margin-top:1px}
:root[data-text="l"] #page{zoom:1.1}
:root[data-text="xl"] #page{zoom:1.22}
:root[data-motion="less"] #app *{animation:none!important;transition:none!important}
[data-role="s"] .dock nav a[href$="/work"]{--nc:#F43F5E}
[data-role="s"] .dock nav a[href$="/room"]{--nc:#14B8A6}
[data-role="s"] .dock .iconbtn.setbtn{color:#7C3AED}
[data-role="s"] .dock .iconbtn.setbtn svg{filter:drop-shadow(0 0 5px rgba(124,58,237,.5))}
[data-role="s"] .dock .iconbtn.setbtn.active{background:var(--grad);color:#fff;box-shadow:0 10px 26px -10px rgba(217,70,239,.9)}
@media (max-width:1000px){
 :root[data-role="s"] .dock .bottom{display:flex;flex-direction:row;margin:0 0 0 auto;padding:0;align-items:center}
 :root[data-role="s"] .dock .bottom .iconbtn:not(.setbtn){display:none}
}
</style>
<script>
/* ---------- tests: sample data ---------- */
const TESTS=[
 {id:'ts1',cls:'c1',title:'Unit 5 progress test',kind:'In class',date:addDays(TODAY,4),mins:30,where:'JLT 2',
  what:['Grammar from units 4 and 5','20 travel words','A short listening, 2 questions'],ready:'/s/path'},
 {id:'ts2',cls:'x1',title:'IELTS mock test 1',kind:'Full practice test',date:addDays(TODAY,8),mins:165,where:'JLT 4',
  what:['Listening, 30 minutes','Reading, 60 minutes','Writing, 60 minutes','Speaking on another day'],ready:'/s/classes/x1'},
 {id:'ts3',cls:'c1',title:'End of course test: B1',kind:'Level test',date:new Date(2026,10,26),mins:90,where:'JLT 2',pass:60,
  what:['Reading and writing','Listening','Speaking with a teacher'],ready:'/s/path'}
];
const TESTSDONE=[
 {id:'td1',cls:'c1',title:'Unit 4 progress test',date:addDays(TODAY,-13),score:68,pass:60},
 {id:'td0',past:'a2',title:'End of course test: A2',date:new Date(2026,2,27),score:79,pass:60,cert:true}
];
const testCls=t=>t.cls?clsById[t.cls]:null;
const testName=t=>{const c=testCls(t);if(c)return c.name;const p=typeof pastById==='function'&&t.past?pastById(t.past):null;return p?p.name:''};

/* ---------- gather the student's work ---------- */
function curClasses(s){return(typeof stEnrol==='function')?stEnrol(s).cur:[clsById[s.cls]]}
function workAll(s){const out=[];curClasses(s).forEach(c=>tasksOfCls(c).filter(t=>t.verb!=='suggest').forEach(t=>out.push({t,c,st:hwStatus(t,s)})));
 return out.sort((a,b)=>a.t.due-b.t.due)}
const workOpen=s=>workAll(s).filter(x=>['todo','missing','rev'].includes(x.st.k));
const workWait=s=>workAll(s).filter(x=>x.st.k==='wait');
const workDone=s=>workAll(s).filter(x=>x.st.k==='done').reverse();
function workAvg(s){const d=workDone(s).map(x=>subScore(x.st.m));const t=TESTSDONE.map(x=>x.score);const all=d.concat(t);
 return all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):null}
const mins2=m=>{if(m<60)return`${m} minutes`;const h=Math.floor(m/60),r=m%60;return`${h} ${h===1?'hour':'hours'}${r?` ${r} minutes`:''}`};
const dueWord=d=>{const n=dayDiff(d);return n<0?(n===-1?'1 day late':`${-n} days late`):n===0?'Today':n===1?'Tomorrow':`In ${n} days`};

/* ---------- the page ---------- */
STU.work=function(page,r){const s=curStudent();const tab=['todo','tests','results'].includes(r.a)?r.a:'todo';
 const open=workOpen(s),wait=workWait(s),done=workDone(s);const avg=workAvg(s);
 const soon=TESTS.slice().sort((a,b)=>a.date-b.date)[0];
 const el=content(page,`<div class="hey"><div><h1>Tasks and tests.<span>Everything to do, and all your results in one place.</span></h1></div>
  <div class="hey-act"><a class="btn" href="#/s/progress">${ic('chart')}My progress</a><a class="btn cta" href="#/s/report">${ic('dl')}My report</a></div></div>
 <div class="wtiles">
  <a class="wtile ${tab==='todo'?'on':''}" href="#/s/work/todo" style="--tc:#EC4899"><span class="gic">${ic('write')}</span><b>${open.length}</b><span>To do</span><small>${open.length?`Next: ${dueWord(open[0].t.due).toLowerCase()}`:'Nothing waiting for you'}</small></a>
  <a class="wtile ${tab==='tests'?'on':''}" href="#/s/work/tests" style="--tc:#A855F7"><span class="gic">${ic('flag')}</span><b>${TESTS.length}</b><span>Tests coming</span><small>${soon?`${soon.title.split(':')[0]} · ${dueWord(soon.date).toLowerCase()}`:''}</small></a>
  <a class="wtile" href="#/s/work/todo" style="--tc:#3B82F6"><span class="gic">${ic('log')}</span><b>${wait.length}</b><span>With the teacher</span><small>${wait.length?'Being marked now':'Nothing to wait for'}</small></a>
  <a class="wtile ${tab==='results'?'on':''}" href="#/s/work/results" style="--tc:#22C55E"><span class="gic">${ic('check')}</span><b>${avg==null?'--':avg+'%'}</b><span>My average</span><small>${done.length+TESTSDONE.length} marked so far</small></a>
 </div>
 <div class="chips3">${[['todo','To do',open.length],['tests','Tests',TESTS.length],['results','Results',done.length+TESTSDONE.length]].map(([k,l,n])=>`<a href="#/s/work/${k}"><button class="${tab===k?'on':''}">${l}<span class="dot2" style="background:${tab===k?'#fff':'var(--ink-dis)'}"></span>${n}</button></a>`).join('')}</div>
 <div id="wb"></div>`);
 const b=el.querySelector('#wb');
 if(tab==='todo')wkTodo(b,s,open,wait);
 else if(tab==='tests')wkTests(b,s);
 else wkResults(b,s,done);
 b.querySelectorAll('[data-fb]').forEach(x=>x.onclick=()=>{const t=taskById[x.dataset.fb]||S.assigned.find(k=>k.id===x.dataset.fb);openHomework(t,s)});
 return el};

function wkRow(x,href){const t=x.t,st=x.st;return`<a class="syl-row" href="${href}"><span class="no ti ${t.type}" style="border-radius:16px">${ic(TYPEICON[t.type])}</span>
 <div><h3>${esc(t.title)}</h3><p>${esc(x.c.name)} · ${t.type} · Unit ${t.unit}${t.pts?` · ${t.pts} points`:''}</p></div>
 <span class="fzstt">${pill(st.l,st.cls)}<br><span class="note-s">${dueWord(t.due)} · ${fmtD(t.due)}</span></span>${ic('chev')}</a>`}

function wkTodo(b,s,open,wait){
 const byCls=curClasses(s).map(c=>({c,rows:open.filter(x=>x.c.id===c.id)})).filter(g=>g.rows.length);
 b.innerHTML=`${byCls.length?byCls.map(g=>`<div class="secbar"><h2>${esc(g.c.name)}</h2><span class="cnt2">${g.rows.length}</span><span class="ln2"></span><span class="note-s">${g.c.days}, ${g.c.time} · ${g.c.room}</span></div>
  <div class="fzsyl">${g.rows.map(x=>wkRow(x,`#/s/task/${x.t.id}`)).join('')}</div>`).join('')
 :`<div class="emptyw"><b>Nothing to do right now</b>You are up to date. Do a short practice on your path to keep your streak.<div style="margin-top:14px"><a class="btn cta" href="#/s/path">${ic('play')}Practise 5 minutes</a></div></div>`}
 ${wait.length?`<div class="secbar past" style="margin-top:30px"><h2>With the teacher</h2><span class="cnt2">${wait.length}</span><span class="ln2"></span><span class="note-s">You will get a message when it comes back</span></div>
  <div class="fzsyl">${wait.map(x=>wkRow(x,`#/s/task/${x.t.id}`)).join('')}</div>`:''}
 <p class="snote">${ic('info')}<span>Homework counts towards your grade. Practice on your path does not: it is only to help you.</span></p>`}

function wkTests(b,s){const up=TESTS.slice().sort((a,b2)=>a.date-b2.date);
 b.innerHTML=`<div class="secbar"><h2>Coming next</h2><span class="cnt2">${up.length}</span><span class="ln2"></span><span class="note-s">Dates come from your teacher</span></div>
 <div class="tcards">${up.map((t,i)=>{const n=dayDiff(t.date);const soon=i===0;
  return`<article class="tcard ${soon?'soon':''}"><span class="cnt3">${dueWord(t.date)}</span>
   <div class="dt"><span class="cube"><b>${t.date.getDate()}</b><span>${t.date.toLocaleDateString('en-GB',{month:'short'})}</span></span>
    <div><h3>${esc(t.title)}</h3><span class="crs">${esc(testName(t))}</span></div></div>
   <div class="meta2"><span>${ic('cal')}${t.date.toLocaleDateString('en-GB',{weekday:'long'})} ${fmtD(t.date)}</span>
    <span>${ic('log')}${mins2(t.mins)}</span>
    <span>${ic('classes')}${esc(t.where)} · ${esc(t.kind)}</span>
    ${t.pass?`<span>${ic('flag')}Pass mark ${t.pass}%. Pass it and you move up a level.</span>`:''}</div>
   <ul class="what"><b>What is in it</b>${t.what.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
   <div class="cta2"><a class="btn ${soon?'cta':''}" href="#${t.ready}">${ic('play')}Get ready</a><a class="btn" href="#/s/progress">${ic('chart')}What to practise</a></div></article>`}).join('')}</div>
 <div class="secbar past"><h2>Tests I have done</h2><span class="cnt2">${TESTSDONE.length}</span><span class="ln2"></span></div>
 <div class="fzsyl"><div class="rrows">${TESTSDONE.map(t=>{const ok=t.score>=t.pass;
  return`<div class="rrow"><span class="no2">${ic(ok?'check':'warn')}</span>
   <div><b>${esc(t.title)}</b><small>${esc(testName(t))} · ${t.date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${ok?'Passed':'Not passed'}</small></div>
   <span class="rmeter ${ok?'ok':'low'}"><i style="width:${t.score}%"></i></span><span class="rsc">${t.score}%</span>${t.cert?`<a class="btn sm" href="#/s/report" style="white-space:nowrap">${ic('dl')}Certificate</a>`:ic('chev')}</div>`}).join('')}</div></div>`}

function wkResults(b,s,done){const avg=workAvg(s);
 const rows=done.map(x=>({title:x.t.title,sub:`${x.c.name} · ${x.t.type} · Unit ${x.t.unit}`,score:subScore(x.st.m),icon:TYPEICON[x.t.type],id:x.t.id,when:fmtD(addDays(x.t.due,2))}))
  .concat(TESTSDONE.map(t=>({title:t.title,sub:`${testName(t)} · Test`,score:t.score,icon:'flag',when:fmtD(t.date)})));
 const CAP=8;const many=rows.length>CAP;const shown=S.workAll?rows:rows.slice(0,CAP);
 const rowH=r=>`<${r.id?'button':'div'} class="rrow" ${r.id?`data-fb="${r.id}"`:''}>
   <span class="no2">${ic(r.icon)}</span><div><b>${esc(r.title)}</b><small>${esc(r.sub)} · came back ${r.when}</small></div>
   <span class="rmeter ${r.score>=75?'ok':r.score<60?'low':''}"><i style="width:${r.score}%"></i></span><span class="rsc">${r.score}</span>${r.id?ic('chev'):'<span></span>'}</${r.id?'button':'div'}>`;
 b.innerHTML=`<div class="prg"><section class="pn c7"><div class="pn-h"><h3>My scores</h3><span class="sub">Homework and tests that came back</span></div>
  <div class="pn-b">${rows.length?`<div class="rrows">${shown.map(rowH).join('')}</div>
   ${many?`<div style="padding-top:14px"><button class="btn" id="wmore">${ic(S.workAll?'chev':'chevd')}${S.workAll?'Show fewer':`Show all ${rows.length}`}</button></div>`:''}`
  :'<div class="emptyw"><b>No results yet</b>Your first marked task will show here.</div>'}
  <p class="snote">${ic('info')}<span>You only see a score when your teacher has finished marking it. Tap a row to read the feedback.</span></p></div></section>
  <section class="pn c5"><div class="pn-h"><h3>My average</h3><span class="sub">All courses together</span></div><div class="pn-b">
   <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px"><b style="font-family:var(--display);font-size:46px;font-weight:600;line-height:1">${avg==null?'--':avg}</b><span class="note-s">out of 100</span></div>
   <span class="rmeter" style="height:12px"><i style="width:${avg||0}%"></i></span>
   <p class="note-s" style="margin-top:12px">${avg>=70?'You are above the 60% you need for your B1 certificate.':'You need 60% to pass your B1 course.'}</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><a class="btn cta" href="#/s/report">${ic('dl')}Report for my parents</a><a class="btn" href="#/s/progress">${ic('chart')}My skills</a></div>
  </div></section></div>
 ${typeof historyCard==='function'?historyCard(s):''}`;
 const mb=b.querySelector('#wmore');if(mb)mb.onclick=()=>{S.workAll=!S.workAll;render()}}

/* ---------- settings ---------- */
const SET_DEF={lang:'en',simple:true,aloud:true,nHw:true,nMark:true,nClass:true,nTest:true,nRoom:false,
 chEmail:true,chPush:true,chSms:false,goal:10,remind:'19:00',text:'m',motion:false,seeRoom:true,letPlay:true,shareParent:true};
S.set=Object.assign({},SET_DEF);
try{const j=localStorage.getItem('sbx-set');if(j)Object.assign(S.set,JSON.parse(j))}catch(e){}
function applySet(){const d=document.documentElement;d.dataset.text=S.set.text;if(S.set.motion)d.dataset.motion='less';else d.removeAttribute('data-motion')}
function setSave(){try{localStorage.setItem('sbx-set',JSON.stringify(S.set))}catch(e){}applySet()}
applySet();
const LANGS=[['en','English'],['ar','العربية'],['ru','Русский'],['tr','Türkçe'],['fr','Français']];
const swch=(k,lbl)=>`<button class="sw ${S.set[k]?'on':''}" data-sw="${k}" role="switch" aria-checked="${!!S.set[k]}" aria-label="${lbl}"><i></i></button>`;
const srow=(icon,col,title,sub,ctrl)=>`<div class="srow"><span class="si" style="--sc:${col}">${ic(icon)}</span><div><b>${title}</b><small>${sub}</small></div>${ctrl}</div>`;

STU.settings=function(page){const s=curStudent();const c=clsById[s.cls];const first=s.name.split(' ')[0];
 const el=content(page,`<div class="hey"><div><h1>Settings.<span>Your account, your language, and what we tell you about.</span></h1></div></div>
 <div class="prg">
  <section class="pn c7"><div class="pn-h"><h3>My account</h3><span class="sub">From the school office</span></div><div class="pn-b">
   <div class="sme"><span class="av3" style="background:${avCol(s.name)}">${ini(s.name)}</span><div><h3>${esc(s.name)}</h3><p>${esc(c.name)} · ${esc(c.campus==='DXB'?'Dubai JLT':'London')}</p></div></div>
   <div class="sfields">
    <div class="sfield"><span>Student number</span><b>SB-${String(1000+STUDENTS.indexOf(s)).slice(0,4)}</b></div>
    <div class="sfield"><span>Email</span><b>${esc(first.toLowerCase())}@example.com</b></div>
    <div class="sfield"><span>Phone</span><b>+971 50 000 0000</b></div>
    <div class="sfield"><span>My courses</span><b>${curClasses(s).length} now</b></div>
   </div>
   <div class="sfoot"><button class="btn" id="spw">${ic('shield')}Change my password</button><span class="grow2"></span><button class="btn" id="shelp">${ic('help')}Ask the office</button></div>
   <p class="snote">${ic('info')}<span>The office writes your name, email and phone. Ask them if something is wrong.</span></p>
  </div></section>

  <section class="pn c5"><div class="pn-h"><h3>Language and reading</h3><span class="sub">How the portal talks to you</span></div><div class="pn-b">
   ${srow('msg','#A855F7','My language','Menus and buttons in your language. Your lessons stay in English.',`<select class="input" id="slang" style="width:150px">${LANGS.map(([k,l])=>`<option value="${k}" ${S.set.lang===k?'selected':''}>${l}</option>`).join('')}</select>`)}
   ${srow('speak','#EC4899','Read to me','A Listen button on every page.',swch('aloud','Read to me'))}
   ${srow('eye','#3B82F6','Text size','Make the words bigger.',`<div class="sopt">${[['m','A'],['l','A+'],['xl','A++']].map(([k,l])=>`<button class="${S.set.text===k?'on':''}" data-text="${k}">${l}</button>`).join('')}</div>`)}
  </div></section>

  <section class="pn"><div class="pn-h"><h3>Tell me about</h3><span class="sub">What we send you, and where</span></div><div class="pn-b">
   ${srow('write','#22C55E','New homework and marks','When a teacher gives you a task or sends it back.',swch('nHw','New homework and marks'))}
   ${srow('flag','#A855F7','Test dates','A reminder 3 days before a test.',swch('nTest','Test dates'))}
   ${srow('cal','#3B82F6','Class changes','A new room, a new time, or no class.',swch('nClass','Class changes'))}
   <div class="sfoot"><span class="note-s">Send it to:</span><div class="sopt">${[['chPush','My phone'],['chEmail','Email'],['chSms','SMS']].map(([k,l])=>`<button class="${S.set[k]?'on':''}" data-ch="${k}">${l}</button>`).join('')}</div></div>
  </div></section>
 </div>
 <div class="sfoot" style="border-top:1px solid var(--line);margin-top:6px">
  <a class="btn" href="#/s/messages">${ic('msg')}Message my teacher</a>
  <a class="btn" href="#/s/report">${ic('dl')}Download my report</a>
  <span class="grow2"></span><button class="btn" id="sout">${ic('external')}Sign out</button></div>`);

 el.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const k=b.dataset.sw;S.set[k]=!S.set[k];b.classList.toggle('on',S.set[k]);b.setAttribute('aria-checked',String(!!S.set[k]));setSave();
  toast(`${b.getAttribute('aria-label')}: ${S.set[k]?'on':'off'}`)});
 el.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const k=b.dataset.ch;S.set[k]=!S.set[k];b.classList.toggle('on',S.set[k]);setSave()});
 el.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{S.set.text=b.dataset.text;setSave();el.querySelectorAll('[data-text]').forEach(x=>x.classList.toggle('on',x.dataset.text===S.set.text))});
 const lg=el.querySelector('#slang');if(lg)lg.onchange=()=>{S.set.lang=lg.value;setSave();
  toast(S.set.lang==='en'?'Menus are in English.':'Menus will change language. Your lessons stay in English.')};
 el.querySelector('#spw').onclick=()=>openLayer(`<div class="th"><h2>Change my password</h2><button class="iconbtn" data-close>${ic('x')}</button></div>
  <div class="tb" style="display:flex;flex-direction:column;gap:12px">
   <div class="field"><label>My password now</label><input class="input" type="password" placeholder="••••••••"></div>
   <div class="field"><label>New password</label><input class="input" type="password" placeholder="At least 8 letters and numbers"></div>
   <div class="field"><label>Write the new password again</label><input class="input" type="password"></div>
   <div class="alert info">${ic('info')}<span>Do not give your password to anybody, not even a teacher.</span></div>
  </div><div class="tf"><button class="btn" data-close>Cancel</button><button class="btn primary" data-close id="pwok">Save</button></div>`,'modal',{cls:'sm'});
 el.querySelector('#shelp').onclick=()=>toast('Student services: reception at JLT, or +971 4 000 0000.');
 el.querySelector('#sout').onclick=()=>toast('This is a prototype, so sign out is switched off.');
 return el};

/* ---------- nav: tasks in the dock, settings on its own ---------- */
(function(){const _n=stNav;stNav=function(){const x=_n().map(i=>i.slice());const i=x.findIndex(y=>y[0]==='classes');
 x.splice(i+1,0,['work','My tasks','mark']);return x}})();

(function(){const _r=window.render;window.render=function(){const out=_r.apply(this,arguments);const r=route();
 if(r.role!=='s')return out;
 const bottom=document.querySelector('.dock .bottom');
 if(bottom&&!bottom.querySelector('.setbtn')){const a=document.createElement('a');a.className='iconbtn setbtn';a.href='#/s/settings';a.title='Settings';
  a.setAttribute('aria-label','Settings');a.innerHTML=ic('settings');bottom.prepend(a)}
 const sb=document.querySelector('.dock .setbtn');if(sb)sb.classList.toggle('active',r.page==='settings');
 const who=document.querySelector('.fbar .who');if(who&&!who.dataset.set){who.dataset.set='1';who.style.cursor='pointer';who.title='Settings';who.onclick=()=>go('/s/settings')}
 const cb=document.querySelector('.fbar .crumb b');
 if(cb&&r.page==='settings')cb.textContent='Settings';
 if(cb&&r.page==='work')cb.textContent='Tasks and tests';
 const dk=document.querySelector('.dock nav a[href$="/work"]');
 if(dk)dk.classList.toggle('active',r.page==='work');
 return out}})();

/* home: a short strip so students find their tasks and tests */
(function(){const _h=STU.home;STU.home=function(page){const el=_h(page)||page.querySelector('.content');const s=curStudent();
 const open=workOpen(s);const soon=TESTS.slice().sort((a,b)=>a.date-b.date)[0];
 const anchor=el.querySelector('.wel')||el.querySelector('.hey');if(!anchor||el.querySelector('.wtiles'))return el;
 const d=document.createElement('div');d.className='wtiles';d.style.margin='26px 0';
 d.innerHTML=`<a class="wtile" href="#/s/work/todo" style="--tc:#EC4899"><span class="gic">${ic('write')}</span><b>${open.length}</b><span>To do</span><small>${open.length?`Next: ${esc(open[0].t.title)}`:'Nothing waiting for you'}</small></a>
  <a class="wtile" href="#/s/work/tests" style="--tc:#A855F7"><span class="gic">${ic('flag')}</span><b>${soon?dayDiff(soon.date):'--'}</b><span>Days to my next test</span><small>${soon?esc(soon.title):''}</small></a>
  <a class="wtile" href="#/s/work/results" style="--tc:#22C55E"><span class="gic">${ic('check')}</span><b>${workAvg(s)||'--'}%</b><span>My average</span><small>Homework and tests</small></a>`;
 anchor.insertAdjacentElement('afterend',d);
 /* the homework card only covers the main class: say so when another course has tasks */
 const other=open.filter(x=>x.c.id!==s.cls);
 if(other.length)el.querySelectorAll('.pn-h').forEach(h=>{const t=h.querySelector('h3');if(!t||!/homework/i.test(t.textContent))return;
  const sub=h.querySelector('.sub');if(sub)sub.textContent=`${clsById[s.cls].name} · ${other.length} more in ${other[0].c.name}`});
 return el}})();
</script>
<script>
/* ---------- rewards shelf lives on the progress page ---------- */
(function(){const _p=STU.progress;if(!_p)return;
 STU.progress=function(page,r){const out=_p(page,r);const el=(out&&out.querySelectorAll)?out:page.querySelector('.content')||page;
 if(el.querySelector('.shelf'))return out;
 const s=curStudent();const avg=(typeof workAvg==='function')?workAvg(s):null;
 const w=document.createElement('div');w.className='prg';w.innerHTML=rewardShelf(s,avg);
 const hey=el.querySelector('.hey');const first=el.querySelector('.prg');
 if(first)first.insertAdjacentElement('afterend',w);else if(hey)hey.insertAdjacentElement('afterend',w);else el.appendChild(w);
 return out}})();
</script>
<style>
/* a calmer learning path */
:root[data-role="s"] .bento{align-items:start}
.sr-mini{display:flex;flex-direction:column;gap:10px}
.sr-mini .who3{display:flex;align-items:center}
.sr-mini .who3 .av{margin-right:-10px;box-shadow:0 0 0 3px var(--card)}
.sr-mini .who3 .more{margin-left:18px;font-size:13.5px;color:var(--ink-3);font-weight:600}
.sr-mini .ask{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.sr-mini .ask .r-t b{display:block;font-size:14px;font-weight:600}
.sr-mini .ask .r-t span{font-size:12.5px;color:var(--ink-3)}
.sr-mini .ask .btn{margin-left:auto}
</style>
<script>
/* ---------- path page: fewer panels, nothing said twice ---------- */
function roomMini(s){
 const cm=(typeof classmates==='function')?classmates(s):[];const on=cm.filter(x=>x.on);
 const ch=(typeof challengeState==='function')?challengeState(s):[];const inc=ch.find(x=>x.status==='incoming');
 return`<div class="stackcol"><section class="pn" aria-labelledby="srmH"><div class="pn-h"><h3 id="srmH">Study room</h3><span class="sub">${on.length} classmates studying now</span></div>
 <div class="pn-b"><div class="sr-mini">
  <div class="who3">${on.slice(0,4).map(x=>`<span class="av" style="background:${avCol(x.m.name)}">${ini(x.m.name)}</span>`).join('')}
   ${on.length?`<span class="more">${on.slice(0,2).map(x=>firstL(x.m.name)).join(', ')}${on.length>2?` and ${on.length-2} more`:''}</span>`:'<span class="more">Nobody is online right now</span>'}</div>
  ${inc?`<div class="ask"><span class="av" style="background:${avCol(inc.with)}">${ini(inc.with)}</span><div class="r-t"><b>${firstL(inc.with)} wants to play</b><span>${esc(inc.topic)}</span></div>
   <a class="btn sm primary" href="#/s/path/ch-${inc.bank}-${inc.id}">${ic('play')}Play</a></div>`:''}
  <a class="btn cta" href="#/s/room" style="align-self:flex-start">${ic('users')}Open the study room</a>
  <p class="note-s" style="margin:0">Short quizzes with a friend. There is no chat.</p>
 </div></div></section></div>`}

(function(){const _p=STU.path;STU.path=function(page,r){const out=_p(page,r);if(r&&r.a)return out;
 const el=page.querySelector('.content');if(!el)return out;
 try{const s=curStudent();
  /* the reason is already on the Next card, so drop it from the step list */
  el.querySelectorAll('.pathline .ps-why').forEach(n=>n.remove());
  /* the Next card already carries the Start button */
  el.querySelectorAll('.ps.now .ps-card .btn').forEach(n=>n.remove());
  /* the streak and average live on the dashboard and the rewards shelf */
  el.querySelectorAll('.pline').forEach(n=>n.remove());
  /* one call to action on the Next card, not two */
  el.querySelectorAll('.lc-cta .note-s').forEach(n=>n.remove());
  /* two classmate panels become one */
  const stack=el.querySelector('.stackcol');
  if(stack&&!stack.querySelector('.sr-mini')){const w=document.createElement('div');w.innerHTML=roomMini(s);
   stack.replaceWith(w.firstElementChild);if(typeof wireFriends==='function')wireFriends(el,s)}
 }catch(e){}
 return out}})();
</script>
<script>
if(!location.hash)location.hash='#/t/home';
render();
</script>
