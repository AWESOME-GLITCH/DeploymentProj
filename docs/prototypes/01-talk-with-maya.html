<!doctype html>
<!--
  Talk with Maya - Learning Path prototype 01 (round two rebuild).
  Standalone: open this file in a phone browser (390 x 844, no page scroll).
  Cast art: Open Peeps by Pablo Stanley and Open Doodles (both CC0), pre-rendered in the palette
  by scripts/lp/cast.mjs into docs/design/cast/ and inlined here. Blobert is docs/design/cast/blobert.svg.
  Test hooks: window.LP.start(), LP.answer(text), LP.miss(), LP.finish(), LP.freeze().
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>Talk with Maya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink); --pill:var(--ink); --on-pill:var(--cream);
  --spring:cubic-bezier(.2,1.4,.4,1); --ease:cubic-bezier(.3,.7,.2,1);
}
html[data-theme="dark"]{ --page:#121212; --on-page:var(--cream); --pill:var(--cream); --on-pill:var(--ink) }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overflow:hidden}
body{
  margin:0; background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition:background .3s var(--ease), color .3s var(--ease);
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0}
:focus-visible{outline:3px solid var(--on-page); outline-offset:3px; border-radius:8px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.hide{display:none !important}

/* ---------- shell ---------- */
.phone{
  width:min(100vw,430px); height:100dvh;
  display:flex; flex-direction:column; gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
}

/* ---------- top strip: three thick segments + theme ---------- */
.top{display:flex; align-items:center; gap:14px; height:36px; flex:none}
.prog{display:flex; gap:7px; flex:1}
.seg{position:relative; height:14px; flex:1; border-radius:99px; border:3px solid var(--on-page); overflow:hidden}
.seg i{position:absolute; inset:0; background:var(--on-page); transform:scaleX(0); transform-origin:left; transition:transform .4s var(--spring)}
.seg.half i{transform:scaleX(.5)}
.seg.on i{transform:scaleX(1)}
.theme{width:36px; height:36px; border-radius:99px; border:3px solid var(--on-page); display:grid; place-items:center; flex:none}
.theme svg{width:17px; height:17px; display:block}
.theme .sun-ico{display:none}
html[data-theme="dark"] .theme .moon{display:none}
html[data-theme="dark"] .theme .sun-ico{display:block}

/* ---------- the card ---------- */
.card{
  --block:var(--sun);
  position:relative; flex:1; min-height:0; overflow:hidden;
  border:3px solid var(--ink); border-radius:28px; background:var(--block); color:var(--ink);
  transition:background .4s var(--ease);
  animation:pop .35s var(--spring) both;
}
.card[data-state="listen"],.card[data-state="miss"]{--block:var(--sky)}
.card[data-state="done"]{--block:var(--mint)}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.96)} 70%{transform:scale(1.02)} to{opacity:1; transform:none}}
@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}

.head{position:relative; z-index:3; padding:22px 22px 0}
h1{margin:0; padding-right:56px; font-weight:800; font-size:38px; line-height:1.02; letter-spacing:-.025em; animation:rise .35s var(--spring) both}
.lede{margin:10px 0 0; font-size:16px; line-height:1.35; animation:rise .35s var(--spring) .06s both}

/* Maya's bubble */
.say{
  position:relative; display:inline-block; max-width:100%; margin:14px 0 0; padding:11px 16px 12px;
  background:var(--cream); border:3px solid var(--ink); border-radius:22px; box-shadow:5px 5px 0 var(--ink);
  font-size:21px; font-weight:700; line-height:1.25; letter-spacing:-.01em;
  animation:pop .35s var(--spring) both;
}
.say:before,.say:after{content:""; position:absolute; width:0; height:0; border-style:solid}
.say:before{right:34px; bottom:-20px; border-width:20px 0 0 16px; border-color:var(--ink) transparent transparent transparent}
.say:after{right:38px; bottom:-13px; border-width:13px 0 0 10px; border-color:var(--cream) transparent transparent transparent}
.w{opacity:.32; transition:opacity .15s; border-radius:4px}
.w.said{opacity:1}
.w.now{opacity:1; background:var(--sun); box-shadow:0 0 0 4px var(--sun)}
.card[data-state="intro"] .say,.card[data-state="done"] .say{display:none}

/* ---------- Maya, big and cropped at the card edge ---------- */
.maya{
  position:absolute; z-index:1; left:50%; bottom:-104px; width:640px; height:640px; margin-left:-314px;
  pointer-events:none; transform-origin:50% 92%;
  transition:transform .4s var(--spring);
  animation:rise .4s var(--spring) .06s both;
}
.card[data-state="intro"] .maya{transform:translateY(26px)}
.card[data-state="listen"] .maya{transform:translate(-12px,10px) rotate(-5deg) scale(1.04)}
.card[data-state="good"] .maya{transform:translateY(-8px) scale(1.03)}
.card[data-state="miss"] .maya{transform:translate(8px,8px) rotate(2deg)}
.card[data-state="done"] .maya{display:none}
.breathe{width:100%; height:100%; transform-origin:50% 100%; animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-.5deg)} 50%{transform:scale(1.02) rotate(.5deg)}}
.face{position:absolute; inset:0; visibility:hidden}
.face.on{visibility:visible}
.face svg,.hero svg{width:100%; height:100%; display:block}

/* ---------- end-card hero (Open Doodle) ---------- */
.hero{position:absolute; z-index:1; left:-150px; bottom:-60px; width:720px; height:540px; display:none; pointer-events:none; animation:rise .4s var(--spring) .06s both}
.card[data-state="done"] .hero{display:block}

/* ---------- stickers ---------- */
.stk{position:absolute; z-index:2; color:var(--ink); pointer-events:none; transition:opacity .25s, transform .35s var(--spring); filter:drop-shadow(0 0 2px var(--cream)) drop-shadow(0 0 1.5px var(--cream)) drop-shadow(0 0 1px var(--cream))}
.stk svg{display:block}
.tw{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)} 40%{transform:scale(1.18) rotate(12deg)} 65%{transform:scale(.94) rotate(-6deg)}}
.stk-star{top:24px; right:22px}
.stk-squig{left:18px; top:62%; animation-delay:1.1s}
.stk-heart{right:40px; top:49%; animation-delay:2s}
.stk-hear{right:14px; top:34%; opacity:0; transform:scale(.4) rotate(-20deg)}
.card[data-state="listen"] .stk-hear{opacity:1; transform:none}
.stk-note{left:50%; top:48%; opacity:0}
.card[data-state="speak"] .stk-note,.card[data-state="fix"] .stk-note{animation:note 1.4s ease-in-out infinite}
@keyframes note{0%{opacity:0; transform:translate(0,8px) scale(.6)} 30%{opacity:1} 100%{opacity:0; transform:translate(22px,-34px) scale(1.1) rotate(10deg)}}
.card[data-state="done"] .stk-squig,.card[data-state="done"] .stk-heart{display:none}
.stk-d2{left:26px; top:46%; display:none; animation-delay:1.4s}
.card[data-state="done"] .stk-d2{display:block}
/* the reward sticker: one of six, pops with overshoot */
.pop{position:absolute; z-index:6; right:18px; top:26%; width:116px; height:116px; opacity:0; pointer-events:none; color:var(--ink); filter:drop-shadow(0 0 2px var(--cream)) drop-shadow(0 0 2px var(--cream)) drop-shadow(0 0 1px var(--cream))}
.card[data-state="done"] .pop{top:30%; right:16px; width:92px; height:92px}
.pop svg{width:100%; height:100%}
.pop.go{animation:burst .4s var(--spring) both, fade .3s ease-in 1.2s both}
@keyframes burst{from{opacity:0; transform:scale(.2) rotate(-25deg)} to{opacity:1; transform:scale(1) rotate(8deg)}}
@keyframes fade{to{opacity:0; transform:scale(1.1) rotate(8deg)}}

/* ---------- the learner's bubble (target, then what they said, then the three bars) ---------- */
.you{
  position:absolute; z-index:4; left:18px; right:18px; bottom:18px; padding:11px 16px 13px;
  background:var(--paper); border:3px solid var(--ink); border-radius:22px; box-shadow:-5px 5px 0 var(--ink);
  font-size:21px; font-weight:700; line-height:1.25; letter-spacing:-.01em;
  display:none; animation:pop .35s var(--spring) both;
}
.you.show{display:block}
.you:before,.you:after{content:""; position:absolute; width:0; height:0; border-style:solid}
.you:before{left:34px; bottom:-20px; border-width:20px 16px 0 0; border-color:var(--ink) transparent transparent transparent}
.you:after{left:38px; bottom:-13px; border-width:13px 10px 0 0; border-color:var(--paper) transparent transparent transparent}
.you small{display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; opacity:.75}
.you.ghost{border-style:dashed; box-shadow:none; background:var(--cream)}
.you.ghost:before{display:none} .you.ghost:after{display:none}
.bars{display:none; gap:10px; margin-top:10px}
.you.scored .bars{display:flex}
.bar{flex:1}
.bar b{display:block; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px}
.track{display:block; height:13px; border:2.5px solid var(--ink); border-radius:99px; background:var(--cream); overflow:hidden}
.fill{display:block; height:100%; background:var(--ink); border-radius:99px; transform:scaleX(0); transform-origin:left; transition:transform .5s var(--spring)}
.bar:nth-child(2) .fill{transition-delay:.06s} .bar:nth-child(3) .fill{transition-delay:.12s}
.you.miss{right:150px; bottom:22px}
.you.swept{animation:swept .5s cubic-bezier(.5,0,.8,.3) both}
@keyframes swept{to{transform:translate(-130%,30px) rotate(-16deg); opacity:.9}}
.you.eaten{transform-origin:100% 0; animation:eaten .45s cubic-bezier(.6,0,.9,.4) both}
@keyframes eaten{to{transform:translate(70px,-20px) scale(0); opacity:.7}}

/* ---------- end-card bars (big, on the block colour, no box) ---------- */
.score{position:relative; z-index:3; padding:16px 22px 0; display:none; max-width:300px}
.card[data-state="done"] .score{display:block}
.score .row{display:flex; align-items:center; gap:12px; margin-top:10px; animation:rise .35s var(--spring) both}
.score .row:nth-child(2){animation-delay:.06s} .score .row:nth-child(3){animation-delay:.12s}
.score b{width:78px; font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
.score .track{flex:1; height:18px; border-width:3px; background:var(--paper)}

/* ---------- Blobert ---------- */
.blob{position:absolute; z-index:5; right:6px; bottom:-12px; width:196px; height:180px; pointer-events:none; transform:translateX(130%); display:none}
.blob #body > path:first-child,.blob #arm-left circle,.blob #arm-right circle{fill:var(--cream)}
.blob.show{display:block}
.blob svg{width:100%; height:100%; overflow:visible; display:block; transform:scaleX(-1)}
.blob.in{animation:blobIn .4s var(--spring) both}
@keyframes blobIn{from{transform:translateX(130%) rotate(24deg)} to{transform:translateX(0) rotate(0)}}
.blob.out{animation:blobOut .3s ease-in both}
@keyframes blobOut{from{transform:translateX(0)} to{transform:translateX(130%) rotate(-10deg)}}
.blob #body{transform-box:fill-box; transform-origin:50% 100%; animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.04,.96)}}
.blob #eyes{transform-box:fill-box; transform-origin:50% 50%; animation:blink 3.4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
.blob #sweep{transform-box:view-box; transform-origin:184px 120px}
.blob.sweep #sweep{animation:sweep .8s var(--ease) both}
@keyframes sweep{0%{transform:rotate(0)} 35%{transform:rotate(96deg)} 60%{transform:rotate(58deg)} 100%{transform:rotate(104deg)}}
.blob #mouth{transform-box:fill-box; transform-origin:50% 40%}
.blob.eat #mouth{animation:chomp .6s ease-in-out both}
@keyframes chomp{0%{transform:scale(1)} 30%{transform:scale(1.9,2.4)} 60%{transform:scale(.7,.6)} 100%{transform:scale(1)}}
.blob #arm-left{transform-box:view-box; transform-origin:62px 128px}
.blob.wave #arm-left{animation:wave .25s ease-in-out 2 alternate}
@keyframes wave{to{transform:rotate(-70deg)}}
.blob #stars{opacity:0}
.blob.wave #stars{opacity:1}
.cap{position:absolute; z-index:6; font-size:15px; font-weight:800; color:var(--ink); background:var(--cream); border:3px solid var(--ink); border-radius:12px; padding:3px 9px; pointer-events:none; opacity:0; transform:scale(.4)}
.cap.go{animation:capIn .3s var(--spring) both}
@keyframes capIn{to{opacity:1; transform:scale(1) rotate(-8deg)}}
.cap-hup{right:70px; bottom:186px}
.cap-gag{right:184px; bottom:150px}
.burp{position:absolute; z-index:6; right:96px; bottom:118px; width:44px; height:44px; color:var(--ink); opacity:0; pointer-events:none}
.burp.go{animation:burp .6s var(--spring) both}
@keyframes burp{from{opacity:0; transform:translateY(0) scale(.2)} 40%{opacity:1} to{opacity:0; transform:translate(-30px,-60px) scale(1.1) rotate(30deg)}}

/* ---------- dock ---------- */
.dock{flex:none; display:flex; gap:10px; height:56px}
.pill{
  position:relative; flex:1; height:56px; border-radius:99px; background:var(--pill); color:var(--on-pill);
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:19px; font-weight:700; letter-spacing:-.01em;
  transition:transform .15s var(--spring);
}
.pill:active{transform:scale(.97)}
.pill[aria-disabled="true"]{pointer-events:none}
.pill .chev{font-size:24px; font-weight:800; line-height:1; margin-top:-3px}
.pill svg{width:22px; height:22px; display:block; flex:none}
.pill .ring{position:absolute; inset:-3px; border-radius:99px; border:3px solid var(--pill); opacity:0; pointer-events:none}
.pill.live .ring{animation:ring 1.4s ease-out infinite}
.pill.live .ring.b{animation-delay:.7s}
@keyframes ring{0%{opacity:.55; transform:scale(1)} 100%{opacity:0; transform:scale(1.16)}}
.ico{width:56px; height:56px; border-radius:99px; border:3px solid var(--on-page); display:grid; place-items:center; flex:none; transition:opacity .2s, transform .15s var(--spring)}
.ico:active{transform:scale(.95)}
.ico svg{width:24px; height:24px; display:block}
.ico[aria-disabled="true"]{opacity:.45; pointer-events:none}
.ico .mic{display:none}
.dock.typing .ico .kb{display:none} .dock.typing .ico .mic{display:block}
.typed{display:none; flex:1; min-width:0; gap:8px}
.dock.typing .typed{display:flex}
.dock.typing .pill{display:none}
.typed input{
  flex:1; min-width:0; height:56px; padding:0 18px; border-radius:99px;
  border:3px solid var(--on-page); background:var(--paper); color:var(--ink);
  font:inherit; font-size:17px; font-weight:700;
}
.typed input::placeholder{color:#5a5a5a}
.typed button{height:56px; padding:0 20px; border-radius:99px; background:var(--pill); color:var(--on-pill); font-size:17px; font-weight:800; flex:none}

/* ---------- freeze (screenshot hook) and reduced motion ---------- */
html.freeze *{animation-play-state:paused !important}
@media (prefers-reduced-motion:reduce){
  .breathe,.tw,.pill.live .ring,.blob #body,.blob #eyes,.stk-note{animation:none !important}
  .card,.say,.you,.maya,h1,.lede,.hero,.score .row{animation-duration:.12s !important}
  .blob.in,.blob.out{animation-duration:.2s !important; animation-timing-function:ease !important}
  .you.swept,.you.eaten{animation:fadeOut .25s ease both !important}
  @keyframes fadeOut{to{opacity:0}}
  .blob.sweep #sweep,.blob.eat #mouth,.blob.wave #arm-left{animation:none !important}
  .maya,.fill{transition-duration:.15s !important}
}
@media (max-height:720px){
  h1{font-size:32px} .say,.you{font-size:19px} .maya{bottom:-150px}
}
</style>
</head>
<body>

<div class="phone">
  <header class="top">
    <div class="prog" id="prog" role="img" aria-label="Turn 1 of 3">
      <span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span>
    </div>
    <button class="theme" id="theme" aria-pressed="false">
      <span class="sr">Dark mode</span>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      <svg class="sun-ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g></svg>
    </button>
  </header>

  <main class="card" id="card" data-state="intro">
    <div class="head">
      <h1 id="headline">Talk with Maya</h1>
      <p class="lede" id="lede">Three turns at a cafe. Say it out loud.</p>
      <div class="say" id="say" aria-live="polite" aria-atomic="true"><span id="sayText"></span></div>
    </div>

    <div class="score" id="score" role="group" aria-label="How you sounded">
      <div class="row"><b>Sounds</b><span class="track"><i class="fill" id="f0"></i></span></div>
      <div class="row"><b>Rhythm</b><span class="track"><i class="fill" id="f1"></i></span></div>
      <div class="row"><b>Words</b><span class="track"><i class="fill" id="f2"></i></span></div>
    </div>

    <div class="maya" id="maya">

    '<svg viewBox="0 0 50 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M2.5 16C7 4.2 14.5 20.9 20.5 12s9.5-8.6 14.6 2c3.8 7.8 7.6 3.3 10.4-5.5"/></svg>'
  ];

  var $ = function (id) { return document.getElementById(id); };
  var card = $("card"), headline = $("headline"), lede = $("lede");
  var say = $("say"), sayText = $("sayText"), you = $("you"), youTag = $("youTag"), youText = $("youText");
  var go = $("go"), goLabel = $("goLabel"), goMic = $("goMic"), goEar = $("goEar"), goChev = $("goChev");
  var dock = $("dock"), kb = $("kb"), typed = $("typed"), typedIn = $("typedIn"), typedGo = $("typedGo");
  var prog = $("prog"), pop = $("pop"), blob = $("blob"), capHup = $("capHup"), capGag = $("capGag"), burp = $("burp");
  var faces = {};
  [].forEach.call(document.querySelectorAll(".face"), function (f) { faces[f.dataset.face] = f; });

  var turn = 0, scores = [], timers = [], mouth = null, rec = null, listening = false;
  var lastFace = -1, lastGag = -1, lastSticker = -1;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- helpers ---------- */
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; stopMouth(); }
  function stopMouth() { if (mouth) { clearInterval(mouth); mouth = null; } }
  function setFace(name) { for (var k in faces) faces[k].classList.toggle("on", k === name); }
  function setState(s) { card.dataset.state = s; }
  function pick(list, last) {
    var i; do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === last);
    return i;
  }
  function replayAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function syllables(word) {
    var w = word.toLowerCase().replace(/[^a-z]/g, "");
    if (!w) return 1;
    var m = w.replace(/e$/, "").match(/[aeiouy]{1,2}/g);
    return Math.max(1, m ? m.length : 1);
  }
  function speakAloud(text, rate) {
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = rate || 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* no voice: the highlighted words still carry the line */ }
  }

  /* ---------- Maya speaks: words light up on the beat, mouth swaps at about 8 Hz ---------- */
  function mayaSays(text, rate, done) {
    clearTimers();
    rate = rate || 1;
    sayText.innerHTML = "";
    text.split(" ").forEach(function (w, i, arr) {
      var s = document.createElement("span");
      s.className = "w"; s.textContent = w;
      sayText.appendChild(s);
      if (i < arr.length - 1) sayText.appendChild(document.createTextNode(" "));
    });
    replayAnim(say, "say");
    var words = [].slice.call(sayText.querySelectorAll(".w"));
    speakAloud(text, rate);
    if (!reduced) {
      var open = false;
      mouth = setInterval(function () { open = !open; setFace(open ? "talk" : "idle"); }, 125);
    } else { setFace("talk"); }
    var at = 120;
    words.forEach(function (w, i) {
      var hold = (210 + syllables(w.textContent) * 150) / rate;
      later(function () {
        if (i) { words[i - 1].classList.remove("now"); words[i - 1].classList.add("said"); }
        w.classList.add("now");
      }, at);
      at += hold + 60 / rate;
    });
    later(function () {
      words.forEach(function (w) { w.classList.remove("now"); w.classList.add("said"); });
      stopMouth(); setFace("idle");
      later(done, 260);
    }, at + 80);
  }

  /* ---------- scoring: three honest signals, never a percentage ---------- */
  function norm(s) { return s.toLowerCase().replace(/[^a-z' ]/g, "").replace(/\s+/g, " ").trim(); }
  function lev(a, b) {
    var prev = [], i, j, cur;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur = [i];
      for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  function lcs(a, b) {
    var t = [], i, j;
    for (i = 0; i <= a.length; i++) { t[i] = []; for (j = 0; j <= b.length; j++) t[i][j] = 0; }
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) t[i][j] = a[i - 1] === b[j - 1] ? t[i - 1][j - 1] + 1 : Math.max(t[i - 1][j], t[i][j - 1]);
    return t[a.length][b.length];
  }
  function score(said, target) {
    var a = norm(said), b = norm(target);
    var aw = a.split(" ").filter(Boolean), bw = b.split(" ").filter(Boolean);
    var hit = bw.filter(function (w) { return aw.indexOf(w) > -1; }).length;
    var as = a.replace(/ /g, ""), bs = b.replace(/ /g, "");
    var sounds = Math.max(0, 1 - lev(as, bs) / Math.max(1, bs.length));
    var order = bw.length ? lcs(aw, bw) / bw.length : 0;
    var len = 1 - Math.min(1, Math.abs(aw.length - bw.length) / Math.max(2, bw.length));
    return { sounds: sounds, rhythm: order * 0.55 + len * 0.45, words: bw.length ? hit / bw.length : 0 };
  }

  /* ---------- UI bits ---------- */
  function setProg() {
    [].forEach.call(prog.children, function (s, i) {
      s.classList.toggle("on", i < turn);
      s.classList.toggle("half", i === turn && turn < TURNS.length);
    });
    prog.setAttribute("aria-label", turn >= TURNS.length ? "All three turns done" : "Turn " + (turn + 1) + " of " + TURNS.length);
  }
  function button(label, o) {
    o = o || {};
    goLabel.textContent = label;
    go.setAttribute("aria-disabled", o.off ? "true" : "false");
    goMic.classList.toggle("hide", !o.mic);
    goEar.classList.toggle("hide", !o.ear);
    goChev.classList.toggle("hide", !o.chev);
    go.classList.toggle("live", !!o.live);
    go.onclick = o.on || null;
  }
  function setTyping(on) {
    kb.setAttribute("aria-pressed", String(on));
    var was = dock.classList.contains("typing");
    dock.classList.toggle("typing", on);
    if (on) { typedIn.value = ""; typedIn.focus(); } else if (was) { go.focus(); }
  }
  function kbEnabled(on) { kb.setAttribute("aria-disabled", on ? "false" : "true"); }
  function showYou(text, tag, cls) {
    youTag.textContent = tag;
    youText.textContent = text;
    you.className = "you show " + (cls || "");
    ["b0", "b1", "b2"].forEach(function (id) { $(id).style.transform = "scaleX(0)"; });
    replayAnim(you, "show");
  }
  function hideYou() { you.className = "you"; }
  function stickerPop() {
    lastSticker = pick(STICKERS, lastSticker);
    pop.innerHTML = STICKERS[lastSticker];
    replayAnim(pop, "go");
  }

  /* ---------- flow ---------- */
  function askTurn() {
    clearTimers();
    setProg();
    hideYou();
    setState("speak");
    lede.classList.add("hide");
    headline.textContent = "Maya asks";
    button("Listen", { off: true, ear: true });
    kbEnabled(false);
    setTyping(false);
    mayaSays(TURNS[turn].maya, 1, yourTurn);
  }

  function yourTurn() {
    clearTimers();
    setState("listen");
    setFace("listen");
    headline.textContent = "Your turn";
    showYou(TURNS[turn].you, "Say this", "ghost");
    kbEnabled(true);
    button("Say it", { mic: true, on: startListening });
  }

  function startListening() {
    if (listening) { stopListening(); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    listening = true;
    button("Listening", { mic: true, live: true, on: startListening });
    if (!SR) { listening = false; openTyping(); return; }
    try {
      rec = new SR();
      rec.lang = "en-GB"; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = function (e) { listening = false; judge(e.results[0][0].transcript); };
      rec.onerror = function () { if (listening) { listening = false; openTyping(); } };
      rec.onend = function () { if (listening) { listening = false; openTyping(); } };
      rec.start();
      later(function () { if (listening) stopListening(); }, 7000);
    } catch (e) { listening = false; openTyping(); }
  }
  function stopListening() {
    listening = false;
    try { if (rec) rec.stop(); } catch (e) { /* already stopped */ }
    openTyping();
  }
  function openTyping() {
    if (card.dataset.state !== "listen") return;
    button("Say it", { mic: true, on: startListening });
    setTyping(true);
  }

  function judge(said) {
    if (card.dataset.state !== "listen") return;
    clearTimers();
    try { if (rec) rec.abort(); } catch (e) { /* nothing to abort */ }
    listening = false;
    setTyping(false);
    kbEnabled(false);
    var s = score(said, TURNS[turn].you);
    var avg = (s.sounds + s.rhythm + s.words) / 3;
    if (avg < 0.6) { miss(said); return; }

    scores.push(s);
    setState("good");
    lastFace = pick(FACES, lastFace);
    setFace(FACES[lastFace]);
    headline.textContent = TURNS[turn].praise;
    showYou(said.trim(), "You said", "scored");
    later(function () {
      $("b0").style.transform = "scaleX(" + Math.max(.18, s.sounds).toFixed(2) + ")";
      $("b1").style.transform = "scaleX(" + Math.max(.18, s.rhythm).toFixed(2) + ")";
      $("b2").style.transform = "scaleX(" + Math.max(.18, s.words).toFixed(2) + ")";
    }, 120);
    if (!reduced) stickerPop();
    speakAloud(TURNS[turn].praise, 1);
    button(turn === TURNS.length - 1 ? "Finish" : "Next", { chev: true, on: function () {
      turn += 1;
      if (turn >= TURNS.length) finish(); else askTurn();
    } });
  }

  /* A miss: Blobert springs in, does one gag, waves, leaves. Then the calm correction. */
  function miss(said) {
    setState("miss");
    setFace("oops");
    headline.textContent = "Hmm";
    showYou(said.trim(), "You said", "miss");
    button("Listen", { off: true, ear: true });
    lastGag = pick(GAGS, lastGag);
    var gag = GAGS[lastGag];
    blob.className = "blob show in";
    capHup.className = "cap cap-hup go";
    later(function () {
      capHup.className = "cap cap-hup";
      blob.classList.add(gag);
      capGag.textContent = gag === "sweep" ? "swish" : "nom";
      capGag.className = "cap cap-gag go";
      you.classList.add(gag === "sweep" ? "swept" : "eaten");
      if (gag === "eat") later(function () { capGag.textContent = "burp!"; replayAnim(burp, "go"); }, 500);
    }, 420);
    later(function () {
      capGag.className = "cap cap-gag";
      blob.classList.remove(gag);
      blob.classList.add("wave");
      hideYou();
    }, 1320);
    later(function () { blob.classList.remove("wave", "in"); blob.classList.add("out"); }, 1880);
    later(function () {
      blob.className = "blob";
      setState("fix");
      headline.textContent = "Like this";
      mayaSays(TURNS[turn].you, 0.75, yourTurn);
    }, 2220);
  }

  function finish() {
    clearTimers();
    setProg();
    hideYou();
    blob.className = "blob"; capHup.className = "cap cap-hup"; capGag.className = "cap cap-gag"; burp.className = "burp";
    setState("done");
    headline.textContent = "You did it";
    lede.textContent = "You can now order a coffee in English.";
    lede.classList.remove("hide");
    kbEnabled(false);
    setTyping(false);
    var avg = function (k) {
      if (!scores.length) return 0.72;
      return scores.reduce(function (t, s) { return t + s[k]; }, 0) / scores.length;
    };
    ["sounds", "rhythm", "words"].forEach(function (k, i) {
      $("f" + i).style.transform = "scaleX(0)";
      later(function () { $("f" + i).style.transform = "scaleX(" + Math.max(.25, Math.min(1, avg(k))).toFixed(2) + ")"; }, 200 + i * 60);
    });
    if (!reduced) later(stickerPop, 150);
    button("Again", { chev: true, on: restart });
  }

  function restart() {
    clearTimers();
    turn = 0; scores = [];
    ["f0", "f1", "f2"].forEach(function (id) { $(id).style.transform = "scaleX(0)"; });
    askTurn();
  }

  /* ---------- wiring ---------- */
  button("Start", { chev: true, on: restart });
  kb.onclick = function () {
    if (kb.getAttribute("aria-disabled") === "true") return;
    if (dock.classList.contains("typing")) { setTyping(false); return; }
    if (listening) { listening = false; try { if (rec) rec.abort(); } catch (e) { /* none */ } button("Say it", { mic: true, on: startListening }); }
    setTyping(true);
  };
  typedGo.onclick = function () { if (typedIn.value.trim()) judge(typedIn.value); };
  typedIn.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); if (typedIn.value.trim()) judge(typedIn.value); }
    if (e.key === "Escape") setTyping(false);
  });
  $("theme").onclick = function () {
    var dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    this.setAttribute("aria-pressed", String(!dark));
    document.querySelector('meta[name="theme-color"]').content = dark ? "#FFF7E8" : "#121212";
  };

  /* Board and test hooks: drive the prototype without a microphone. */
  window.LP = {
    start: restart,
    listen: function () { clearTimers(); turn = Math.min(turn, TURNS.length - 1); setProg(); lede.classList.add("hide"); mayaSays(TURNS[turn].maya, 1, function () {}); clearTimers(); [].forEach.call(sayText.querySelectorAll(".w"), function (w) { w.classList.add("said"); }); yourTurn(); },
    answer: function (text) { judge(text || TURNS[turn].you); },
    miss: function (text, gag) { if (gag) { lastGag = GAGS.indexOf(gag) === 0 ? 1 : 0; } judge(text || "a tea"); },
    finish: function () { if (!scores.length) scores = [{ sounds: .82, rhythm: .66, words: 1 }]; turn = TURNS.length; finish(); },
    freeze: function () { document.documentElement.classList.add("freeze"); },
    state: function () { return card.dataset.state; }
  };
})();
</script>
</body>
</html>
