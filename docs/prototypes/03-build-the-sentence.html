<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build the sentence - Learning Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Build the sentence - prototype 03 (round two)
   One sun block, Leo the barista hands over the bill, you build the
   sentence on the slip. Blobert clears any word that does not belong.
   Cast art: Open Peeps and Open Doodles (CC0), pre-rendered in the
   palette by scripts/lp/cast.mjs. Never redrawn here.
   ------------------------------------------------------------------ */
:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink); --line:var(--ink);
  --btn-bg:var(--ink); --btn-fg:var(--cream);
  --spring:cubic-bezier(.2,1.4,.4,1);
  --ease:cubic-bezier(.2,.8,.3,1);
}
html[data-theme="dark"]{
  --page:#121212; --on-page:#FFF7E8; --line:#FFF7E8;
  --btn-bg:#FFF7E8; --btn-fg:#121212;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--page);color:var(--on-page);
  font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:600;
  transition:background-color .3s var(--ease),color .3s var(--ease);
}
.app{
  position:relative;display:flex;flex-direction:column;
  width:100%;max-width:430px;margin:0 auto;height:100%;
  padding:12px 20px 18px;gap:12px;overflow:hidden;
}

/* ---------- top: thin progress bar, dark toggle ---------- */
.top{flex:none;display:flex;align-items:center;gap:14px;height:40px}
.bar{flex:1;height:10px;border-radius:999px;border:3px solid var(--line);overflow:hidden;background:transparent}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--line);transition:width .38s var(--spring)}
.theme{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);cursor:pointer;
  transition:transform .2s var(--spring);
}
.theme:active{transform:scale(.92)}
.theme svg{width:18px;height:18px;display:block}
.theme .moon{display:block}.theme .sun{display:none}
html[data-theme="dark"] .theme .moon{display:none}
html[data-theme="dark"] .theme .sun{display:block}

/* ---------- the card: one block colour ---------- */
.card{
  position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  border:3px solid var(--ink);border-radius:28px;background:var(--sun);color:var(--ink);
  animation:cardIn .5s var(--spring) both;
}
.card.end{background:var(--mint)}
.card.end h1{font-size:34px}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.head{position:relative;z-index:3;padding:20px 22px 0}
h1{margin:0;font-weight:800;font-size:36px;line-height:1.04;letter-spacing:-.02em;animation:rise .36s var(--spring) both}
.lede{margin:6px 0 0;font-size:16px;line-height:1.35;max-width:17em;animation:rise .36s var(--spring) .06s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:rise .36s var(--spring) both}

/* the bill: a cream slip Leo is handing over. The sentence is built on it. */
.slip{
  position:relative;z-index:3;margin:14px 22px 0;padding:10px 14px 6px;
  background:var(--cream);border:3px solid var(--ink);border-radius:14px;
  box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg);
  animation:rise .36s var(--spring) .12s both;
  transition:transform .3s var(--spring);
}
.slip .receipt{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:4px}
.slots{display:flex;flex-wrap:wrap;gap:2px 10px;align-content:flex-start;min-height:84px}
.slot{
  position:relative;min-width:36px;height:40px;display:grid;place-items:center;padding:0 2px;
  font-family:inherit;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1;
  border:0;background:transparent;color:var(--ink);
}
.slot:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:4px;border-radius:999px;background:var(--ink);opacity:.28;transition:opacity .2s var(--ease),transform .3s var(--spring)}
.slot.filled{cursor:pointer}
.slot.filled:after{opacity:1}
.slot.next:after{animation:waiting 1.4s ease-in-out infinite}
@keyframes waiting{0%,100%{opacity:.28}50%{opacity:.9}}
.slot .word{display:inline-block;animation:land .34s var(--spring) both}
@keyframes land{from{transform:translateY(-8px) scale(1.14)}to{transform:none}}
.slot.wrong .word{opacity:.9}
.slot.ghost{opacity:.35}

/* score: three ink bars on the slip, never a percentage */
.score{display:grid;gap:9px;padding:4px 0 6px}
.score .row{display:grid;grid-template-columns:66px 1fr;align-items:center;gap:12px;font-size:15px;font-weight:800;animation:rise .36s var(--spring) both}
.score .row:nth-child(2){animation-delay:.06s}.score .row:nth-child(3){animation-delay:.12s}
.score .track{height:16px;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.score .track i{display:block;height:100%;width:0;background:var(--ink);border-radius:999px;transition:width .5s var(--spring)}
.said{margin:0 0 8px;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:rise .36s var(--spring) both}
.said q{quotes:"\201C" "\201D"}

/* ---------- Leo, oversized and cropped at the card edge ----------
   Anchored under the slip so his face always sits in the same place; his hair
   peeks out from behind the bill he is handing over. */
.scene{
  position:absolute;z-index:1;left:-104px;top:118px;width:540px;height:540px;
  pointer-events:none;transform-origin:50% 0;
  transition:transform .42s var(--spring);animation:popIn .55s var(--spring) .1s both;
}
.card.tall .scene{transform:translateY(26px) scale(1.2)}
@keyframes popIn{from{opacity:0;transform:translateY(34px) scale(.9)}to{opacity:1;transform:none}}
.mood{width:100%;height:100%;transform-origin:50% 60%;transition:transform .42s var(--spring)}
.card[data-mood="happy"] .mood{transform:translateY(-10px) scale(1.04)}
.card[data-mood="listen"] .mood{transform:translateY(8px) scale(1.05) rotate(-2.5deg)}
.card[data-mood="oops"] .mood{transform:translateY(4px) scale(1.03) rotate(2deg)}
.breathe{width:100%;height:100%;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{0%,100%{transform:rotate(-.8deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-5px)}}
.pose{position:absolute;inset:0;opacity:0}
.pose.on{opacity:1}
.art{width:100%;height:100%;display:block}

/* the end card doodle */
.doodle{
  position:absolute;z-index:1;left:-165px;bottom:4px;width:730px;height:548px;
  pointer-events:none;transform-origin:50% 80%;animation:popIn .55s var(--spring) .1s both;
}
.doodle .art{animation:breathe 3.4s ease-in-out infinite}

/* ---------- stickers ---------- */
.stick{position:absolute;z-index:2;color:var(--ink);pointer-events:none}
.stick svg{display:block}
.tw{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}42%{transform:scale(1.2) rotate(11deg)}68%{transform:scale(.93) rotate(-5deg)}}
.s-star{top:20px;right:24px}
.s-squiggle{top:232px;left:18px;animation-delay:.9s}
.s-heart{bottom:34px;left:24px;animation-delay:1.8s}
.card.tall .s-squiggle{top:268px}
.card.end .s-star{top:150px;right:26px}
.card.end .s-squiggle{top:auto;bottom:44px;left:24px}
.card.end .s-heart{left:auto;right:30px;bottom:40px}
.burst{position:absolute;z-index:4;color:var(--ink);pointer-events:none;width:64px;height:64px;transform:scale(0)}
.burst svg{display:block;width:100%;height:100%}
.burst.go{animation:burst .42s var(--spring) both}
@keyframes burst{from{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.18) rotate(8deg)}to{transform:scale(1) rotate(0)}}
.burst.bye{transition:opacity .3s,transform .3s;opacity:0;transform:scale(.6)}

/* ---------- Blobert ---------- */
.blobert{
  position:absolute;z-index:6;width:190px;height:174px;left:-230px;top:112px;
  pointer-events:none;will-change:transform;
}
.blobert svg{width:100%;height:100%;display:block;overflow:visible}
.blobert #bl-body{transform-origin:120px 150px;animation:wobble 1.1s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.04) scaleY(.96)}}
.blobert #bl-eyes{transform-origin:120px 102px;animation:blink 3.6s steps(1) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%,98%{transform:scaleY(.1)}}
.blobert #bl-arm-right,.blobert #bl-broom{transform-origin:184px 120px;transition:transform .16s var(--spring)}
.blobert.sweep #bl-arm-right,.blobert.sweep #bl-broom{animation:sweep .7s var(--spring) 1 both}
@keyframes sweep{0%{transform:rotate(-55deg)}45%{transform:rotate(48deg)}100%{transform:rotate(0)}}
.blobert #bl-arm-left{transform-origin:62px 128px}
.blobert.wave #bl-arm-left{animation:wave .32s ease-in-out 2}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-70deg)}}
.blobert #bl-mouth{transform-origin:124px 128px;transition:transform .16s var(--spring)}
.blobert.chomp #bl-mouth{animation:chomp .7s var(--ease) both}
@keyframes chomp{0%{transform:scale(1)}30%{transform:scale(1.9,2.6)}55%{transform:scale(.6,.4)}80%{transform:scale(1.3,1.2)}100%{transform:scale(1)}}
.blobert.puff #bl-body{animation:puff .35s var(--spring) both}
@keyframes puff{0%{transform:scale(1)}50%{transform:scale(1.12,1.08)}100%{transform:scale(1)}}
.blobert #bl-bin,.blobert #bl-broom{display:none}
.blobert.gag-bin #bl-bin{display:block}
.blobert.gag-sweep #bl-broom{display:block}
.blobert.gag-sweep svg{transform:scaleX(-1)}
.blobert #bl-lid{transform-origin:16px 82px;transition:transform .18s var(--spring)}
.blobert.lid #bl-lid{animation:lid .5s var(--ease) both}
@keyframes lid{0%{transform:rotate(0)}30%{transform:rotate(-70deg)}65%{transform:rotate(-70deg)}100%{transform:rotate(0)}}
.blobert #bl-stars{opacity:0;transition:opacity .2s}
.blobert.puff #bl-stars{opacity:1}
.cap{ /* captioned sound, a sticker not a sentence */
  position:absolute;z-index:7;left:0;top:0;padding:4px 10px;border:3px solid var(--ink);border-radius:999px;
  background:var(--cream);color:var(--ink);font-size:13px;font-weight:800;letter-spacing:.04em;
  pointer-events:none;transform:scale(0);animation:burst .4s var(--spring) both;
}

/* ---------- word bank ---------- */
.bank{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:148px;align-content:flex-start}
.bank.out{opacity:0;transition:opacity .2s var(--ease)}
.tile{
  font-family:inherit;font-size:17px;font-weight:700;padding:0 16px;height:44px;min-width:44px;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);cursor:pointer;
  animation:tileIn .36s var(--spring) both;
  transition:transform .18s var(--spring),background-color .18s var(--ease),color .18s var(--ease),opacity .18s var(--ease);
}
@keyframes tileIn{from{opacity:0;transform:translateY(12px) scale(.86)}to{opacity:1;transform:none}}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:scale(.94)}
.tile.spent{visibility:hidden;pointer-events:none}
.tile.hint{background:var(--line);color:var(--page);animation:hint .5s var(--spring) 3}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.fly{
  position:fixed;margin:0;z-index:9;pointer-events:none;display:grid;place-items:center;
  font-family:inherit;font-weight:700;font-size:18px;border:3px solid var(--line);border-radius:999px;
  background:var(--page);color:var(--on-page);
  transition:border-color .22s var(--ease),color .22s var(--ease),background-color .22s var(--ease),font-size .22s var(--ease);
}
.fly.bare{border-color:transparent;background:transparent;color:var(--ink);font-weight:800;font-size:22px}

/* ---------- typed fallback ---------- */
.typed{flex:none;display:flex;flex-direction:column;gap:8px;min-height:120px;justify-content:center}
.typed input{
  font-family:inherit;font-size:18px;font-weight:700;height:52px;padding:0 18px;width:100%;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);
}
.typed input::placeholder{color:var(--on-page);opacity:.5}
.typed input:focus-visible{border-color:transparent;outline:3px solid var(--line);outline-offset:0}
.note{margin:0;font-size:14px;text-align:center;opacity:.72}

/* ---------- the one button ---------- */
.cta{flex:none;display:flex;gap:10px;align-items:center;animation:rise .36s var(--spring) both}
.btn{
  font-family:inherit;font-size:18px;font-weight:700;flex:1;height:56px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border:0;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;
  transition:transform .22s var(--spring),opacity .3s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.26;pointer-events:none}
.btn.ready{animation:ready .4s var(--spring) both}
@keyframes ready{from{transform:scale(.94)}60%{transform:scale(1.04)}to{transform:scale(1)}}
.btn .chev{font-size:22px;line-height:1}
.btn .dots{display:inline-flex;gap:5px}
.btn .dots i{width:8px;height:8px;border-radius:999px;background:var(--btn-fg);animation:listen 1s ease-in-out infinite}
.btn .dots i:nth-child(2){animation-delay:.15s}.btn .dots i:nth-child(3){animation-delay:.3s}
@keyframes listen{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-5px);opacity:1}}
.key{ /* the typed fallback, always visible beside the mic */
  width:56px;height:56px;flex:none;display:grid;place-items:center;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);cursor:pointer;
  transition:transform .2s var(--spring);
}
.key:active{transform:scale(.92)}
.key svg{width:26px;height:26px;display:block}

/* ---------- focus, reduced motion ---------- */
:focus{outline:none}
:focus-visible{outline:3px solid var(--line);outline-offset:3px;border-radius:999px}
.card :focus-visible{outline-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .tw,.breathe,.doodle .art,.slot.next:after,.btn .dots i,.blobert #bl-body,.blobert #bl-eyes{animation:none!important}
  .card,.scene,.doodle,h1,.lede,.slip,.tile,.pop,.score .row,.said{animation-duration:.01ms!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="bar" role="progressbar" aria-label="Progress in this exercise" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" id="barBox"><i id="bar"></i></div>
    <button class="theme" id="theme" aria-label="Dark mode" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></g></svg>
    </button>
  </div>

  <div class="card" id="card" data-mood="idle">
    <div class="head">
      <h1 id="title">Ask for the bill</h1>
      <p class="lede" id="lede">Tap the words in order.</p>
    </div>

    <!-- the bill: the sentence is built on the slip -->
    <div class="slip" id="slip">
      <div class="receipt" aria-hidden="true"><span id="rcA">Café Leo</span><span>Table 4</span></div>
      <div class="slots" id="slots" role="group" aria-label="Your sentence"></div>
      <!-- speaking score: three ink bars, shown in place of the words -->
      <p class="said" id="said" hidden></p>
      <div class="score" id="score" hidden>
        <div class="row"><span>Sounds</span><span class="track"><i id="b1"></i></span></div>
        <div class="row"><span>Rhythm</span><span class="track"><i id="b2"></i></span></div>
        <div class="row"><span>Words</span><span class="track"><i id="b3"></i></span></div>
      </div>
    </div>

    <!-- stickers, placed with intent: a star over Leo's shoulder, a squiggle by the slip, a heart low left -->
    <span class="stick s-star tw" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M12.4.9 14.4 9.5 22.9 12.1 15.1 14.3 12.4 23.5 9.7 15 1.1 12 9.2 9.7Z" fill="currentColor"/></svg></span>
    <span class="stick s-squiggle tw" aria-hidden="true"><svg width="50" height="34" viewBox="0 0 50 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M2.5 14c6-12 10-12 16 0s10 12 16 0 10-12 13-4"/></svg></span>
    <span class="stick s-heart tw" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M11.7 21.6C1.5 13.4 3.1 3.9 12 7.9c8.2-4.8 10.7 5.6.4 14.1Z" fill="currentColor"/></svg></span>
    <!-- Leo, the barista, seven faces cut between (a crossfade would ghost two of him) -->
    <div class="scene" id="scene" aria-hidden="true">

<script>
(function(){
  "use strict";
  var SPRING = "cubic-bezier(.2,1.4,.4,1)";
  var TARGET = ["Could","I","have","the","bill,","please?"];
  var SENTENCE = "Could I have the bill, please?";
  var POOL = ["have","Could","money","the","please?","I","want","bill,"];
  var STEPS = 8;              /* six words, say it, done */
  var $ = function(id){ return document.getElementById(id); };
  var card = $("card"), slots = $("slots"), slip = $("slip"), bank = $("bank"), cta = $("cta"), ctaLabel = $("ctaLabel");
  var key = $("key"), typed = $("typed"), say = $("say"), live = $("live"), bar = $("bar");
  var title = $("title"), lede = $("lede"), score = $("score"), said = $("said"), blobert = $("blobert"), scene = $("scene"), doodle = $("doodle");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var placed = [];            /* words in the slots, in order */
  var phase = "build";        /* build | ready | speak | scored | done */
  var busy = false;           /* Blobert on stage or a tile in flight */
  var lastGag = null, lastSticker = null, rec = null;

  /* ---------- theme ---------- */
  var theme = $("theme");
  theme.onclick = function(){
    var dark = document.documentElement.getAttribute("data-theme") !== "dark";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    theme.setAttribute("aria-pressed", String(dark));
    theme.setAttribute("aria-label", dark ? "Light mode" : "Dark mode");
  };

  /* ---------- small helpers ---------- */
  function announce(m){ live.textContent = m; }
  function mood(m){ card.setAttribute("data-mood", m); }
  function pose(p){
    var all = scene.querySelectorAll(".pose");
    for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i].getAttribute("data-pose") === p);
  }
  function progress(n){
    bar.style.width = (n / STEPS * 100) + "%";
    $("barBox").setAttribute("aria-valuenow", String(n));
  }
  function setHead(h, l){
    title.textContent = h; lede.textContent = l;
    [title, lede].forEach(function(n){ n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop"); });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, reduced ? Math.min(ms, 40) : ms); }); }
  function move(node, frames, ms, easing){
    if (reduced){ var last = frames[frames.length - 1]; for (var k in last) node.style[k] = last[k]; return Promise.resolve(); }
    return node.animate(frames, { duration: ms, easing: easing || SPRING, fill: "both" }).finished;
  }

  /* ---------- voice ---------- */
  var talking = null;
  function speak(text, rate, after){
    var done = function(){ clearInterval(talking); talking = null; pose("idle"); if (after) after(); };
    if (!("speechSynthesis" in window)){ setTimeout(done, 900); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = rate || 1;
      var on = false, guard = setTimeout(done, 4000);
      talking = setInterval(function(){ on = !on; pose(on ? "talk" : "idle"); }, 150);
      u.onend = function(){ clearTimeout(guard); done(); };
      u.onerror = function(){ clearTimeout(guard); done(); };
      window.speechSynthesis.speak(u);
    } catch (e){ done(); }
  }

  /* ---------- stickers: six shapes, never the same twice ---------- */
  var SHAPES = {
    star:"<svg viewBox='0 0 24 24'><path d='M12.4.9 14.4 9.5 22.9 12.1 15.1 14.3 12.4 23.5 9.7 15 1.1 12 9.2 9.7Z' fill='currentColor'/></svg>",

  function pickSticker(){
    var keys = Object.keys(SHAPES).filter(function(k){ return k !== lastSticker; });

    return lastSticker;
  }
  function popSticker(x, y, size, shape){

    s.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + size + "px;height:" + size + "px";
    s.innerHTML = SHAPES[shape || pickSticker()];
    card.appendChild(s);

    return s;
  }

  function renderSlots(){

    TARGET.forEach(function(w, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "slot";
      if (i < placed.length){
        b.classList.add("filled");
        b.setAttribute("aria-label", "Remove " + placed[i]);
        b.innerHTML = "<span class='word'>" + placed[i] + "</span>";
        b.onclick = function(){ takeOut(i); };
      } else {
        b.disabled = true; b.tabIndex = -1;
        b.setAttribute("aria-label", "Empty slot " + (i + 1));
        b.style.minWidth = (18 + w.length * 10) + "px";
        if (i === placed.length) b.classList.add("next");
      }
      slots.appendChild(b);
    });
  }
  function renderBank(){
    bank.innerHTML = "";
    POOL.forEach(function(w, i){
      var t = document.createElement("button");
      t.type = "button"; t.className = "tile"; t.textContent = w; t.dataset.word = w;
      t.style.animationDelay = (i * 60) + "ms";
      t.onclick = function(){ tap(t); };
      bank.appendChild(t);
    });
  }
  function tileFor(word){
    var ts = bank.querySelectorAll(".tile");
    for (var i = 0; i < ts.length; i++) if (ts[i].dataset.word === word && !ts[i].classList.contains("spent")) return ts[i];
    return null;
  }
  /* a tile flies from the bank to the next slot, becoming bare ink text as it lands */
  function fly(tile, to, bare){
    var a = tile.getBoundingClientRect(), b = to.getBoundingClientRect();
    var f = document.createElement("div");
    f.className = "fly"; f.textContent = tile.textContent;
    f.style.cssText = "left:" + a.left + "px;top:" + a.top + "px;width:" + a.width + "px;height:" + a.height + "px";
    document.body.appendChild(f);
    if (bare) requestAnimationFrame(function(){ f.classList.add("bare"); });
    return move(f, [
      { transform: "translate(0,0) scale(1)" },
      { transform: "translate(" + (b.left + b.width/2 - a.left - a.width/2) + "px," + (b.top + b.height/2 - a.top - a.height/2) + "px) scale(1)" }
    ], 340).then(function(){ f.remove(); });
  }
  function tap(tile){
    if (busy || phase !== "build") return;
    var w = tile.dataset.word, i = placed.length;
    if (w === TARGET[i]) placeRight(tile); else placeWrong(tile);
  }
  function placeRight(tile){
    busy = true;
    var target = slots.children[placed.length];
    tile.classList.add("spent");
    fly(tile, target, true).then(function(){
      placed.push(tile.dataset.word);
      renderSlots();
      progress(placed.length);
      announce(placed.join(" "));
      busy = false;
      if (placed.length === TARGET.length) complete();
    });
  }
  function takeOut(i){
    if (busy || phase !== "build") return;
    var w = placed[i];
    placed.splice(i, 1);
    renderSlots();
    progress(placed.length);
    var t = tileFor(w) || bank.querySelector(".tile.spent[data-word='" + w + "']");
    if (t){ t.classList.remove("spent"); t.style.animation = "none"; void t.offsetWidth; t.style.animation = ""; }
    announce(w + " removed");
  }

  /* ---------- a wrong tile: Blobert clears it ---------- */
  var GAGS = ["sweep", "eat", "bin"];
  function pickGag(){
    var g = GAGS.filter(function(k){ return k !== lastGag; });
    lastGag = g[Math.floor(Math.random() * g.length)];
    return lastGag;
  }
  function caption(text, x, y){
    var c = document.createElement("span");
    c.className = "cap"; c.textContent = text;
    c.style.left = x + "px"; c.style.top = y + "px";
    card.appendChild(c);
    setTimeout(function(){ c.remove(); }, 900);
  }
  function placeWrong(tile, forceGag){
    busy = true; phase = "build";
    var target = slots.children[placed.length];
    tile.classList.add("spent");
    fly(tile, target, true).then(function(){
      /* the word lands on the slip, then Blobert sees it */
      target.classList.add("wrong");
      target.innerHTML = "<span class='word'>" + tile.dataset.word + "</span>";
      target.disabled = false;
      mood("oops"); pose("oops");
      var gag = forceGag || pickGag();
      lastGag = gag;
      return blobertGag(gag, target).then(function(){ return tile; });
    }).then(function(){
      /* the word goes back to the bank; then the calm correction */
      target.classList.remove("wrong"); target.innerHTML = ""; target.disabled = true;
      renderSlots();
      tile.classList.remove("spent"); tile.style.animation = "none"; void tile.offsetWidth; tile.style.animation = "";
      mood("idle");
      var right = tileFor(TARGET[placed.length]), next = slots.children[placed.length];
      if (right){ right.classList.add("hint"); setTimeout(function(){ right.classList.remove("hint"); }, 1600); }
      if (next){ next.classList.add("ghost"); next.innerHTML = "<span class='word'>" + TARGET[placed.length] + "</span>"; setTimeout(function(){ if (phase === "build" && next.parentNode) renderSlots(); }, 1600); }
      announce("Not that one. Next word: " + TARGET[placed.length]);
      speak(SENTENCE, 0.75, function(){ busy = false; });
      if (!("speechSynthesis" in window)) busy = false;
    });
  }
  function blobertGag(gag, slot){
    var word = slot.querySelector(".word");
    var cr = card.getBoundingClientRect(), sr = slot.getBoundingClientRect();
    var cardW = cr.width, wx = sr.left - cr.left + sr.width / 2, wy = sr.top - cr.top + sr.height / 2;
    /* he arrives at the word's height; the sweep comes from the left, the others from the right */
    var start = cardW + 30;
    var to = Math.min(cardW - 120, gag === "sweep" ? wx + sr.width / 2 - 4 : gag === "eat" ? wx + sr.width / 2 - 70 : wx - 4);
    blobert.style.top = Math.max(40, wy - 100) + "px";
    blobert.style.left = start + "px";
    blobert.className = "blobert gag-" + gag;
    var dx = to - start;
    if (reduced){
      blobert.style.transform = "translateX(" + dx + "px)";
      word.style.transition = "opacity .2s"; word.style.opacity = "0";
      return wait(300).then(function(){ blobert.style.transform = ""; blobert.className = "blobert"; });
    }
    var fly = function(frames, ms, easing){ return move(word, frames, ms, easing || "cubic-bezier(.3,.6,.4,1)"); };
    return move(blobert, [{ transform: "translateX(0)" }, { transform: "translateX(" + dx + "px)" }], 300)
      .then(function(){ return wait(60); })
      .then(function(){
        var br = blobert.getBoundingClientRect();
        if (gag === "sweep"){
          blobert.classList.add("sweep");
          caption("swish", br.left - cr.left + 60, br.top - cr.top - 30);
          return wait(200).then(function(){
            return fly([
              { transform: "translate(0,0) rotate(0)", opacity: 1 },
              { transform: "translate(-210px,90px) rotate(-40deg)", opacity: 0 }
            ], 420);
          }).then(function(){ return wait(160); });
        }
        if (gag === "eat"){
          var m = blobert.querySelector("#bl-mouth").getBoundingClientRect();
          blobert.classList.add("chomp");
          var ex = m.left + m.width / 2 - sr.left - sr.width / 2, ey = m.top + m.height / 2 - sr.top - sr.height / 2;
          return wait(120).then(function(){
            return fly([
              { transform: "translate(0,0) scale(1)", opacity: 1 },
              { transform: "translate(" + ex + "px," + ey + "px) scale(.15)", opacity: 0 }
            ], 320, "cubic-bezier(.4,0,.6,1)");
          }).then(function(){
            blobert.classList.add("puff");
            caption("burp!", br.left - cr.left + 10, br.top - cr.top - 34);
            popSticker(br.left - cr.left + br.width * .55, br.top - cr.top - 40, 40, "star");
            return wait(380);
          });
        }
        /* bin: the word drops in, the lid claps */
        var bn = blobert.querySelector("#bl-bin").getBoundingClientRect();
        blobert.classList.add("lid");
        var bx = bn.left + bn.width / 2 - sr.left - sr.width / 2, by = bn.top + bn.height * .62 - sr.top - sr.height / 2;
        caption("clap", bn.left - cr.left - 20, bn.top - cr.top - 34);
        return wait(140).then(function(){
          return fly([
            { transform: "translate(0,0) scale(1)", opacity: 1 },
            { transform: "translate(" + bx + "px," + (by - 50) + "px) scale(.9)", opacity: 1, offset: .5 },
            { transform: "translate(" + bx + "px," + by + "px) scale(.5)", opacity: 0 }
          ], 420);
        }).then(function(){ return wait(240); });
      })
      .then(function(){
        blobert.classList.remove("sweep", "chomp", "puff", "lid");
        blobert.classList.add("wave");
        return wait(380);
      })
      .then(function(){
        blobert.classList.remove("wave");
        return move(blobert, [{ transform: "translateX(" + dx + "px)" }, { transform: "translateX(0)" }], 300, "cubic-bezier(.5,0,.8,.4)");
      })
      .then(function(){ blobert.className = "blobert"; blobert.style.transform = ""; });
  }

  /* ---------- complete: Leo reacts, the sentence is spoken ---------- */
  function complete(){
    phase = "ready"; busy = true;
    mood("happy"); pose("happy");
    slip.style.transform = "rotate(1deg) scale(1.03)";
    setTimeout(function(){ slip.style.transform = ""; }, 500);
    var sr = slip.getBoundingClientRect(), cr = card.getBoundingClientRect();
    popSticker(sr.right - cr.left - 56, sr.top - cr.top - 34, 64, "burst");
    setHead("That's it", "Now say it to Leo.");
    announce("Sentence complete. " + SENTENCE);
    bank.classList.add("out");
    setTimeout(function(){ bank.hidden = true; key.hidden = false; card.classList.add("tall"); $("cta-row").hidden = false; }, 220);
    speak(SENTENCE, 1, function(){
      pose("idle");
      busy = false;
      cta.disabled = false; cta.classList.add("ready");
      cta.focus();
    });
  }

  /* ---------- say it: the mic, or the typed fallback ---------- */
  function listening(on){
    cta.innerHTML = on
      ? "<span class='dots' aria-hidden='true'><i></i><i></i><i></i></span><span id='ctaLabel'>Listening</span>"
      : "<span id='ctaLabel'>Say it</span> <span class='chev' aria-hidden='true'>&#187;</span>";
    ctaLabel = $("ctaLabel");
  }
  function startMic(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    phase = "speak"; mood("listen"); pose("listen");
    setHead("Your turn", "Say: " + SENTENCE);
    listening(true);
    if (!SR){ setTimeout(function(){ listening(false); openTyped(); }, 900); return; }
    try {
      rec = new SR(); rec.lang = "en-GB"; rec.interimResults = false; rec.maxAlternatives = 1;
      var got = false;
      rec.onresult = function(e){ got = true; scored(e.results[0][0].transcript); };
      rec.onerror = function(){ if (!got){ listening(false); openTyped(); } };
      rec.onend = function(){ if (!got){ listening(false); openTyped(); } };
      setTimeout(function(){ if (!got && phase === "speak" && typed.hidden){ listening(false); openTyped(); } }, 6000);
      rec.start();
    } catch (e){ listening(false); openTyped(); }
  }
  function openTyped(){
    if (rec){ try { rec.abort(); } catch (e){} rec = null; }
    phase = "speak"; mood("listen"); pose("listen");
    setHead("Your turn", "Say: " + SENTENCE);
    listening(false);
    bank.hidden = true; typed.hidden = false; cta.disabled = true; key.hidden = true;
    say.value = ""; say.focus();
  }
  typed.onsubmit = function(e){ e.preventDefault(); if (say.value.trim()) scored(say.value); };
  key.onclick = openTyped;

  function norm(s){ return s.toLowerCase().replace(/[^a-z' ]+/g, " ").trim().split(/\s+/).filter(Boolean); }
  function scored(text){
    var want = norm(SENTENCE), got = norm(text);
    var hit = 0; want.forEach(function(w){ if (got.indexOf(w) >= 0) hit++; });
    var words = hit / want.length;
    var inOrder = 0, j = 0; got.forEach(function(w){ if (w === want[j]){ inOrder++; j++; } });
    var rhythm = Math.min(1, inOrder / want.length + .15);
    var sounds = Math.min(1, words * .7 + rhythm * .3 + .08);
    show(sounds, rhythm, words, text);
  }
  function show(s, r, w, text){
    phase = "scored";
    typed.hidden = true; key.hidden = true; bank.hidden = true; $("cta-row").hidden = false;
    slots.hidden = true; score.hidden = false; $("rcA").textContent = "Your turn";
    said.hidden = false; said.innerHTML = "You said <q>" + text.replace(/</g, "&lt;") + "</q>";
    requestAnimationFrame(function(){
      $("b1").style.width = Math.round(s * 100) + "%";
      $("b2").style.width = Math.round(r * 100) + "%";
      $("b3").style.width = Math.round(w * 100) + "%";
    });
    var good = w >= .8;
    mood(good ? "happy" : "idle"); pose(good ? "happy" : "wow");
    setHead(good ? "Nice one" : "Nearly", good ? "Leo got it the first time." : "Try it with me once more.");
    progress(7);
    if (good){
      var cr = card.getBoundingClientRect(), r2 = score.getBoundingClientRect();
      popSticker(r2.right - cr.left - 30, r2.top - cr.top - 50, 56);
    }
    announce((good ? "Nice one. " : "Nearly. ") + "Sounds " + Math.round(s * 100) + ", rhythm " + Math.round(r * 100) + ", words " + Math.round(w * 100) + " out of 100.");
    listening(false);
    ctaLabel.textContent = good ? "Next" : "Say it again";
    cta.disabled = false; cta.classList.remove("ready"); void cta.offsetWidth; cta.classList.add("ready");
    cta.focus();
  }

  /* ---------- end card ---------- */
  function endCard(){
    phase = "done";
    card.classList.add("end");
    card.removeAttribute("data-mood");
    slip.hidden = true; scene.hidden = true; doodle.hidden = false;
    var sticks = card.querySelectorAll(".stick");
    for (var i = 0; i < sticks.length; i++) sticks[i].hidden = i > 1;
    setHead("You can now ask for the bill", "Could I have the bill, please?");
    progress(8);
    announce("You can now ask for the bill.");
    ctaLabel.textContent = "Done";
    cta.classList.remove("ready"); void cta.offsetWidth; cta.classList.add("ready");
    cta.disabled = false;
  }

  cta.onclick = function(){
    if (phase === "ready") startMic();
    else if (phase === "scored"){ if ((ctaLabel.textContent || "").indexOf("again") >= 0){ score.hidden = true; said.hidden = true; slots.hidden = false; $("rcA").textContent = "Café Leo"; phase = "ready"; startMic(); } else endCard(); }
    else if (phase === "done") location.reload();
  };

  /* ---------- tester hooks ---------- */
  window.addEventListener("lp:auto", function(e){
    var ok = !e.detail || e.detail.correct !== false;
    if (phase === "build"){
      if (ok){ var t = tileFor(TARGET[placed.length]); if (t) tap(t); }
      else { var bad = tileFor("money") || tileFor("want"); if (bad) placeWrong(bad, e.detail && e.detail.gag); }
    } else if (phase === "ready"){ ok ? show(.94, .9, 1, SENTENCE) : show(.6, .5, .5, "could i have the money"); }
    else if (phase === "speak"){ ok ? scored(SENTENCE) : scored("could i have the money please"); }
    else if (phase === "scored"){ endCard(); }
  });
  window.lp = {
    wrong: function(gag){ var bad = tileFor("money") || tileFor("want"); if (bad) placeWrong(bad, gag); },
    phase: function(){ return phase; },
    busy: function(){ return busy; },
    end: endCard, score: show, typed: openTyped
  };

  /* ---------- go ---------- */
  renderSlots(); renderBank(); progress(0);
})();
</script>
</body>
</html>
