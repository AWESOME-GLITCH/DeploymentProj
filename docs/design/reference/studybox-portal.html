.road{background:var(--surface-0);border:1px solid var(--line);border-radius:12px;padding:20px 24px 12px;box-shadow:var(--shadow-1);margin-bottom:20px}
.road h2{font-size:22px;margin-bottom:2px}
.road .sub{color:var(--ink-3);font-size:13px;margin-bottom:10px}
.road svg{width:100%;height:auto;display:block}
.road .stop{cursor:pointer}
.road .stop text{font-family:var(--font);font-size:11px;fill:var(--ink-3);font-weight:600}
.road .stop.done circle{fill:var(--violet-500);stroke:var(--violet-500)}
.road .stop.cur circle{fill:var(--surface-0);stroke:var(--violet-600);stroke-width:3}
.road .stop.next circle{fill:var(--surface-0);stroke:var(--line-strong);stroke-width:2}
.road .stop.done text{fill:var(--violet-800)}
.road .stop.cur text{fill:var(--ink);font-weight:700}
.road .lbl2{font-size:12px;fill:var(--ink-2);font-family:var(--font)}
.ten{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ten svg{width:120px;height:120px}
.ten .leg{display:flex;flex-direction:column;gap:6px;font-size:13px}
.ten .leg div{display:flex;align-items:center;gap:8px}
.ten .leg i{width:10px;height:10px;border-radius:50%}
.coach{display:flex;gap:12px;align-items:flex-start;background:var(--violet-50);border:1px solid var(--violet-200);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:20px}
.coach .av{background:var(--violet-600);color:#fff}
.hw{display:flex;flex-direction:column}
.hw .row{padding:12px 16px}
.hw .row .t b{font-size:14px}
.pth{display:flex;flex-direction:column;gap:10px;max-width:760px}
.pitem{display:flex;align-items:center;gap:14px;background:var(--surface-0);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow-1)}
.pitem .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-3);color:var(--ink-2);flex:0 0 32px}
.pitem.done .n{background:var(--success-t);color:var(--success)}
.pitem.cur .n{background:var(--violet-600);color:#fff}
.pitem .t{flex:1}
.pitem .t b{display:block;font-size:14px}
.pitem .t span{font-size:12px;color:var(--ink-3)}
.pitem.locked{opacity:.6}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .q{font-size:16px;font-weight:600}
.quiz .opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px;background:var(--surface-0)}
.quiz .opt:hover{border-color:var(--violet-500)}
.quiz .opt.ok{border-color:var(--success-f);background:var(--success-t)}
.quiz .opt.bad{border-color:var(--danger-f);background:var(--danger-t)}
.fb{background:var(--surface-0);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.fb .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.fb .h b{color:var(--ink)}
.fb p{font-size:14px}
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig b{font-size:28px;font-family:var(--mono);color:var(--violet-800)}
</style>
<script>
/* ---------- student portal ---------- */
/* ---------- item preview (sample content for every item type) ---------- */
function openItemPreview(it,u,asStudent){const title=esc(it.title);const unit=u?`Unit ${u.n}: ${esc(u.title)}`:'';let body='';
 if(it.type==='Page')body=`<div class="paper" style="font-size:15px"><p class="small muted" style="margin-bottom:10px">${unit} · Vocabulary and reading · about ${it.min} min</p><h3 style="margin-bottom:8px">The journey that changed my mind</h3><p style="margin-bottom:10px">Ten years ago Amal Haddad set off on a two-week trip across Oman with a rucksack, a paper map and no plan. She <b>has travelled</b> to more than forty countries since then, but she still says that first journey taught her the most. "I <b>had never slept</b> outdoors before," she remembers. "By the end of the trip I <b>had learnt</b> to read the stars."</p><p style="margin-bottom:14px">Today Amal runs a small company that organises walking holidays for people who, like her, want to travel slowly. "Fast travel is about collecting places," she says. "Slow travel is about collecting people."</p><div class="card"><div class="ch"><h3>Vocabulary</h3><span class="small muted">Tap a word to hear it</span></div><div class="cb" style="display:flex;flex-wrap:wrap;gap:6px">${['set off','rucksack','sleep outdoors','read the stars','collect places','slow travel','organise a holiday','a two-week trip'].map(w=>`<button class="chip">${w}</button>`).join('')}</div></div><div class="card" style="margin-top:12px"><div class="ch"><h3>Check you understand</h3></div><div class="cb quiz"><div class="q">Why does Amal think slow travel is better?</div>${['It is cheaper','You meet people','You see more places'].map((o,i)=>`<button class="opt" data-o="${i===1?'ok':'bad'}">${o}</button>`).join('')}</div></div></div>`;
 else if(it.type==='Video')body=`<p class="small muted" style="margin-bottom:10px">${unit} · Grammar in context · ${it.min} min</p><div style="aspect-ratio:16/9;background:var(--sidebar-bg);border-radius:10px;display:grid;place-items:center;color:#fff;position:relative;margin-bottom:12px"><button class="iconbtn" style="width:64px;height:64px;background:var(--violet-500);color:#fff;border-radius:50%">${ic('play')}</button><span class="small" style="position:absolute;left:14px;bottom:10px;color:var(--sidebar-muted)">0:00 / 6:12 · subtitles: English, Arabic, Spanish</span></div><div class="card"><div class="ch"><h3>Transcript</h3></div><div class="cb" style="font-size:14px;line-height:1.6"><p><span class="mono muted">0:00</span> In this video we look at the present perfect: <b>have</b> or <b>has</b> plus the past participle. We use it when the time is not finished or not important.</p><p><span class="mono muted">0:42</span> "I <b>have travelled</b> to Oman." When? It does not matter. Compare: "I <b>travelled</b> to Oman in 2019." Now the time is finished, so we use the past simple.</p><p><span class="mono muted">1:30</span> Pause the video and find three present perfect verbs in the reading from lesson a.</p></div></div>`;
 else if(it.type==='Quiz')body=`<p class="small muted" style="margin-bottom:10px">${unit} · ${it.pts} points · auto-marked · two attempts</p><div class="quiz"><div class="q">1 of 10. Choose the correct form.</div><p>Amal ____ to more than forty countries since her first trip.</p>${['travelled','has travelled','is travelling'].map((o,i)=>`<button class="opt" data-o="${i===1?'ok':'bad'}">${o}</button>`).join('')}<p class="small muted hidden" id="pvx">Present perfect: the time (since her first trip) is not finished.</p></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" disabled>Previous</button><button class="btn primary" id="pvn" disabled>Next</button></div>`;
 else if(it.type==='Speaking')body=`<p class="small muted" style="margin-bottom:10px">${unit} · ${it.pts} points · marked by AZE, then your teacher</p><div class="paper"><div class="prompt"><b>Task.</b> Describe a journey you remember. Say where you went, why, and whether you would go again. Speak for one to two minutes.</div></div><div class="card"><div class="cb" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div class="small muted">You can listen back and record again before you submit. Your teacher hears only the version you submit.</div><div style="display:flex;gap:8px"><button class="btn lg primary">${ic('mic')}Record</button><button class="btn lg" disabled>${ic('play')}Listen back</button></div><div class="wave" style="width:100%;opacity:.4">${Array.from({length:60},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.3)*26)}px"></i>`).join('')}</div></div></div><div class="card" style="margin-top:12px"><div class="ch"><h3>How it is marked</h3></div><div class="cb small" style="display:flex;flex-direction:column;gap:4px"><div><b>Task completion</b> · did you cover all three points?</div><div><b>Fluency</b> · pace and pauses</div><div><b>Pronunciation</b> · word stress and final sounds</div><div><b>Grammar and vocabulary</b> · past tenses, travel words</div></div></div>`;
 else if(it.type==='Writing')body=`<p class="small muted" style="margin-bottom:10px">${unit} · ${it.pts} points · marked by AZE, then your teacher</p><div class="paper"><div class="prompt"><b>Task.</b> Write an email of complaint to a company about a product or service you paid for. Say what the problem was, how it affected you, and what you want the company to do. Write 140 to 190 words.</div></div><div class="card"><div class="ch"><h3>Model answer (opens after you submit)</h3></div><div class="cb paper" style="font-size:14px;filter:blur(3px);user-select:none">Dear Sir or Madam, I would like to express my dissatisfaction with the laptop I purchased from your shop on 3 May. Although the assistant told me the battery lasts ten hours, it lasts only three…</div></div><div class="field" style="margin-top:12px"><label>Your writing</label><textarea class="input" rows="6" placeholder="Dear Sir or Madam,"></textarea><span class="hint">0 words · aim for 140 to 190 · saves as you type</span></div>`;
 else body=`<p class="small muted" style="margin-bottom:10px">${unit} · in class · ${it.min} min</p><div class="card"><div class="ch"><h3>Review and Memory Booster</h3></div><div class="cb" style="display:flex;flex-direction:column;gap:8px;font-size:14px"><div><b>I can…</b></div>${['talk about experiences using the present perfect','use travel collocations (set off, go sightseeing, get lost)','write a short email of complaint with a clear request','stress three-syllable words correctly'].map(x=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="accent-color:var(--violet-600)">${x}</label>`).join('')}<div class="small muted" style="margin-top:6px">Students tick these in class; the teacher sees the totals per statement in the class overview.</div></div></div>`;
 const b=openLayer(`<div class="th"><span class="ti ${it.type}">${ic(TYPEICON[it.type])}</span><h2>${title}</h2>${asStudent?'':pill('Preview as student','violet','eye')}<button class="iconbtn" data-close>${ic('x')}</button></div><div class="tb">${body}</div><div class="tf"><span class="left">${it.pub?'Published':'Draft, not visible to students'}${it.req?' · required':''}</span><button class="btn" data-close>Close</button>${asStudent&&(it.type==='Quiz'||it.type==='Writing'||it.type==='Speaking')?`<button class="btn primary" data-close>Submit</button>`:asStudent?`<button class="btn primary" data-close>Mark as done</button>`:''}</div>`,'modal',{cls:'lg'});
 b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{b.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','bad'));o.classList.add(o.dataset.o);const x=b.querySelector('#pvx');if(x)x.classList.remove('hidden');const n=b.querySelector('#pvn');if(n)n.disabled=false});}

const STU={};
const curStudent=()=>stById[S.student]||STUDENTS.find(s=>s.cls==='c1');
const stTeacher=s=>tById[clsById[s.cls].teacher];
function stNav(){return[['home','Home','home'],['classes','My classes','classes'],['practice','Practice','book'],['progress','How I\'m doing','chart'],['messages','Messages','msg']]}
function viewAs(s){S.student=s.id;S.viewAs={from:location.hash||'#/t/home',by:S.role};if(layerStack.length)closeLayer();go('/s/home')}
function exitViewAs(){const f=S.viewAs?S.viewAs.from:'#/t/home';S.viewAs=null;location.hash=f}
const ro=()=>!!S.viewAs;
const roToast=()=>toast('Read-only while viewing as a student.');
const hwStatus=(t,s)=>{const m=SUBS.find(x=>x.task===t.id&&x.student===s.id);if(!m){return t.due<TODAY?{k:'missing',l:'Missing',cls:'bad'}:{k:'todo',l:'Not started',cls:'neutral'}}const st=subState(m);if(st==='released')return{k:'done',l:'Returned',cls:'ok',m};if(st==='revision')return{k:'rev',l:'Returned for a second try',cls:'info',m};return{k:'wait',l:'Being marked',cls:'warn',m}};
const target=s=>bandName(LEVELS[clsById[s.cls].level].ord+1).replace('+','');
function roadSvg(c){const W=920,H=170;const pts=[];for(let i=0;i<12;i++){const x=40+i*(W-80)/11;const y=90+Math.sin(i*0.9)*32;pts.push([x,y])}const d=pts.map((p,i)=>(i?`Q ${(pts[i-1][0]+p[0])/2} ${i%2?pts[i-1][1]:p[1]}, ${p[0]} ${p[1]}`:`M ${p[0]} ${p[1]}`)).join(' ');const cur=c.unit;
 return`<svg viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="var(--surface-3)" stroke-width="14" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--violet-200)" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>${pts.map((p,i)=>{const u=S.curriculum[i];const k=i+1<cur?'done':i+1===cur?'cur':'next';return`<g class="stop ${k}" data-u="${i+1}"><circle cx="${p[0]}" cy="${p[1]}" r="${k==='cur'?12:9}"/>${k==='done'?`<path d="M${p[0]-4} ${p[1]}l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`:''}<text x="${p[0]}" y="${p[1]+(i%2?-18:28)}" text-anchor="middle">${k==='cur'?'You are here':'Unit '+(i+1)}</text>${k==='cur'?`<text class="lbl2" x="${p[0]}" y="${p[1]+(i%2?-32:42)}" text-anchor="middle">${u?u.title:''}</text>`:''}</g>`}).join('')}<text class="lbl2" x="${W-40}" y="24" text-anchor="end" style="font-weight:700;fill:var(--violet-800)">${target(curStudent())} test · ${fmtD(new Date(c.end))}</text></svg>`}
function ringSvg(parts){const R=48,cx=60,cy=60,r=2*Math.PI*R;let off=0;const cols=['var(--violet-600)','var(--chart-2)','var(--chart-3)'];return`<svg viewBox="0 0 120 120"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="12"/>${parts.map((p,i)=>{const len=r/3-4;const s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="12" stroke-dasharray="${len} ${r-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" opacity="${p.done?1:0.25}" stroke-linecap="butt"/>`;off+=r/3;return s}).join('')}<text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--ink);font-family:var(--font)">${parts.filter(p=>p.done).length*3+1}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" style="font-size:10px;fill:var(--ink-3);font-family:var(--font)">of 10 min</text></svg>`}
function practiceItems(s){const weak=[...SKILLS].sort((a,b)=>s.sub[a]-s.sub[b]).slice(0,2);const sug=S.assigned.filter(t=>t.cls===s.cls&&t.verb==='suggest').map(t=>({id:t.id,title:t.title,sub:`Set by ${stTeacher(s).name.split(' ')[0]} · ${t.type}`,min:15,st:'cur',teacher:true}));
 const base=[{id:'p1',title:'Past simple verbs: regular and irregular',sub:`${weak[0]} focus · 8 questions`,min:5,st:'done'},{id:'p2',title:'Word stress on three-syllable words',sub:'Speaking focus · listen and repeat',min:4,st:'done'},{id:'p3',title:'"want + person + to + verb"',sub:`${weak[0]} focus · 6 questions`,min:5,st:'cur'},{id:'p4',title:'Formal linking words for emails',sub:`${weak[1]} focus · matching`,min:6,st:'next'},{id:'p5',title:'Unit 5 vocabulary: travel collocations',sub:'Review · 10 cards',min:5,st:'next'},{id:'p6',title:'Listening: complaints at reception',sub:'Listening focus · 2 minutes',min:6,st:'locked'}];return[...sug,...base]}
STU.home=function(page){const s=curStudent();const c=clsById[s.cls];const t=stTeacher(s);const hw=tasksOfCls(c).filter(x=>x.verb!=='suggest'&&Math.abs(dayDiff(x.due))<=14).sort((a,b)=>a.due-b.due);const u=S.curriculum[c.unit-1];const r=risk(s);const done=S.stuDone||{};
 const coach=r&&r.lvl==='red'?`Two homework tasks are waiting for you. Start with the writing task tonight; it takes about 20 minutes.`:s.sub.Writing<s.sub.Speaking?`Your speaking is ahead of your writing. Five minutes of the past tense practice before Sunday will help your next email.`:`Your past tense verbs improved in Unit 4. Keep going: the Unit 5 speaking task closes on Thursday.`;
 const el=content(page,`${head(`Hi ${s.name.split(' ')[0]}`,`${lvlPill(c.level)}<span>·</span><span>${c.name}, ${t.name}</span><span>·</span><span>Next class ${c.days.split(',')[0].split(' ')[0]} ${c.time}, ${c.room}</span>`)}
 <div class="road"><h2>Road to ${target(s)}</h2><div class="sub">Unit ${c.unit} of 12 · ${12-c.unit} stops to go · click a stop to open it</div>${roadSvg(c)}</div>
 <div class="coach"><span class="av">${ini(t.name)}</span><div><b>${t.name.split(' ')[0]} says:</b> ${coach}</div></div>
 <div class="grid2"><div class="card"><div class="ch"><h3>Homework</h3><span class="small muted">${hw.filter(x=>hwStatus(x,s).k==='todo'||hwStatus(x,s).k==='missing'||hwStatus(x,s).k==='rev').length} to do</span><a class="btn sm" href="#/s/classes">All homework</a></div><div class="hw list">${hw.length?hw.map(x=>{const st=hwStatus(x,s);return`<div class="row click" data-hw="${x.id}"><span class="ti ${x.type}" style="width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:0 0 32px">${ic(TYPEICON[x.type])}</span><div class="t"><b>${x.title}</b><span>Unit ${x.unit} · ${x.due<TODAY?'was due':'due'} ${fmtD(x.due)}${st.m&&st.k==='done'?` · ${subScore(st.m)}/100`:''}</span></div>${pill(st.l,st.cls)}${st.k==='todo'||st.k==='missing'||st.k==='rev'?`<button class="btn sm primary" data-start="${x.id}">${st.k==='rev'?'Try again':'Start'}</button>`:`<button class="btn sm" data-hw2="${x.id}">Open</button>`}</div>`}).join(''):'<div class="empty"><b>No homework right now</b></div>'}</div></div>
 <div><div class="card" style="margin-bottom:16px"><div class="ch"><h3>Today's 10 minutes</h3></div><div class="cb ten">${ringSvg([{done:!!done.hw},{done:!!done.pr},{done:!!done.rv}])}<div class="leg"><div><i style="background:var(--violet-600)"></i>Homework: ${hw.find(x=>hwStatus(x,s).k==='todo')?hw.find(x=>hwStatus(x,s).k==='todo').title:'all done'}</div><div><i style="background:var(--chart-2)"></i>Practice: "want + person + to + verb"</div><div><i style="background:var(--chart-3)"></i>Review: Unit ${c.unit} words</div><a class="btn sm primary" href="#/s/practice" style="align-self:flex-start;margin-top:4px">Start the next one</a></div></div></div>
 <div class="card"><div class="ch"><h3>This week</h3><span class="small muted">Unit ${c.unit}</span><a class="btn sm" href="#/s/unit/${c.unit}">Open unit</a></div><div class="cb"><b style="font-size:15px">${u.title}</b><p class="muted small" style="margin:2px 0 10px">You will be able to: ${u.obj.toLowerCase()}</p><div class="list" style="margin:0 -16px -16px">${u.items.slice(0,6).map((it,i)=>`<div class="row" style="padding:8px 16px"><span class="ti ${it.type}">${ic(TYPEICON[it.type])}</span><div class="t"><b style="font-weight:500">${it.title}</b></div>${i<2?pill('Done','ok','check'):i===2?pill('In class Sun','violet'):''}</div>`).join('')}</div></div></div></div></div>`);
 el.querySelectorAll('.road .stop').forEach(g=>g.onclick=()=>go(`/s/unit/${g.dataset.u}`));
 el.querySelectorAll('[data-hw],[data-hw2]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-start]'))return;openHomework(taskById[x.dataset.hw||x.dataset.hw2]||S.assigned.find(t=>t.id===(x.dataset.hw||x.dataset.hw2)),s)});
 el.querySelectorAll('[data-start]').forEach(b=>b.onclick=e=>{e.stopPropagation();openHomework(taskById[b.dataset.start]||S.assigned.find(t=>t.id===b.dataset.start),s,true)})};
function openHomework(t,s,start){if(!t)return;const st=hwStatus(t,s);const m=st.m;const d=m&&S.decisions[m.id];const e=m?essayFor(m):null;const isW=t.type==='Writing';
 if(st.k==='done'&&m){let bands=d?d.bands:critFor(m).map(c=>c[1]);if(!d){const avg=bands.reduce((a,b)=>a+b,0)/bands.length;const want=2+(subScore(m)-40)/22;const sh=Math.round((want-avg)*2)/2;bands=bands.map(b=>Math.max(2,Math.min(4.5,b+sh)))}const crit=critFor(m);const fbText=d&&d.comment?d.comment:'Good structure. Check your past tense verbs: underline every verb and ask "when?".';
  openLayer(`<div class="th"><h2>${t.title}</h2><button class="iconbtn" data-close>${ic('x')}</button></div><div class="tb" style="display:flex;flex-direction:column;gap:12px"><div class="scorebig"><b>${subScore(m)}</b><span class="muted">/ 100 · overall ${segLabel(Math.round((bands.reduce((a,b)=>a+b,0)/bands.length)*2)/2)} · marked by ${stTeacher(s).name.split(' ')[0]}</span></div>
  <div class="card"><div class="ch"><h3>Your bands</h3></div><div class="cb" style="display:flex;flex-direction:column;gap:8px">${crit.map((cr,i)=>`<div style="display:grid;grid-template-columns:160px 1fr auto;gap:10px;align-items:center;font-size:13px"><span>${cr[0]}</span><div class="segs locked">${SEGS.map(([l,v])=>`<button class="${bands[i]===v?'on':''}" disabled>${l}</button>`).join('')}</div></div>`).join('')}</div></div>
  <div class="fb"><div class="h">${avatar(stTeacher(s).name,1)}<b>${stTeacher(s).name}</b><span>· feedback</span></div><p>${esc(fbText)}</p>${d&&d.audio?`<p class="small muted" style="margin-top:6px">${ic('mic','ic small')} Audio message, ${d.audio.len}: "${d.audio.text}"</p>`:''}</div>
  ${isW&&e?`<div class="card"><div class="ch"><h3>Your writing with the errors marked</h3><span class="small muted">Hover a mark to see the correction</span></div><div class="cb paper" style="font-size:15px">${esc(e.text).replace(/\{([^|]+)\|([a-z]+)\|([^}]+)\}/g,(_,w,ty,fix)=>`<mark class="${ty}" title="${ERRTYPES[ty]}: ${esc(fix)}">${w}</mark>`).replace(/\n\n/g,'<br><br>')}<div class="typekey">${Object.entries(ERRTYPES).map(([k,v])=>`<span><i style="border-color:${ERRCOL[k]}"></i>${v}</span>`).join('')}</div></div></div>`:''}

A.ask=function(page){const Q=[['Which B1 classes in Dubai have attendance under 85% this month?',()=>{const rows=CLASSES.filter(c=>c.campus==='DXB'&&c.level.startsWith('B1')&&!c.upcoming).map(c=>({c,a:clsAtt(c)})).filter(x=>x.a<85);return{cols:['Class','Teacher','Attendance','Students'],rows:rows.map(x=>[x.c.name+' '+x.c.level,tById[x.c.teacher].name,x.a+'%',stOfCls(x.c).length]),how:`SELECT class, teacher, AVG(present) FROM register\nWHERE campus='DXB' AND level LIKE 'B1%' AND session_date >= '2026-08-13'\nGROUP BY class HAVING AVG(present) < 0.85\n-- population: ${CLASSES.filter(c=>c.campus==='DXB'&&c.level.startsWith('B1')&&!c.upcoming).length} classes, register as of 08:10`}}],['How many submissions are waiting for teacher review, by teacher?',()=>{const by={};toMark().forEach(m=>{const t=tById[clsById[taskById[m.task].cls].teacher];by[t.name]=(by[t.name]||0)+1});return{cols:['Teacher','Waiting','Oldest'],rows:Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,v,ago(Math.max(...toMark().filter(m=>tById[clsById[taskById[m.task].cls].teacher].name===n).map(m=>m.submittedAgo)))]),how:`SELECT teacher, COUNT(*) FROM submissions\nWHERE state='awaiting_teacher' GROUP BY teacher`}}],['Which classes start in the next 14 days and are not ready?',()=>({cols:['Class','Campus','Starts','Missing'],rows:CLASSES.filter(c=>c.upcoming).map(c=>[c.name+' '+c.level,CAMPUS[c.campus].n,fmtD(new Date(c.start)),readiness(c).filter(r=>!r[1]).map(r=>r[0]).join(', ')||'Nothing']),how:`SELECT class, campus, start_date, readiness_gaps FROM classes\nWHERE start_date BETWEEN today AND today + 14`})],['What was the level-up rate for B2 last course?',()=>({cols:['Level','Campus','Sat the test','Passed','Rate'],rows:[['B2','Dubai',22,15,'68%'],['B2','London',18,12,'67%']],how:`SELECT level, campus, COUNT(*) sat, SUM(passed) FROM level_tests\nWHERE course_block='2026-05' AND level='B2' GROUP BY campus`})],['Which students under 18 are missing guardian consent?',()=>({cols:['Student','Class','Campus','Consent'],rows:STUDENTS.filter(s=>s.minor).slice(0,3).map((s,i)=>[s.name,clsById[s.cls].name,CAMPUS[s.campus].n,i===1?'Missing':'On file']),how:`SELECT student, class, consent_status FROM students JOIN consents\nWHERE age < 18 -- role-scoped: safeguarding lead and super admin only`})]];

<script>
/* ---------- sub-pages instead of pop-ups ---------- */
function viewAs(s,hash){S.student=s.id;S.viewAs={from:location.hash||'#/t/home',by:S.role};if(layerStack.length)closeLayer();location.hash=hash||'#/s/home'}
function outcomesBlock(n,u,compact){const M=UNITMETA[n]||UNITMETA[5];const ican=unitICan(n);return`<div class="card outcomes" style="margin-bottom:20px"><div class="ch"><h3>Learning outcomes</h3><span class="small muted">By the end of Unit ${n} you will be able to</span></div><div class="cb" style="display:grid;grid-template-columns:${compact?'1fr':'minmax(0,1.3fr) minmax(0,1fr)'};gap:16px 28px"><ol style="margin:0;padding-left:20px;line-height:1.7;font-size:14.5px">${ican.map(x=>`<li>${x}</li>`).join('')}</ol><div class="sumlist" style="font-size:13.5px"><div><b>Grammar</b><span>${esc(M.g)}</span><span></span></div><div><b>Vocabulary</b><span>${esc(M.v)}</span><span></span></div><div><b>Real life</b><span>${esc(M.f)}</span><span></span></div><div><b>Writing</b><span>${esc(M.w)}</span><span></span></div><div><b>Video</b><span>${esc(M.vid)}</span><span></span></div></div></div></div>`}
function route(){const h=location.hash.replace(/^#\/?/,'')||'t/home';const p=h.split('/');return{role:p[0],page:p[1]||'home',a:p[2],b:p[3],c:p[4],d:p[5],e:p[6]}}
const LCODES=['a','b','c','d','e','f'];
const LTITLE={a:'Vocabulary and reading',b:'Grammar in context',c:'Grammar practice',d:'Speaking',e:'Writing',f:'Review and Memory Booster'};
function unitLessons(n,u){const m=UNITMETA[n]||UNITMETA[5];const r=unitRefs(n);const p=r.cb[0],w=r.wb[0];const L=[
 {code:'a',title:LTITLE.a,focus:m.v,cb:`${p} to ${p+1}`,wb:`${w} to ${w+1}`,mode:'In class',mats:[`Audio ${m.a[0]}`,`Audio ${m.a[1]}`,'Word list with audio'],key:['set off on a journey','a two-week trip','get lost','sleep outdoors'],inclass:['Lead-in: photos and three questions','Reading: skim, then detail questions','Vocabulary: collocations in context'],athome:[`Workbook p.${w} to ${w+1}`,'Word list with audio on the portal'],notes:'Pair the two strongest readers with the two weakest for the detail task. Skip exercise 6 if time is short.'},
 {code:'b',title:LTITLE.b,focus:m.g,cb:`${p+2} to ${p+3}`,wb:`${w+2} to ${w+3}`,mode:'Watch at home, use in class',mats:[`Audio ${m.a[2]}`,`Grammar summary p.${r.gs[0]} to ${r.gs[1]}`,'Grammar video with transcript'],key:['I have travelled to…','Have you ever…?','I went there in 2019.'],inclass:['Notice the form in the reading','Controlled practice, then a mingle: "Have you ever…?"','Error correction from last week\'s writing'],athome:['Watch the 6-minute grammar video before class',`Workbook p.${w+2} to ${w+3}`],notes:'Common error in this class: present perfect with a finished time ("I have visited in 2019"). Board it and elicit the correction.'},
 {code:'c',title:LTITLE.c,focus:'ten auto-marked questions on the unit grammar',cb:`${p+4} to ${p+5}`,wb:`${w+4}`,mode:'At home',mats:['Grammar practice quiz (auto-marked)'],key:[],inclass:['Review the two most-missed questions at the start of the next lesson'],athome:['Grammar practice quiz on the portal, two attempts',`Workbook p.${w+4}`],notes:'The quiz report shows the most-missed question; open it in class on the projector.'},
 {code:'d',title:LTITLE.d,focus:m.f,cb:`${p+6}`,wb:`${w+5}`,mode:'In class, record at home',mats:[`Audio ${m.a[4]}`,'Pronunciation: sentence stress'],key:['Could you help me with…?','I\'m afraid there\'s a problem with…','What can you do about it?'],inclass:['Listen to two conversations','Role play in pairs, swap roles','Practise the recording on a phone'],athome:['Speaking task on the portal (AZE marks it, then your teacher)'],notes:'This lesson feeds the unit speaking task. Make sure everyone records at least once in class.'},
 {code:'e',title:LTITLE.e,focus:m.w,cb:`${p+7}`,wb:`${w+6}`,mode:'Plan in class, write at home',mats:['Model text with annotations','Writing checklist'],key:['I am writing to…','I would appreciate it if…','I look forward to hearing from you.'],inclass:['Analyse the model: organisation and register','Plan in pairs','Start the first paragraph in class'],athome:['Finish the writing task on the portal (AZE marks it, then your teacher)'],notes:'Whole-class feedback sheet goes out after marking; keep individual comments short.'},
 {code:'f',title:LTITLE.f,focus:'"I can" statements; unit vocabulary and grammar',cb:`${p+10} to ${p+11}`,wb:`${w+7}`,mode:'In class',mats:['Review exercises','Memory Booster cards'],key:[],inclass:['Review exercises in pairs','Tick the "I can" statements','Unit video and discussion if time allows'],athome:['Extra practice from the learning path if any statement is unticked'],notes:'Students who leave two or more statements unticked get the support practice automatically.'}];return L}
function previewBody(it,u){const unit=u?`Unit ${u.n}: ${esc(u.title)}`:'';
 if(it.type==='Page')return`<div class="paper" style="font-size:15px"><h3 style="margin-bottom:8px">The journey that changed my mind</h3><p style="margin-bottom:10px">Ten years ago Amal Haddad set off on a two-week trip across Oman with a rucksack, a paper map and no plan. She <b>has travelled</b> to more than forty countries since then, but she still says that first journey taught her the most. "I <b>had never slept</b> outdoors before," she remembers. "By the end of the trip I <b>had learnt</b> to read the stars."</p><p style="margin-bottom:14px">Today Amal runs a small company that organises walking holidays for people who, like her, want to travel slowly. "Fast travel is about collecting places," she says. "Slow travel is about collecting people."</p><div class="card"><div class="ch"><h3>Vocabulary</h3><span class="small muted">Tap a word to hear it</span></div><div class="cb" style="display:flex;flex-wrap:wrap;gap:6px">${['set off','rucksack','sleep outdoors','read the stars','collect places','slow travel','organise a holiday','a two-week trip'].map(w=>`<button class="chip">${w}</button>`).join('')}</div></div><div class="card" style="margin-top:12px"><div class="ch"><h3>Check you understand</h3></div><div class="cb quiz"><div class="q">Why does Amal think slow travel is better?</div>${['It is cheaper','You meet people','You see more places'].map((o,i)=>`<button class="opt" data-o="${i===1?'ok':'bad'}">${o}</button>`).join('')}</div></div></div>`;
 if(it.type==='Video')return`<div style="aspect-ratio:16/9;background:var(--sidebar-bg);border-radius:10px;display:grid;place-items:center;color:#fff;position:relative;margin-bottom:12px"><button class="iconbtn" style="width:64px;height:64px;background:var(--violet-500);color:#fff;border-radius:50%">${ic('play')}</button><span class="small" style="position:absolute;left:14px;bottom:10px;color:var(--sidebar-muted)">0:00 / 6:12 · subtitles: English, Arabic, Spanish</span></div><div class="card"><div class="ch"><h3>Transcript</h3></div><div class="cb" style="font-size:14px;line-height:1.6"><p><span class="mono muted">0:00</span> In this video we look at the present perfect: <b>have</b> or <b>has</b> plus the past participle. We use it when the time is not finished or not important.</p><p><span class="mono muted">0:42</span> "I <b>have travelled</b> to Oman." When? It does not matter. Compare: "I <b>travelled</b> to Oman in 2019." Now the time is finished, so we use the past simple.</p><p><span class="mono muted">1:30</span> Pause the video and find three present perfect verbs in the reading from lesson a.</p></div></div>`;
 if(it.type==='Quiz')return`<div class="quiz"><div class="q">1 of 10. Choose the correct form.</div><p>Amal ____ to more than forty countries since her first trip.</p>${['travelled','has travelled','is travelling'].map((o,i)=>`<button class="opt" data-o="${i===1?'ok':'bad'}">${o}</button>`).join('')}<p class="small muted hidden" id="pvx">Present perfect: the time (since her first trip) is not finished.</p></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" disabled>Previous</button><button class="btn primary" id="pvn" disabled>Next</button></div>`;
 if(it.type==='Speaking')return`<div class="paper"><div class="prompt"><b>Task.</b> Describe a journey you remember. Say where you went, why, and whether you would go again. Speak for one to two minutes.</div></div><div class="card"><div class="cb" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div class="small muted">You can listen back and record again before you submit. Your teacher hears only the version you submit.</div><div style="display:flex;gap:8px"><button class="btn lg primary">${ic('mic')}Record</button><button class="btn lg" disabled>${ic('play')}Listen back</button></div><div class="wave" style="width:100%;opacity:.4">${Array.from({length:60},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.3)*26)}px"></i>`).join('')}</div></div></div><div class="card" style="margin-top:12px"><div class="ch"><h3>How it is marked</h3></div><div class="cb small" style="display:flex;flex-direction:column;gap:4px"><div><b>Task completion</b> · did you cover all three points?</div><div><b>Fluency</b> · pace and pauses</div><div><b>Pronunciation</b> · word stress and final sounds</div><div><b>Grammar and vocabulary</b> · past tenses, travel words</div></div></div>`;

.topbar{height:var(--topbar-h);background:color-mix(in srgb,var(--surface-1) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:0;padding:0 32px;gap:12px}
.topbar .seg{background:var(--surface-0);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{white-space:nowrap;height:30px;border-radius:8px;padding:0 13px;font-size:13px;color:var(--ink-3)}
.seg button.on{background:var(--ink);color:var(--surface-0);box-shadow:none}
.topbar .search{flex:0 1 380px;height:40px;background:var(--surface-0);border:1px solid var(--line);border-radius:11px;padding:0 12px}
.topbar .fresh{font-size:12px;white-space:nowrap}
#density{display:none}
.iconbtn{width:38px;height:38px;border-radius:11px}
.topbar .iconbtn:hover{background:var(--surface-0)}
.content{padding:12px 32px 88px;max-width:var(--content-max)}
.pagehead{margin-bottom:22px}
.pagehead .t h1,h1{font-size:25px;line-height:32px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.pagehead .meta{font-size:13.5px}
.crumbs{font-size:13px;margin-bottom:10px}

/* ---- base components, restated for the theme ---- */
.btn{height:38px;border-radius:10px;padding:0 15px;border-color:var(--line-strong);font-weight:600}
.btn.sm{height:32px;border-radius:9px;padding:0 12px}
.btn.primary{background:var(--violet-600);border-color:var(--violet-600);box-shadow:0 1px 2px rgba(91,69,224,.3)}
.btn.primary:hover{background:var(--violet-700);border-color:var(--violet-700)}
.btn.ghost:hover{background:var(--surface-2)}
.card,.tile,.tablewrap,.ucard,.ccourse,.uhead2,.uhead,.lhead,.thead,.road,.ctxbar{border-radius:16px;border-color:var(--line);box-shadow:var(--card-sh)}
.ul,.lsec,.pitem,.outc,.mod{border-radius:14px}
.card .ch{border-bottom-color:var(--line);padding:16px 20px}
.card .ch h3{font-size:15px;font-weight:650}
.dt th{background:var(--surface-0);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;height:44px}
.dt tbody tr:hover{background:var(--surface-2)}
.tabs{display:flex;width:max-content;max-width:100%;gap:2px;background:var(--surface-0);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:22px}
.tabs button{height:34px;padding:0 14px;margin:0;border-radius:9px;border-bottom:0;font-size:13.5px;color:var(--ink-3)}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button.on{background:var(--violet-50);color:var(--violet-700)}
.pill{height:24px;border-radius:999px;font-weight:600}
.pill.ok{background:var(--good-t);color:var(--good)}.pill.warn{background:var(--warn-t);color:var(--warn)}.pill.bad{background:var(--bad-t);color:var(--bad)}
.list .row.click:hover{background:var(--surface-2)}
.input{border-radius:10px;border-color:var(--line-strong)}
.modal,.tray{border-radius:20px}
.tray{border-radius:20px 0 0 20px}

/* ---- dashboard grid ---- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;margin-bottom:20px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1180px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media (max-width:640px){.s3{grid-column:span 12}.dash{gap:14px}}

/* KPI */
.kpi{background:var(--surface-0);border:1px solid var(--line);border-radius:16px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--card-sh);color:inherit;text-align:left;min-width:0;transition:border-color var(--dur-fast),transform var(--dur-fast)}
a.kpi:hover,button.kpi:hover{border-color:var(--violet-200);text-decoration:none}
.kpi .k-top{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi .k-top .go{margin-left:auto;color:var(--ink-dis)}
.kpi .k-top .go svg{width:16px;height:16px}
.ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 32px;background:var(--violet-50);color:var(--acc)}
.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.teal{background:color-mix(in srgb,var(--teal) 12%,var(--surface-0));color:var(--teal)}
.ico.amber{background:color-mix(in srgb,var(--amber) 14%,var(--surface-0));color:var(--amber)}
.ico.rose{background:color-mix(in srgb,var(--rose) 12%,var(--surface-0));color:var(--rose)}
.kpi .k-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px;min-height:44px}
.kpi .num{font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .num small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.kpi .k-foot{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px}
.spk{display:block;flex:0 0 auto}
.pbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.pbar.teal i{background:var(--teal)}
.kpi .pbar{width:96px;margin-bottom:8px}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12px;padding:1px 7px 1px 5px;border-radius:999px}
.delta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.delta.good{background:var(--good-t);color:var(--good)}.delta.bad{background:var(--bad-t);color:var(--bad)}.delta.flat{background:var(--surface-2);color:var(--ink-3)}
.avs{display:inline-flex}
.avs span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;border:2px solid var(--surface-0);margin-left:-6px}
.avs span:first-child{margin-left:0}

/* panel */
.pn{background:var(--surface-0);border:1px solid var(--line);border-radius:16px;box-shadow:var(--card-sh);min-width:0;display:flex;flex-direction:column}
.pn-h{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;flex-wrap:wrap}
.pn-h h3{font-size:15px;font-weight:650;letter-spacing:-.01em}
.pn-h .sub{font-size:12.5px;color:var(--ink-3)}
.pn-h .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.pn-b{padding:0 20px 18px;flex:1}
.link{font-size:13px;font-weight:600;color:var(--violet-700);display:inline-flex;align-items:center;gap:2px}
.link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.link:hover{text-decoration:underline}
.pn-foot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:12px 20px;font-size:13px;font-weight:600;color:var(--violet-700)}
.pn-foot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;margin-left:auto}
.pn-foot:hover{background:var(--surface-2);border-radius:0 0 16px 16px;text-decoration:none}

/* level chip */
.lv{display:inline-grid;place-items:center;height:22px;padding:0 7px;border-radius:7px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--lvc) 13%,var(--surface-0));color:var(--lvc);flex:0 0 auto;letter-spacing:0}
.lv.big{width:42px;height:42px;padding:0;border-radius:12px;font-size:13.5px}
.lv-A2{--lvc:var(--lv-a2)}.lv-B1{--lvc:var(--lv-b1)}.lv-B1p{--lvc:var(--lv-b1p)}.lv-B2{--lvc:var(--lv-b2)}

/* class mini cards */
.klasses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1320px){.klasses{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.klass{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-0);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.klass:hover{border-color:var(--violet-200);box-shadow:0 6px 20px -12px rgba(22,20,43,.2)}
.klass .kh{display:flex;align-items:center;gap:11px;color:inherit;min-width:0}
.klass .kh:hover{text-decoration:none}
.klass .kn{min-width:0}
.klass .kn b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.klass .kn span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kprog>div:first-child{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.kprog>div:first-child b{color:var(--ink-2);font-weight:600}
.kstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface-2);border-radius:10px;padding:8px 4px}
.kstats div{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.kstats div+div{border-left:1px solid var(--line)}
.kstats span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.kstats b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.kact{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.kact .btn.ghost{margin-right:-6px}
.kact .btn svg{width:15px;height:15px}
b.good,em.good{color:var(--good)}b.warn,em.warn{color:var(--warn)}b.bad,em.bad{color:var(--bad)}

/* attendance panel */
.att-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 0 14px}
.att-big{font-size:44px;line-height:46px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.att-big small{font-size:20px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:2px}
.att-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin-top:4px;flex-wrap:wrap}
.att-chart{margin:0 -4px 8px}
.att-chart svg{width:100%;height:auto;display:block}
.att-list{border-top:1px solid var(--line)}
.arow{display:block;padding:10px 0 9px;color:inherit;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow:hover{text-decoration:none}
.arow:hover b{color:var(--violet-700)}
.arow-t{display:flex;align-items:center;gap:8px;margin-bottom:7px;min-width:0}
.arow-t b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow-t span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.arow-t em{margin-left:auto;font-style:normal;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.abar{position:relative;height:6px;border-radius:3px;background:var(--surface-3)}
.abar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--good)}
.abar i.warn{background:var(--amber)}.abar i.bad{background:var(--rose)}
.abar u{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink-2);opacity:.45;margin-left:-1px}
.ascale{position:relative;height:18px;font-size:11px;color:var(--ink-3);margin-top:8px}
.ascale span{position:absolute;top:0;white-space:nowrap}
.ascale span:first-child{left:0}.ascale span:last-child{right:0}.ascale span.mid{transform:translateX(-50%)}
.showall{display:block;width:100%;text-align:center;padding:10px;font-weight:600;color:var(--violet-700);font-size:13px;border-top:1px solid var(--line)}
.showall:hover{background:var(--surface-2)}

/* charts */
.achart .grid{stroke:var(--line);stroke-width:1}
.achart .ax{fill:var(--ink-3);font-size:10.5px;font-family:var(--font)}
.achart .tgt{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.achart .tg{font-weight:600}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pn-b > svg.achart{width:100%;height:auto;display:block}

/* schedule */
.sched{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:48px 12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:inherit}
.srow:last-child{border-bottom:0}
.srow:hover{text-decoration:none}
.srow time{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-weight:500}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.sdot.done{background:var(--good)}
.sdot.next{background:var(--acc);box-shadow:0 0 0 4px var(--violet-100)}
.srow .st b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* compact rows */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:inherit;min-width:0}
.r:last-child{border-bottom:0}
a.r:hover,.r.click:hover{text-decoration:none}
a.r:hover .r-t b,.r.click:hover .r-t b{color:var(--violet-700)}
.r.click{cursor:pointer}
.r-t{flex:1;min-width:0}
.r-t b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.r .ti svg{width:17px;height:17px}
.r .av{width:34px;height:34px;flex-basis:34px;font-size:12px;color:#fff}
.r .num2{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);min-width:24px;text-align:right}
.r .rowact{opacity:0}
.r:hover .rowact,.r:focus-within .rowact{opacity:1}

/* exceptions */
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.fchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-0)}
.fchip span{font-size:11px;background:var(--surface-2);color:var(--ink-3);border-radius:999px;padding:0 6px;line-height:18px}
.fchip:hover{border-color:var(--line-strong)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--surface-0)}
.fchip.on span{background:rgba(255,255,255,.18);color:inherit}
.exrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.exrow.sel{background:var(--violet-50)}
.sev{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.sev.bad{background:var(--rose)}
.exrow .r-t b{white-space:normal}
.exrow .r-t span{white-space:normal}
.exrow .owner{font-size:12px;color:var(--ink-3);white-space:nowrap}
.exrow .acts{display:flex;gap:4px;align-items:center}
@media (max-width:760px){.exrow{grid-template-columns:10px minmax(0,1fr)}.exrow .owner,.exrow .acts{grid-column:2}}

/* student */
.pn.road{padding:0;margin:0}
.pn.road .pn-b{padding:0 20px 8px}
.wrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;font-size:13.5px}
.wrow:last-child{border-bottom:0}
.wk-strip{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.wk-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.wk-h b{font-size:14px;font-weight:650}.wk-h span{font-size:12.5px;color:var(--ink-3)}.wk-h .link{margin-left:auto}
.wk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.wk-grid .wrow:nth-last-child(2):nth-child(odd){border-bottom:0}
@media (max-width:900px){.wk-grid{grid-template-columns:1fr}}
.wrow:hover{text-decoration:none;color:var(--violet-700)}
.wrow time{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.wrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skl{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.skl b{font-weight:600;font-size:12.5px;text-align:right}
.ten2{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center}
.ten2 svg{width:104px;height:104px}
.ten2 .leg{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ten2 .leg div{display:flex;gap:8px;align-items:flex-start;line-height:18px}
.ten2 .leg i{width:9px;height:9px;border-radius:3px;margin-top:5px;flex:0 0 9px}
.note{display:flex;gap:12px;align-items:flex-start}
.note .av{width:38px;height:38px;flex-basis:38px;font-size:13px;background:var(--violet-100);color:var(--violet-800)}
.note p{font-size:14px;line-height:22px;color:var(--ink-2)}
.note p b{color:var(--ink)}

/* one stat strip instead of four boxes */
.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface-0);border:1px solid var(--line);border-radius:16px;box-shadow:var(--card-sh);margin-bottom:20px;overflow:hidden}
.statbar .kpi{grid-column:auto;border:0;border-radius:0;box-shadow:none;padding:18px 22px;background:transparent}
.statbar .kpi+.kpi{border-left:1px solid var(--line)}
.statbar a.kpi:hover,.statbar button.kpi:hover{background:var(--surface-2)}
@media (max-width:1180px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.statbar .kpi:nth-child(3){border-left:0}.statbar .kpi:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:640px){.statbar{grid-template-columns:1fr}.statbar .kpi+.kpi{border-left:0;border-top:1px solid var(--line)}}

/* classes table */
.tablepn{margin-bottom:20px}
.ctab-wrap{overflow-x:auto}
table.ctab{width:100%;border-collapse:collapse;font-size:13.5px}
.ctab th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.ctab th span{text-transform:none;letter-spacing:0;font-weight:500}
.ctab th.num{text-align:right}
.ctab td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.ctab th:first-child,.ctab td:first-child{padding-left:20px}
.ctab th:last-child,.ctab td:last-child{padding-right:14px}
.ctab tbody tr.click{cursor:pointer}
.ctab tbody tr:hover td{background:var(--surface-2)}
.ctab tbody tr:hover td.col-att{background:color-mix(in srgb,var(--violet-100) 70%,var(--surface-2))}
.ctab td.num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.ctab em{font-style:normal;color:var(--ink-3);font-weight:500}
.c-name{display:flex;align-items:center;gap:12px}
.c-name .lv.big{width:38px;height:38px;border-radius:11px;font-size:12.5px}
.c-name a{display:block;font-weight:650;font-size:14.5px;color:var(--ink)}
.ctab tr:hover .c-name a{color:var(--violet-700)}
.c-name>div>span,.c-two>span{display:block;font-size:12px;color:var(--ink-3)}
.c-two b{font-weight:600}
.mono-b{font-family:var(--mono);font-weight:500!important}
.pbar.sm{width:84px;height:5px;margin-top:7px}
.ctab .col-att{background:color-mix(in srgb,var(--violet-50) 70%,transparent);min-width:160px}
.ctab th.col-att{color:var(--violet-700)}
.c-att{display:flex;align-items:center;gap:8px}
.c-att b{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.abar.sm{width:132px;height:5px;margin-top:8px}
.tiny{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:4px}
.cnt-link{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 8px;border-radius:999px;background:var(--warn-t);color:var(--warn);font-weight:700;font-size:12.5px}
.cnt-link:hover{text-decoration:none;filter:brightness(.96)}
.ctab td.act{text-align:right}

.ctab .act .iconbtn:hover{background:var(--surface-0);color:var(--violet-700)}

@media (prefers-reduced-motion:reduce){.kpi,.klass{transition:none}}
</style>
<script>
/* ---------- dashboard kit ---------- */
let _gid=0;
const tone=v=>v==null?'':v>=85?'good':v>=75?'warn':'bad';
const lvChip=(l,big)=>`<span class="lv lv-${lvlCls(l)} ${big?'big':''}">${l}</span>`;
const avCol=n=>{const cs=['#5B45E0','#0F9F94','#D98B06','#D63B3B','#2563EB','#9333EA','#0E7490'];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return cs[h%cs.length]};
const avStack=names=>`<span class="avs">${names.slice(0,4).map(n=>`<span style="background:${avCol(n)}" title="${esc(n)}">${ini(n)}</span>`).join('')}</span>`;
const deltaChip=(d,suffix='')=>d==null?'':`<span class="delta ${d>0?'good':d<0?'bad':'flat'}">${ic(d>0?'up':d<0?'down':'minus')}${Math.abs(d)}${suffix}</span>`;
const kpi=o=>{const tag=o.href?'a':'button';return`<${tag} class="kpi s3" ${o.href?`href="${o.href}"`:`type="button"`} ${o.attr||''}><div class="k-top"><span class="ico ${o.tone||''}">${ic(o.icon)}</span>${o.label}<span class="go">${ic('chev')}</span></div><div class="k-mid"><div class="num">${o.num}${o.unit?`<small>${o.unit}</small>`:''}</div>${o.viz||''}</div><div class="k-foot">${o.foot||''}</div></${tag}>`};
const smooth=pts=>{let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d};
function sparkArea(vals,o={}){const w=o.w||104,h=o.h||40,col=o.col||'var(--acc)';const v=vals.filter(x=>x!=null);if(v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;const pts=v.map((x,i)=>[4+i*(w-8)/(v.length-1),5+(h-10)*(1-(x-mn)/r)]);const id='gs'+(++_gid);const line=smooth(pts);const L=pts[pts.length-1];
 return`<svg class="spk" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col};stop-opacity:.22"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient></defs><path d="${line} L${L[0].toFixed(1)},${h} L${pts[0][0]},${h} Z" style="fill:url(#${id})"/><path d="${line}" style="fill:none;stroke:${col};stroke-width:2;stroke-linecap:round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="3.5" style="fill:var(--surface-0);stroke:${col};stroke-width:2"/></svg>`}
function areaChart(vals,o={}){const w=o.w||310,h=o.h||150,pl=34,pr=20,pt=12,pb=24;const mn=o.min??0,mx=o.max??100;const X=i=>pl+i*(w-pl-pr)/(vals.length-1);const Y=v=>pt+(h-pt-pb)*(1-(Math.max(mn,Math.min(mx,v))-mn)/(mx-mn));const ticks=o.ticks||[mn,mx];const pts=vals.map((v,i)=>[X(i),Y(v)]);const id='ga'+(++_gid);const line=smooth(pts);const L=pts[pts.length-1];const col=o.col||'var(--acc)';const u=o.unit||'';
 return`<svg class="achart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||''}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col};stop-opacity:.2"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient></defs>
 ${ticks.map(t=>`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${pl-8}" y="${Y(t)+3.5}" text-anchor="end" class="ax">${t}${u}</text>`).join('')}
 ${o.target!=null?`<line x1="${pl}" x2="${w-pr}" y1="${Y(o.target)}" y2="${Y(o.target)}" class="tgt"/><text x="${w-pr}" y="${Y(o.target)+14}" text-anchor="end" class="ax tg">Target</text>`:''}
 <path d="${line} L${L[0].toFixed(1)},${Y(mn)} L${pts[0][0]},${Y(mn)} Z" style="fill:url(#${id})"/><path d="${line}" style="fill:none;stroke:${col};stroke-width:2.4;stroke-linecap:round"/>
 ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:2.8}" style="fill:${i===pts.length-1?col:'var(--surface-0)'};stroke:${col};stroke-width:2"><title>${(o.labels||[])[i]||''}: ${vals[i]}${u}</title></circle>`).join('')}
 ${(o.labels||[]).map((l,i)=>`<text x="${X(i)}" y="${h-6}" text-anchor="middle" class="ax">${l}</text>`).join('')}</svg>`}
function barsV(series,o={}){const w=o.w||310,h=o.h||170,pl=30,pr=6,pt=12,pb=24;const n=o.labels.length;const mx=o.max||Math.ceil(Math.max(1,...series.flat())/20)*20;const Y=v=>pt+(h-pt-pb)*(1-v/mx);const gw=(w-pl-pr)/n;const k=series.length;const bw=Math.min(16,(gw-14-(k-1)*4)/k);const cols=o.colors||['var(--acc)','var(--teal)'];const ticks=[0,mx/2,mx];const u=o.unit||'';
 return`<svg class="achart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||''}">${ticks.map(t=>`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${pl-6}" y="${Y(t)+3.5}" text-anchor="end" class="ax">${t}${u}</text>`).join('')}
 ${o.labels.map((l,i)=>{const gx=pl+i*gw+(gw-(bw*k+4*(k-1)))/2;return series.map((s,j)=>{const x=gx+j*(bw+4);const y=Math.min(Y(s[i]),Y(0)-4);const r=Math.min(4,bw/2);return`<path d="M${x.toFixed(1)},${Y(0)} V${(y+r).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)} H${(x+bw-r).toFixed(1)} Q${(x+bw).toFixed(1)},${y.toFixed(1)} ${(x+bw).toFixed(1)},${(y+r).toFixed(1)} V${Y(0)} Z" style="fill:${cols[j]}"><title>${(o.names||[])[j]||''} ${l}: ${s[i]}${u}</title></path>`}).join('')+`<text x="${(pl+i*gw+gw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" class="ax">${l}</text>`}).join('')}</svg>`}
/* attendance bars use a 60 to 100 scale so real differences are visible; the scale is printed under the list */
const attW=v=>Math.max(2,Math.min(100,(v-60)*2.5));
function attPanel(o){const rows=o.rows;return`<section class="pn ${o.cls||''}" id="attP" aria-labelledby="attH"><div class="pn-h"><h3 id="attH">Attendance</h3><span class="sub">${o.scope}</span>${o.end?`<span class="end">${o.end}</span>`:''}</div>
 <div class="pn-b"><div class="att-top"><div><div class="att-big">${o.overall??'–'}<small>%</small></div><div class="att-meta">${deltaChip(o.delta,' pts')}<span>vs last week · target 85%</span></div></div>${o.chart?'':sparkArea(o.weeks,{w:112,h:48})}</div>
 ${o.chart?`<div class="att-chart">${areaChart(o.weeks,{labels:o.labels,min:70,max:100,ticks:[70,85,100],target:85,unit:'%',aria:'Attendance by week'})}</div>`:''}
 <div class="att-list">${rows.map(r=>`<a class="arow" href="${r.href}"><div class="arow-t">${lvChip(r.level)}<b>${r.name}</b>${r.sub?`<span>${r.sub}</span>`:''}<em class="${tone(r.v)}">${r.v??'–'}%</em></div><div class="abar"><i class="${tone(r.v)}" style="width:${r.v==null?0:attW(r.v)}%"></i><u style="left:${attW(85)}%"></u></div></a>`).join('')}</div>
 <div class="ascale" aria-hidden="true"><span>60%</span><span class="mid" style="left:${attW(85)}%">85% target</span><span>100%</span></div>${o.more||''}</div>${o.foot||''}</section>`}

/* =========================================================
   TEACHER HOME · classes as one clean table
   ========================================================= */
const clsWeeks=c=>clsAttWeeks(c).filter(x=>x!=null);
const clsLastAtt=c=>{const w=clsWeeks(c);return w.length?w[w.length-1]:clsAtt(c)};
const clsPrevAtt=c=>{const w=clsWeeks(c);return w.length>1?w[w.length-2]:null};
const clsHw=c=>{const tc=tasksOfCls(c).filter(t=>t.unit===c.unit&&t.verb!=='suggest'&&t.due<=TODAY);const e=tc.length*stOfCls(c).length;const g=tc.reduce((a,t)=>a+SUBS.filter(m=>m.task===t.id).length,0);return{e,g,p:e?Math.round(100*g/e):null}};
const TODAYSCHED={c1:{t:'09:00',k:'done'},c3:{t:'11:30',k:'next'},c2:{t:'18:00',k:'later'}};
const todayCell=(c,role)=>{const x=TODAYSCHED[c.id];if(!x||role!=='t')return`<span class="muted small">${c.days}</span>`;return x.k==='done'?pill('Register taken','ok','check'):x.k==='next'?`<a class="btn sm primary" href="#/${role}/class/${c.id}/register">Take register</a>`:`<span class="small" style="color:var(--ink-2)">Register at ${x.t}</span>`};
function classTable(cls,o={}){const role=o.role||S.role;const q=toMark();
 const weeks=[0,1,2,3,4].map(k=>{const a=cls.map(c=>clsAttWeeks(c)[k]).filter(x=>x!=null);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}).filter(x=>x!=null);
 const overall=weeks.length?weeks[weeks.length-1]:null;const delta=weeks.length>1?overall-weeks[weeks.length-2]:null;
 const hws=cls.map(clsHw);const hwE=hws.reduce((a,h)=>a+h.e,0),hwG=hws.reduce((a,h)=>a+h.g,0);
 const mkAll=q.filter(m=>cls.some(c=>c.id===taskById[m.task].cls)).length;const stN=cls.reduce((a,c)=>a+stOfCls(c).length,0),cap=cls.reduce((a,c)=>a+c.cap,0);
 return`<div class="ctab-wrap"><table class="ctab"><thead><tr><th>Class</th><th>Time</th><th>Progress</th><th class="num">Students</th><th class="col-att">Attendance <span>this week</span></th><th class="num" title="Current unit tasks handed in">Homework</th><th class="num">To mark</th><th>Today</th><th><span class="sr">Actions</span></th></tr></thead><tbody>
 ${cls.map((c,i)=>{const a=clsLastAtt(c),pa=clsPrevAtt(c),h=hws[i],mk=q.filter(m=>taskById[m.task].cls===c.id).length;return`<tr class="click" data-href="#/${role}/class/${c.id}">
  <td><div class="c-name">${lvChip(c.level,true)}<div><a href="#/${role}/class/${c.id}">${c.name}</a><span>${CAMPUS[c.campus].n} · ${c.room}</span></div></div></td>
  <td><div class="c-two"><b class="mono-b">${c.time}</b><span>${c.days}</span></div></td>
  <td><div class="c-two"><b>Unit ${c.unit} <em>of 12</em></b><div class="pbar sm"><i style="width:${Math.round(100*c.unit/12)}%"></i></div></div></td>
  <td class="num">${stOfCls(c).length}<em> / ${c.cap}</em></td>
  <td class="col-att"><div class="c-att"><b class="${tone(a)}">${a??'–'}%</b>${a!=null&&pa!=null?deltaChip(a-pa):''}</div><div class="abar sm"><i class="${tone(a)}" style="width:${a==null?0:attW(a)}%"></i><u style="left:${attW(85)}%"></u></div></td>
  <td class="num">${h.p??'–'}%</td>
  <td class="num">${mk?`<a class="cnt-link" href="#/${role}/class/${c.id}/marking" title="Open marking">${mk}</a>`:'<span class="muted">0</span>'}</td>
  <td>${todayCell(c,role)}</td>
  <td class="act"><a class="iconbtn" href="#/${role}/class/${c.id}/register" title="Register" aria-label="Register for ${c.name}">${ic('cal')}</a><a class="iconbtn" href="#/${role}/class/${c.id}/curriculum" title="Curriculum" aria-label="Curriculum for ${c.name}">${ic('book')}</a><button class="iconbtn" data-msg="${c.id}" title="Message class" aria-label="Message ${c.name}">${ic('msg')}</button></td></tr>`}).join('')}
 </tbody><tfoot><tr><td colspan="3"><b>All ${cls.length} classes</b></td><td class="num">${stN}<em> / ${cap}</em></td><td class="col-att"><div class="c-att"><b class="${tone(overall)}">${overall??'–'}%</b>${deltaChip(delta,' pts')}</div><span class="tiny">vs last week · target 85%</span></td><td class="num">${hwE?Math.round(100*hwG/hwE):'–'}%</td><td class="num">${mkAll}</td><td colspan="2"></td></tr></tfoot></table></div>`}
function wireClassTable(el){el.querySelectorAll('.ctab tr[data-href]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('a,button'))return;go(tr.dataset.href.slice(1))});el.querySelectorAll('.ctab [data-msg]').forEach(b=>b.onclick=e=>{e.stopPropagation();openMessage(null,clsById[b.dataset.msg])})}

T.home=function(page){
 const my=myClasses();const sts=my.flatMap(stOfCls);
 const q=toMark().filter(m=>my.some(c=>c.id===taskById[m.task].cls));const oldest=q.length?Math.max(...q.map(m=>m.submittedAgo)):0;
 const hws=my.map(clsHw);const hwE=hws.reduce((a,h)=>a+h.e,0),hwG=hws.reduce((a,h)=>a+h.g,0);const hwPct=hwE?Math.round(100*hwG/hwE):0;
 const risky=sts.map(s=>({s,r:risk(s)})).filter(x=>x.r&&x.r.lvl==='red');
 const low=sts.filter(s=>{const a=att8(s);return a!=null&&a<80});
 const byTask={};q.forEach(m=>{(byTask[m.task]=byTask[m.task]||[]).push(m)});
 const tasksQ=Object.entries(byTask).sort((a,b)=>oldestSub(taskById[b[0]])-oldestSub(taskById[a[0]]));
 const todo=[{i:'cal',t:'Register not taken',s:'B1+ Evening, Tue 8 Sep',fn:()=>go('/t/class/c2/register')},{i:'book',t:'Unit 6 not yet published',s:'B1 Morning reaches it on Sun 13 Sep',fn:()=>go('/t/curriculum')},{i:'msg',t:'2 replies from students',s:'Elif Demir, Mateus Silva',fn:()=>go('/t/messages')},{i:'flag',t:'Observation on 24 Sep',s:'Omar will observe B2 Morning',fn:()=>toast('Added to your calendar.')}].filter(x=>!S.done.has(x.t));
 const next=my.find(c=>TODAYSCHED[c.id]&&TODAYSCHED[c.id].k==='next');
 const el=content(page,`${head('Good morning, Sara',`<span>Thursday 10 September</span><span>·</span><span>Dubai JLT</span>`,`<button class="btn" id="msgc">${ic('msg')}Message a class</button><button class="btn primary" id="assign">${ic('plus')}Assign work<span class="k"><kbd>A</kbd></span></button>`)}
 <div class="statbar">
  ${kpi({label:'Classes today',icon:'cal',num:Object.keys(TODAYSCHED).length,href:'#/t/calendar',foot:next?`Next: <b style="color:var(--ink-2)">${next.name}</b> at ${TODAYSCHED[next.id].t}`:'All done for today'})}
  ${kpi({label:'Waiting to mark',icon:'mark',tone:'amber',num:q.length,href:'#/t/marking',foot:q.length?(oldest>=5?pill(`Oldest ${oldest} days`,'bad'):`Oldest ${ago(oldest)}`):'All caught up'})}
  ${kpi({label:'Homework handed in',icon:'write',tone:'teal',num:hwPct,unit:'%',href:'#/t/marking',viz:`<div class="pbar teal"><i style="width:${hwPct}%"></i></div>`,foot:`${hwG} of ${hwE} for current unit tasks`})}
  ${kpi({label:'Students to check',icon:'users',tone:'rose',num:risky.length,unit:`of ${sts.length}`,href:'#chkH',viz:avStack(risky.map(x=>x.s.name)),foot:risky.length?risky.slice(0,3).map(x=>x.s.name.split(' ')[0]).join(', ')+(risky.length>3?` and ${risky.length-3} more`:''):'Nobody flagged this week'})}
 </div>
 <section class="pn tablepn" aria-labelledby="myH"><div class="pn-h"><h3 id="myH">My classes</h3><span class="sub">${my.length} classes · ${sts.length} students · Unit ${my[0].unit} of 12</span><span class="end"><a class="link" href="#/t/classes">View all${ic('chev')}</a></span></div>
  ${classTable(my,{role:'t'})}
  <a class="pn-foot" href="#/t/class/${low[0]?low[0].cls:my[0].id}/students">${low.length} students under 80% attendance over the last 8 sessions${ic('chev')}</a></section>
 <div class="dash">
  <section class="pn s8" aria-labelledby="mkH"><div class="pn-h"><h3 id="mkH">Waiting to mark</h3><span class="sub">AZE has proposed a mark for each</span><span class="end"><a class="btn sm" href="#/t/marking">Open queue</a></span></div>
   <div class="pn-b"><div class="rows">${tasksQ.length?tasksQ.slice(0,4).map(([tid,ms])=>{const t=taskById[tid];const c=clsById[t.cls];const old=oldestSub(t);return`<div class="r"><span class="ti ${t.type}">${ic(TYPEICON[t.type])}</span><div class="r-t"><b>${t.title}</b><span>${c.name} · Unit ${t.unit} · ${ms.length} waiting</span></div>${pill(`${old} days`,old>=5?'bad':'neutral')}<a class="btn sm primary" href="#/t/mark/${t.id}">Mark</a></div>`}).join(''):'<div class="empty"><b>Nothing to mark</b>New submissions land here as students finish.</div>'}</div></div></section>
  <section class="pn s4" aria-labelledby="wkH"><div class="pn-h"><h3 id="wkH">This week</h3><span class="sub">${my[0].name} · Unit ${my[0].unit}</span></div>
   <div class="pn-b">${weekRows(my[0],false).map(x=>`<a class="wrow" href="${x.href}"><time>${x.d}</time><span>${x.label}</span>${rowPill(x.status)}</a>`).join('')}</div></section>
 </div>
 <div class="dash">
  <section class="pn s6" aria-labelledby="chkH"><div class="pn-h"><h3 id="chkH">Students to check on</h3><span class="sub">Two or more warning signs</span></div>
   <div class="pn-b"><div class="rows">${risky.length?risky.slice(0,4).map(x=>`<a class="r" href="#/t/student/${x.s.id}"><span class="av" style="background:${avCol(x.s.name)}">${ini(x.s.name)}</span><div class="r-t"><b>${x.s.name}</b><span>${clsById[x.s.cls].name} · ${x.r.reasons.slice(0,2).join(' · ')}</span></div>${pill('At risk','bad')}</a>`).join(''):'<div class="empty"><b>Nobody flagged</b></div>'}</div></div></section>
  <section class="pn s6" aria-labelledby="tdH"><div class="pn-h"><h3 id="tdH">To do</h3><span class="sub">${todo.length} open</span></div>
   <div class="pn-b"><div class="rows" id="todo">${todo.length?todo.map((x,i)=>`<div class="r click" data-i="${i}" tabindex="0"><span class="ico">${ic(x.i)}</span><div class="r-t"><b>${x.t}</b><span>${x.s}</span></div><button class="iconbtn rowact" data-dis="${x.t}" title="Dismiss" aria-label="Dismiss">${ic('x')}</button></div>`).join(''):'<div class="empty"><b>Nothing for now</b></div>'}</div></div></section>
 </div>`);
 wireClassTable(el);
 el.querySelector('#assign').onclick=()=>openAssign();el.querySelector('#msgc').onclick=()=>openMessage(null,my[0]);
 const kc=el.querySelector('a.kpi[href="#chkH"]');if(kc)kc.onclick=e=>{e.preventDefault();el.querySelector('#chkH').scrollIntoView({behavior:'smooth',block:'center'})};
 el.querySelectorAll('#todo .r').forEach(r=>{const f=e=>{if(e.target.closest('[data-dis]'))return;todo[+r.dataset.i].fn()};r.onclick=f;r.onkeydown=e=>{if(e.key==='Enter')f(e)}});
 el.querySelectorAll('[data-dis]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.done.add(b.dataset.dis);render()});
};
T.classes=function(page){const my=myClasses();const el=content(page,`${head('My classes',`${my.length} classes this term · Dubai JLT`,`<button class="btn primary" id="assign">${ic('plus')}Assign work</button>`)}
 <section class="pn tablepn" aria-label="My classes">${classTable(my,{role:'t'})}</section>`);
 el.querySelector('#assign').onclick=()=>openAssign();wireClassTable(el)};

STU.home=function(page){const s=curStudent();const c=clsById[s.cls];const t=stTeacher(s);const done=S.stuDone||{};
 const hw=tasksOfCls(c).filter(x=>x.verb!=='suggest'&&Math.abs(dayDiff(x.due))<=14).sort((a,b)=>a.due-b.due);
 const todoN=hw.filter(x=>['todo','missing','rev'].includes(hwStatus(x,s).k)).length;
 const due=tasksOfCls(c).filter(x=>x.verb!=='suggest'&&x.due<=addDays(TODAY,7));const sub=due.filter(x=>SUBS.find(m=>m.task===x.id&&m.student===s.id)).length;
 const wk=weekOf(s).filter(x=>x!=null);const att=attAll(s);const r=risk(s);
 const mins=done.pr?27:22;const acts=done.pr?3:2;
 const coach=r&&r.lvl==='red'?`Two homework tasks are waiting for you. Start with the writing task tonight; it takes about 20 minutes.`:s.sub.Writing<s.sub.Speaking?`Your speaking is ahead of your writing. Five minutes of past tense practice before Sunday will help your next email.`:`Your past tense verbs improved in Unit 4. Keep going: the Unit 5 speaking task closes on Thursday.`;

function ring2(parts,o={}){const R=48,C=2*Math.PI*R,sw=12;const tot=parts.reduce((a,p)=>a+p.v,0)||1;const gap=parts.filter(p=>p.v>0).length>1?3:0;let off=0;
 return`<svg class="ring2" viewBox="0 0 118 118" role="img" aria-label="${o.aria||''}"><circle cx="59" cy="59" r="${R}" style="fill:none;stroke:var(--surface-3);stroke-width:${sw}"/>${parts.map(p=>{if(!p.v)return'';const seg=C*p.v/tot;const s=`<circle cx="59" cy="59" r="${R}" transform="rotate(-90 59 59)" style="fill:none;stroke:${p.col};stroke-width:${sw};stroke-dasharray:${Math.max(.6,seg-gap).toFixed(2)} ${C.toFixed(2)};stroke-dashoffset:${(-off).toFixed(2)}"><title>${p.name}: ${p.v}</title></circle>`;off+=seg;return s}).join('')}<text x="59" y="63" text-anchor="middle" class="rb">${o.big}</text><text x="59" y="80" text-anchor="middle" class="rs">${o.sub||''}</text></svg>`}
function gauge(parts,o={}){const R=84,cx=110,cy=104,sw=18,gapDeg=12;const tot=parts.reduce((a,p)=>a+p.v,0)||1;const P=a=>[(cx+R*Math.cos(a*Math.PI/180)).toFixed(2),(cy-R*Math.sin(a*Math.PI/180)).toFixed(2)];let a0=180;let s=`<path d="M${P(180)} A${R} ${R} 0 0 1 ${P(0)}" style="fill:none;stroke:var(--surface-3);stroke-width:${sw};stroke-linecap:round"/>`;
 const live=parts.filter(p=>p.v>0);if(live.length)s='';
 live.forEach((p,i)=>{const span=180*p.v/tot;let st=a0-(i?gapDeg/2:0),en=a0-span+(i<live.length-1?gapDeg/2:0);if(en>st){const m=(a0+a0-span)/2;st=m;en=m}const [x1,y1]=P(st),[x2,y2]=P(en);s+=`<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" style="fill:none;stroke:${p.col};stroke-width:${sw};stroke-linecap:round"><title>${p.name}: ${p.v}</title></path>`;a0-=span});
 return`<svg class="gauge" viewBox="0 0 220 124" role="img" aria-label="${o.aria||''}">${s}<text x="${cx}" y="${cy-14}" text-anchor="middle" class="gb">${o.big}</text><text x="${cx}" y="${cy+8}" text-anchor="middle" class="gs">${o.sub||''}</text></svg>`}
function barcode(vals,o={}){const mn=o.min??0,mx=o.max??Math.max(1,...vals);const n=vals.length;const hi=o.hi??n-1;const hp=v=>Math.max(4,(Math.min(mx,Math.max(mn,v))-mn)/(mx-mn)*88);
 const pts=vals.map((v,i)=>[(i+.5)/n*100,100-hp(v)]);const tipL=Math.max(12,Math.min(88,(hi+.5)/n*100));
 return`<div class="bc" style="height:${o.h||130}px" role="img" aria-label="${o.aria||''}"><div class="bc-bars">${vals.map((v,i)=>`<i class="${i===hi?'hi':o.color?o.color(v,i):''}" style="height:${hp(v)}%" title="${esc(o.label?o.label(v,i):String(v))}"></i>`).join('')}</div><svg class="bc-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${smooth(pts)}" style="fill:none;stroke:var(--indigo);stroke-width:2;vector-effect:non-scaling-stroke;opacity:.4"/></svg>${o.tip?`<div class="bc-tip" style="left:${tipL}%;bottom:${hp(vals[hi])}%">${o.tip}</div>`:''}</div>${o.axis?`<div class="bc-ax">${o.axis.map(a=>`<span>${a}</span>`).join('')}</div>`:''}`}
const stackAv=(names,max=5)=>`<span class="stackav">${names.slice(0,max).map(n=>`<span style="background:${avCol(n)}" title="${esc(n)}">${ini(n)}</span>`).join('')}${names.length>max?`<span class="more">+${names.length-max}</span>`:''}</span>`;
function attCard(o){const K=lastWeekIdx(o.sts);const cur=attCounts(o.sts,K*4,K*4+4);const prev=K>0?attCounts(o.sts,(K-1)*4,K*4):null;const d=prev&&cur.pct!=null&&prev.pct!=null?cur.pct-prev.pct:null;

 const weekStart=addDays(TODAY,-TODAY.getDay());const days=[...Array(7)].map((_,i)=>addDays(weekStart,i));S.wkSel=S.wkSel??TODAY.getDay();
 const dayRows=d=>{const nm=d.toLocaleDateString('en-GB',{weekday:'short'});const isToday=d.toDateString()===TODAY.toDateString();const past=d<TODAY&&!isToday;
  return my.filter(c=>classDays(c).includes(nm)).sort((a,b)=>a.time.localeCompare(b.time)).map(c=>{const cd=lessonCodeOn(c,d);const k=isToday?(TODAYSCHED[c.id]||{}).k:'';const st=past||k==='done'?pill('Done','ok','check'):k==='next'?pill('Next','violet'):isToday?pill('Later','neutral'):'';
  return`<a class="srow" href="${unitHref(c.unit,c,'lesson',cd)}"><time>${c.time}</time><i class="sdot ${past||k==='done'?'done':k==='next'?'next':''}"></i><div class="st"><b>${c.name}</b><span>Lesson ${c.unit}${cd} · ${LTITLE[cd]} · ${c.room}</span></div>${st}</a>`}).join('')||'<div class="empty"><b>No classes</b>Weekend in Dubai.</div>'};
 const chkHtml=()=>{const done=todoAll.filter(x=>S.done.has(x.t)).length;return`<div class="chk-prog"><span>${done} of ${todoAll.length} done</span><div class="pbar"><i style="width:${Math.round(100*done/todoAll.length)}%"></i></div></div><div class="chk">${todoAll.map((x,i)=>`<div class="chk-i ${S.done.has(x.t)?'done':''}"><button class="tick" data-tick="${i}" aria-label="${S.done.has(x.t)?'Mark as not done':'Mark as done'}" aria-pressed="${S.done.has(x.t)}">${ic('check')}</button><div class="r-t" data-go="${i}"><b>${x.t}</b><span>${x.s}</span></div><span class="go">${ic('chev')}</span></div>`).join('')}</div>`};

 <div class="bento">

  ${attCard2({cls:'s4',scope:'My 3 classes',sts,caps:my.map(c=>{const v=clsLastAtt(c);return{label:c.name.split(' ')[0],sub:c.name.split(' ').slice(1).join(' '),title:c.name,v,tone:aTone(v),href:`#/t/class/${c.id}/register`}}),foot:low.length?`<a class="pn-foot" href="#/t/class/${low[0].cls}/students">${low.length} students under 80%${ic('chev')}</a>`:''})}

  <section class="pn s4" aria-labelledby="gmH"><div class="pn-h"><h3 id="gmH">Marking</h3><span class="sub">Unit ${my[0].unit}</span></div>

   <a class="btn primary big-cta" href="#/t/marking">${ic('mark')}Start marking</a></div></section>
 </div>

 <section class="pn tablepn" aria-labelledby="myH"><div class="pn-h"><h3 id="myH">My classes</h3><span class="sub">${my.length} classes · ${sts.length} students</span><span class="end"><a class="link" href="#/t/classes">View all${ic('chev')}</a></span></div>${classTable(my,{role:'t'})}</section>

 <div class="bento">

 el.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.wkSel=+b.dataset.day;el.querySelectorAll('[data-day]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on)});el.querySelector('#wkBody').innerHTML=dayRows(days[S.wkSel])});
