<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yesterday, today, tomorrow - Learning Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   Yesterday, today, tomorrow - prototype 9 (rebuild)
   One sky card. Fatima tells her story, cropped big. The sun is the
   time slider; three landmarks sit on the horizon: Riyadh (sepia,
   yesterday), Dubai (ink, today), London (dashed, tomorrow).
   Magnet tiles snap into "I ___ in a shop." Blobert clears a wrong
   tile with the broom. Then the learner says all three lines.
   Cast art is Open Peeps / Open Doodles, inlined, never redrawn.
   --------------------------------------------------------------- */
:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink); --line:var(--ink);
  --block:var(--sky);
  --btn-bg:var(--ink); --btn-fg:var(--cream);
  --sepia:#C9A981; --sepia-line:#6A4E35;
  --spring:cubic-bezier(.2,1.4,.4,1);
  --ease:cubic-bezier(.2,.8,.3,1);
}
html[data-theme="dark"]{
  --page:#121212; --on-page:#FFF7E8; --line:#FFF7E8;
  --btn-bg:#FFF7E8; --btn-fg:#121212;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--page);color:var(--on-page);
  font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:600;
  transition:background-color .3s var(--ease),color .3s var(--ease);
}
.app{
  position:relative;display:flex;flex-direction:column;
  width:100%;max-width:430px;margin:0 auto;height:100dvh;max-height:100dvh;
  padding:14px 16px 18px;gap:12px;overflow:hidden;
}

/* ---------- top row: back, three progress segments, theme ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;height:44px}
.icon-btn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);
  cursor:pointer;transition:transform .2s var(--spring);
}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;display:block}
.icon-btn .moon,.icon-btn .sunic{display:none}
html[data-theme="light"] .icon-btn .moon{display:block}
html[data-theme="dark"] .icon-btn .sunic{display:block}
.segs{flex:1;display:flex;gap:6px;height:14px}
.seg{flex:1;border-radius:999px;border:3px solid var(--line);overflow:hidden;background:transparent}
.seg i{display:block;height:100%;width:0;background:var(--line);border-radius:999px;transition:width .38s var(--spring)}

/* ---------- the card ---------- */
.card{
  position:relative;flex:1 1 auto;min-height:0;
  background:var(--block);border:3px solid var(--ink);border-radius:28px;
  padding:20px 20px 0;color:var(--ink);overflow:hidden;
  animation:cardIn .4s var(--spring) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.head{position:relative;z-index:3;padding-right:44px}
h1{margin:0;font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.sub{margin:5px 0 0;font-size:17px;font-weight:600;line-height:1.3;min-height:22px}
.pop{animation:pop .34s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- the sky: sun slider and horizon ---------- */
.sky{position:relative;z-index:2;height:128px;margin:10px -4px 0;touch-action:none;user-select:none}
.sky svg.horizon{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.arc{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 9;opacity:.55}
.ground{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.lm{transform-box:fill-box;transform-origin:50% 100%;transition:transform .34s var(--spring),opacity .3s var(--ease)}
.lm.on{transform:translateY(-6px) scale(1.08)}
.lm .f{fill:var(--ink)}
.lm .o{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
/* yesterday: an old photograph */
.lm-0 .f{fill:var(--sepia)}
.lm-0 .o{stroke:var(--sepia-line)}
/* tomorrow: not drawn yet */
.lm-2 .o{stroke-dasharray:6 5}
.lm-2 .f{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:6 5;stroke-linejoin:round}
.lm.done .o,.lm-2.done .f{stroke-dasharray:none}
.lm-2.done .f{fill:var(--ink)}
.lm-0.done .f{fill:var(--ink)}
.lm-0.done .o{stroke:var(--ink)}
.knob{
  position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;
  padding:0;border:0;background:transparent;cursor:grab;border-radius:999px;
  transition:left .36s var(--spring),top .36s var(--spring);
}
.knob.drag{transition:none;cursor:grabbing}
.knob svg{width:100%;height:100%;display:block;overflow:visible}
.knob .disc{fill:var(--sun);stroke:var(--ink);stroke-width:3}
.knob .ray{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.knob .rays{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.knob.hop svg{animation:hop .34s var(--spring) both}
@keyframes hop{0%{transform:scale(.84)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.knob:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- the sentence with the gap ---------- */
.line{
  position:relative;z-index:3;margin:8px 0 0;text-align:center;
  font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;
}
.gap{
  position:relative;display:inline-grid;place-items:center;vertical-align:bottom;
  min-width:96px;height:36px;padding:0 4px;margin:0 2px;
  transition:min-width .34s var(--spring);
}
.gap::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:999px;background:var(--ink);opacity:.35;
  transition:opacity .2s var(--ease);
}
.gap.waiting::after{animation:waiting 1.6s ease-in-out infinite}
@keyframes waiting{0%,100%{opacity:.35}50%{opacity:.85}}
.gap.filled::after{opacity:0}
.gap .word{display:inline-block;animation:land .34s var(--spring) both}
@keyframes land{from{transform:translateY(-8px) scale(1.16)}to{transform:none}}
.gap .ghost{opacity:.38}

/* ---------- Fatima: cropped big, front and centre ---------- */
.scene{
  position:absolute;z-index:1;left:50%;bottom:-132px;width:520px;height:520px;margin-left:-300px;
  pointer-events:none;transform-origin:50% 80%;
  transition:transform .42s var(--spring);animation:popIn .5s var(--spring) both;
}
@keyframes popIn{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.card[data-face="think"] .scene{transform:translateX(-6px) rotate(-2deg)}
.card[data-face="wow"] .scene{transform:translateY(-8px) scale(1.04)}
.card[data-face="listen"] .scene{transform:translateY(8px) scale(1.06) rotate(-2deg)}
.card[data-face="happy"] .scene{transform:translateY(-6px) scale(1.03)}
.breathe{width:100%;height:100%;animation:breathe 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012)}}
.face{position:absolute;inset:0;opacity:0}
.face.on{opacity:1}
.art{width:100%;height:100%;display:block}

/* ---------- stickers ---------- */
.stick{position:absolute;z-index:4;color:var(--ink);pointer-events:none}
.stick svg{display:block}
.tw{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}42%{transform:scale(1.2) rotate(11deg)}68%{transform:scale(.93) rotate(-5deg)}}
.s-star{top:18px;right:18px}
.s-squig{bottom:150px;right:14px;animation-delay:1.1s}
.burst{position:absolute;z-index:5;width:72px;height:72px;color:var(--ink);pointer-events:none;opacity:0}
.burst svg{width:100%;height:100%;display:block}
.burst.go{animation:burst .55s var(--spring) both}
@keyframes burst{0%{opacity:0;transform:scale(.3) rotate(-30deg)}55%{opacity:1;transform:scale(1.16) rotate(10deg)}100%{opacity:0;transform:scale(1.3) rotate(16deg) translateY(-10px)}}

/* what the learner said */
.bubble{
  position:absolute;z-index:4;right:14px;bottom:70px;max-width:62%;
  background:var(--cream);border:3px solid var(--ink);border-radius:20px 20px 6px 20px;
  padding:8px 13px;font-size:17px;font-weight:700;line-height:1.25;text-align:center;
  animation:pop .3s var(--spring) both;
}

/* ---------- the slot under the card: tiles, bars or the typed field ---------- */
.slot{flex:none;height:84px;display:flex;align-items:center;justify-content:center}
.rail{display:flex;gap:10px;justify-content:center;align-items:center;width:100%}
.tile{
  font-family:inherit;font-size:17px;font-weight:700;padding:0 18px;height:50px;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);
  cursor:pointer;white-space:nowrap;animation:pop .34s var(--spring) both;
  transition:transform .18s var(--spring),opacity .22s var(--ease);
}
.tile:nth-child(2){animation-delay:.06s}
.tile:nth-child(3){animation-delay:.12s}
.tile:active{transform:scale(.94)}
.tile.used{opacity:.26;pointer-events:none}
.tile.nudge{animation:nudge .5s var(--spring) both}
@keyframes nudge{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1)}}
.fly{
  position:fixed;z-index:30;pointer-events:none;display:grid;place-items:center;margin:0;
  font-family:inherit;font-weight:800;border:3px solid var(--line);border-radius:999px;
  background:var(--page);color:var(--on-page);
}
/* three ink bars */
.bars{width:100%;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;padding:0 6px}
.bars b{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.bars .bar{height:14px;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bars .bar i{display:block;height:100%;width:0;background:var(--line);border-radius:999px;transition:width .45s var(--spring)}
.bars .bar:nth-of-type(2) i{transition-delay:.06s}
.bars .bar:nth-of-type(3) i{transition-delay:.12s}
/* typed fallback */
.typed{display:flex;gap:8px;width:100%}
.typed input{
  flex:1;font-family:inherit;font-size:17px;font-weight:700;height:52px;padding:0 18px;min-width:0;
  border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--on-page);
}
.typed input::placeholder{color:var(--on-page);opacity:.42}

/* ---------- the one button, plus the always-visible typed icon ---------- */
.cta{flex:none;display:flex;gap:10px;align-items:center}
.btn{
  flex:1;font-family:inherit;font-size:17px;font-weight:700;height:56px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border:0;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;
  transition:transform .22s var(--spring),opacity .3s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.26;pointer-events:none}
.btn.ready{animation:ready .4s var(--spring) both}
@keyframes ready{from{transform:scale(.94)}60%{transform:scale(1.04)}to{transform:scale(1)}}
.btn svg{width:22px;height:22px;display:block}
.btn .dots i{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:999px;background:var(--btn-fg);animation:listen 1s ease-in-out infinite}
.btn .dots i:nth-child(2){animation-delay:.15s}
.btn .dots i:nth-child(3){animation-delay:.3s}
@keyframes listen{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-5px);opacity:1}}
.key-btn{width:56px;height:56px}
.key-btn svg{width:24px;height:24px}
.key-btn[aria-pressed="true"]{background:var(--line);color:var(--page)}
.link{background:none;border:0;padding:4px 8px;font-family:inherit;font-size:17px;font-weight:700;color:var(--on-page);opacity:.72;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- the end card: mint, a full-body doodle ---------- */
.card.done{background:var(--mint);padding:24px 22px 0}
.card.done .head{padding-right:0}
.card.done h1{font-size:40px}
.card.done .sub{font-size:18px;margin-top:8px;max-width:290px}
.doodle{
  position:absolute;z-index:1;right:-36px;bottom:-14px;width:430px;height:430px;pointer-events:none;
  animation:popIn .5s var(--spring) .12s both;
}
.doodle .sway{width:100%;height:100%;animation:sway 3.2s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-4px)}}
.d-star{top:112px;right:26px}
.d-heart{top:250px;left:24px;animation-delay:1.4s}
.d-squig{top:170px;right:28px;animation-delay:.7s}

/* ---------- Blobert ---------- */
.blob{position:fixed;z-index:40;width:176px;height:162px;left:0;top:0;pointer-events:none;opacity:0}
.blob svg{width:100%;height:100%;display:block;overflow:visible}
#bl-body > path:first-child{fill:var(--block)}
#bl-arm-left circle,#bl-arm-right circle{fill:var(--block)}
#bl-body{transform-box:fill-box;transform-origin:50% 100%;animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.04) scaleY(.97)}}
#bl-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.4s ease-in-out infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#bl-arm-right,#bl-broom{transform-box:view-box;transform-origin:184px 120px}
#bl-stars{opacity:0}
.blob.sweep #bl-arm-right,.blob.sweep #bl-broom{animation:sweep .34s ease-in-out both}
@keyframes sweep{0%{transform:rotate(40deg)}50%{transform:rotate(118deg)}100%{transform:rotate(80deg)}}
.blob.crane #bl-arm-right,.blob.crane #bl-broom{animation:crane .36s var(--ease) both}
@keyframes crane{0%{transform:rotate(0)}40%{transform:rotate(112deg)}100%{transform:rotate(-20deg)}}
.blob.flick #bl-arm-right,.blob.flick #bl-broom{animation:flick .3s var(--ease) both}
@keyframes flick{0%{transform:rotate(110deg)}60%{transform:rotate(-50deg)}100%{transform:rotate(-20deg)}}
.blob.eat #bl-mouth{transform-box:fill-box;transform-origin:50% 30%;animation:chomp .32s ease-in-out both}
@keyframes chomp{0%{transform:scale(1)}40%{transform:scale(1.5,2.2)}70%{transform:scale(1.1,1.4)}100%{transform:scale(1)}}
.blob.eat #bl-stars{animation:burp .4s var(--ease) .3s both}
@keyframes burp{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.blob.wave #bl-arm-left{transform-box:view-box;transform-origin:62px 128px;animation:wave .16s ease-in-out 2 alternate}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-28deg)}}

/* ---------- focus and motion preferences ---------- */
:focus{outline:none}
:focus-visible{outline:3px solid var(--line);outline-offset:3px;border-radius:999px}
.card :focus-visible{outline-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .tw,.breathe,.knob .rays,.gap.waiting::after,.btn .dots i,#bl-body,#bl-eyes,.doodle .sway{animation:none!important}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="top">
    <button class="icon-btn" id="backBtn" aria-label="Back to the lesson">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <div class="segs" role="progressbar" aria-label="Progress in this exercise" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="segs">
      <div class="seg"><i></i></div><div class="seg"><i></i></div><div class="seg"><i></i></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Dark mode" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      <svg class="sunic" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/></g></svg>
    </button>
  </div>

  <!-- the sky card -->
  <div class="card" id="card" data-face="idle">
    <div class="head">
      <h1 id="title">Yesterday, today, tomorrow</h1>
      <p class="sub" id="sub" aria-live="polite">Drag the sun. Pick the word.</p>
    </div>

    <!-- the sentence with the gap -->
    <p class="line" id="line" aria-live="polite">I <span class="gap waiting" id="gap"></span> in a shop.</p>

    <!-- the sun on its arc, the horizon with three landmarks -->
    <div class="sky" id="sky">
      <svg class="horizon" id="horizon" viewBox="0 0 320 128" preserveAspectRatio="none" aria-hidden="true">
        <path class="arc" id="arc" d="M44 44 Q160 -16 276 44"/>
        <path class="ground" d="M8 120 H312"/>
        <!-- yesterday: Riyadh, a tower with an arch, in sepia -->
        <g class="lm lm-0" id="lm-0">
          <path class="f" fill-rule="evenodd" d="M30 120 V88 Q30 64 44 64 Q58 64 58 88 V120 Z M38 120 V100 Q44 90 50 100 V120 Z"/>
          <path class="o" d="M30 120 V88 Q30 64 44 64 Q58 64 58 88 V120 M38 120 V100 Q44 90 50 100 V120"/>
        </g>
        <!-- today: Dubai, a tapering tower in full ink -->
        <g class="lm lm-1" id="lm-1">
          <path class="f" d="M160 52 L163 68 L166 68 L168 86 L173 86 L176 104 L182 104 L184 120 H136 L138 104 H144 L147 86 H152 L154 68 H157 Z"/>
          <path class="o" d="M160 52 L163 68 L166 68 L168 86 L173 86 L176 104 L182 104 L184 120 H136 L138 104 H144 L147 86 H152 L154 68 H157 Z"/>
        </g>
        <!-- tomorrow: London, a wheel still to be drawn -->
        <g class="lm lm-2" id="lm-2">
          <path class="f" d="M276 74 m-20 0 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0 Z"/>
          <path class="o" d="M276 74 V54 M276 74 V94 M276 74 H256 M276 74 H296 M276 74 L262 60 M276 74 L290 88 M276 74 L290 60 M276 74 L262 88 M276 74 L262 120 M276 74 L290 120"/>
        </g>
      </svg>
      <button class="knob" id="knob" role="slider" aria-label="Time" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" aria-valuetext="Today">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g class="rays"><path class="ray" d="M24 3v6M24 39v6M3 24h6M39 24h6M9.2 9.2l4.2 4.2M34.6 34.6l4.2 4.2M38.8 9.2l-4.2 4.2M13.4 34.6l-4.2 4.2"/></g>
          <circle class="disc" cx="24" cy="24" r="12"/>
        </svg>
      </button>
    </div>

    <!-- Fatima -->

    if (gag === "eat") { left = tr.left + tr.width / 2 - bw / 2 + (fromRight ? 8 : -8); top = tr.top - 124; }
    blob.style.left = left + "px"; blob.style.top = top + "px";
    blob.className = "blob " + gag;
    var fromX = fromRight ? -120 : 120;
    var enter = blob.animate([
      { opacity: 0, transform: flip + "translate(" + (-fromX) + "px,16px) scale(.8)" },
      { opacity: 1, transform: flip + "translate(0,0) scale(1)" }
    ], { duration: reduced ? 120 : 170, easing: reduced ? "ease-out" : SPRING, fill: "forwards" });
    var tileAnim;
    enter.onfinish = function () {
      // the gag: 340 ms
      var k;
      var d = fromRight ? 1 : -1;
      if (gag === "crane") k = [{ transform: "none" }, { transform: "translateY(-6px)", offset: .3 }, { transform: "translate(" + 60 * d + "px,-90px) rotate(" + 10 * d + "deg)", opacity: 1, offset: .75 }, { transform: "translate(" + 140 * d + "px,-150px) rotate(" + 16 * d + "deg)", opacity: 0 }];
      else if (gag === "sweep") k = [{ transform: "none" }, { transform: "translate(" + 30 * d + "px,0) rotate(" + 8 * d + "deg)", offset: .35 }, { transform: "translate(" + 220 * d + "px,-10px) rotate(" + 40 * d + "deg)", opacity: 1, offset: .8 }, { transform: "translate(" + 320 * d + "px,-20px) rotate(" + 60 * d + "deg)", opacity: 0 }];
      else if (gag === "flick") k = [{ transform: "none" }, { transform: "translateY(-30px) rotate(-10deg)", offset: .3 }, { transform: "translateY(-260px) rotate(-40deg)", opacity: 1, offset: .8 }, { transform: "translateY(-420px) rotate(-60deg)", opacity: 0 }];
      else k = [{ transform: "none", opacity: 1 }, { transform: "translateY(-40px) scale(.8)", offset: .45 }, { transform: "translateY(-70px) scale(.1)", opacity: 0 }];
      tileAnim = tile.animate(k, { duration: reduced ? 200 : 340, delay: 60, easing: "cubic-bezier(.4,0,.6,1)", fill: "forwards" });
      tileAnim.onfinish = function () {
        blob.classList.add("wave");
        setTimeout(function () {
          var out = blob.animate([
            { opacity: 1, transform: flip + "translate(0,0) scale(1)" },
            { opacity: 0, transform: flip + "translate(" + (-fromX) + "px,10px) scale(.86)" }
          ], { duration: 150, easing: "ease-in", fill: "forwards" });
          out.onfinish = function () {
            blob.className = "blob";
            // the tile comes back, calmly
            tileAnim.cancel();
            tile.style.animation = "none"; void tile.offsetWidth; tile.style.animation = "";
            done();
          };
        }, 150);
      };
    };
  }

  // ---------- speech: she says the line, the learner says it back ----------
  var synth = window.speechSynthesis || null;
  var talkTimer = null;
  function speak(text, rate, done) {
    var dur = Math.max(1200, text.length * 85) / rate;
    var on = false;
    clearInterval(talkTimer);
    talkTimer = setInterval(function () { on = !on; setFace(on ? "talk" : FACES[t]); }, 150);
    var finish = function () { clearInterval(talkTimer); restFace(); if (done) done(); };
    var timer = setTimeout(finish, dur);
    if (synth && synth.speak) {
      try {
        synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-GB"; u.rate = rate;
        u.onend = function () { clearTimeout(timer); finish(); };
        synth.speak(u);
      } catch (e) {}
    }
  }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var rec = null;
  function listen(onText, onFail) {
    if (!SR) { onFail(); return; }
    try {
      rec = new SR(); rec.lang = "en-GB"; rec.interimResults = false; rec.maxAlternatives = 1;
      var got = false;
      rec.onresult = function (e) { got = true; onText(e.results[0][0].transcript); };
      rec.onerror = function () { if (!got) onFail(); };
      rec.onend = function () { if (!got) onFail(); };
      rec.start();
    } catch (e) { onFail(); }
  }
  function norm(s) { return s.toLowerCase().replace(/[^a-z' ]+/g, " ").trim().split(/\s+/).filter(Boolean); }
  function bigrams(s) { var a = s.replace(/\s+/g, ""); var o = {}; for (var i = 0; i < a.length - 1; i += 1) o[a.substr(i, 2)] = (o[a.substr(i, 2)] || 0) + 1; return o; }
  function score(saidText, target) {
    var sw = norm(saidText), tw = norm(target);
    var hit = 0; tw.forEach(function (w) { if (sw.indexOf(w) >= 0) hit += 1; });
    var words = tw.length ? hit / tw.length : 0;
    var a = bigrams(sw.join(" ")), b = bigrams(tw.join(" ")), inter = 0, na = 0, nb = 0, k;
    for (k in a) { na += a[k]; if (b[k]) inter += Math.min(a[k], b[k]); }
    for (k in b) nb += b[k];
    var sounds = (na + nb) ? 2 * inter / (na + nb) : 0;
    var rhythm = tw.length ? Math.max(0, 1 - Math.abs(sw.length - tw.length) / tw.length) : 0;
    return [Math.min(1, sounds + .05), Math.min(1, rhythm), words];
  }
  function showBars(s) {
    rail.hidden = true; typed.hidden = true; bars.hidden = false;
    requestAnimationFrame(function () {
      for (var i = 0; i < 3; i += 1) $("b" + i).style.width = Math.round(Math.max(.08, s[i]) * 100) + "%";
    });
  }

  // ---------- the button ----------
  function setButton(label, icon, enabled) {
    btnLabel.textContent = label;
    btnIcon.innerHTML = icon === "mic"
      ? '<svg viewBox="0 0 24 24"><rect x="8.2" y="1.8" width="7.6" height="13" rx="3.8" fill="currentColor"/><path d="M4.8 11.2a7.2 7.2 0 0 0 14.4 0M12 18.4V22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>'
      : icon === "dots" ? '<span class="dots"><i></i><i></i><i></i></span>'
      : icon === "go" ? '<span style="font-size:22px;line-height:1">&raquo;</span>' : "";
    mainBtn.disabled = !enabled;
    if (enabled && !reduced) { mainBtn.classList.remove("ready"); void mainBtn.offsetWidth; mainBtn.classList.add("ready"); }
  }

  // ---------- phase A: build the three sentences ----------
  function pickTile(tile) {
    if (phase !== "build" || busy) return;
    var want = Number(tile.dataset.t);
    if (built[want]) return;
    busy = true;
    if (want === t) {
      flyTile(tile, function () {
        built[t] = true;
        $("lm-" + t).classList.add("done");
        setFace("happy");
        setProgress();
        var r = gap.getBoundingClientRect(), c = card.getBoundingClientRect();
        popSticker(r.right - c.left - 10, r.top - c.top - 60);
        sub.textContent = sentence(t);
        tiles.forEach(function (x) { x.classList.remove("nudge"); });
        busy = false;
        var left = [0, 1, 2].filter(function (i) { return !built[i]; });
        if (!left.length) { setTimeout(startSay, 900); }
        else {
          faceTimer = setTimeout(function () {
            restFace();
            sub.textContent = "Now drag the sun to " + TIMES[left[0]].toLowerCase() + ".";
          }, 1100);
        }
      });
    } else {
      // a miss: Blobert clears it, then the calm correction
      setFace("oops");
      blobertGag(tile, function () {
        gap.innerHTML = "";
        var g = document.createElement("span"); g.className = "word ghost"; g.textContent = WORDS[t]; gap.appendChild(g);
        gap.classList.remove("waiting");
        sub.textContent = TIMES[t] + ": " + sentence(t);
        var right = tiles[t];
        right.classList.remove("nudge"); void right.offsetWidth; right.classList.add("nudge");
        speak(sentence(t), .75, function () { busy = false; });
        busy = false;
      });
    }
  }
  tiles.forEach(function (tile) { tile.addEventListener("click", function () { pickTile(tile); }); });

  // ---------- phase B: say all three ----------
  var sayIndex = 0;
  function startSay() {
    phase = "say";
    knob.setAttribute("aria-disabled", "true");
    sayIndex = 0;
    tries = 0;
    rail.hidden = true;
    $("title").textContent = "Now say it";
    $("title").classList.remove("pop"); void $("title").offsetWidth; $("title").classList.add("pop");
    nextSay();
  }
  function nextSay() {
    bubble.hidden = true;
    bars.hidden = true; typed.hidden = true;
    keyBtn.setAttribute("aria-pressed", "false");
    t = sayIndex; placeSun(t); setLabels(t);
    gap.innerHTML = ""; gap.classList.add("filled"); gap.classList.remove("waiting");
    var w = document.createElement("span"); w.className = "word"; w.textContent = WORDS[t]; gap.appendChild(w);
    sub.textContent = "Listen, then say it.";
    setButton("Say it", "mic", false);
    busy = true;
    speak(sentence(t), 1, function () {
      sub.textContent = TIMES[t] + ". Your turn.";
      setButton("Say it", "mic", true);
      busy = false;
      mainBtn.focus({ preventScroll: true });
    });
  }
  function startListening() {
    if (phase !== "say" || busy) return;
    busy = true;
    setFace("listen");
    setButton("Listening", "dots", false);
    sub.textContent = "I'm listening.";
    listen(function (text) { judge(text); }, function () {
      // no mic: fall to the typed field, with the icon pressed
      busy = false;
      restFace();
      openTyped();
    });
  }
  function openTyped() {
    if (phase !== "say") return;
    bars.hidden = true; rail.hidden = true; typed.hidden = false;
    keyBtn.setAttribute("aria-pressed", "true");
    setButton("Check", "go", true);
    sub.textContent = "Type it, then check.";
    typedIn.value = "";
    typedIn.focus({ preventScroll: true });
  }
  function judge(text) {
    busy = true;
    var s = score(text, sentence(t));
    var avg = (s[0] + s[1] + s[2]) / 3;
    bubble.textContent = text; bubble.hidden = false;
    typed.hidden = true; keyBtn.setAttribute("aria-pressed", "false");
    showBars(s);
    tries += 1;
    if (avg >= .6 || tries >= 2) {
      said[t] = true; setProgress();
      setFace(avg >= .85 ? "wow" : "happy");
      sub.textContent = avg >= .85 ? "Lovely." : "Nice.";
      var c = card.getBoundingClientRect();
      popSticker(c.width - 110, 120);
      setButton(avg >= .85 ? "Lovely" : "Nice", "", false);
      setTimeout(function () {
        sayIndex += 1; tries = 0;
        if (sayIndex > 2) finish(); else nextSay();
      }, 1600);
    } else {
      setFace("listen");
      sub.textContent = "Nearly. Listen again.";
      setButton("Say it", "mic", false);
      setTimeout(function () {
        speak(sentence(t), .75, function () {
          sub.textContent = "Once more.";
          setButton("Say it", "mic", true);
          busy = false;
        });
      }, 700);
    }
  }
  mainBtn.addEventListener("click", function () {
    if (phase === "say") {
      if (!typed.hidden) { if (typedIn.value.trim()) judge(typedIn.value.trim()); else typedIn.focus(); }
      else startListening();
    } else if (phase === "done") {
      $("title").textContent = "Next lesson";
    }
  });
  typed.addEventListener("submit", function (e) { e.preventDefault(); if (typedIn.value.trim()) judge(typedIn.value.trim()); });
  keyBtn.addEventListener("click", function () {
    if (phase !== "say" || (busy && typed.hidden)) return;
    if (typed.hidden) { if (rec) { try { rec.abort(); } catch (e) {} } openTyped(); }
    else { typed.hidden = true; keyBtn.setAttribute("aria-pressed", "false"); setButton("Say it", "mic", true); sub.textContent = TIMES[t] + ". Your turn."; }
  });

  // ---------- the end card ----------
  function finish() {
    phase = "done";
    bars.hidden = true; bubble.hidden = true;
    card.innerHTML = "";
    card.appendChild($("doneTpl").content.cloneNode(true));
    card.className = "card done";
    card.removeAttribute("data-face");
    $("slot").innerHTML = '<button class="link" id="againBtn">Again</button>';
    $("againBtn").addEventListener("click", function () { location.reload(); });
    keyBtn.hidden = true;
    setButton("Next lesson", "go", true);
    mainBtn.focus({ preventScroll: true });
  }

  // ---------- tester hook ----------
  window.addEventListener("lp:auto", function (e) {
    var ok = !(e.detail && e.detail.correct === false);
    if (phase === "build") {
      if (built[t]) { var left = [0, 1, 2].filter(function (i) { return !built[i]; }); if (left.length) setTime(left[0], true); }
      if (ok) pickTile(tiles[t]);
      else { var wrong = [0, 1, 2].filter(function (i) { return i !== t && !built[i]; }); pickTile(tiles[wrong.length ? wrong[0] : (t + 1) % 3]); }
    } else if (phase === "say") {
      if (busy && typed.hidden) { clearInterval(talkTimer); if (synth) { try { synth.cancel(); } catch (x) {} } }
      judge(ok ? sentence(t) : "I shop");
    }
  });
  window.lpState = function () { return { phase: phase, t: t, built: built, said: said, progress: progress }; };

  // ---------- go ----------
  setProgress();
  setTime(1, false);
  requestAnimationFrame(function () { placeSun(t); });
})();
</script>
