<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Listen and pick</title>
<meta name="description" content="Learning Path prototype: Maya orders at the cafe, the learner taps what she asked for." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ---------- tokens (docs/design/brief.md) ---------- */
  :root {
    --sun: #FFD93D;
    --lilac: #CDB8FF;
    --tangerine: #FF5A2D;
    --mint: #A8F0C6;
    --sky: #BFE3FF;
    --ink: #121212;
    --cream: #FFF7E8;
    --paper: #FFFFFF;

    --page: var(--cream);
    --on-page: var(--ink);
    --focus: var(--ink);

    --spring: cubic-bezier(.2, 1.4, .4, 1);
    --r-card: 28px;
    --r-tile: 24px;
  }
  :root[data-theme="dark"] {
    --page: #121212;
    --on-page: #FFF7E8;
    --focus: #FFF7E8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--page);
    color: var(--on-page);
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    transition: background 240ms ease, color 240ms ease;
  }
  button { font-family: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 99px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- phone ---------- */
  .phone {
    position: relative;
    width: 390px; height: 844px; max-height: 100dvh;
    overflow: hidden;
    display: flex; flex-direction: column;
    padding: 18px 20px 22px;
  }

  /* ---------- top: three bar segments and the theme toggle ---------- */
  .top { display: flex; align-items: center; gap: 12px; height: 36px; flex: 0 0 auto; }
  .steps { display: flex; gap: 8px; flex: 1 1 auto; }
  .step {
    height: 12px; flex: 1 1 0; border-radius: 99px;
    border: 3px solid var(--on-page);
    position: relative; overflow: hidden;
  }
  .step::after {
    content: ""; position: absolute; inset: 0; background: var(--on-page);
    transform: scaleX(0); transform-origin: left;
    transition: transform 360ms var(--spring);
  }
  .step[data-state="now"]::after { transform: scaleX(.36); }
  .step[data-state="done"]::after { transform: scaleX(1); }

  .toggle {
    appearance: none; border: 3px solid var(--on-page); background: transparent;
    width: 48px; height: 36px; border-radius: 99px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    transition: transform 220ms var(--spring);
  }
  .toggle:active { transform: scale(.92); }
  .toggle svg { width: 18px; height: 18px; display: block; }
  :root[data-theme="light"] .toggle .i-sun { display: none; }
  :root[data-theme="dark"] .toggle .i-moon { display: none; }

  /* ---------- headline ---------- */
  .head { flex: 0 0 auto; margin-top: 12px; }
  h1 { margin: 0; font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -.025em; }
  .sub { margin: 6px 0 0; font-size: 16px; font-weight: 600; opacity: .74; }

  /* ---------- coach card (sky: listening) ---------- */
  .coach {
    flex: 0 0 auto; margin-top: 14px; position: relative;
    height: 250px; border-radius: var(--r-card);
    border: 3px solid var(--ink); background: var(--sky); color: var(--ink);
    overflow: hidden;
    animation: pop 380ms var(--spring) backwards;
  }
  .maya { position: absolute; left: -2px; top: 0; bottom: 0; width: 186px; pointer-events: none; }
  .stage { position: absolute; inset: 0; transition: transform 340ms var(--spring); }
  .maya.lean .stage { transform: translate(10px, 4px) rotate(4deg); }
  .breath { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scaleY(1) } 50% { transform: scaleY(1.018) } }
  .face { position: absolute; inset: 0; opacity: 0; }
  .face.on { opacity: 1; }
  .face svg { width: 100%; height: 100%; display: block; }

  /* stickers around Maya */
  .stick { position: absolute; color: var(--ink); pointer-events: none; }
  .stick svg { display: block; width: 100%; height: 100%; }
  .s-star { left: 148px; top: 6px; width: 30px; height: 30px; }
  .s-squiggle { left: 8px; top: 212px; width: 46px; height: 24px; }
  .tw { animation: twinkle 4s ease-in-out infinite; transform-origin: center; }
  .tw.b { animation-delay: 1.4s; }
  .tw.c { animation-delay: 2.7s; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8) rotate(-8deg) } 50% { opacity: 1; transform: scale(1.1) rotate(6deg) } }


  /* the side column: bubble, pill, quiet text */
  .side { position: absolute; right: 14px; top: 0; bottom: 0; width: 156px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .bubble {
    position: relative; margin: 0;
    border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
    border-radius: 20px; padding: 12px 12px; min-height: 74px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 15px; font-weight: 700; line-height: 1.25; text-align: center;
    animation: pop 320ms var(--spring) backwards;
  }
  .bubble { z-index: 0; }
  .bubble::before, .bubble::after {
    content: ""; position: absolute; z-index: -1; left: 16px; bottom: -11px;
    width: 20px; height: 20px; background: var(--ink); transform: rotate(45deg);
  }
  .bubble::after { left: 19px; bottom: -5px; width: 14px; height: 14px; background: var(--paper); }
  .bubble .d { width: 9px; height: 9px; border-radius: 99px; background: var(--ink); animation: dot 1400ms ease-in-out infinite; }
  .bubble .d:nth-child(2) { animation-delay: 180ms; }
  .bubble .d:nth-child(3) { animation-delay: 360ms; }
  @keyframes dot { 0%, 100% { opacity: .25; transform: none } 40% { opacity: 1; transform: translateY(-4px) } }

  .pill {
    appearance: none; border: 0; width: 100%; height: 56px; border-radius: 99px;
    background: var(--ink); color: #fff; font-size: 16px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    cursor: pointer; transition: transform 220ms var(--spring);
  }
  .pill:active { transform: scale(.95); }
  .pill svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .pill .chev { font-size: 22px; line-height: 1; margin-left: 2px; }
  .ghost {
    appearance: none; border: 0; background: none; padding: 4px 2px; min-height: 40px;
    font-size: 14px; font-weight: 700; color: var(--ink); opacity: .78;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: center;
  }

  /* ---------- the four pick cards ---------- */
  .grid {
    flex: 1 1 auto; margin-top: 14px; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px;
  }
  .tile {
    position: relative; appearance: none;
    border: 3px solid var(--ink); border-radius: var(--r-tile);
    background: var(--cream); color: var(--ink);
    padding: 10px 8px 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    animation: pop 360ms var(--spring) backwards;
    transition: background 200ms ease, opacity 260ms ease, transform 260ms var(--spring);
  }
  .tile:nth-child(1) { animation-delay: 60ms; }
  .tile:nth-child(2) { animation-delay: 120ms; }
  .tile:nth-child(3) { animation-delay: 180ms; }
  .tile:nth-child(4) { animation-delay: 240ms; }
  .tile:active { transform: scale(.96); }
  @media (hover: hover) { .tile:hover { transform: translateY(-3px); } .tile.dim:hover, .tile.quiet:hover { transform: none; } }
  .tile .ico { width: 136px; height: 112px; display: block; transition: transform 460ms cubic-bezier(.5, 0, .9, .4), opacity 380ms ease; }
  .tile .word { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .tile.swept .ico { transform: translate(130px, -50px) rotate(42deg); opacity: 0; }
  .tile.sucked .ico { transform: translate(70px, 56px) rotate(260deg) scale(.04); opacity: 0; }
  .tile.dim { opacity: .36; }
  .tile.dim .ico { animation: popback 340ms var(--spring); }
  @keyframes popback { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.06); opacity: 1 } 100% { transform: none } }
  .tile.quiet { opacity: .4; }
  .tile.right { background: var(--mint); z-index: 2; animation: hit 420ms var(--spring); opacity: 1; }
  @keyframes hit { 0% { transform: scale(1) } 45% { transform: scale(1.07) rotate(-1.5deg) } 100% { transform: scale(1) } }
  .tile .reward { position: absolute; top: -18px; right: -14px; width: 58px; height: 58px; color: var(--ink); transform: scale(0); pointer-events: none; }
  .tile .reward svg { width: 100%; height: 100%; display: block; }
  .tile.right .reward { animation: stick 420ms var(--spring) forwards; }
  @keyframes stick { 0% { transform: scale(0) rotate(-40deg) } 70% { transform: scale(1.18) rotate(8deg) } 100% { transform: scale(1) rotate(0) } }

  @keyframes pop {
    0% { opacity: 0; transform: translateY(16px) scale(.92) }
    70% { opacity: 1; transform: translateY(0) scale(1.04) }
    100% { opacity: 1; transform: none }
  }

  /* ---------- Blobert ---------- */
  .blobert {
    position: absolute; width: 170px; height: 150px; left: 0; top: 0; z-index: 6; pointer-events: none;
    transform: translate(300px, 40px) scale(.6); opacity: 0;
    transition: transform 380ms var(--spring), opacity 180ms ease;
  }
  .blobert.in { transform: none; opacity: 1; }
  .blobert.out { transform: translate(300px, 10px) scale(.7); opacity: 0; transition: transform 320ms cubic-bezier(.5, 0, .9, .4), opacity 260ms ease; }
  .blobert svg { width: 100%; height: 100%; display: block; overflow: visible; transform: scaleX(-1); }
  .blobert #body { transform-origin: 120px 192px; animation: wobble 2.4s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(-2deg) scaleY(1) } 50% { transform: rotate(2deg) scaleY(1.03) } }
  .blobert #eyes { transform-origin: 121px 102px; animation: blink 3.4s ease-in-out infinite; }
  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1) } 94%, 97% { transform: scaleY(.08) } }
  .blobert #arm-right { transform-origin: 184px 120px; transition: transform 200ms ease; }
  .blobert.sweep #arm-right { animation: sweep 520ms cubic-bezier(.4, 0, .2, 1) 1; }
  @keyframes sweep { 0% { transform: rotate(0) } 35% { transform: rotate(-70deg) } 75% { transform: rotate(40deg) } 100% { transform: rotate(0) } }
  .blobert #arm-left { transform-origin: 62px 128px; }
  .blobert.wave #arm-left { animation: wavearm 420ms ease-in-out 1; }
  @keyframes wavearm { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-60deg) } 50% { transform: rotate(-30deg) } 75% { transform: rotate(-65deg) } }
  .blobert.sneeze #body { animation: sneeze 320ms ease-out 1; }
  @keyframes sneeze { 0% { transform: scale(1) } 30% { transform: scale(.9, 1.14) translateY(-8px) } 60% { transform: scale(1.18, .84) translateY(6px) } 100% { transform: scale(1) } }
  .blobert #vac { display: none; }
  .blobert.vacuum #vac { display: block; }
  .blobert.vacuum #broom { display: none; }
  .blobert.vacuum #vac .suck { animation: suck 420ms linear infinite; }
  @keyframes suck { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -16 } }
  .cap {
    position: absolute; left: 6px; top: -14px;
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .01em;
    padding: 6px 11px; border-radius: 99px; transform: scale(0) rotate(-10deg); transform-origin: 50% 100%;
    transition: transform 260ms var(--spring);
  }
  .cap.on { transform: scale(1) rotate(-8deg); }

  /* ---------- end card (mint: done) ---------- */
  .done { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; margin-top: 12px; }
  .phone.finished .head, .phone.finished .coach, .phone.finished .grid { display: none; }
  .phone.finished .done { display: flex; }
  .kicker { margin: 0; font-size: 16px; font-weight: 700; opacity: .74; animation: pop 320ms var(--spring) backwards; }
  .done h2 { margin: 2px 0 0; font-size: 38px; font-weight: 800; line-height: 1.05; letter-spacing: -.025em; animation: pop 340ms var(--spring) 60ms backwards; }
  .hero {
    position: relative; flex: 1 1 auto; min-height: 0; margin-top: 16px;
    border-radius: var(--r-card); border: 3px solid var(--ink); background: var(--mint); color: var(--ink);
    overflow: hidden; animation: pop 380ms var(--spring) 120ms backwards;
  }
  .hero .doodle { position: absolute; left: -6px; right: -6px; top: 6px; bottom: 6px; }
  .hero .doodle svg { width: 100%; height: 100%; display: block; }
  .hero .h-star { left: 24px; top: 22px; width: 44px; height: 44px; }
  .hero .h-heart { right: 22px; top: 30px; width: 34px; height: 34px; }
  .hero .h-sparkle { left: 30px; bottom: 32px; width: 34px; height: 34px; }
  .hero .h-squiggle { right: 18px; bottom: 26px; width: 56px; height: 28px; }
  .done .pill { margin-top: 16px; flex: 0 0 auto; animation: pop 340ms var(--spring) 180ms backwards; }
  :root[data-theme="dark"] .done .pill { border: 3px solid var(--cream); }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .breath, .tw, .bubble .d, .blobert #body, .blobert #eyes, .blobert.sweep #arm-right,
    .blobert.wave #arm-left, .blobert.sneeze #body, .blobert.vacuum #vac .suck { animation: none !important; }
    .coach, .bubble, .tile, .kicker, .done h2, .hero, .done .pill { animation-duration: 1ms !important; }
    .tile.right, .tile.dim .ico, .tile.right .reward { animation-duration: 1ms !important; }
    .tile.right .reward { transform: scale(1); }
    .blobert { transform: none; transition: opacity 240ms ease; }
    .blobert.in { opacity: 1; }
    .blobert.out { transform: none; opacity: 0; }
    .tile .ico { transition: opacity 300ms ease; }
    .tile.swept .ico, .tile.sucked .ico { transform: none; }
    .step::after, .stage, .tile, .cap { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">

  <header class="top">
    <div class="steps" id="steps" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-label="Round 1 of 3">
      <span class="step" data-state="now"></span><span class="step"></span><span class="step"></span>
    </div>
    <button class="toggle" id="toggle" type="button" aria-label="Dark mode" aria-pressed="false">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>
    </button>
  </header>

  <section class="head">
    <h1>Listen and pick</h1>
    <p class="sub" id="sub">Tap what Maya orders.</p>
  </section>

  <section class="coach" id="coach" aria-label="Maya orders at the cafe">
    <div class="maya" id="maya">

        <path d="M46 28h28M46 42h18M46 56h28M46 70h14"/>
      </g>
      <path d="M92 60l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#121212" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="st-4" viewBox="0 0 24 24"><path d="M12 .8 14.6 9.4 23.2 12 14.6 14.6 12 23.2 9.4 14.6.8 12 9.4 9.4Z" fill="currentColor"/></symbol>
    <symbol id="st-5" viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.9 7.4.8-5.5 5.1 1.5 7.4L12 18l-6.5 3.7 1.5-7.4L1.5 9.2l7.4-.8z" fill="currentColor"/></symbol>
    <symbol id="st-burst" viewBox="0 0 24 24"><path d="M12 .5 14.2 8.3 22 5.6 16.3 11.3 23.5 14.5 15.7 15.3 17 23.5 12 17.2 7 23.5 8.3 15.3.5 14.5 7.7 11.3 2 5.6 9.8 8.3Z" fill="currentColor"/></symbol>
  </defs>
</svg>

<script>
(function () {
  "use strict";

  var CARDS = [
    { key: "coffee", word: "a coffee",    alt: "One cup of coffee" },
    { key: "two",    word: "two coffees", alt: "Two cups of coffee" },
    { key: "tea",    word: "a tea",       alt: "A cup of tea with a teabag" },
    { key: "bill",   word: "the bill",    alt: "A bill with a star" }
  ];
  var ROUNDS = [
    { line: "Could I have a coffee, please?",  answer: "coffee" },
    { line: "Two coffees, please.",            answer: "two" },
    { line: "Could we have the bill, please?", answer: "bill" }
  ];
  var GAGS = ["sweep", "vacuum"];
  var STARS = ["st-4", "st-5", "st-burst"];

  var phone = document.getElementById("phone");
  var coach = document.getElementById("coach");
  var maya = document.getElementById("maya");
  var grid = document.getElementById("grid");
  var bubble = document.getElementById("bubble");
  var steps = document.getElementById("steps");
  var live = document.getElementById("live");
  var playBtn = document.getElementById("playBtn");
  var wordsBtn = document.getElementById("wordsBtn");
  var nextBtn = document.getElementById("nextBtn");
  var toggle = document.getElementById("toggle");
  var blob = document.getElementById("blobert");
  var cap = document.getElementById("cap");

  var faces = {};
  [].forEach.call(document.querySelectorAll(".face"), function (f) { faces[f.dataset.face] = f; });

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var round = 0, locked = false, wordsOn = true;
  var lastGag = null, lastStar = null, forcedGag = null;
  var timers = [];

  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }
  function setFace(name) {
    for (var k in faces) faces[k].classList.toggle("on", k === name);
  }

  /* ---------- theme ---------- */
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    toggle.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
    toggle.setAttribute("aria-label", t === "dark" ? "Light mode" : "Dark mode");
    try { localStorage.setItem("lp-theme", t); } catch (e) {}
  }
  try { var saved = localStorage.getItem("lp-theme"); if (saved === "dark" || saved === "light") setTheme(saved); } catch (e) {}
  toggle.addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* ---------- speech: talk and idle swapped at about 8 Hz while she speaks ---------- */
  var synth = window.speechSynthesis || null;
  var canSpeak = !!(synth && window.SpeechSynthesisUtterance);
  var voice = null, current = null, mouth = null, mouthFaces = ["idle", "talk"];

  function pickVoice() {
    if (!canSpeak) return;
    var list = synth.getVoices() || [];
    voice = list.filter(function (v) { return /en[-_]GB/i.test(v.lang); })[0] ||
            list.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }
  if (canSpeak) { pickVoice(); synth.addEventListener("voiceschanged", pickVoice); }

  function mouthOn(on) {
    clearInterval(mouth); mouth = null;
    coach.classList.toggle("speaking", !!on);
    if (on) {
      var open = false;
      mouth = setInterval(function () { open = !open; setFace(open ? mouthFaces[1] : mouthFaces[0]); }, 125);
    } else {
      setFace(mouthFaces[0]);
    }
  }

  function stopSpeaking() {
    current = null;
    mouthOn(false);
    if (canSpeak) { try { synth.cancel(); } catch (e) {} }
  }

  /* rate 1 for the order, 0.75 for the calm replay after a miss */
  function speak(rate, restFace) {
    stopSpeaking();
    mouthFaces = [restFace || "idle", "talk"];
    setFace(mouthFaces[0]);
    var line = ROUNDS[round].line;
    var token = { started: false, ended: false };
    current = token;
    live.textContent = "Maya says: " + line;

    function start() { if (current !== token || token.started) return; token.started = true; mouthOn(true); }
    function end() { if (current !== token || token.ended) return; token.ended = true; mouthOn(false); }

    if (canSpeak) {
      var u = new SpeechSynthesisUtterance(line);
      u.lang = "en-GB"; if (voice) u.voice = voice; u.rate = rate; u.pitch = 1.05;
      u.onstart = start; u.onend = end; u.onerror = end;
      try { synth.speak(u); } catch (e) {}
    }
    /* no audio yet (blocked, headless, or unsupported): act it out for the length of the line */
    later(function () {
      if (!token.started) { start(); later(end, Math.round(line.length * 60 / rate)); }
    }, 500);
    later(end, Math.round(line.length * 140 / rate) + 1500);
  }

  /* ---------- words bubble ---------- */
  function setWords(on) {
    wordsOn = on;
    if (on) {
      bubble.textContent = "“" + ROUNDS[round].line + "”";
      bubble.removeAttribute("aria-label");
    } else {
      bubble.innerHTML = '<i class="d"></i><i class="d"></i><i class="d"></i>';
      bubble.setAttribute("aria-label", "The words are hidden. Listen.");
    }
    wordsBtn.textContent = on ? "Hide the words" : "Show the words";
    wordsBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }

  /* ---------- board ---------- */
  function paintSteps() {
    var n = steps.children;
    for (var i = 0; i < n.length; i++) n[i].setAttribute("data-state", i < round ? "done" : (i === round ? "now" : ""));
    steps.setAttribute("aria-valuenow", String(round));
    steps.setAttribute("aria-label", "Round " + Math.min(round + 1, 3) + " of 3");
  }

  function buildGrid() {
    grid.innerHTML = "";
    CARDS.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tile"; b.dataset.key = c.key;
      b.setAttribute("aria-label", c.word);
      b.innerHTML =
        '<svg class="ico" aria-hidden="true" focusable="false"><use href="#ico-' + c.key + '"></use></svg>' +
        '<span class="word" aria-hidden="true">' + c.word + '</span>' +
        '<span class="reward" aria-hidden="true"><svg><use href="#st-4"></use></svg></span>';
      b.addEventListener("click", function () { pick(c.key); });
      grid.appendChild(b);
    });
  }

  function pickDifferent(list, last) {
    var pool = list.filter(function (x) { return x !== last; });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function tiles() { return [].slice.call(grid.children); }

  /* ---------- a pick ---------- */
  function pick(key) {
    if (locked || phone.classList.contains("finished")) return;
    var tile = grid.querySelector('[data-key="' + key + '"]');
    if (!tile || tile.classList.contains("dim")) return;
    locked = true;
    if (key === ROUNDS[round].answer) win(tile); else miss(tile);
  }

  function win(tile) {
    clearAll();
    stopSpeaking();
    maya.classList.remove("lean");
    setFace("happy");
    var star = pickDifferent(STARS, lastStar); lastStar = star;
    tile.querySelector(".reward use").setAttribute("href", "#" + star);
    tile.querySelector(".reward").style.transform = "";
    tiles().forEach(function (t) { if (t !== tile) t.classList.add("quiet"); });
    tile.classList.add("right");
    live.textContent = "Yes. " + tile.getAttribute("aria-label") + ".";
    round += 1;
    paintSteps();
    later(function () {
      if (round >= ROUNDS.length) { finish(); return; }
      startRound();
    }, 1300);
  }

  function placeBlobert(tile) {
    var p = phone.getBoundingClientRect(), r = tile.getBoundingClientRect();
    var left = Math.min(r.right - p.left - 96, p.width - 170 - 2);
    var top = r.bottom - p.top - 152;
    blob.style.left = left + "px";
    blob.style.top = top + "px";
  }

  function miss(tile) {
    clearAll();
    stopSpeaking();
    setFace("listen");
    maya.classList.add("lean");
    live.textContent = "Not " + tile.getAttribute("aria-label") + ". Blobert tidies it away. Listen again.";

    var gag = forcedGag && forcedGag !== lastGag ? forcedGag : pickDifferent(GAGS, lastGag);
    lastGag = gag; forcedGag = null;
    blob.className = "blobert " + gag;
    cap.className = "cap";
    placeBlobert(tile);
    void blob.offsetWidth;
    blob.classList.add("in");

    var t = reduced ? 160 : 360;
    if (gag === "sweep") {
      later(function () { blob.classList.add("sweep"); cap.textContent = "swish!"; cap.classList.add("on"); }, t);
      later(function () { tile.classList.add("swept"); }, t + 120);
      later(function () { cap.classList.remove("on"); }, t + 700);
      later(function () { blob.classList.add("wave"); }, t + 760);
      later(function () { blob.classList.add("out"); }, t + 1180);
      later(function () { settle(tile, "swept"); }, t + 1480);
    } else {
      later(function () { cap.textContent = "vrrrm"; cap.classList.add("on"); tile.classList.add("sucked"); }, t);
      later(function () { cap.classList.remove("on"); }, t + 460);
      later(function () { blob.classList.add("sneeze"); cap.textContent = "achoo!"; cap.classList.add("on"); }, t + 520);
      later(function () { cap.classList.remove("on"); blob.classList.add("wave"); }, t + 900);
      later(function () { blob.classList.add("out"); }, t + 1300);
      later(function () { settle(tile, "sucked"); }, t + 1600);
    }
  }

  /* the real thing: the card comes back quiet, the line replays slowly, Maya still leaning in */
  function settle(tile, cls) {
    tile.classList.remove(cls);
    tile.classList.add("dim");
    blob.className = "blobert";
    locked = false;
    speak(0.75, "listen");
  }

  function startRound() {
    clearAll();
    paintSteps();
    buildGrid();
    setWords(wordsOn);
    maya.classList.remove("lean");
    setFace("idle");
    locked = false;
    speak(1);
  }

  function finish() {
    clearAll();
    stopSpeaking();
    blob.className = "blobert";
    phone.classList.add("finished");
    live.textContent = "You can now order at a cafe.";
    later(function () { nextBtn.focus(); }, 300);
  }

  function restart() {
    phone.classList.remove("finished");
    round = 0;
    startRound();
  }

  playBtn.addEventListener("click", function () {
    if (phone.classList.contains("finished")) return;
    speak(maya.classList.contains("lean") ? 0.75 : 1, maya.classList.contains("lean") ? "listen" : "idle");
  });
  wordsBtn.addEventListener("click", function () { setWords(!wordsOn); });
  nextBtn.addEventListener("click", restart);

  /* keyboard: arrows move between the four cards */
  grid.addEventListener("keydown", function (e) {
    var map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 2, ArrowUp: -2 };
    if (!(e.key in map)) return;
    var all = tiles(), i = all.indexOf(document.activeElement);
    if (i < 0) return;
    var j = i + map[e.key];
    if (j >= 0 && j < all.length) { all[j].focus(); e.preventDefault(); }
  });

  /* tester hooks */
  window.addEventListener("lp:auto", function (e) {
    var ok = !(e.detail && e.detail.correct === false);
    var key = ok ? ROUNDS[round].answer
                 : CARDS.filter(function (c) { return c.key !== ROUNDS[round].answer; })
                        .filter(function (c) { var t = grid.querySelector('[data-key="' + c.key + '"]'); return t && !t.classList.contains("dim"); })[0].key;
    pick(key);
  });
  window.__lp = {
    pick: pick,
    gag: function (name) { forcedGag = name; },
    state: function () { return { round: round, locked: locked, words: wordsOn, finished: phone.classList.contains("finished"), lastGag: lastGag }; },
    finish: finish
  };

  startRound();
})();
</script>
</body>
</html>
