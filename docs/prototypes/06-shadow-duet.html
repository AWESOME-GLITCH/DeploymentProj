<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shadow duet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* Shadow duet: prototype 6. Pronunciation by shadowing. Maya says the line with
   a word-by-word highlight and a bouncing rhythm dot; on the second pass the
   learner speaks along and the two voices are drawn as two ink waveforms that
   line up. Board look of 26 Oct: flat colour blocks, ink outlines, black pill
   buttons, springy motion under 400 ms, one block colour per screen. */

:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6;
  --sky:#BFE3FF; --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink); --block:var(--sun);
  --field:var(--paper);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --page:#121212; --on-page:var(--cream); --field:#1E1E1E;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif; font-weight:600;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background 300ms ease,color 300ms ease;
}

/* 390 x 844, no page scroll */
.app{
  position:fixed; inset:0; width:100%; max-width:430px; margin:0 auto;
  display:flex; flex-direction:column; gap:12px;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
}

/* ---------- top row: line pips and the mode switch ---------- */
.top{display:flex; align-items:center; justify-content:space-between; height:34px; flex:0 0 auto}
.pips{display:flex; gap:7px; align-items:center}
.pip{
  width:30px; height:7px; border-radius:99px; background:var(--on-page); opacity:.18;
  transition:opacity 220ms ease,width 260ms var(--spring);
}
.pip.live{opacity:1; width:44px}
.pip.done{opacity:1}
.switch{
  width:44px; height:44px; border:none; border-radius:99px; background:transparent;
  color:var(--on-page); display:grid; place-items:center; cursor:pointer; padding:0;
}
.switch svg{width:22px; height:22px; display:block}
.switch:active{transform:scale(.92)}

/* ---------- the block card ---------- */
.card{
  position:relative; flex:1 1 auto; min-height:0;
  border-radius:28px; background:var(--block); color:var(--ink);
  overflow:hidden; transition:background 340ms ease;
  animation:cardIn 360ms var(--spring) both;
}
.card[data-tone="mint"]{--block:var(--mint)}
@keyframes cardIn{from{opacity:0; transform:translateY(14px) scale(.96)} to{opacity:1; transform:none}}

.card-top{position:absolute; inset:20px 20px auto 20px; z-index:3}
.headline{font-weight:800; font-size:34px; line-height:1.05; letter-spacing:-.6px; margin:0}
.sub{margin:10px 0 0; font-size:15px; font-weight:600; opacity:.78; max-width:21ch}

/* ---------- the line, with the karaoke highlight and the rhythm dot ---------- */
.panel{
  position:absolute; left:18px; right:18px; top:18px; z-index:4;
  background:var(--paper); color:var(--ink);
  border:3px solid var(--ink); border-radius:24px;
  padding:30px 14px 16px;
  box-shadow:4px 5px 0 var(--ink);
  animation:pop 320ms var(--spring) both;
}
.line{margin:0; font-size:20px; line-height:1.66; font-weight:700; letter-spacing:-.2px}
.w{opacity:.32; transition:opacity 140ms ease}
.w.said{opacity:1}
/* the pill borrows the space either side of the word, so the highlight never
   rewraps the line and nothing below it has to move */
.w.now{
  opacity:1; transition:none; background:var(--ink); color:var(--cream);
  border-radius:8px; padding:2px 5px; margin:0 -5px;
  animation:wordPop 240ms var(--spring) both;
}
.w.fix{opacity:1; box-shadow:0 3px 0 var(--ink); border-radius:3px}
@keyframes wordPop{from{transform:scale(.88)} to{transform:scale(1)}}
@keyframes pop{from{opacity:0; transform:translateY(-8px) scale(.94)} to{opacity:1; transform:none}}

/* the dot hops to the word being said */
.dot{
  position:absolute; left:0; top:0; width:13px; height:13px; border-radius:99px;
  background:var(--ink); opacity:0; pointer-events:none;
  transition:transform 200ms var(--spring),opacity 160ms ease;
}
.dot.on{opacity:1}
.dot.hop{animation:hop 260ms var(--spring) both}
@keyframes hop{0%{margin-top:0}45%{margin-top:-9px}100%{margin-top:0}}

/* ---------- the two ink waveforms ---------- */
.waves{position:absolute; left:20px; right:20px; z-index:3; display:grid; gap:20px}
.wave-row{display:grid; gap:3px; animation:pop 320ms var(--spring) both}
.wave-row:nth-child(2){animation-delay:60ms}
.wave-label{font-size:13px; font-weight:800; letter-spacing:.3px; opacity:.72}
.wave{position:relative; height:62px}
.wave svg{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible}
.wave path{fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.wave .flat{stroke-width:2.6; stroke-dasharray:3 7; opacity:.45}
.reveal{position:absolute; inset:0; clip-path:inset(0 calc(100% - var(--rev,0%)) 0 0); transition:clip-path 200ms linear}
.head{
  position:absolute; top:-4px; bottom:-4px; left:0; width:3px; border-radius:99px;
  background:var(--ink); opacity:0; transform:translateX(0);
  transition:transform 200ms linear,opacity 160ms ease;
}
.head.on{opacity:.55}

/* ---------- three ink bars ---------- */
.bars{position:absolute; left:20px; right:20px; z-index:4; display:grid; gap:18px}
.bar-row{display:grid; gap:5px; animation:pop 300ms var(--spring) both}
.bar-row:nth-child(2){animation-delay:60ms}
.bar-row:nth-child(3){animation-delay:120ms}
.bar-label{font-size:14px; font-weight:800; letter-spacing:.2px}
.track{height:14px; border-radius:99px; border:3px solid var(--ink); background:transparent; overflow:hidden}
.fill{display:block; height:100%; width:0; background:var(--ink); border-radius:99px; transition:width 420ms var(--spring)}

/* ---------- stickers ---------- */
.sticker{position:absolute; z-index:5; color:var(--ink); pointer-events:none}
.sticker svg{display:block}
.twinkle{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(1.18) rotate(10deg)}70%{transform:scale(.94) rotate(-4deg)}}
/* the stickers live in the band under the bars, clear of every panel */
.s-star{top:56%; right:26px}
.s-squiggle{bottom:26px; right:30px; animation-delay:1.2s}
.s-win{display:none; top:62%; right:34px}
.card.done .s-win{display:block}
.card.done .s-star,.card.done .s-squiggle{display:none}
.burst{top:55%; left:50%; margin-left:-32px; opacity:0; z-index:7}
.burst.go{animation:burst 420ms var(--spring) both}
@keyframes burst{0%{opacity:0; transform:scale(.3) rotate(-24deg)}60%{opacity:1; transform:scale(1.14) rotate(8deg)}100%{opacity:1; transform:scale(1) rotate(0)}}

/* ---------- Maya ---------- */
.stage{position:absolute; left:4px; bottom:6px; width:158px; height:218px; z-index:2}
.card.done .stage{left:50%; margin-left:-104px; width:208px; height:286px; bottom:-4px}
.cast{position:relative; width:100%; height:100%; transition:transform 320ms var(--spring)}
.cast .pose{position:absolute; inset:0; opacity:0; transition:opacity 160ms ease}
.cast .pose.on{opacity:1}
.cast svg{width:100%; height:100%; display:block}
.sway{animation:sway 3s ease-in-out infinite; transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.1deg) translateY(-2px)}}
.card.listening .cast{transform:translateY(4px) scale(1.05)}
.card.reacting .cast{transform:translateY(-6px) scale(1.03)}

/* ---------- Blobert: he handles every mistake ---------- */
.blobert{
  position:absolute; z-index:8; width:150px; height:130px; pointer-events:none;
  opacity:0; transform:translateX(150px);
}
.blobert svg{width:100%; height:100%; display:block; overflow:visible}
.blobert .body{fill:var(--block); stroke:var(--ink); stroke-width:3; stroke-linejoin:round; stroke-linecap:round}
.blobert .limb-ink{fill:none; stroke:var(--ink); stroke-width:12; stroke-linecap:round}
.blobert .limb-fill{fill:none; stroke:var(--block); stroke-width:6; stroke-linecap:round}
.blobert .ln{fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.blobert .tool{display:none}
.blobert[data-gag="sweep"] .t-broom,
.blobert[data-gag="mop"] .t-mop,
.blobert[data-gag="bin"] .t-bin,
.blobert[data-gag="vacuum"] .t-vacuum,
.blobert[data-gag="crane"] .t-crane{display:block}
.blobert .mouth-open{display:none}
.blobert[data-gag="eat"] .mouth-open{display:block}
.blobert[data-gag="eat"] .mouth-shut{display:none}
.blobert.in{animation:blobIn 200ms var(--spring) both}
.blobert.look .wobble{animation:blobLook 120ms ease-out both}
.blobert.act .wobble{animation:blobAct 360ms var(--spring) both}
.blobert.wave .arm-r{animation:blobWave 160ms ease-in-out 2 both}
.blobert.out{animation:blobOut 160ms ease-in both}
@keyframes blobIn{from{opacity:0; transform:translateX(150px) rotate(6deg)} to{opacity:1; transform:translateX(0) rotate(0)}}
@keyframes blobOut{from{opacity:1; transform:translateX(0)} to{opacity:0; transform:translateX(150px)}}
@keyframes blobLook{to{transform:translateX(-6px) rotate(-4deg)}}
@keyframes blobAct{0%{transform:translateX(-6px) rotate(-4deg)}45%{transform:translateX(-14px) rotate(7deg) scaleX(1.05)}100%{transform:translateX(-6px) rotate(-1deg)}}
@keyframes blobWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.blobert .wobble{transform-box:fill-box; transform-origin:50% 90%}
.blobert .arm-r{transform-box:fill-box; transform-origin:12% 70%}
.blobert .idle{transform-box:fill-box; transform-origin:50% 100%; animation:blobIdle 3.2s ease-in-out infinite}
@keyframes blobIdle{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.03)}}
/* his sound, captioned as a sticker so it needs no English */
.blob-sound{position:absolute; z-index:9; opacity:0}
.blob-sound.go{animation:burst 380ms var(--spring) both}

/* the word Blobert clears: one gag each, all under 400 ms */
.w.g-sweep{animation:gSweep 340ms ease-in both}
.w.g-eat{animation:gEat 340ms ease-in both}
.w.g-mop{animation:gMop 340ms ease-in both}
.w.g-bin{animation:gBin 340ms ease-in both}
.w.g-vacuum{animation:gVacuum 340ms ease-in both}
.w.g-crane{animation:gCrane 340ms ease-in both}
.w.gone{opacity:0}
@keyframes gSweep{0%{opacity:1}100%{opacity:0; transform:translateX(-110px) rotate(-16deg)}}
@keyframes gEat{0%{opacity:1}100%{opacity:0; transform:translate(46px,16px) scale(.2)}}
@keyframes gMop{0%{opacity:1}60%{opacity:.6; transform:translateY(7px) scaleY(.26)}100%{opacity:0; transform:translateY(9px) scaleY(.12)}}
@keyframes gBin{0%{opacity:1}100%{opacity:0; transform:translateY(64px) rotate(14deg)}}
@keyframes gVacuum{0%{opacity:1}100%{opacity:0; transform:translate(40px,10px) scale(.15) rotate(20deg)}}
@keyframes gCrane{0%{opacity:1}100%{opacity:0; transform:translateY(-74px) rotate(6deg)}}

/* ---------- dock ---------- */
.dock{flex:0 0 auto; display:grid; gap:10px}
.say{
  font-size:15px; font-weight:700; text-align:center; min-height:22px; margin:0;
  color:var(--on-page); opacity:.78;
}
.say b{font-weight:800; opacity:1}
.btn{
  position:relative; width:100%; height:56px; border:none; border-radius:99px;
  background:var(--ink); color:#fff; font:inherit; font-weight:700; font-size:18px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  cursor:pointer; transition:transform 180ms var(--spring); -webkit-tap-highlight-color:transparent;
}
[data-theme="dark"] .btn{background:var(--cream); color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.waiting{opacity:.45}
.btn .go{position:absolute; right:22px; font-size:20px; font-weight:800}
.btn.live::before{
  content:""; position:absolute; inset:-6px; border-radius:99px;
  border:3px solid var(--ink); opacity:.3; animation:ring 1.4s ease-out infinite;
}
[data-theme="dark"] .btn.live::before{border-color:var(--cream)}
@keyframes ring{0%{transform:scale(.97); opacity:.35}100%{transform:scale(1.07); opacity:0}}
.minor{
  background:none; border:none; font:inherit; font-size:15px; font-weight:700;
  color:var(--on-page); text-decoration:underline; text-underline-offset:3px;
  padding:10px 14px; min-height:44px; cursor:pointer; justify-self:center; opacity:.8;
}
.typed{display:none; gap:8px; grid-template-columns:1fr auto}
.typed.on{display:grid}
.typed input{
  height:52px; border:3px solid var(--ink); border-radius:99px; background:var(--field);
  color:var(--on-page); font:inherit; font-weight:700; font-size:16px; padding:0 18px; min-width:0;
}
[data-theme="dark"] .typed input{border-color:var(--cream)}
.typed input::placeholder{color:var(--on-page); opacity:.45}
.typed button{
  height:52px; padding:0 20px; border:none; border-radius:99px; background:var(--ink);
  color:#fff; font:inherit; font-weight:700; font-size:16px; cursor:pointer;
}
[data-theme="dark"] .typed button{background:var(--cream); color:var(--ink)}

/* ink focus ring, cream in the dark: never a red or an orange flash */
:focus-visible{outline:3px solid var(--on-page); outline-offset:3px; border-radius:99px}
.card :focus-visible{outline-color:var(--ink)}
.hidden{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none !important}
  .cast,.btn,.fill,.dot,.head,.reveal{transition-duration:120ms}
  .blobert.in{opacity:1; transform:none}
  .w.gone{transition:opacity 120ms ease}
}
@media (max-height:760px){
  .headline{font-size:30px}
  .line{font-size:19px}
  .stage{width:138px; height:190px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="top">
    <div class="pips" id="pips" role="group" aria-label="Line 1 of 3">
      <span class="pip live"></span><span class="pip"></span><span class="pip"></span>
    </div>
    <button class="switch" id="switch" aria-label="Switch to dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.6"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
    </button>
  </div>

  <section class="card" id="card" data-tone="sun">
    <div class="card-top" id="cardTop">
      <h1 class="headline" id="headline">Shadow duet</h1>
      <p class="sub" id="sub">Maya says a line. Then say it with her.</p>
    </div>

    <div class="panel hidden" id="panel">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <p class="line" id="lineText"></p>
    </div>

    <div class="waves hidden" id="waves" aria-hidden="true">
      <div class="wave-row">
        <span class="wave-label">Maya</span>
        <div class="wave">
          <svg viewBox="0 0 318 50" preserveAspectRatio="none"><path id="wMaya" d=""/></svg>
          <i class="head" id="head"></i>
        </div>
      </div>
      <div class="wave-row">
        <span class="wave-label">You</span>
        <div class="wave">
          <svg class="flat-wrap" viewBox="0 0 318 50" preserveAspectRatio="none"><path class="flat" d="M0 25 L318 25"/></svg>
          <div class="reveal" id="youReveal">
            <svg viewBox="0 0 318 50" preserveAspectRatio="none"><path id="wYou" d=""/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="bars hidden" id="bars"></div>

    <span class="sticker s-star twinkle" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M12.48 0.87 L14.44 9.47 L22.88 12.09 L15.09 14.25 L12.37 23.47 L9.71 15.01 L1.13 11.98 L9.19 9.70 Z" fill="#121212"></path></svg></span>
    <span class="sticker s-squiggle twinkle" aria-hidden="true"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M2.31 15.75 C5.50 5.33 9.88 20.60 13.26 11.50 C14.96 6.92 18.76 10.45 22.47 7.11" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"></path></svg></span>
    <span class="sticker s-win twinkle" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M10.76 3.02 L12.25 9.79 L19.09 10.99 L12.00 12.67 L10.87 18.73 L10.03 12.41 L2.94 11.20 L9.58 9.64 Z" fill="#121212"></path><circle cx="19.5" cy="18.5" r="2.1" fill="#121212"></circle><circle cx="4.5" cy="20" r="1.4" fill="#121212"></circle></svg></span>
    <span class="sticker burst" id="burst" aria-hidden="true"></span>

    <div class="stage">
      <div class="cast" id="cast">
        <div class="pose on" data-pose="idle"><svg viewBox="0 0 200 280" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><defs><style>
.lpc-pop{animation:lpc-pop 350ms cubic-bezier(.34,1.56,.64,1) both}
.lpc-idle{transform-box:fill-box;transform-origin:50% 100%;animation:lpc-sway 3s ease-in-out infinite}
.lpc-tw{transform-box:fill-box;transform-origin:50% 50%;animation:lpc-tw 4s ease-in-out infinite}
@keyframes lpc-pop{0%{transform:scale(.86)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes lpc-sway{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.1deg) translateY(-2px)}}
@keyframes lpc-tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.72}}

    if (p) card.classList.add(p);
    const want = POSE_FOR[p] || "idle";
    cast.querySelectorAll(".pose").forEach(n => n.classList.toggle("on", n.dataset.pose === want));
    cast.classList.toggle("sway", !reduced && want === "idle");
  }

  /* ---------------- the ink waveforms ---------------- */
  const WW = 318, WH = 50, MID = WH / 2;

  /* One wiggly ink line per voice. Each word owns a slot; the hump inside the
     slot is the word's stress, so two voices that match sit on top of each
     other and a word that slipped sits low and late. */
  function wavePath(stress, scales, shifts){
    const n = stress.length, slot = WW / n;
    let d = "";
    for (let x = 0; x <= WW; x += 1.5){
      const i = Math.min(n - 1, Math.floor(x / slot));
      const t = (x - i * slot) / slot - (shifts ? shifts[i] : 0);
      const gate = (t <= .08 || t >= .92) ? 0 : Math.sin(Math.PI * ((t - .08) / .84));
      const amp = stress[i] * (scales ? scales[i] : 1) * Math.pow(gate, .7) * (MID - 4);
      const y = MID - amp * Math.sin(x * 0.62);
      d += (x === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
    }
    return d;
  }

  function drawMaya(){
    wMaya.setAttribute("d", wavePath(LINES[line].stress, null, null));
  }
  function drawYou(scales, shifts){
    wYou.setAttribute("d", wavePath(LINES[line].stress, scales, shifts));
  }
  function revealYou(pct){
    youReveal.style.setProperty("--rev", Math.max(0, Math.min(100, pct)) + "%");
  }

  /* ---------------- she says the line, word by word ---------------- */
  function paintLine(){
    const words = LINES[line].text.split(" ");
    lineText.innerHTML = words.map((w,i) => '<span class="w" data-i="' + i + '">' + w + "</span>").join(" ");
    spans = Array.prototype.slice.call(lineText.querySelectorAll(".w"));
    panel.classList.remove("hidden");
  }

  /* the rhythm dot hops to the word being said */
  function moveDot(span){
    if (!span) { dot.classList.remove("on"); return; }
    const x = span.offsetLeft + span.offsetWidth / 2 - 6.5;
    const y = span.offsetTop - 17;
    dot.style.transform = "translate(" + x + "px," + y + "px)";
    dot.classList.add("on");
    if (!reduced){
      dot.classList.remove("hop");
      void dot.offsetWidth;
      dot.classList.add("hop");
    }
  }

  function speakLine(rate, withHead, done){
    setPose("speaking");
    let over = false, i = 0;
    const end = () => {
      if (over) return;
      over = true;
      clearTimeout(wordTimer);
      spans.forEach(s => { s.classList.remove("now"); s.classList.add("said"); });
      dot.classList.remove("on");
      head.classList.remove("on");
      if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch(e){} }
      if (done) done();
    };
    skipLine = end;

    const step = () => {
      spans.forEach((s,k) => { s.classList.toggle("now", k === i); if (k < i) s.classList.add("said"); });
      if (i >= spans.length){ end(); return; }
      layout();            /* a long line may wrap: keep the waves under the panel */
      moveDot(spans[i]);
      if (withHead){
        head.classList.add("on");
        const pct = (i + 1) / spans.length;
        head.style.transform = "translateX(" + (pct * 100) + "%)";
        revealYou(pct * 100);
      }
      const w = spans[i].textContent;
      i++;
      wordTimer = setTimeout(step, (reduced ? 130 : 190) + w.length * (40 / rate));
    };
    clearTimeout(wordTimer);
    step();

    if (window.speechSynthesis){
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(LINES[line].text);
        u.lang = "en-GB"; u.rate = rate;
        window.speechSynthesis.speak(u);
      } catch(e){}
    }
  }

  /* ---------------- pass one: Maya alone ---------------- */
  function startLine(){
    phase = "maya";
    tries = 0;
    cardTop.classList.add("hidden");
    bars.classList.add("hidden");
    burst.classList.remove("go");
    card.classList.remove("done");
    card.dataset.tone = "sun";
    paintPips();
    paintLine();
    drawMaya();
    drawYou([1,1,1,1,1,1], null);
    revealYou(0);
    head.style.transform = "translateX(0)";
    waves.classList.remove("hidden");
    layout();
    say.textContent = "Listen to the rhythm.";
    setButton("Maya is saying it", true);
    minor.classList.add("hidden");
    closeTyped();
    speakLine(1, false, yourTurn);
  }

  /* ---------------- pass two: the learner shadows her ---------------- */
  function yourTurn(){
    phase = "ready";
    setPose(null);
    spans.forEach(s => s.classList.remove("said"));
    bars.classList.add("hidden");
    waves.classList.remove("hidden");
    revealYou(0);
    head.style.transform = "translateX(0)";
    layout();
    say.textContent = "Now say it with her.";
    setButton(canHear ? "Speak with Maya" : "Type it with her", false);
    minor.classList.toggle("hidden", !canHear);
  }

  function setButton(label, waiting){
    goLabel.textContent = label;
    go.classList.toggle("waiting", !!waiting);
  }

  let rec = null, startedAt = 0;
  function duet(){
    if (!canHear){ openTyped("No mic here. Type the line instead."); return; }
    phase = "duet";
    startedAt = Date.now();
    go.classList.add("live");
    setButton("I'm listening", false);
    say.textContent = "Speak along.";
    minor.classList.add("hidden");
    let heard = "";
    try {
      rec = new SR();
      rec.lang = "en-GB"; rec.interimResults = true; rec.maxAlternatives = 1;
      rec.onresult = (ev) => {
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          if (ev.results[i].isFinal) heard += " " + ev.results[i][0].transcript;
          else heard = heard + "";
        }
        if (!heard.trim()){
          let live = "";
          for (let i = 0; i < ev.results.length; i++) live += " " + ev.results[i][0].transcript;
          heard = live;
        }
      };
      rec.onerror = () => { go.classList.remove("live"); openTyped("I could not hear you. Type it instead."); };
      rec.onend = () => {
        go.classList.remove("live");
        if (phase !== "duet") return;
        const said = heard.trim();
        if (!said){ openTyped("I could not hear you. Type it instead."); return; }
        judge(said, Date.now() - startedAt);
      };
      rec.start();
    } catch(e){
      go.classList.remove("live");
      openTyped("No mic here. Type the line instead.");
      return;
    }
    /* she sings the line again while the learner shadows her */
    speakLine(1, true, () => {
      setPose("listening");
      setTimeout(() => { if (phase === "duet" && rec) { try { rec.stop(); } catch(e){} } }, 700);
    });
  }

  function openTyped(message){
    phase = "typing";
    setPose("listening");
    if (message) say.textContent = message;
    typed.classList.add("on");
    go.classList.add("hidden");
    minor.classList.add("hidden");
    typedIn.value = "";
    typedIn.placeholder = LINES[line].text;
    typedIn.focus();
  }
  function closeTyped(){
    typed.classList.remove("on");
    go.classList.remove("hidden");
  }

  /* ---------------- scoring: three ink bars, never a percentage ---------------- */
  function norm(s){ return s.toLowerCase().replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim(); }

  function judge(said, ms){
    phase = "result";
    closeTyped();
    const L = LINES[line];
    const heard = norm(said), model = norm(L.text);
    const hw = heard ? heard.split(" ") : [], mw = model.split(" ");

    /* per word: did it land, and did it land on time */
    const scales = [], shifts = [];
    let hitCount = 0, slip = -1;
    mw.forEach((w,i) => {
      const hit = hw.some(h => h === w || (w.length > 3 && h.indexOf(w.slice(0,4)) === 0));
      if (hit) hitCount++; else if (slip < 0) slip = i;
      scales.push(hit ? 1 : .3);
      shifts.push(hit ? 0 : .18);
    });

    const hits = L.keys.filter(k => hw.some(h => h === k || (k.length > 3 && h.indexOf(k.slice(0,4)) === 0)));
    const words = hits.length / L.keys.length;
    const sounds = Math.min(1, (hitCount / mw.length) * 0.8 + words * 0.3);
    const lenGap = Math.abs(hw.length - mw.length) / Math.max(4, mw.length);
    const paceGap = ms ? Math.min(.6, Math.abs(ms - 2600) / 5200) : 0;
    const rhythm = Math.max(.24, 1 - lenGap - paceGap);

    drawYou(scales, shifts);
    revealYou(100);
    head.classList.remove("on");
    showBars(sounds, rhythm, words);

    const high = words >= .67 && sounds >= .5;
    if (high || tries >= 1){
      totals.sounds.push(sounds); totals.rhythm.push(rhythm); totals.words.push(words);
      if (high) wellDone(); else tidyUp(slip < 0 ? longestWord(mw) : slip);
    } else {
      tries++;
      tidyUp(slip < 0 ? longestWord(mw) : slip);
    }
  }

  function longestWord(mw){
    let best = 0;
    mw.forEach((w,i) => { if (w.length > mw[best].length) best = i; });
    return best;
  }

  function showBars(sounds, rhythm, words){
    const rows = [["Sounds", sounds], ["Rhythm", rhythm], ["Words", words]];
    bars.innerHTML = rows.map(r =>
      '<div class="bar-row"><span class="bar-label">' + r[0] + "</span>" +
      '<div class="track" role="img" aria-label="' + r[0] + ": " + band(r[1]) + '"><i class="fill"></i></div></div>'
    ).join("");
    waves.classList.add("hidden");
    bars.classList.remove("hidden");
    layout();
    const fills = bars.querySelectorAll(".fill");
    rows.forEach((r,i) => setTimeout(() => {
      fills[i].style.width = Math.round(24 + r[1] * 68) + "%";
    }, 140 + i * 60));
  }
  function band(v){ return v >= .75 ? "strong" : v >= .45 ? "growing" : "getting started"; }

  /* high bars: a star pops, one of five and never the same twice in a row */
  function wellDone(){
    setPose("reacting");
    paintSticker();
    burst.classList.add("go");
    say.textContent = "Your rhythm matched hers.";
    setButton("Next line", true);
    minor.classList.add("hidden");
    setTimeout(() => {
      burst.classList.remove("go");
      line++;
      if (line >= LINES.length) finish(); else startLine();
    }, reduced ? 400 : 1500);
  }

  /* low bars: Blobert tidies the word that slipped, then the calm correction */
  function tidyUp(wordIndex){
    setPose("listening");
    say.textContent = "";
    setButton("Listen again", true);
    minor.classList.add("hidden");
    const target = spans[wordIndex] || spans[0];
    runGag(target, () => {
      /* the calm correction: the word comes back and the line replays slowly,
         with the three bars still on the card so the learner sees why */
      target.classList.remove("gone");
      target.classList.add("fix");
      spans.forEach(s => s.classList.remove("said"));
      say.textContent = "Slowly now.";
      speakLine(0.75, false, () => {
        target.classList.remove("fix");
        if (tries > 1 || totals.words.length > line){
          line++;
          if (line >= LINES.length) finish(); else startLine();
        } else {
          yourTurn();
        }
      });
    });
  }

  /* ---------------- Blobert's gag: pop in, look, one gag, wave, slide out ---- */
  function pickGag(){
    let i;
    do { i = Math.floor(Math.random() * GAGS.length); } while (i === lastGag);
    lastGag = i;
    return GAGS[i];
  }

  function runGag(target, done){
    const gag = pickGag();
    blobert.dataset.gag = gag;
    blobert.classList.remove("hidden","in","look","act","wave","out");
    /* he stands under the bars, on the side of the word he is clearing, and
       always whole: his tools reach the right edge of his own 150px box */
    const box = target.getBoundingClientRect();
    const cardBox = card.getBoundingClientRect();
    const under = bars.classList.contains("hidden") ? panel : bars;
    const left = Math.min(cardBox.width - 152, Math.max(cardBox.width * .45, box.right - cardBox.left - 70));
    const below = under.offsetTop + under.offsetHeight + 14;
    blobert.style.left = left + "px";
    blobert.style.top = Math.max(0, Math.min(cardBox.height - 138, below)) + "px";

    if (reduced){
      blobert.style.opacity = "1";
      blobert.style.transform = "none";
      target.classList.add("gone");
      setTimeout(() => { blobert.classList.add("hidden"); if (done) done(); }, 320);
      return;
    }
    blobert.style.opacity = "";
    blobert.style.transform = "";

    blobert.classList.add("in");                                  /* 0    pop in, 200 ms */
    setTimeout(() => blobert.classList.add("look"), 200);         /* 200  look, 120 ms */
    setTimeout(() => {                                            /* 320  the gag, 360 ms */
      blobert.classList.add("act");
      target.classList.add("g-" + gag);
      popSound(GAG_SOUND[gag]);
    }, 320);
    setTimeout(() => {                                            /* 600  wave, overlaps the tail */
      target.classList.add("gone");
      target.classList.remove("g-" + gag);
      blobert.classList.add("wave");
    }, 660);
    setTimeout(() => blobert.classList.add("out"), 720);          /* 720  slide out, 160 ms */
    setTimeout(() => {                                            /* 880  gone, under 900 ms */
      blobert.classList.add("hidden");
      blobSound.classList.remove("go");
      if (done) done();
    }, 880);
  }

  /* ---------------- the kit stickers ---------------- */
  const SHAPES = {
    heart: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M11.70 21.60 C1.55 13.37 3.13 3.90 12.04 7.91 C20.23 3.07 22.74 13.47 12.42 21.99 Z" fill="#121212"></path></svg>',
    star: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M12.48 0.87 L14.44 9.47 L22.88 12.09 L15.09 14.25 L12.37 23.47 L9.71 15.01 L1.13 11.98 L9.19 9.70 Z" fill="#121212"></path></svg>',
    sparkle: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M10.76 3.02 L12.25 9.79 L19.09 10.99 L12.00 12.67 L10.87 18.73 L10.03 12.41 L2.94 11.20 L9.58 9.64 Z" fill="#121212"></path><circle cx="19.5" cy="18.5" r="2.1" fill="#121212"></circle><circle cx="4.5" cy="20" r="1.4" fill="#121212"></circle></svg>',
    squiggle: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M2.31 15.75 C5.50 5.33 9.88 20.60 13.26 11.50 C14.96 6.92 18.76 10.45 22.47 7.11" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"></path></svg>',
    cloud: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M6.70 18.92 C0.64 19.31 0.77 11.11 7.49 11.67 C7.69 5.95 15.78 4.44 17.88 10.71 C22.65 9.84 23.95 18.82 17.25 19.12 Z" fill="#121212"></path></svg>'
  };
  function shape(kind, size){ return SHAPES[kind].replace(/SZ/g, size); }

  function paintSticker(){
    let i;
    do { i = Math.floor(Math.random() * STICKERS.length); } while (i === lastSticker);
    lastSticker = i;
    burst.innerHTML = shape(STICKERS[i], 72);
  }

  /* his sound is a sticker, never a sentence */
  function popSound(kind){
    blobSound.innerHTML = shape(kind || "squiggle", 30);
    blobSound.style.left = (parseFloat(blobert.style.left) + 8) + "px";
    blobSound.style.top = (parseFloat(blobert.style.top) - 6) + "px";
    blobSound.classList.remove("go");
    void blobSound.offsetWidth;
    blobSound.classList.add("go");
  }

  /* ---------------- the "You did it" card ---------------- */
  function finish(){
    phase = "done";
    setPose("reacting");
    card.dataset.tone = "mint";
    card.classList.add("done");
    panel.classList.add("hidden");
    waves.classList.add("hidden");
    burst.classList.remove("go");
    cardTop.classList.remove("hidden");
    headline.textContent = "You did it";
    sub.textContent = "You can now ask for the bill at a cafe.";
    paintPips(true);

    const avg = (a) => a.length ? a.reduce((x,y) => x + y, 0) / a.length : 0;
    showBars(avg(totals.sounds), avg(totals.rhythm), avg(totals.words));
    waves.classList.add("hidden");
    say.textContent = "";
    setButton("Again", false);
    minor.classList.add("hidden");
    closeTyped();
  }

  /* ---------------- where the waveforms and the bars sit ---------------- */
  function layout(){
    const top = card.classList.contains("done")
      ? 182
      : (panel.classList.contains("hidden") ? 150 : panel.offsetTop + panel.offsetHeight + 34);
    waves.style.top = top + "px";
    bars.style.top = top + "px";
  }

  function paintPips(all){
    const list = pips.children;
    for (let i = 0; i < list.length; i++){
      list[i].classList.toggle("done", !!all || i < line);
      list[i].classList.toggle("live", !all && i === line);
    }
    pips.setAttribute("aria-label", all ? "All three lines done" : "Line " + (line + 1) + " of 3");
  }

  function reset(){
    line = 0; tries = 0; lastGag = -1; lastSticker = -1;
    totals.sounds = []; totals.rhythm = []; totals.words = [];
    phase = "intro";
    card.dataset.tone = "sun";
    card.classList.remove("done");
    cardTop.classList.remove("hidden");
    headline.textContent = "Shadow duet";
    sub.textContent = "Maya says a line. Then say it with her.";
    panel.classList.add("hidden");
    waves.classList.add("hidden");
    bars.classList.add("hidden");
    blobert.classList.add("hidden");
    setPose(null);
    paintPips();
    say.textContent = canHear
      ? "Listen to Maya, then speak the line with her."
      : "Listen to Maya, then type the line with her.";
    setButton("Start", false);
    minor.classList.add("hidden");
    closeTyped();
  }

  /* ---------------- one button drives everything ---------------- */
  go.addEventListener("click", () => {
    if (phase === "intro"){ startLine(); return; }
    if (phase === "done"){ reset(); startLine(); return; }
    if (phase === "ready"){ duet(); return; }
    if (phase === "duet"){ if (rec) { try { rec.stop(); } catch(e){} } return; }
    if (skipLine) skipLine();   /* she is talking: skip to the end of the line */
  });

  minor.addEventListener("click", () => openTyped("Type the line you would say."));
  typedGo.addEventListener("click", sendTyped);
  typedIn.addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });
  function sendTyped(){
    const v = typedIn.value.trim();
    if (!v) return;
    closeTyped();
    judge(v, 0);
  }

  window.addEventListener("resize", layout);

  /* ---------------- light and dark ---------------- */
  const sw = el("switch");
  sw.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    sw.setAttribute("aria-label", dark ? "Switch to dark mode" : "Switch to light mode");
    sw.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.6"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>';
  });

  /* a small hook so the prototype can be driven in a browser check */
  window.__duet = {
    start: () => { if (line >= LINES.length) reset(); startLine(); },
    answer: (text) => judge(text, 2600),
    shadow: () => {                 /* the duet pass, without a real mic */
      phase = "duet";
      go.classList.add("live");
      setButton("I'm listening", false);
      say.textContent = "Speak along.";
      minor.classList.add("hidden");
      speakLine(1, true, () => setPose("listening"));
    },
    gag: (which) => {
      if (which) lastGag = GAGS.indexOf(which) === 0 ? 1 : 0;
      tidyUp(4);
    },
    finish: () => {
      totals.sounds = [.78,.66,.8]; totals.rhythm = [.7,.82,.74]; totals.words = [1,.67,1];
      line = 3; finish();
    },
    state: () => phase
  };

  reset();
})();
</script>
</body>
</html>
