<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>Today and the path - Learning Path prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --calm:var(--lilac);   /* the calm card: coming back, and today finished */
  --page:var(--cream); --on-page:var(--ink);
  --road-ahead:var(--paper); --road-done:var(--sun);
  --chrome:rgba(18,18,18,.62); --chrome-line:rgba(18,18,18,.3);
  --tag-bg:var(--ink); --tag-fg:var(--cream);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.8,.3,1);
}
html[data-theme="dark"]{
  --page:#121212; --on-page:#FFF7E8;
  --chrome:rgba(255,247,232,.6); --chrome-line:rgba(255,247,232,.32);
  --tag-bg:var(--cream); --tag-fg:var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-weight:600; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  transition:background .3s var(--ease), color .3s var(--ease);
}
/* ------------------------------------------------------------------ app */
.app{
  position:relative; width:min(390px,100vw); height:100%; max-height:844px;
  display:flex; flex-direction:column; overflow:hidden; background:var(--page);
}
@media (min-width:430px) and (min-height:880px){
  .app{height:844px;border-radius:40px;box-shadow:0 30px 80px rgba(18,18,18,.22)}
}
.screen{
  position:absolute; inset:0; display:none; flex-direction:column;
  padding:10px 20px 0; background:var(--page);
}
.screen.is-on{display:flex}

/* ----------------------------------------------------------- top chrome */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:48px;flex:0 0 auto}
.demo{
  position:relative;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;
  border:2px dashed var(--chrome-line); border-radius:999px; background:none;
  color:var(--chrome); font:800 10.5px/1 inherit; letter-spacing:.09em; text-transform:uppercase;
  cursor:pointer; font-family:inherit;
}
.demo:after{content:"";position:absolute;inset:-4px -6px}  /* 44px tap area */
.demo:active{transform:scale(.96)}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .3s var(--spring);
}
html[data-theme="dark"] .icon-btn{background:var(--sun)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px}

/* ------------------------------------------------------------- the card */
.card{
  position:relative; border:3px solid var(--ink); border-radius:28px; padding:22px 22px 20px;
  background:var(--sun); color:var(--ink); overflow:hidden; flex:0 0 auto;
}
.card--mint{background:var(--mint)}
h1{font:800 clamp(30px,8.6vw,36px)/1.05 inherit;letter-spacing:-.02em;margin:0 0 8px}
.line{font:600 16px/1.35 inherit;margin:0;max-width:17ch}
.card-body{display:flex;align-items:flex-start;gap:4px}
.card-copy{flex:1 1 auto;padding-top:2px}
.card-art{flex:0 0 128px;margin:-8px -6px -6px 0;align-self:flex-end}
.card-art svg{display:block;width:100%;height:auto}

/* --------------------------------------------------------------- button */
.pill{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;
  border:0;border-radius:999px;background:var(--ink);color:#fff;
  font:700 17px/1 inherit;font-family:inherit;cursor:pointer;margin-top:18px;
  transition:transform .3s var(--spring),box-shadow .3s var(--ease);
}
.pill:active{transform:scale(.965)}
.pill .go{font-size:19px;font-weight:800;transition:transform .3s var(--spring)}
.pill:hover .go{transform:translateX(4px)}
/* finished for today: the action becomes plain ink text, never a second filled button */
.pill.quiet{background:none;color:var(--ink);font-weight:700;font-size:15px;
  text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;margin-top:10px}
.pill.quiet .go{display:none}
.text-btn{
  display:block;margin:12px auto 0;background:none;border:0;color:currentColor;opacity:.85;
  font:700 14px/1 inherit;font-family:inherit;cursor:pointer;padding:12px 16px;text-decoration:underline;
  text-underline-offset:4px;text-decoration-thickness:2px;
}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:999px}
html[data-theme="dark"] .screen :focus-visible{outline-color:var(--sun)}
.card :focus-visible,.lesson :focus-visible{outline-color:var(--ink)}

/* ----------------------------------------------------------- the path */
.path-wrap{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:4px 0 2px}
.kicker{font:800 11px/1 inherit;letter-spacing:.14em;text-transform:uppercase;opacity:.62;margin:0 0 2px 2px}
.road{display:block;width:100%;height:auto;max-height:100%;overflow:visible}
.road .edge{fill:none;stroke:var(--ink);stroke-width:46;stroke-linecap:round;stroke-linejoin:round}
.road .surface{fill:none;stroke:var(--road-ahead);stroke-width:40;stroke-linecap:round}
.road .done{fill:none;stroke:var(--road-done);stroke-width:40;stroke-linecap:round;
  transition:stroke-dasharray .7s var(--ease)}
.road .dashes{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 13;opacity:.7}
.lm path,.lm circle,.lm rect,.lm line{vector-effect:non-scaling-stroke}
.lm{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;fill:var(--paper)}
.lm .solid{fill:var(--ink);stroke:none}
.lm-g{transform-box:fill-box;transform-origin:center}
.lm-next{transform:scale(1.22)}
.pulse{fill:none;stroke:var(--ink);stroke-width:3;opacity:.4;transform-box:fill-box;transform-origin:center;
  animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.72);opacity:.5}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
.tag rect{fill:var(--tag-bg)}
.tag text{fill:var(--tag-fg);font:800 13px/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em}
.leader{fill:none;stroke:var(--tag-bg);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 8;opacity:.85}
.lm-label{fill:var(--on-page);font:800 13px/1 "Plus Jakarta Sans",system-ui,sans-serif;opacity:.65}

/* ------------------------------------------------- the can-do, at the end */
.cando{height:14px;border:3px solid var(--ink);border-radius:999px;background:transparent;
  overflow:hidden;margin:4px 0 2px}
.cando b{display:block;height:100%;width:34%;background:var(--ink);border-radius:999px;
  transition:width .38s var(--spring)}
.cando.moved b{width:72%}
.return-line{margin:14px 2px 0;font:600 14px/1.35 inherit;opacity:.72;text-align:center}
/* the path, as a page headline rather than a second block colour */
.page-head{flex:0 0 auto;padding:2px 2px 0}
.page-head h1{margin-bottom:6px}

/* ------------------------------------------------------------- tab bar */
.tabs{
  flex:0 0 auto;display:flex;gap:4px;margin:10px 0 16px;padding:6px;height:68px;
  border:3px solid var(--ink);border-radius:28px;background:var(--paper);
}
html[data-theme="dark"] .tabs{background:var(--cream)}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:0;border-radius:22px;background:none;color:var(--ink);cursor:pointer;
  font:700 11.5px/1 inherit;font-family:inherit;transition:background .25s var(--ease),color .25s var(--ease);
}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.tab:active{transform:scale(.96)}

/* ---------------------------------------------------------------- week */
/* seven marks, no count: filled for a day you learned, empty for a day you did not.
   It never resets and it is never a target, so no number goes anywhere near it. */
.week{display:flex;gap:7px;align-items:flex-end;height:74px;margin:14px 0 6px}
.week i{flex:1;border:3px solid var(--ink);border-radius:10px;background:var(--paper);height:34px;
  display:block;transition:height .4s var(--spring),background .3s var(--ease)}
.week i.on{background:var(--ink);height:66px}
.week-days{display:flex;gap:7px;margin-top:8px}
.week-days span{flex:1;text-align:center;font:700 11px/1 inherit;opacity:.75}

/* ------------------------------------------------------------- lesson */
.lesson{
  position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  padding:12px 20px 20px;background:var(--tangerine);color:var(--ink);
}
.lesson.is-on{display:flex;animation:reveal .38s var(--ease) both}
@keyframes reveal{from{clip-path:circle(0% at var(--ox,50%) var(--oy,80%))}
  to{clip-path:circle(142% at var(--ox,50%) var(--oy,80%))}}
.lesson-top{display:flex;align-items:center;gap:14px;height:44px;flex:0 0 auto}
.bar{flex:1;height:12px;border:3px solid var(--ink);border-radius:999px;background:transparent;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink);width:0;transition:width .35s var(--spring)}
.close{width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;margin-left:-10px}
.close svg{width:22px;height:22px}
.stage{position:relative;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;min-height:0}
.bubble{
  position:relative;align-self:stretch;border:3px solid var(--ink);border-radius:24px;background:var(--paper);
  padding:14px 18px;font:800 23px/1.2 inherit;letter-spacing:-.02em;text-align:center;color:var(--ink);
}
.bubble:after{content:"";position:absolute;left:50%;margin-left:-28px;bottom:-13px;width:20px;height:20px;background:var(--paper);
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(-6deg,-6deg)}
.bubble small{display:block;font:600 13px/1 inherit;opacity:.6;margin-top:7px}
.lesson-art{width:234px;margin:6px 0 -2px}
.lesson-art svg{display:block;width:100%;height:auto}
.heard{
  align-self:stretch;min-height:52px;border:3px dashed var(--ink);border-radius:22px;background:transparent;
  padding:13px 18px;font:700 17px/1.2 inherit;text-align:center;color:var(--ink);opacity:.95;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.heard.good{border-style:solid;background:var(--paper)}
.heard small{font:600 13px/1.25 inherit;opacity:.72}
.typed{
  align-self:stretch;height:56px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);
  padding:0 20px;font:700 16px/1 inherit;font-family:inherit;color:var(--ink);width:100%;
}
.typed::placeholder{color:rgba(18,18,18,.42)}
.typing #mic svg{display:none}
.listening .pill{background:var(--paper);color:var(--ink);box-shadow:0 0 0 0 rgba(18,18,18,.45);animation:ring 1.4s var(--ease) infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(18,18,18,.45)}100%{box-shadow:0 0 0 22px rgba(18,18,18,0)}}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:3px;
  animation:dot 1.1s var(--ease) infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ------------------------------------------------------------ stickers */
.sticker{position:absolute;pointer-events:none}
.sticker svg{display:block;width:100%;height:100%;fill:var(--ink)}
.twinkle{animation:twinkle 4s var(--ease) infinite}
.twinkle.b{animation-delay:1.3s}.twinkle.c{animation-delay:2.6s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(.6) rotate(-12deg);opacity:.75}}
.pop-star{position:absolute;left:79%;top:30%;width:76px;height:76px;margin:-38px 0 0 -38px;pointer-events:none;
  opacity:0;z-index:5}
.pop-star svg{width:100%;height:100%;fill:var(--ink);color:var(--ink)}
.pop-star.go{animation:popstar .48s var(--spring) both}
@keyframes popstar{0%{opacity:0;transform:scale(.2) rotate(-24deg)}55%{opacity:1;transform:scale(1.12) rotate(6deg)}
  100%{opacity:0;transform:scale(1.35) rotate(10deg)}}

/* ------------------------------------------------------- maya + motion */
.maya{display:block;width:100%;height:auto}
.maya .ln{stroke:var(--ink);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.maya .fill-p{fill:var(--paper)}
.maya .fill-i{fill:var(--ink);stroke:none}
.maya .no-f{fill:none}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.8s var(--ease) infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.wave{transform-box:fill-box;transform-origin:22% 88%;animation:wave 2.6s var(--ease) infinite}
@keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(-13deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-9deg)}}
.mouth-talk .m-rest{display:none}
.mouth-talk .m-open{display:block;transform-box:fill-box;transform-origin:center;animation:talk .5s steps(2,end) infinite}
.m-open{display:none}
@keyframes talk{0%{transform:scaleY(.45)}50%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
.lean{animation:lean .45s var(--spring) forwards}
@keyframes lean{to{transform:translateX(7px) rotate(3deg)}}

.pop{animation:pop .36s var(--spring) both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.fade{animation:fade .3s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
html[data-motion="off"] .breathe,html[data-motion="off"] .wave,html[data-motion="off"] .twinkle,
html[data-motion="off"] .pulse,html[data-motion="off"] .mouth-talk .m-open{animation:none}
</style>
</head>
<body>

<!-- ======================================================== Maya, drawn -->
<template id="t-maya">
<svg class="maya" viewBox="0 0 160 214" role="img" aria-label="Maya the coach">
  <defs>
    <filter id="wob" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#wob)" class="breathe">
    <!-- hair, behind everything -->
    <path class="fill-i" d="M48,58 C44,20 62,10 80,10 C98,10 116,20 112,58 L112,98 C112,105 105,107 103,100 L103,60 C99,42 92,34 80,34 C68,34 61,42 57,60 L57,100 C55,107 48,105 48,98 Z"/>
    <!-- legs and shoes -->
    <path class="ln fill-p" d="M63,158 h15 v38 h-15 z"/>
    <path class="ln fill-p" d="M83,158 h15 v38 h-15 z"/>
    <rect class="fill-i" x="50" y="192" width="28" height="13" rx="6.5"/>
    <rect class="fill-i" x="83" y="192" width="28" height="13" rx="6.5"/>
    <!-- neck -->
    <path class="ln fill-p" d="M71,80 h18 v24 h-18 z"/>
    <!-- jumper -->
    <path class="ln fill-p" d="M53,107 C53,98 65,92 80,92 C95,92 107,98 107,107 L113,164 C113,171 100,174 80,174 C60,174 47,171 47,164 Z"/>
    <path class="ln no-f" d="M67,97 Q80,109 93,97"/>
    <!-- waving arm -->
    <g class="wave">
      <path class="ln fill-p" d="M100,106 C117,102 129,87 133,70 L118,63 C113,79 103,89 93,92 Z"/>
      <circle class="ln fill-p" cx="126" cy="59" r="11.5"/>
      <path class="ln no-f" d="M122,51 v-7 M130,52 v-7"/>
    </g>
    <!-- head -->
    <ellipse class="ln fill-p" cx="80" cy="56" rx="31" ry="33"/>
    <!-- fringe -->
    <path class="fill-i" d="M50,54 C50,29 63,18 80,18 C97,18 110,29 110,54 C103,39 96,33 86,35 C75,37 64,45 57,59 C54,57 51,56 50,54 Z"/>
    <!-- face -->
    <circle class="fill-i" cx="69" cy="60" r="4.1"/>
    <circle class="fill-i" cx="91" cy="60" r="4.1"/>
    <path class="ln no-f m-rest" d="M68,73 Q80,84 92,72"/>
    <ellipse class="ln fill-i m-open" cx="80" cy="76" rx="8.5" ry="7"/>
    <!-- ear sticker, shown while listening -->
    <path class="ln no-f ear" style="display:none" d="M118,46 q11,0 11,11 M125,39 q18,0 18,18"/>
    <!-- the held thing, then the arm over it -->
    <g class="hold hold-cup">
      <path class="ln no-f" d="M23,134 q6,-7 0,-13 M36,134 q6,-7 0,-13"/>
      <rect class="ln fill-p" x="11" y="140" width="39" height="12" rx="5"/>
      <path class="ln fill-p" d="M15,153 h31 l-4,35 h-23 z"/>
    </g>
    <g class="hold hold-star" style="display:none">
      <path class="ln fill-p" d="M34,126 L43,150 L68,153 L49,170 L55,194 L34,181 L13,194 L19,170 L0,153 L25,150 Z"/>
    </g>
    <path class="ln fill-p" d="M53,110 C44,120 40,135 40,151 L55,155 C56,140 59,128 65,119 Z"/>
    <circle class="ln fill-p" cx="47" cy="158" r="11"/>
  </g>
</svg>
</template>

<!-- ============================================================ the app -->
<div class="app" id="app">

  <!-- ------------------------------------------------------------ TODAY -->
  <section class="screen is-on" id="s-today">
    <div class="top">
      <button class="demo" id="variant" type="button">demo: <span id="variant-name">today</span></button>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch to dark mode"></button>
    </div>

    <div class="card pop" id="today-card">
      <div class="card-body">
        <div class="card-copy">
          <h1 id="today-head">Today</h1>
          <p class="line" id="today-line">Order a coffee. Ten minutes.</p>
        </div>
        <div class="card-art" data-maya="wave"></div>
      </div>
      <button class="pill" id="start" type="button"><span id="start-label">Order a coffee</span> <span class="go">&raquo;</span></button>
      <span class="sticker twinkle" style="right:14px;top:10px;width:21px;height:21px" aria-hidden="true"></span>
      <span class="sticker twinkle b" style="right:108px;top:34px;width:15px;height:15px" aria-hidden="true"></span>
      <span class="sticker twinkle c" style="right:104px;top:150px;width:13px;height:13px" aria-hidden="true"></span>
    </div>

    <div class="path-wrap pop" style="--d:90ms">
      <p class="kicker">The path</p>
      <div id="road-today"></div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Main"></nav>
  </section>

  <!-- ------------------------------------------------------------- PATH -->
  <section class="screen" id="s-path">
    <div class="top">
      <span></span>
      <button class="icon-btn" data-theme-btn type="button" aria-label="Switch theme"></button>
    </div>
    <div class="page-head pop">
      <h1>Your road</h1>
      <p class="line">You are at the lit stop.</p>
    </div>
    <div class="path-wrap pop" style="--d:90ms">
      <div id="road-path"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Main"></nav>
  </section>

  <!-- --------------------------------------------------------------- ME -->
  <section class="screen" id="s-me">
    <div class="top">
      <span></span>
      <button class="icon-btn" data-theme-btn type="button" aria-label="Switch theme"></button>
    </div>
    <div class="path-wrap" style="padding-bottom:10px">
    <div class="card pop" style="background:var(--calm)">
      <div class="card-body" style="min-height:128px">
        <div class="card-copy">
          <h1>Me</h1>
          <p class="kicker" style="opacity:.75;margin:10px 0 0 2px">This week</p>
          <div class="week" aria-label="This week">
            <i class="on"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i></i>
          </div>
          <div class="week-days" aria-hidden="true">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
        </div>
      </div>
      <button class="pill" id="dark-pill" type="button"><span id="dark-label">Dark mode</span> <span class="go">&raquo;</span></button>
    </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Main"></nav>
  </section>

  <!-- ----------------------------------------------------------- LESSON -->
  <section class="lesson" id="s-lesson" aria-hidden="true">
    <div class="lesson-top">
      <button class="close" id="lesson-close" type="button" aria-label="Close the lesson">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="bar" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><b id="lesson-bar"></b></div>
    </div>
    <div class="stage" id="lesson-stage">
      <div class="bubble pop" id="say-this">A flat white, please.<small id="say-hint">Now you.</small></div>
      <div class="lesson-art pop" style="--d:60ms" data-maya="talk"></div>
      <div class="heard pop" style="--d:120ms" id="heard" aria-live="polite">Your words go here</div>
      <span class="pop-star" id="pop-star" aria-hidden="true"></span>
    </div>
    <div id="lesson-actions">
      <button class="pill" id="mic" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <span id="mic-label">Say it</span></button>
      <button class="text-btn" id="type-toggle" type="button">Type it instead</button>
    </div>
  </section>

  <!-- ------------------------------------------------------------- DONE -->
  <section class="screen" id="s-done">
    <div class="top"><span></span>
      <button class="icon-btn" data-theme-btn type="button" aria-label="Switch theme"></button>
    </div>
    <div class="path-wrap" style="padding-bottom:10px">
      <div class="card card--mint pop" style="padding-bottom:22px">
        <div class="card-body" style="flex-direction:column;align-items:stretch">
          <div class="card-copy">
            <h1>You can order a coffee.</h1>
            <div class="cando" id="cando" role="progressbar" aria-label="What you can do"
              aria-valuemin="0" aria-valuemax="100" aria-valuenow="34"><b></b></div>
          </div>
          <div style="width:150px;align-self:center;margin:2px 0 -8px" data-maya="cheer"></div>
        </div>
        <button class="pill" id="done-again" type="button">Say it once more <span class="go">&raquo;</span></button>
        <button class="text-btn" id="done-back" type="button">Finish for today</button>
        <span class="pop-star" id="end-star" style="left:50%;top:66%" aria-hidden="true"></span>
        <span class="sticker twinkle" style="left:18px;top:158px;width:24px;height:24px" aria-hidden="true"></span>
        <span class="sticker twinkle c" style="right:22px;top:26px;width:19px;height:19px" aria-hidden="true"></span>
      </div>
      <p class="return-line">This comes back tomorrow.</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Main"></nav>
  </section>

</div>

<script>
/* =================================================================== art */
const SVG='http://www.w3.org/2000/svg';
const starPath='M50,4 C56,32 68,44 96,50 C68,56 56,68 50,96 C44,68 32,56 4,50 C32,44 44,32 50,4 Z';
const heartPath='M50,92 C12,66 6,44 18,28 C30,14 46,18 50,34 C54,18 70,14 82,28 C94,44 88,66 50,92 Z';
const sparkPath='M50,8 L58,38 L88,46 L58,54 L50,84 L42,54 L12,46 L42,38 Z';
const stickers=[starPath,heartPath,sparkPath,
  'M50,10 C60,30 70,40 90,50 C70,60 60,70 50,90 C40,70 30,60 10,50 C30,40 40,30 50,10 Z',
  'M14,62 q18,-30 36,0 q18,30 36,0',
  'M50,6 L62,36 L94,36 L68,56 L78,88 L50,69 L22,88 L32,56 L6,36 L38,36 Z'];
function svgIcon(d,solid=true){
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${solid
    ?`<path d="${d}"/>`
    :`<path d="${d}" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>`}</svg>`;
}
document.querySelectorAll('.sticker').forEach((s,i)=>{s.innerHTML=svgIcon(i%2?sparkPath:starPath)});

/* Maya, in three poses */
function maya(pose){
  const node=document.getElementById('t-maya').content.cloneNode(true);
  const svg=node.querySelector('svg');
  svg.querySelectorAll('filter').forEach(f=>{const id='wob'+Math.random().toString(36).slice(2,7);
    svg.querySelectorAll('[filter]').forEach(g=>g.setAttribute('filter','url(#'+id+')'));f.id=id;});
  if(pose==='talk'){svg.classList.add('mouth-talk');svg.querySelector('.wave').classList.remove('wave');}
  if(pose==='cheer'){
    svg.querySelector('.hold-cup').style.display='none';
    svg.querySelector('.hold-star').style.display='';
  }
  return svg;
}
document.querySelectorAll('[data-maya]').forEach(slot=>slot.appendChild(maya(slot.dataset.maya)));

/* ================================================================= road */
const STOPS=[
  {t:0.025, icon:'home', label:'Hello'},
  {t:0.285, icon:'book', label:'Numbers'},
  {t:0.555, icon:'cup',  label:'At the cafe'},
  {t:0.805, icon:'sign', label:'Ask the way'},
  {t:0.985, icon:'flag', label:'A1 done'}
];
const ROAD_D='M44,322 C112,342 232,310 246,262 C260,214 118,224 96,178 C74,132 230,144 276,106 C310,78 264,36 186,28';
const ICONS={
  home:'<path d="M-13,1 L0,-12 L13,1 L13,14 L-13,14 Z"/><path class="solid" d="M-4,4 h8 v10 h-8 z"/>',
  book:'<path d="M-13,-10 h26 v20 h-26 z"/><path d="M0,-10 V10"/>',
  cup :'<path d="M-9,-6 h18 l-2.5,19 h-13 z"/><rect x="-11.5" y="-12" width="23" height="7" rx="3"/>',
  sign:'<path d="M0,15 V-6"/><path d="M-13,-15 h19 l6,5.5 l-6,5.5 h-19 z"/>',
  flag:'<path d="M0,16 V-15"/><path d="M0,-15 L16,-8.5 L0,-2 Z"/>'
};
function buildRoad(el,{progress,next,labels}){
  el.innerHTML=
  `<svg class="road" viewBox="0 0 358 352" preserveAspectRatio="xMidYMid meet">
     <path class="edge" d="${ROAD_D}"/>
     <path class="surface" d="${ROAD_D}"/>
     <path class="done" pathLength="100" d="${ROAD_D}" stroke-dasharray="0 100"/>
     <path class="dashes" d="${ROAD_D}"/>
     <g class="marks"></g>
   </svg>`;
  const svg=el.querySelector('svg'), marks=el.querySelector('.marks'), guide=el.querySelector('.edge');
  const L=guide.getTotalLength(), W=358, H=352;
  const road=[];
  for(let i=0;i<=240;i++) road.push(guide.getPointAtLength(i/240*L));
  const taken=[];
  /* drop a label where it clears the road and the other labels */
  function place(p,w,h){
    let best=null;
    for(let a=0;a<16;a++){
      const ang=a/16*Math.PI*2, dx=Math.cos(ang), dy=Math.sin(ang);
      for(const r of [24,34,46,58]){
        const off=r+Math.abs(dx)*w/2+Math.abs(dy)*h/2;
        const cx=p.x+dx*off, cy=p.y+dy*off;
        if(cx-w/2<4||cx+w/2>W-4||cy-h/2<4||cy+h/2>H-4) continue;
        let clear=99;
        for(const s of road){
          const ex=Math.max(Math.abs(s.x-cx)-w/2,0), ey=Math.max(Math.abs(s.y-cy)-h/2,0);
          const d=Math.hypot(ex,ey); if(d<clear) clear=d;
        }
        let score=Math.min(clear,30)-r*0.06-Math.abs(dy)*2.5;
        for(const t of taken){
          if(Math.abs(t.x-cx)<(t.w+w)/2+6&&Math.abs(t.y-cy)<(t.h+h)/2+6) score-=40;
        }
        if(!best||score>best.score) best={score,cx,cy};
      }
    }
    if(!best) best={cx:p.x,cy:p.y-46};
    taken.push({x:best.cx,y:best.cy,w,h});
    return {x:best.cx-p.x,y:best.cy-p.y};
  }
  STOPS.forEach((s,i)=>{
    const p=guide.getPointAtLength(s.t*L);
    const g=document.createElementNS(SVG,'g');
    g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    const isNext=i===next, isDone=i<next;
    let inner='';
    if(isNext) inner+=`<circle class="pulse" r="27"/>`;
    inner+=`<g class="lm-g${isNext?' lm-next':''}">
      <g class="lm"${i>next?' opacity="0.8"':''}>${ICONS[s.icon]}</g>
      ${isDone?`<g transform="translate(12,-12)"><circle r="9.5" fill="var(--ink)"/>
        <path d="M-4,0.3 L-1.3,3.1 L4.1,-3.2" fill="none" stroke="var(--cream)" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/></g>`:''}
    </g>`;
    if(isNext){
      const w=s.label.length*8.2+30, o=place(p,w,32);
      const len=Math.hypot(o.x,o.y);
      if(len>34) inner+=`<path class="leader" d="M${(o.x/len*23).toFixed(1)},${(o.y/len*23).toFixed(1)}
        L${o.x.toFixed(1)},${o.y.toFixed(1)}"/>`;
      inner+=`<g class="tag"><rect x="${(o.x-w/2).toFixed(1)}" y="${(o.y-16).toFixed(1)}"
          width="${w.toFixed(0)}" height="32" rx="16"/>
        <text x="${o.x.toFixed(1)}" y="${(o.y+5).toFixed(1)}" text-anchor="middle">${s.label}</text></g>`;
    }else if(labels){
      const w=s.label.length*7.5+6, o=place(p,w,20);
      inner+=`<text class="lm-label" x="${o.x.toFixed(1)}" y="${(o.y+4.5).toFixed(1)}" text-anchor="middle">${s.label}</text>`;
    }
    g.innerHTML=inner;
    marks.appendChild(g);
  });
  requestAnimationFrame(()=>{
    svg.querySelector('.done').setAttribute('stroke-dasharray',`${progress} 100`);
  });
}

/* ================================================================ state */
const state={progress:0,next:2,variant:'today',tab:'today',turn:0,lastSticker:-1};
/* The three Today states. Copy follows the ruled patterns: the act first, the size
   second, the button names the act, and the return card carries no count at all. */
const SCENES={
  today:{head:'Today',line:'Order a coffee. Ten minutes.',btn:'Order a coffee',
         name:'today',bg:'var(--sun)',quiet:false,wave:true},
  back :{head:'Carry on',line:'Order a coffee again. Three minutes.',btn:'Order a coffee',
         name:'coming back',bg:'var(--calm)',quiet:false,wave:false},
  rest :{head:'That is today done',line:'Tomorrow, something new.',btn:'Do one more',
         name:'after a session',bg:'var(--calm)',quiet:true,wave:false}
};
function paintToday(){
  const s=SCENES[state.variant];
  document.getElementById('today-head').textContent=s.head;
  document.getElementById('today-line').textContent=s.line;
  document.getElementById('start-label').textContent=s.btn;
  document.getElementById('variant-name').textContent=s.name;
  const card=document.getElementById('today-card');
  card.style.background=s.bg;
  document.getElementById('start').classList.toggle('quiet',s.quiet);
  /* coming back and finished: she is settled and neutral, never pleading */
  const arm=card.querySelector('.maya .wave,.maya .rest-arm');
  if(arm) arm.setAttribute('class',s.wave?'wave':'rest-arm');
  replay(card);
  buildRoad(document.getElementById('road-today'),{progress:state.progress,next:state.next,labels:false});
}
function replay(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}

/* ================================================================= tabs */
const TABICON={
  today:'<path d="M12 3v2.4M12 18.6V21M4.2 12H2m20 0h-2.2M5.6 5.6 4 4m14.4 1.6L20 4M5.6 18.4 4 20m14.4-1.6L20 20"/><circle cx="12" cy="12" r="4.4"/>',
  path :'<path d="M5 20c0-4 6-3 6-7s-5-3-5-6 4-3 8-3"/><circle cx="18.5" cy="5" r="2"/><circle cx="5.5" cy="20" r="2"/>',
  me   :'<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.4-4 4.3-5.6 7.5-5.6s6.1 1.6 7.5 5.6"/>'
};
document.querySelectorAll('.tabs').forEach(bar=>{
  bar.innerHTML=['today','path','me'].map(k=>
    `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k==='today'}" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">${TABICON[k]}</svg>
      ${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
});
function go(tab){
  state.tab=tab;
  const id=tab==='done'?'s-done':'s-'+tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('is-on',s.id===id));
  const lit=tab==='done'?'today':tab;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===lit)));
  const on=document.getElementById(id);
  on.querySelectorAll('.pop').forEach(replay);
  if(tab==='path') buildRoad(document.getElementById('road-path'),{progress:state.progress,next:state.next,labels:true});
  if(tab==='today') paintToday();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return; go(t.dataset.tab);
});

/* ================================================================ theme */
function setTheme(mode){
  document.documentElement.dataset.theme=mode;
  document.querySelector('meta[name=theme-color]').content=mode==='dark'?'#121212':'#FFF7E8';
  const dark=mode==='dark';
  document.querySelectorAll('.icon-btn').forEach(b=>{
    b.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
    b.innerHTML=dark
      ?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9 6.7 6.7M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>`
      :`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>`;
  });
  document.getElementById('dark-label').textContent=dark?'Light mode':'Dark mode';
}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
document.addEventListener('click',e=>{
  if(e.target.closest('#theme')||e.target.closest('[data-theme-btn]')||e.target.closest('#dark-pill')) toggleTheme();
});

/* ============================================================== variant */
document.getElementById('variant').addEventListener('click',()=>{
  state.variant=state.variant==='today'?'back':(state.variant==='back'?'rest':'today');
  if(state.variant==='rest'){state.progress=78;state.next=3;}
  else{state.progress=50;state.next=2;}
  paintToday();
});

/* =============================================================== lesson */
const TURNS=[
  {say:'A flat white, please.',hint:'Maya says it. Now you.'},
  {say:'Thank you.',hint:'One more. Say it back.'}
];
const lesson=document.getElementById('s-lesson');
const heard=document.getElementById('heard');
const micBtn=document.getElementById('mic');
const micLabel=document.getElementById('mic-label');
const typeToggle=document.getElementById('type-toggle');
let typedBox=null, rec=null, listening=false;

function openLesson(ev){
  if(state.variant==='rest'){go('path');return;}
  const r=(ev&&ev.currentTarget)?ev.currentTarget.getBoundingClientRect():null;
  const box=document.getElementById('app').getBoundingClientRect();
  if(r){
    lesson.style.setProperty('--ox',((r.left+r.width/2-box.left)/box.width*100).toFixed(1)+'%');
    lesson.style.setProperty('--oy',((r.top+r.height/2-box.top)/box.height*100).toFixed(1)+'%');
  }
  state.turn=0;
  lesson.classList.add('is-on'); lesson.setAttribute('aria-hidden','false');
  paintTurn();
  setTimeout(()=>micBtn.focus({preventScroll:true}),420);
}
function closeLesson(){
  stopListening();
  lesson.classList.remove('is-on'); lesson.setAttribute('aria-hidden','true');
  document.getElementById('start').focus({preventScroll:true});
}
function paintTurn(){
  const t=TURNS[state.turn];
  document.getElementById('say-this').firstChild.textContent=t.say;
  document.getElementById('say-hint').textContent=t.hint;
  heard.textContent='Tap the button and say it';
  heard.classList.remove('good');
  const bar=document.getElementById('lesson-bar');
  bar.style.width=(state.turn/TURNS.length*100)+'%';
  bar.parentElement.setAttribute('aria-valuenow',String(state.turn));
  ['#say-this','.lesson-art','#heard'].forEach(sel=>replay(lesson.querySelector(sel)));
}
function normalise(s){return s.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);}
function close_enough(said){
  const want=normalise(TURNS[state.turn].say), got=normalise(said);
  if(!got.length) return false;
  const hits=want.filter(w=>got.includes(w)).length;
  return hits/want.length>=0.6;
}
/* one of six, and never the same as the last one that popped */
function popSticker(id){
  let i; do{i=Math.floor(Math.random()*stickers.length);}while(i===state.lastSticker);
  state.lastSticker=i;
  const el=document.getElementById(id||'pop-star');
  el.innerHTML=svgIcon(stickers[i],i!==4);
  el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
}
function accept(said){
  stopListening();
  heard.textContent='“'+said+'”';
  heard.classList.add('good');
  popSticker();
  const art=lesson.querySelector('.lesson-art');
  art.classList.add('lean');setTimeout(()=>art.classList.remove('lean'),700);
  setTimeout(()=>{
    state.turn++;
    if(state.turn>=TURNS.length) finish();
    else {paintTurn();hideTyped();}
  },900);
}
function finish(){
  document.getElementById('lesson-bar').style.width='100%';
  setTimeout(()=>{
    lesson.classList.remove('is-on'); lesson.setAttribute('aria-hidden','true');
    hideTyped();
    state.progress=78; state.next=3; state.variant='rest';
    go('done');
    document.getElementById('done-back').focus({preventScroll:true});
  },420);
}

/* ---- speech, with a typed fallback ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startListening(){
  if(!SR){showTyped('Mic not available here. Type it.');return;}
  try{
    rec=new SR(); rec.lang='en-GB'; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=e=>{
      const said=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();
      heard.textContent='“'+said+'”';
      if(e.results[e.results.length-1].isFinal){
        if(close_enough(said)) accept(said);
        else{stopListening();heard.textContent='Nearly. Listen and try again.';}
      }
    };
    rec.onerror=()=>{stopListening();showTyped('No mic here. Type it instead.');};
    rec.onend=()=>{if(listening) stopListening();};
    rec.start(); listening=true;
    lesson.classList.add('listening');
    micLabel.innerHTML='Listening<span class="dots"><i></i><i></i><i></i></span>';
    heard.textContent='…';
    const art=lesson.querySelector('.lesson-art svg');
    if(art){art.querySelector('.ear').style.display='';art.classList.remove('mouth-talk');}
  }catch(err){showTyped('No mic here. Type it instead.');}
}
function stopListening(){
  listening=false;
  try{rec&&rec.stop();}catch(e){}
  lesson.classList.remove('listening');
  if(!typedBox) micLabel.textContent='Say it';
  const art=lesson.querySelector('.lesson-art svg');
  if(art){art.querySelector('.ear').style.display='none';art.classList.add('mouth-talk');}
}
function showTyped(msg){
  stopListening();
  if(msg) heard.textContent=msg;
  if(typedBox) {typedBox.focus();return;}
  typedBox=document.createElement('input');
  typedBox.className='typed pop'; typedBox.type='text'; typedBox.autocomplete='off';
  typedBox.setAttribute('aria-label','Type what you would say');
  typedBox.placeholder='Type what you say';
  lesson.querySelector('#lesson-actions').insertBefore(typedBox,micBtn);
  typedBox.style.marginBottom='12px';
  lesson.classList.add('typing');
  micLabel.textContent='Send';
  typeToggle.textContent='Use the mic instead';
  typedBox.addEventListener('keydown',e=>{if(e.key==='Enter') submitTyped();});
  typedBox.focus({preventScroll:true});
}
function hideTyped(){
  if(!typedBox) return;
  typedBox.remove(); typedBox=null;
  lesson.classList.remove('typing');
  micLabel.textContent='Say it';
  typeToggle.textContent='Type it instead';
}
function submitTyped(){
  const v=(typedBox&&typedBox.value||'').trim();
  if(!v){typedBox.focus();return;}
  if(close_enough(v)) accept(v);
  else {heard.textContent='Nearly. Look at the line and try again.';typedBox.select();}
}

document.getElementById('start').addEventListener('click',openLesson);
document.getElementById('lesson-close').addEventListener('click',closeLesson);
micBtn.addEventListener('click',()=>{
  if(typedBox) return submitTyped();
  if(listening) return stopListening();
  startListening();
});
typeToggle.addEventListener('click',()=>{typedBox?(hideTyped(),heard.textContent='Tap the button and say it'):showTyped('');});
document.getElementById('done-back').addEventListener('click',()=>go('today'));
document.getElementById('done-again').addEventListener('click',()=>{go('today');setTimeout(()=>{
  state.variant='today';state.progress=50;state.next=2;paintToday();openLesson();},120);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lesson.classList.contains('is-on')) closeLesson();});

/* =================================================================== go */
state.progress=50;
setTheme('light');
paintToday();
</script>
</body>
</html>
