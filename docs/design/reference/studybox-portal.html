<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Studybox Staff Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;
  --radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--radius-full:999px;
  --topbar-h:56px;--sidebar-w:240px;--sidebar-w-c:64px;--content-max:1280px;--tray-w:480px;--panel-w:440px;
  --row:40px;
  --violet-50:#F5F3FF;--violet-100:#EDE9FE;--violet-200:#DDD6FE;--violet-300:#C4B5FD;--violet-400:#A78BFA;
  --violet-500:#7C5CE6;--violet-600:#6A4BD6;--violet-700:#5B3FBF;--violet-800:#4A3299;
  --sidebar-bg:#2A1F5E;--sidebar-hover:#352A6E;--sidebar-active:#1F1647;--sidebar-text:#FFFFFF;--sidebar-muted:#C4B5FD;--sidebar-accent:#A78BFA;
  --ink:#1B1830;--ink-2:#4B4766;--ink-3:#6F6B85;--ink-dis:#A9A6BA;
  --surface-0:#FFFFFF;--surface-1:#FBFAFD;--surface-2:#F6F5FA;--surface-3:#EFEDF6;
  --line:#E4E2EE;--line-strong:#CBC8DA;--overlay:rgba(27,24,48,.55);
  --success:#1F7A4D;--success-i:#218358;--success-f:#30A46C;--success-t:#E6F6EB;
  --warning:#8A5200;--warning-i:#AB6400;--warning-f:#E0A100;--warning-t:#FFF4D6;
  --danger:#B3261E;--danger-i:#CE2C31;--danger-f:#E5484D;--danger-t:#FEEBEC;
  --info:#0B5CAB;--info-i:#0D74CE;--info-f:#3B8FE3;--info-t:#E6F1FC;
  --band1:#E5484D;--band1-t:#FEEBEC;--band2:#F5A623;--band2-t:#FFF4D6;--band3:#30A46C;--band3-t:#E6F6EB;--band4:#0D74CE;--band4-t:#E6F1FC;
  --sk-read:#2B7ABC;--sk-write:#1F8A4D;--sk-listen:#E06C00;--sk-speak:#C9A200;--sk-lang:#0F8A8F;
  --chart-1:#5B3FBF;--chart-2:#0F8A8F;--chart-3:#E06C00;--chart-4:#C54396;--chart-5:#2B7ABC;
  --shadow-1:0 1px 2px rgba(27,24,48,.08),0 1px 3px rgba(27,24,48,.06);
  --shadow-2:0 4px 8px -2px rgba(27,24,48,.12),0 2px 4px -2px rgba(27,24,48,.08);
  --shadow-3:0 8px 16px -4px rgba(27,24,48,.18),0 0 1px rgba(27,24,48,.3);
  --shadow-4:0 20px 32px -8px rgba(27,24,48,.28);
  --dur-fast:120ms;--dur-base:180ms;--dur-panel:300ms;--ease:cubic-bezier(.2,0,0,1);
  --font:"Plus Jakarta Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EEEAF7;--ink-2:#BBB5D0;--ink-3:#9691AE;--ink-dis:#5F5A78;
  --surface-0:#1B1826;--surface-1:#14121F;--surface-2:#221E31;--surface-3:#2A2540;
  --line:#2C2740;--line-strong:#3D3757;--overlay:rgba(0,0,0,.6);
  --violet-50:#221B45;--violet-100:#2A2150;--violet-200:#352A6E;--violet-500:#A78BFA;--violet-600:#8B6CF0;--violet-700:#A78BFA;--violet-800:#C4B5FD;
  --sidebar-bg:#171332;--sidebar-hover:#221B45;--sidebar-active:#0F0C22;
  --success:#5CC98E;--success-t:#153426;--warning:#F2B84B;--warning-t:#3A2C10;--danger:#F08A8A;--danger-t:#3B1A1E;--info:#7CB8F5;--info-t:#122A45;
  --band1-t:#3B1A1E;--band2-t:#3A2C10;--band3-t:#153426;--band4-t:#122A45;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);--shadow-2:0 4px 8px rgba(0,0,0,.5);--shadow-3:0 8px 16px rgba(0,0,0,.6);--shadow-4:0 20px 32px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ink:#EEEAF7;--ink-2:#BBB5D0;--ink-3:#9691AE;--ink-dis:#5F5A78;
  --surface-0:#1B1826;--surface-1:#14121F;--surface-2:#221E31;--surface-3:#2A2540;
  --line:#2C2740;--line-strong:#3D3757;--overlay:rgba(0,0,0,.6);
  --violet-50:#221B45;--violet-100:#2A2150;--violet-200:#352A6E;--violet-500:#A78BFA;--violet-600:#8B6CF0;--violet-700:#A78BFA;--violet-800:#C4B5FD;
  --sidebar-bg:#171332;--sidebar-hover:#221B45;--sidebar-active:#0F0C22;
  --success:#5CC98E;--success-t:#153426;--warning:#F2B84B;--warning-t:#3A2C10;--danger:#F08A8A;--danger-t:#3B1A1E;--info:#7CB8F5;--info-t:#122A45;
  --band1-t:#3B1A1E;--band2-t:#3A2C10;--band3-t:#153426;--band4-t:#122A45;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);--shadow-2:0 4px 8px rgba(0,0,0,.5);--shadow-3:0 8px 16px rgba(0,0,0,.6);--shadow-4:0 20px 32px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-1);color:var(--ink);font-family:var(--font);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--violet-700);text-decoration:none}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface-0),0 0 0 4px var(--violet-500)}
.rail :focus-visible{box-shadow:0 0 0 2px var(--sidebar-bg),0 0 0 4px var(--violet-300)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px;line-height:28px}h2{font-size:20px;line-height:24px}h3{font-size:16px;line-height:24px}h4{font-size:14px;line-height:20px}
p{margin:0}
.muted{color:var(--ink-3)}.small{font-size:12px;line-height:16px}.mono{font-family:var(--mono);font-size:12px}
.hidden{display:none!important}

/* shell */
#app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns var(--dur-panel) var(--ease)}
#app.collapsed{grid-template-columns:var(--sidebar-w-c) minmax(0,1fr)}
.rail{background:var(--sidebar-bg);color:var(--sidebar-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 10px;overflow:hidden}
.rail .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 16px;color:#fff}
.rail .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#A78BFA,#7C5CE6);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 28px}
.rail .brand b{font-size:14px;white-space:nowrap}
.rail .brand span{display:block;font-size:11px;color:var(--sidebar-muted);white-space:nowrap}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;color:var(--sidebar-text);font-weight:500;white-space:nowrap;position:relative}
.rail nav a svg{width:20px;height:20px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.rail nav a:hover{background:var(--sidebar-hover)}
.rail nav a.active{background:var(--sidebar-active)}
.rail nav a.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--sidebar-accent)}
.rail nav a .cnt{margin-left:auto;background:var(--sidebar-accent);color:#1F1647;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.rail .sect{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sidebar-muted);padding:14px 10px 6px;white-space:nowrap}
.rail .bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.rail .user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px}
.rail .user .av{width:28px;height:28px;border-radius:50%;background:#A78BFA;color:#1F1647;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 28px}
.rail .user div{white-space:nowrap;overflow:hidden}
.rail .user b{display:block;font-size:13px}
.rail .user span{font-size:11px;color:var(--sidebar-muted)}
.rail .collapse{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:8px;color:var(--sidebar-muted);font-size:12px;white-space:nowrap}
.rail .collapse:hover{background:var(--sidebar-hover)}
#app.collapsed .rail{padding:12px 8px}
#app.collapsed .rail .brand b,#app.collapsed .rail .brand span,#app.collapsed .rail nav a .lbl,#app.collapsed .rail .sect,#app.collapsed .rail .user div,#app.collapsed .rail .collapse span{display:none}
#app.collapsed .rail nav a{justify-content:center;padding:0}
#app.collapsed .rail nav a .cnt{position:absolute;top:4px;right:4px}
#app.collapsed .rail nav a.active::before{left:-8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:var(--surface-0);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar .seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;font-weight:500;color:var(--ink-2);font-size:13px}
.seg button.on{background:var(--surface-0);color:var(--ink);box-shadow:var(--shadow-1)}
.topbar .search{flex:0 1 320px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface-1);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink-3);font-size:13px}
.topbar .search kbd{margin-left:auto}
.topbar .grow{flex:1}
.topbar .fresh{font-size:12px;color:var(--ink-3)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-2);position:relative}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg,.btn svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--danger-f);border:2px solid var(--surface-0)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;height:20px;display:inline-grid;place-items:center;background:var(--surface-0);color:var(--ink-2)}
.content{padding:24px 32px 80px;max-width:var(--content-max);width:100%}
.content.full{max-width:none}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead .t{flex:1;min-width:240px}
.pagehead .t h1{margin-bottom:4px}
.pagehead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:13px}
.pagehead .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-3);margin-bottom:12px}
.crumbs a{color:var(--ink-3)}.crumbs a:hover{color:var(--violet-700)}
.crumbs b{color:var(--ink-2);font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-weight:600;font-size:13px;border:1px solid var(--line-strong);background:var(--surface-0);color:var(--ink);white-space:nowrap;transition:background var(--dur-fast)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--violet-600);border-color:var(--violet-600);color:#fff}
.btn.primary:hover{background:var(--violet-700);border-color:var(--violet-700)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger-f)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.lg{height:40px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .k{margin-left:4px;opacity:.7}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.violet{background:var(--violet-100);color:var(--violet-800)}
.pill.ok{background:var(--success-t);color:var(--success)}
.pill.warn{background:var(--warning-t);color:var(--warning)}
.pill.bad{background:var(--danger-t);color:var(--danger)}
.pill.info{background:var(--info-t);color:var(--info)}
.pill.outline{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lvl{font-family:var(--mono);font-weight:500}
.lvl.A2{background:#FCE7D6;color:#8A3A00}.lvl.B1{background:#E6F1FC;color:#0B5CAB}.lvl.B1p{background:#E0F2F2;color:#0B6B6F}.lvl.B2{background:var(--violet-100);color:var(--violet-800)}
:root[data-theme="dark"] .lvl.A2,:root:not([data-theme="light"]) .lvl.A2{background:#3A2210;color:#F5B27A}
.sk{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* cards, tiles */
.card{background:var(--surface-0);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-1)}
.card .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card .ch h3{flex:1;font-size:14px;line-height:20px}
.card .cb{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface-0);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow-1);text-align:left;display:block;position:relative;transition:border-color var(--dur-fast)}
.tile:hover{border-color:var(--violet-300)}
.tile .lbl{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.tile .lbl .info{margin-left:auto;color:var(--ink-dis)}
.tile .val{font-size:28px;line-height:32px;font-weight:600;margin:4px 0 2px;display:flex;align-items:baseline;gap:10px}
.tile .val .d{font-size:12px;font-weight:600}
.tile .val .d.up{color:var(--danger)}.tile .val .d.down{color:var(--success)}
.tile .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.tile .rule{display:none;position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--ink);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;line-height:16px;z-index:5;box-shadow:var(--shadow-3)}
.tile:hover .rule,.tile:focus-visible .rule{display:block}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.grid-2eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media (max-width:1100px){.grid2,.grid3,.grid-2eq{grid-template-columns:1fr}}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface-0);box-shadow:var(--shadow-1)}
table.dt{border-collapse:collapse;width:100%;font-size:13px}
.dt th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-3);font-size:12px;font-weight:600;text-align:left;padding:0 12px;height:36px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.dt th.sortable{cursor:pointer;user-select:none}.dt th.sortable:hover{color:var(--ink)}
.dt th .arr{margin-left:4px;color:var(--violet-600)}
.dt td{padding:0 12px;height:var(--row);border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr{transition:background var(--dur-fast)}
.dt tbody tr:hover{background:var(--surface-1)}
.dt tbody tr.sel{background:var(--violet-50)}
.dt tbody tr.click{cursor:pointer}
.dt td.num,.dt th.num{text-align:right}
.dt td.wrap{white-space:normal;min-width:220px}
.dt .name{font-weight:600;color:var(--ink)}
.dt .sub{font-size:12px;color:var(--ink-3)}
.dt input[type=checkbox]{width:16px;height:16px;accent-color:var(--violet-600);margin:0;display:block}
.dt .rowact{opacity:0;transition:opacity var(--dur-fast)}
.dt tr:hover .rowact,.dt tr:focus-within .rowact{opacity:1}
.dens-compact{--row:32px}.dens-comfortable{--row:48px}
.bar6{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--surface-3);vertical-align:middle;margin-left:8px;overflow:hidden}
.bar6 i{display:block;height:100%;background:var(--violet-500);border-radius:3px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--violet-100);color:var(--violet-800);font-size:11px;font-weight:700;flex:0 0 28px}
.av.sm{width:22px;height:22px;font-size:10px;flex-basis:22px}
.who{display:flex;align-items:center;gap:8px}

/* toolbar + filters + tabs */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.input{height:32px;border:1px solid var(--line-strong);border-radius:6px;padding:0 10px;background:var(--surface-0);min-width:0}
.input:focus{border-color:var(--violet-500)}
select.input{padding-right:24px}
.input.search{min-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface-0)}
.chip.on{background:var(--violet-100);border-color:var(--violet-300);color:var(--violet-800)}
.chip .x{opacity:.6}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{height:38px;padding:0 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--violet-700);border-bottom-color:var(--violet-600)}
.tabs button .cnt{background:var(--surface-3);color:var(--ink-2);font-size:11px;padding:0 6px;border-radius:999px;height:18px;display:inline-grid;place-items:center}
.views{display:flex;gap:2px;margin-bottom:10px}
.views button{height:32px;padding:0 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--ink-3)}
.views button.on{background:var(--surface-3);color:var(--ink)}
.selbar{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:8px 8px 0 0;padding:0 12px;height:44px;position:sticky;top:0;z-index:2}
.selbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.selbar .btn:hover{background:rgba(255,255,255,.1)}
.selbar b{font-weight:600;margin-right:6px}

/* lists */
.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:48px}
.list .row:last-child{border-bottom:0}
.list .row .t{flex:1;min-width:0}
.list .row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .row .t span{font-size:12px;color:var(--ink-3)}
.list .row.click{cursor:pointer}.list .row.click:hover{background:var(--surface-1)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.grouphead{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;padding:10px 16px 4px;background:var(--surface-1)}

/* today strip and class cards */
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px}
.sess{flex:0 0 240px;background:var(--surface-0);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:6px}
.sess .time{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sess b{font-size:14px}
.sess .room{font-size:12px;color:var(--ink-3)}
.sess.done{border-color:var(--success-f)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}
.ccard{background:var(--surface-0);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-1);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:box-shadow var(--dur-fast)}
.ccard:hover{box-shadow:var(--shadow-2)}
.ccard .top{height:6px}
.ccard .body{padding:12px 16px 8px}
.ccard .body b{display:block;font-size:15px}
.ccard .body span{font-size:12px;color:var(--ink-3)}
.ccard .foot{display:flex;gap:4px;padding:6px 10px 10px;border-top:1px solid var(--line);margin-top:auto}
.ccard .foot .iconbtn{width:36px;height:32px}
.ccard .foot .iconbtn .b{position:absolute;top:2px;right:2px;background:var(--violet-600);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* heatmap */
.heat{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface-0);max-height:560px}
.heat table{border-collapse:separate;border-spacing:0;font-size:12px}
.heat th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:600;color:var(--ink-3);padding:6px 4px;height:84px;vertical-align:bottom;min-width:44px;max-width:44px;border-bottom:1px solid var(--line)}
.heat th div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:74px;font-weight:500}
.heat th:first-child,.heat td:first-child{position:sticky;left:0;background:var(--surface-0);z-index:3;min-width:220px;max-width:220px;text-align:left;padding:0 12px;border-right:1px solid var(--line)}
.heat th:first-child{z-index:4;background:var(--surface-2)}
.heat td{padding:2px;height:40px;border-bottom:1px solid var(--line)}
.heat td:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .cell{width:40px;height:36px;border-radius:4px;display:grid;place-items:center;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent}
.heat .cell:hover{border-color:var(--ink)}
.cell.b1{background:var(--band1-t);color:var(--danger)}.cell.b2{background:var(--band2-t);color:var(--warning)}.cell.b3{background:var(--band3-t);color:var(--success)}.cell.b4{background:var(--band4-t);color:var(--info)}
.cell.none{background:var(--surface-2);color:var(--ink-dis);border:1px dashed var(--line-strong)}
.cell.prog{background:transparent;color:var(--ink-3);border:1px solid var(--line-strong)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* side rail */
.withrail{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:1100px){.withrail{grid-template-columns:1fr}}
.rail2 .card{margin-bottom:12px}
.rail2 .row{padding:8px 12px}

/* tray / modal / palette */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:50;opacity:0;transition:opacity var(--dur-base)}
.scrim.show{opacity:1}
.tray{position:fixed;top:0;right:0;bottom:0;width:var(--tray-w);max-width:100vw;background:var(--surface-0);box-shadow:var(--shadow-3);z-index:51;display:flex;flex-direction:column;transform:translateX(100%);transition:transform var(--dur-panel) var(--ease)}
.tray.show{transform:none}
.tray .th{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.tray .th h2{flex:1;font-size:18px}
.tray .tb{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.tray .tf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-1)}
.tray .tf .left{margin-right:auto;font-size:12px;color:var(--ink-3);align-self:center}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);background:var(--surface-0);border-radius:12px;box-shadow:var(--shadow-4);z-index:52;display:flex;flex-direction:column;opacity:0;transition:opacity var(--dur-base),transform var(--dur-base)}
.modal.show{opacity:1;transform:translate(-50%,-50%)}
.modal.sm{width:480px}.modal.lg{width:760px}
.modal .th{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .th h2{flex:1;font-size:18px}
.modal .tb{padding:16px 20px;overflow-y:auto}
.modal .tf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-1);border-radius:0 0 12px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--danger)}
.field.invalid .input{border-color:var(--danger-f)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:72px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
.checks input{accent-color:var(--violet-600);width:16px;height:16px;margin:0}
.alert{border-radius:6px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.danger{background:var(--danger-t);color:var(--danger)}
.alert.info{background:var(--info-t);color:var(--info)}
.alert.warn{background:var(--warning-t);color:var(--warning)}

/* assign tray specifics */
.tree{border:1px solid var(--line);border-radius:6px;max-height:260px;overflow-y:auto}
.tree .u{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);font-weight:600;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
.tree .u svg{width:14px;height:14px;transition:transform var(--dur-fast)}
.tree .u.open svg{transform:rotate(90deg)}
.tree .i{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 28px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.tree .i:hover{background:var(--surface-1)}
.tree .i.sel{background:var(--violet-50)}
.tree .i input{accent-color:var(--violet-600);margin:0}
.tree .i .tp{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.tree .i .prev{font-size:11px;color:var(--warning);white-space:nowrap}
.acard{border:1px solid var(--line);border-radius:0 8px 8px 0;border-left:4px solid var(--violet-500);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.acard .del{position:absolute;top:8px;right:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;align-items:center}
.tags .tag{display:inline-flex;align-items:center;gap:4px;background:var(--violet-100);color:var(--violet-800);font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.tags .tag button{opacity:.7;font-size:12px}
.tags input{border:0;background:transparent;flex:1;min-width:120px;height:24px;outline:none}
.people{border:1px solid var(--line);border-radius:6px;max-height:180px;overflow-y:auto}
.people label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.people label:last-child{border-bottom:0}
.people input{accent-color:var(--violet-600);margin:0}
.verb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verb button{border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;text-align:left;background:var(--surface-0)}
.verb button b{display:block;font-size:14px}
.verb button span{font-size:12px;color:var(--ink-3)}
.verb button.on{border-color:var(--violet-500);background:var(--violet-50);box-shadow:inset 0 0 0 1px var(--violet-500)}
.summary{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.summary b{color:var(--ink)}

/* marking desk */
.desk{position:fixed;inset:0;z-index:40;background:var(--surface-1);display:flex;flex-direction:column}
.desk .dh{height:56px;background:var(--sidebar-bg);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;flex:0 0 56px}
.desk .dh .back{display:flex;align-items:center;gap:6px;color:var(--sidebar-muted);font-weight:600;font-size:13px}
.desk .dh .back:hover{color:#fff}
.desk .dh .title{flex:1;min-width:0}
.desk .dh .title b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk .dh .title span{font-size:12px;color:var(--sidebar-muted)}
.desk .dh .nav{display:flex;align-items:center;gap:6px}
.desk .dh .nav .iconbtn{color:#fff}.desk .dh .nav .iconbtn:hover{background:var(--sidebar-hover)}
.desk .dh select{height:32px;border-radius:6px;border:1px solid var(--sidebar-hover);background:var(--sidebar-active);color:#fff;padding:0 8px;max-width:220px}
.desk .dh .cnt{font-family:var(--mono);font-size:12px;color:var(--sidebar-muted)}
.desk .db{flex:1;display:grid;grid-template-columns:minmax(480px,3fr) 6px minmax(360px,2fr);min-height:0}
.desk .dl{overflow-y:auto;padding:24px 32px;background:var(--surface-0)}
.desk .split{background:var(--line);cursor:col-resize}
.desk .split:hover{background:var(--violet-300)}
.desk .dr{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;background:var(--surface-1);border-left:1px solid var(--line)}
.paper{max-width:68ch;font-size:16px;line-height:1.7;color:var(--ink)}
.paper .prompt{font-size:13px;color:var(--ink-3);border-left:3px solid var(--line-strong);padding:4px 12px;margin-bottom:16px;line-height:1.4}
.paper .prompt b{color:var(--ink-2)}
.paper .meta{font-size:12px;color:var(--ink-3);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap}
.paper mark{background:transparent;border-bottom:2px solid;padding-bottom:1px;cursor:help;border-radius:0;color:inherit}
.paper mark.art{border-color:#E06C00}.paper mark.tense{border-color:#C54396}.paper mark.form{border-color:#2B7ABC}.paper mark.prep{border-color:#0F8A8F}.paper mark.agr{border-color:#B3261E}.paper mark.punct{border-color:#8A8A8A}.paper mark.sp{border-color:#9E58BD}
.paper mark.hi{background:var(--warning-t)}
.paper.plain mark{border-color:transparent}
.typekey{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:20px}
.typekey i{display:inline-block;width:14px;height:0;border-bottom:2px solid;vertical-align:middle;margin-right:5px}
.transcript{display:flex;flex-wrap:wrap;gap:3px 6px;font-size:16px;line-height:1.7}
.transcript span{padding:0 2px;border-radius:3px;cursor:pointer}
.transcript span.c1{background:#FEEBEC;color:#8A1C1C}.transcript span.c2{background:#FFF4D6;color:#6B4200}.transcript span.c3{background:transparent}
.transcript span.cur{outline:2px solid var(--violet-500)}
.wave{display:flex;align-items:flex-end;gap:2px;height:48px;margin:12px 0;cursor:pointer}
.wave i{flex:1;background:var(--violet-200);border-radius:1px;min-width:2px}
.wave i.played{background:var(--violet-500)}
.player{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.aze{border:1px solid var(--violet-200);background:var(--surface-0);border-radius:8px;overflow:hidden}
.aze .ah{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--violet-50);border-bottom:1px solid var(--violet-200)}
.aze .ah b{font-size:13px}
.aze .ah .conf{margin-left:auto;font-size:12px;color:var(--ink-3)}
.aze .overall{display:flex;align-items:center;gap:12px;padding:12px}
.aze .overall .big{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--violet-800)}
.aze .overall .st{font-size:12px;color:var(--ink-3)}
.crit{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.crit .cr{display:flex;align-items:center;gap:8px}
.crit .cr b{font-size:13px;flex:1}
.segs{display:inline-flex;gap:2px}
.segs button{width:26px;height:22px;border-radius:4px;background:var(--surface-3);font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-3);border:1px solid transparent}
.segs button.on{background:var(--violet-600);color:#fff}
.segs button.ai{border-color:var(--violet-500);color:var(--violet-800)}
.segs button:hover{border-color:var(--violet-500)}
.segs.locked button{cursor:default}
.crit .cm{font-size:13px;color:var(--ink-2);line-height:18px}
.evch{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--violet-800);background:var(--violet-100);border-radius:4px;padding:1px 6px;cursor:pointer;vertical-align:1px}
.evch:hover{background:var(--violet-200)}
.decide{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:12px;border-top:1px solid var(--line);background:var(--surface-1)}
.decide .btn{justify-content:center}
.decide .btn.on{background:var(--violet-100);border-color:var(--violet-500);color:var(--violet-800)}
.state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface-0);color:var(--ink-2)}
.qchips button:hover{border-color:var(--violet-500);color:var(--violet-800)}
.cb-wrap{position:relative}
.cb-sug{position:absolute;left:0;right:0;top:100%;background:var(--surface-0);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow-2);z-index:5;max-height:160px;overflow-y:auto}
.cb-sug button{display:block;width:100%;text-align:left;padding:6px 10px;font-size:13px}
.cb-sug button:hover,.cb-sug button.on{background:var(--violet-50)}
.comments{display:flex;flex-direction:column;gap:8px}
.cmt{background:var(--surface-0);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.cmt .h{display:flex;gap:8px;font-size:11px;color:var(--ink-3);margin-bottom:2px}
.cmt .h b{color:var(--ink-2)}
.cmt.audio{display:flex;gap:10px;align-items:center}
.desk .dfoot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-0)}
.desk .dfoot .st{flex:1;font-size:12px;color:var(--ink-3)}
.queue{display:flex;flex-direction:column;gap:4px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface-0);cursor:pointer}
.qrow:hover{border-color:var(--violet-300)}
.qrow.on{border-color:var(--violet-500);background:var(--violet-50)}
.qrow .n{flex:1;font-weight:600;font-size:13px}
.qrow .lvl{font-size:11px}
.bandgroup{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--surface-0)}
.bandgroup .bh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.bandgroup .bh b{font-family:var(--mono)}
.bandgroup .bh .cnt{color:var(--ink-3);font-size:12px;flex:1}
.bandgroup .bl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.bandgroup .bl .chip.done{opacity:.5;text-decoration:line-through}

/* modules editor */
.mods{max-width:960px}
.mod{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--surface-0)}
.mod .mh{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.mod .mh .h{cursor:grab;color:var(--ink-dis)}
.mod .mh .chev svg{transition:transform var(--dur-fast)}
.mod.closed .mh .chev svg{transform:rotate(-90deg)}
.mod.closed .ml{display:none}
.mod .mh b{flex:1;font-size:14px}
.mod .mh b[contenteditable]{outline:none;border-bottom:1px dashed transparent}
.mod .mh b[contenteditable]:focus{border-bottom-color:var(--violet-500)}
.mod .mh .obj{font-size:12px;color:var(--ink-3);flex:1}
.mod .ml{padding:6px}
.mitem{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 8px 6px 10px;border:1px solid var(--line);border-radius:4px;margin:4px 0;background:var(--surface-0);position:relative}
.mitem.pub{border-left:4px solid var(--success-f);padding-left:7px}
.mitem:hover{background:var(--surface-1)}
.mitem.ind1{margin-left:24px}.mitem.ind2{margin-left:48px}
.mitem .ti{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:0 0 24px}
.mitem .ti svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ti.Page{background:var(--surface-3);color:var(--ink-2)}.ti.Video{background:#FCE7D6;color:#8A3A00}.ti.Quiz{background:var(--info-t);color:var(--info)}.ti.Speaking{background:#FFF4D6;color:#7A5200}.ti.Writing{background:var(--success-t);color:var(--success)}.ti.Live{background:var(--violet-100);color:var(--violet-800)}
.mitem .t{flex:1;min-width:0}
.mitem .t b{display:block;font-size:13px}
.mitem .t span{font-size:12px;color:var(--ink-3)}
.mitem .pubbtn{color:var(--ink-dis)}.mitem .pubbtn.on{color:var(--success-i)}
.dropzone{border:1px dashed var(--line-strong);border-radius:4px;height:40px;display:grid;place-items:center;color:var(--ink-3);font-size:12px;margin:4px 0}
.savebar{position:sticky;top:var(--topbar-h);z-index:10;background:var(--ink);color:#fff;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;margin-bottom:16px;box-shadow:var(--shadow-3)}
.savebar span{flex:1;font-weight:600;font-size:13px}
.savebar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.savebar .btn.primary{background:var(--violet-500);border-color:var(--violet-500)}
.menu{position:absolute;background:var(--surface-0);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-2);min-width:180px;padding:4px;z-index:30}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:5px;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* register */
.reg{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface-0)}
.reg table{border-collapse:separate;border-spacing:0;font-size:12px}
.reg th{position:sticky;top:0;background:var(--surface-2);padding:6px;font-size:11px;color:var(--ink-3);min-width:40px;border-bottom:1px solid var(--line)}
.reg th:first-child,.reg td:first-child{position:sticky;left:0;background:var(--surface-0);min-width:200px;text-align:left;padding:0 12px;font-weight:600;border-right:1px solid var(--line);z-index:1}
.reg th:first-child{background:var(--surface-2);z-index:2}
.reg td{padding:3px;height:36px;border-bottom:1px solid var(--line);text-align:center}
.reg th.today{background:var(--violet-100);color:var(--violet-800)}
.reg .a{width:32px;height:28px;border-radius:5px;display:inline-grid;place-items:center;font-weight:700;font-size:11px;cursor:pointer;border:1px solid transparent}
.reg .a:hover{border-color:var(--ink)}
.a.P{background:var(--success-t);color:var(--success)}.a.L{background:var(--warning-t);color:var(--warning)}.a.A{background:var(--danger-t);color:var(--danger)}.a.E{background:var(--info-t);color:var(--info)}.a.N{background:var(--surface-2);color:var(--ink-dis);border:1px dashed var(--line-strong)}
.reg .a.locked{cursor:default;opacity:.85}
.reg td.pct{font-weight:600}

/* profile */
.profile{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}
@media (max-width:1000px){.profile{grid-template-columns:1fr}}
.profile .side{position:sticky;top:calc(var(--topbar-h) + 16px);align-self:start}
.profile .side .card{padding:20px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.profile .side .av{width:64px;height:64px;font-size:20px;flex-basis:64px}

const lastTwo=st=>subsOf(st).filter(m=>subState(m)==='released').slice(-2).map(subScore);
const risk=st=>{const c=clsById[st.cls];if(c.upcoming)return null;const reasons=[];const a=att8(st);if(a!==null&&a<80)reasons.push(`Attendance ${a}% over the last 8 sessions`);const sa=streakAbs(st);if(sa>=3)reasons.push(`${sa} consecutive absences`);const lt=lastTwo(st);if(lt.length===2&&lt.every(x=>x<LEVELS[c.level].pass))reasons.push(`Last two scores ${lt.join(' and ')} under the ${LEVELS[c.level].pass} pass mark`);const mc=missingCount(st);if(mc>=2)reasons.push(`${mc} homework tasks missing`);if(st.lastActive>=7)reasons.push(`No portal activity for ${st.lastActive} days`);if(!st.invoice)reasons.push('Invoice overdue');const lvl=reasons.length>=2?'red':reasons.length===1?'amber':'green';return{lvl,reasons}};

function spark(vals,w=64,h=20,col='var(--violet-500)'){if(!vals.length)return'';const mx=Math.max(...vals),mn=Math.min(...vals);const r=mx-mn||1;const pts=vals.map((v,i)=>[(i/(vals.length-1))*(w-4)+2,h-3-((v-mn)/r)*(h-6)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];return`<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${col}"/></svg>`}
function bars(series,opts={}){const {w=420,h=200,max=null,labels=[],cols=['var(--chart-1)','var(--chart-2)'],names=[],unit=''}=opts;const pl=34,pb=26,pt=14,pr=8;const mx=max||Math.max(1,...series.flat())*1.1;const n=series[0].length;const gw=(w-pl-pr)/n;const bw=Math.min(28,(gw-8)/series.length);let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`;for(let g=0;g<=4;g++){const y=pt+(h-pt-pb)*(1-g/4);s+=`<line class="grid" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(mx*g/4)}${unit}</text>`}series.forEach((ser,si)=>ser.forEach((v,i)=>{const x=pl+i*gw+(gw-bw*series.length)/2+si*bw;const bh=(h-pt-pb)*(v/mx);s+=`<rect x="${x}" y="${h-pb-bh}" width="${bw-2}" height="${bh}" rx="2" fill="${cols[si]}"><title>${names[si]||''} ${labels[i]}: ${v}${unit}</title></rect>`}));labels.forEach((l,i)=>{s+=`<text x="${pl+i*gw+gw/2}" y="${h-8}" text-anchor="middle">${l}</text>`});s+=`<line class="axis" x1="${pl}" x2="${w-pr}" y1="${h-pb}" y2="${h-pb}"/></svg>`;if(names.length>1)s+=`<div class="legend" style="margin-top:6px">${names.map((n,i)=>`<span><i style="background:${cols[i]}"></i>${n}</span>`).join('')}</div>`;return s}
function lines(series,opts={}){const {w=420,h=200,labels=[],cols=['var(--chart-1)','var(--ink-3)'],names=[],min=0,max=100,dash=[false,true],unit=''}=opts;const pl=34,pb=26,pt=14,pr=8;const n=labels.length;let s=`<svg class="chart" viewBox="0 0 ${w} ${h}">`;for(let g=0;g<=4;g++){const y=pt+(h-pt-pb)*(1-g/4);s+=`<line class="grid" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(min+(max-min)*g/4)}${unit}</text>`}series.forEach((ser,si)=>{const pts=ser.map((v,i)=>v==null?null:[pl+(n>1?i/(n-1):0.5)*(w-pl-pr),pt+(h-pt-pb)*(1-(v-min)/(max-min))]);let d='';pts.forEach((p,i)=>{if(!p)return;d+=(d?' L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)});s+=`<path d="${d}" fill="none" stroke="${cols[si]}" stroke-width="2" ${dash[si]?'stroke-dasharray="4 4"':''}/>`;if(!dash[si])pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${cols[si]}"><title>${labels[i]}: ${ser[i]}${unit}</title></circle>`});});labels.forEach((l,i)=>{s+=`<text x="${pl+(n>1?i/(n-1):0.5)*(w-pl-pr)}" y="${h-8}" text-anchor="middle">${l}</text>`});s+=`</svg>`;if(names.length>1)s+=`<div class="legend" style="margin-top:6px">${names.map((n,i)=>`<span><i style="background:${cols[i]}"></i>${n}</span>`).join('')}</div>`;return s}
function bandRows(sub,target){return`<div class="bands">${SKILLS.map(k=>{const v=sub[k];const t=target;return`<div class="bandrow"><span>${k}</span><div class="track">${[1,2,3,4,5,6].map(i=>`<i class="${v>=i?'f':v>=i-0.5?'half':''} ${t===i?'tgt':''}" title="${['A1','A2','B1','B2','C1','C2'][i-1]}"></i>`).join('')}</div><span class="v">${bandName(v)}</span></div>`}).join('')}</div>`}
const bandName=v=>{const b=['A1','A2','B1','B2','C1','C2'][Math.floor(v)-1]||'A1';return Number.isInteger(v)?b:b+'+'};

function toast(msg,undo){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${msg}</span>${undo?'<button class="u">Undo</button>':''}<button class="x" aria-label="Dismiss">${ic('x')}</button>`;document.getElementById('toasts').appendChild(el);let undone=false;const rm=()=>{el.remove();if(!undone&&undo&&undo.commit)undo.commit()};const t=setTimeout(rm,undo?8000:5000);el.querySelector('.x').onclick=()=>{clearTimeout(t);rm()};if(undo){el.querySelector('.u').onclick=()=>{undone=true;clearTimeout(t);el.remove();undo.fn();toast('Undone')}}}
let layerStack=[];
function openLayer(html,kind='tray',opts={}){const L=document.getElementById('layer');const scrim=document.createElement('div');scrim.className='scrim';const box=document.createElement('div');box.className=kind+(opts.cls?' '+opts.cls:'');box.innerHTML=html;box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');L.appendChild(scrim);L.appendChild(box);requestAnimationFrame(()=>{scrim.classList.add('show');box.classList.add('show')});const rec={scrim,box,kind,onClose:opts.onClose};layerStack.push(rec);scrim.onclick=()=>closeLayer();box.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeLayer());const f=box.querySelector('input,button,textarea,select');if(f&&!opts.noFocus)setTimeout(()=>f.focus(),50);return box}
function closeLayer(){const r=layerStack.pop();if(!r)return;r.scrim.classList.remove('show');r.box.classList.remove('show');setTimeout(()=>{r.scrim.remove();r.box.remove()},200);if(r.onClose)r.onClose()}

function menu(anchor,items){document.querySelectorAll('.menu').forEach(m=>m.remove());const m=document.createElement('div');m.className='menu';m.innerHTML=items.map(it=>it==='-'?'<hr>':`<button class="${it.danger?'danger':''}">${it.icon?ic(it.icon):''}${it.label}</button>`).join('');document.body.appendChild(m);const r=anchor.getBoundingClientRect();m.style.top=(r.bottom+window.scrollY+4)+'px';m.style.left=Math.min(r.left+window.scrollX,window.innerWidth-200)+'px';let i=0;m.querySelectorAll('button').forEach(b=>{const it=items.filter(x=>x!=='-')[i++];b.onclick=e=>{e.stopPropagation();m.remove();it.fn&&it.fn()}});setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)}

  const q=box.querySelector('#pq'),list=box.querySelector('#pl');let sel=0,cur=[];
  const draw=()=>{const v=q.value.trim().toLowerCase();cur=items.filter(it=>!v||(it.l+' '+(it.s||'')+' '+(it.kw||'')).toLowerCase().includes(v));if(!v)cur=cur.filter(i=>i.g==='Recent'||i.g==='Actions'||i.g==='Classes').slice(0,14);else cur=cur.slice(0,14);sel=Math.min(sel,Math.max(0,cur.length-1));let g='';list.innerHTML=cur.length?cur.map((it,i)=>{const gh=it.g!==g?`<div class="pg">${it.g}</div>`:'';g=it.g;return gh+`<div class="pi ${i===sel?'on':''}" data-i="${i}">${ic(it.g==='Students'?'user':it.g==='Classes'?'classes':it.g==='Actions'?'kbd':'log')}<b>${esc(it.l)}</b><span>${esc(it.s||'')}</span>${it.k?`<kbd>${it.k}</kbd>`:''}</div>`}).join(''):'<div class="empty"><b>No matches</b>Try a student name, a class or "assign".</div>';list.querySelectorAll('.pi').forEach(el=>el.onclick=()=>{closeLayer();cur[+el.dataset.i].fn()})};
  q.oninput=draw;q.onkeydown=e=>{if(e.key==='ArrowDown'){sel=(sel+1)%cur.length;draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=(sel-1+cur.length)%cur.length;draw();e.preventDefault()}else if(e.key==='Enter'&&cur[sel]){closeLayer();cur[sel].fn()}};draw()
}
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(layerStack.length)closeLayer();openPalette();return}

  if(window._g&&Date.now()-window._g<800){if(e.key.toLowerCase()==='h')go(`/${S.role}/home`);if(e.key.toLowerCase()==='m'&&S.role==='t')go('/t/marking');window._g=0}
});

function openAssign(cls,pre,verb0){const classes=S.role==='t'?myClasses():CLASSES.filter(c=>!c.upcoming);let c=cls||classes[0];let verb=verb0||'assign';const state={items:new Set(),groups:[{everyone:true,excl:new Set(pre?stOfCls(c).filter(s=>!pre.includes(s)).map(s=>s.id):[]),due:fmtISO(addDays(TODAY,7)),from:fmtISO(TODAY)}],filter:'all',unitOpen:new Set([c.unit||1])};

/* ---------- register ---------- */
function tabRegister(body,c){const sts=stOfCls(c);const n=c.upcoming?0:20;const reg=S.register[c.id]=S.register[c.id]||{};const todayIdx=19;const locked=idx=>idx<todayIdx-1;
 const draw=()=>{body.innerHTML=c.upcoming?'<div class="empty card"><b>No sessions yet</b>The register opens on the first day of class.</div>':`<div class="toolbar"><span class="legend"><span><i style="background:var(--success-t)"></i>Present</span><span><i style="background:var(--warning-t)"></i>Late</span><span><i style="background:var(--danger-t)"></i>Absent</span><span><i style="background:var(--info-t)"></i>Excused</span></span><div class="grow"></div><span class="small muted">Sessions older than two days are locked; ask the DOS to amend with a reason.</span><button class="btn" id="exp">${ic('dl')}Export</button><button class="btn primary" id="save">Save today's register</button></div>
 <div class="reg"><table><thead><tr><th>Student</th>${Array.from({length:n},(_,i)=>`<th class="${i===todayIdx?'today':''}">${fmtD(addDays(TODAY,-(n-1-i)*1.4))}</th>`).join('')}<th>%</th></tr></thead><tbody>${sts.map(s=>`<tr><td>${s.name}</td>${Array.from({length:n},(_,i)=>{const v=(reg[i]&&reg[i][s.id])||(i===todayIdx?'N':s.att[i]);return`<td><button class="a ${v} ${locked(i)?'locked':''}" data-i="${i}" data-s="${s.id}" title="${locked(i)?'Locked':'Click to change'}">${v==='N'?'·':v}</button></td>`}).join('')}<td class="pct">${attAll(s)}%</td></tr>`).join('')}</tbody></table></div>`;
  body.querySelectorAll('.a').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(locked(i)){if(S.role==='a'){amendModal(c,i,b.dataset.s,b.textContent.trim(),draw)}else toast('This session is locked. Ask the DOS to amend it.');return}const cyc=['P','L','A','E'];const cur=b.classList.contains('N')?null:b.textContent.trim();const nx=cyc[(cyc.indexOf(cur)+1)%4];reg[i]=reg[i]||{};reg[i][b.dataset.s]=nx;b.className='a '+nx;b.textContent=nx});
  body.querySelector('#save').onclick=()=>{const t=reg[todayIdx]||{};const miss=sts.filter(s=>!t[s.id]);if(miss.length){confirmModal('Mark the rest present?',`<p>${miss.length} students have no mark for today. Mark them present and save?</p>`,'Mark present and save',()=>{miss.forEach(s=>{reg[todayIdx]=reg[todayIdx]||{};reg[todayIdx][s.id]='P'});draw();toast(`Register saved for ${c.name}. Absent: ${Object.values(reg[todayIdx]).filter(v=>v==='A').length}.`,{fn:()=>{delete reg[todayIdx];draw()}})})}else{toast(`Register saved for ${c.name}.`,{fn:()=>{delete reg[todayIdx];draw()}})}};
  body.querySelector('#exp').onclick=()=>toast('Register exported as CSV with amendment history.')};draw()}
function amendModal(c,i,sid,cur,after){const b=openLayer(`<div class="th"><h2>Amend attendance</h2><button class="iconbtn" data-close>${ic('x')}</button></div><div class="tb" style="display:flex;flex-direction:column;gap:10px"><p>${stById[sid].name}, session ${i+1}, currently <b>${cur}</b>.</p><div class="field"><label>New mark</label><select class="input" id="nv"><option>P</option><option>L</option><option>A</option><option>E</option></select></div><div class="field"><label>Reason (required, logged)</label><input class="input" id="rs" placeholder="e.g. medical certificate received 9 Sep"></div></div><div class="tf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">Amend</button></div>`,'modal',{cls:'sm'});b.querySelector('#ok').onclick=()=>{const rs=b.querySelector('#rs');if(!rs.value.trim()){rs.closest('.field').classList.add('invalid');rs.focus();return}const nv=b.querySelector('#nv').value;S.register[c.id][i]=S.register[c.id][i]||{};S.register[c.id][i][sid]=nv;S.log=S.log||[];S.log.unshift({at:'Today 10:14',who:'Shweta Tripathi',what:`Attendance amended: ${stById[sid].name}, ${c.name}, session ${i+1}: ${cur} → ${nv}`,why:rs.value});closeLayer();after();toast('Attendance amended and logged.')}}

/* ---------- curriculum ---------- */
T.curriculum=function(page){const el=content(page,`${head('Curriculum','Life Intermediate (2nd ed.) · 12 units · published to 3 classes',`<button class="btn" id="addu">${ic('plus')}Add unit</button><button class="btn primary" id="pub" ${S.dirty?'':'disabled'}>Publish changes</button>`)}<div id="cur"></div>`);tabCurriculum(el.querySelector('#cur'));el.querySelector('#addu').onclick=()=>{S.curriculum.push({id:'u'+(S.curriculum.length+1),n:S.curriculum.length+1,title:'New unit',obj:'',open:true,pub:false,items:[]});S.dirty=true;render()};el.querySelector('#pub').onclick=()=>{S.dirty=false;render();toast('Curriculum changes published to 3 classes.')}};
function tabCurriculum(body,c){const ro=S.role==='a'&&c;const draw=()=>{body.innerHTML=`${S.dirty&&!ro?`<div class="savebar">${ic('warn')}<span>Unsaved changes</span><button class="btn sm" id="disc">Discard</button><button class="btn sm primary" id="pubb">Publish changes</button></div>`:''}${ro?`<div class="alert info" style="margin-bottom:12px">${ic('info')}<span>Read-only view of the class curriculum. Edit it under Curriculum in the sidebar.</span></div>`:''}<div class="mods">${S.curriculum.map(u=>`<div class="mod ${u.open?'':'closed'}" data-u="${u.id}"><div class="mh">${ro?'':`<span class="h">${ic('grip')}</span>`}<button class="iconbtn chev" data-tog="${u.id}" style="width:24px;height:24px">${ic('chevd')}</button><b ${ro?'':'contenteditable="true" spellcheck="false"'} data-title="${u.id}">Unit ${u.n}: ${esc(u.title)}</b><span class="obj" data-tog="${u.id}" style="cursor:pointer">${esc(u.obj)||'Click to expand'}</span>${c&&u.n===c.unit?pill('This week','violet'):''}<a class="btn sm" href="#/${S.role}/unit/${u.n}${c?'/'+c.id:''}" title="Pages, materials, lesson plan and extra practice">${ic('external')}Open unit</a><span class="pill neutral">${u.items.length} items</span><button class="iconbtn pubbtn ${u.pub?'on':''}" data-pubu="${u.id}" title="${u.pub?'Published':'Draft'}" ${ro?'disabled':''}>${ic(u.pub?'check':'eyeoff')}</button>${ro?'':`<button class="iconbtn" data-addi="${u.id}" title="Add item">${ic('plus')}</button><button class="iconbtn" data-menu="${u.id}">${ic('more')}</button>`}</div><div class="ml"><div class="mitem" style="background:var(--violet-50);border-color:var(--violet-200)"><span class="ti Live">${ic('flag')}</span><div class="t"><b>Learning outcomes</b><span>${unitICan(u.n).slice(0,3).map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' · ')}${unitICan(u.n).length>3?' · and '+(unitICan(u.n).length-3)+' more':''}</span></div><a class="btn sm ghost" href="#/${S.role}/unit/${u.n}${c?'/'+c.id:''}">All outcomes</a></div>${u.items.length?u.items.map(it=>`<div class="mitem ${it.pub?'pub':''} ind${it.ind}" data-it="${it.id}">${ro?'':`<span class="h" style="color:var(--ink-dis);cursor:grab">${ic('grip')}</span>`}<span class="ti ${it.type}">${ic(TYPEICON[it.type])}</span><div class="t"><b><a href="#" data-prev="${it.id}" style="color:inherit" title="Open and preview as a student">${esc(it.title)}</a></b><span>${it.type}${it.pts?` · ${it.pts} pts`:''} · ${it.min} min${it.aze?' · AZE + teacher mark':it.auto?' · auto-marked':''}${it.req?' · Required':''}</span></div><button class="btn sm ghost" data-prev="${it.id}">${ic('eye')}Open</button>${it.aze||it.auto?`<button class="btn sm ghost" data-asg="${u.n}|${it.id}">Assign</button>`:''}<button class="iconbtn pubbtn ${it.pub?'on':''}" data-pubi="${it.id}" title="${it.pub?'Published':'Unpublished'}" ${ro?'disabled':''}>${ic(it.pub?'check':'eyeoff')}</button>${ro?'':`<button class="iconbtn" data-imenu="${it.id}">${ic('more')}</button>`}</div>`).join(''):`<div class="dropzone">Add or drop the first item</div>`}</div></div>`).join('')}</div>`;
  body.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const u=S.curriculum.find(x=>x.id===b.dataset.tog);u.open=!u.open;draw()});body.querySelectorAll('[data-prev]').forEach(b=>b.onclick=e=>{e.preventDefault();const it=S.curriculum.flatMap(u=>u.items).find(x=>x.id===b.dataset.prev);openItemPreview(it,S.curriculum.find(u=>u.items.includes(it)),false)});
  body.querySelectorAll('[data-title]').forEach(t=>{t.onblur=()=>{const u=S.curriculum.find(x=>x.id===t.dataset.title);const v=t.textContent.replace(/^Unit \d+:\s*/,'');if(v!==u.title){u.title=v;S.dirty=true;draw()}};t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}}});
  body.querySelectorAll('[data-pubu]').forEach(b=>b.onclick=()=>{const u=S.curriculum.find(x=>x.id===b.dataset.pubu);u.pub=!u.pub;u.items.forEach(i=>i.pub=u.pub);S.dirty=true;draw()});
  body.querySelectorAll('[data-pubi]').forEach(b=>b.onclick=()=>{const it=S.curriculum.flatMap(u=>u.items).find(x=>x.id===b.dataset.pubi);it.pub=!it.pub;S.dirty=true;draw()});
  body.querySelectorAll('[data-addi]').forEach(b=>b.onclick=()=>openItemTray(S.curriculum.find(x=>x.id===b.dataset.addi),draw));
  body.querySelectorAll('[data-asg]').forEach(b=>b.onclick=()=>{openAssign(c||myClasses()[0])});
  body.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{const u=S.curriculum.find(x=>x.id===b.dataset.menu);const i=S.curriculum.indexOf(u);menu(e.currentTarget,[{label:'Open unit page',icon:'external',fn:()=>go(`/${S.role}/unit/${u.n}${c?'/'+c.id:''}`)},{label:'Preview as student',icon:'eye',fn:()=>{const cc=c||myClasses()[0];viewAs(stOfCls(cc)[0],`#/s/unit/${u.n}/${cc.id}/lessons`)}},{label:'Edit objectives',icon:'write',fn:()=>{const v=prompt('Objectives ("you will be able to")',u.obj);if(v!=null){u.obj=v;S.dirty=true;draw()}}},{label:'Move up',icon:'up',fn:()=>{if(i>0){S.curriculum.splice(i,1);S.curriculum.splice(i-1,0,u);S.dirty=true;draw()}}},{label:'Move down',icon:'down',fn:()=>{if(i<S.curriculum.length-1){S.curriculum.splice(i,1);S.curriculum.splice(i+1,0,u);S.dirty=true;draw()}}},{label:'Duplicate',icon:'page',fn:()=>{S.curriculum.splice(i+1,0,JSON.parse(JSON.stringify({...u,id:u.id+'c',title:u.title+' (copy)',pub:false})));S.dirty=true;draw()}},{label:'Assign to…',icon:'send',fn:()=>openAssign(c||myClasses()[0])},'-',{label:'Delete unit',icon:'x',danger:true,fn:()=>confirmModal('Delete unit?',`<p>Unit ${u.n}: ${esc(u.title)} and its ${u.items.length} items will be removed. Grades already recorded are kept.</p>`,'Delete',()=>{S.curriculum.splice(i,1);S.dirty=true;draw();toast('Unit deleted.',{fn:()=>{S.curriculum.splice(i,0,u);draw()}})},true)}])});

  const d=body.querySelector('#disc');if(d)d.onclick=()=>{S.curriculum.length=0;makeCurriculum().forEach(u=>S.curriculum.push(u));S.dirty=false;render()};const p=body.querySelector('#pubb');if(p)p.onclick=()=>{S.dirty=false;render();toast('Curriculum changes published to 3 classes.')}};draw()}
function openItemTray(u,after,it){const edit=!!it;const b=openLayer(`<div class="th"><h2>${edit?'Edit item':'Add item to Unit '+u.n}</h2><button class="iconbtn" data-close>${ic('x')}</button></div><div class="tb"><div class="field"><label>Type</label><select class="input" id="ty">${ITEMTYPES.map(t=>`<option ${it&&it.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Title</label><input class="input" id="ti" value="${it?esc(it.title):''}" placeholder="e.g. 6d Speaking task: giving advice"><span class="err hidden">Give the item a title</span></div><div class="frow"><div class="field"><label>Points</label><input class="input" type="number" id="pts" value="${it?it.pts:0}"></div><div class="field"><label>Estimated minutes</label><input class="input" type="number" id="mn" value="${it?it.min:20}"></div></div><div class="checks"><label><input type="checkbox" id="aze" ${it&&it.aze?'checked':''}> Marked by AZE, then reviewed by the teacher</label><label><input type="checkbox" id="req" ${it&&it.req?'checked':''}> Required to complete the unit</label><label><input type="checkbox" id="pub" ${!it||it.pub?'checked':''}> Publish now</label></div></div><div class="tf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">${edit?'Save':'Add item'}</button></div>`,'tray');
 b.querySelector('#ok').onclick=()=>{const ti=b.querySelector('#ti');if(!ti.value.trim()){ti.closest('.field').classList.add('invalid');ti.closest('.field').querySelector('.err').classList.remove('hidden');ti.focus();return}const o={id:it?it.id:'i'+Date.now(),type:b.querySelector('#ty').value,title:ti.value.trim(),pts:+b.querySelector('#pts').value,min:+b.querySelector('#mn').value,aze:b.querySelector('#aze').checked,req:b.querySelector('#req').checked,pub:b.querySelector('#pub').checked,ind:it?it.ind:0};if(it)Object.assign(it,o);else u.items.push(o);S.dirty=true;closeLayer();after();toast(edit?'Item saved.':'Item added to Unit '+u.n+'.')}}

T.marking=function(page){const my=myClasses();const q=toMark().filter(m=>my.some(c=>c.id===taskById[m.task].cls));const byTask={};q.forEach(m=>{(byTask[m.task]=byTask[m.task]||[]).push(m)});let view=S.views.mq||'tasks';
 const draw=()=>{const el=content(page,`${head('Marking',`<span>${q.length} submissions awaiting your review across ${Object.keys(byTask).length} tasks</span>`,`<div class="seg"><button class="${view==='tasks'?'on':''}" data-v="tasks">By task</button><button class="${view==='subs'?'on':''}" data-v="subs">All submissions</button></div><button class="btn" id="pubdone">Publish all reviewed (${Object.values(S.decisions).filter(d=>d.state==='reviewed').length})</button>`)}
  ${view==='tasks'?`<div class="tablewrap"><table class="dt"><thead><tr><th>Task</th><th>Class</th><th class="num">Waiting</th><th>Oldest</th><th>AZE confidence</th><th></th></tr></thead><tbody>${Object.entries(byTask).sort((a,b)=>oldestSub(taskById[b[0]])-oldestSub(taskById[a[0]])).map(([tid,ms])=>{const t=taskById[tid];const c=clsById[t.cls];const old=oldestSub(t);return`<tr><td><span class="who"><span class="ti ${t.type}" style="width:24px;height:24px;border-radius:6px;display:grid;place-items:center">${ic(TYPEICON[t.type])}</span><span class="name">${t.title}</span></span><div class="sub" style="padding-left:32px">Unit ${t.unit} · ${t.type}</div></td><td>${c.name} ${lvlPill(c.level)}</td><td class="num">${ms.length}</td><td>${old>=5?pill(ago(old),'bad'):ago(old)}</td><td><span class="bar6" style="margin:0"><i style="width:${t.type==='Speaking'?66:74}%"></i></span> <span class="small muted">${t.type==='Speaking'?'0.66':'0.74'} avg</span></td><td><a class="btn sm primary" href="#/t/mark/${t.id}">Mark ${ms.length}</a></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty"><b>All clear</b></div></td></tr>'}</tbody></table></div>`:
  `<div class="tablewrap"><table class="dt"><thead><tr><th>Student</th><th>Task</th><th>Class</th><th>Submitted</th><th>AZE proposal</th><th></th></tr></thead><tbody>${q.sort((a,b)=>b.submittedAgo-a.submittedAgo).map(m=>{const t=taskById[m.task];const s=stById[m.student];const c=clsById[t.cls];return`<tr class="click" data-open="${t.id}|${m.id}"><td><span class="who">${avatar(s.name,1)}<span class="name">${s.name}</span></span></td><td>${t.title}</td><td>${c.name}</td><td>${ago(m.submittedAgo)}${m.late?' '+pill('Late','warn'):''}</td><td><span class="mono">${bandName(LEVELS[c.level].ord+(m.score-60)/40)}</span> <span class="small muted">· ${m.score}</span></td><td><button class="btn sm">Review</button></td></tr>`}).join('')}</tbody></table></div>`}`);
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;S.views.mq=view;draw()});el.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>{const [t,m]=r.dataset.open.split('|');openDesk(t,m)});el.querySelector('#pubdone').onclick=()=>{const n=Object.entries(S.decisions).filter(([k,d])=>d.state==='reviewed');if(!n.length){toast('Nothing reviewed yet. Open a task to start.');return}n.forEach(([k,d])=>d.state='released');render();toast(`${n.length} marks returned to students.`,{fn:()=>{n.forEach(([k,d])=>d.state='reviewed');render()}})}};draw()};

<script>
/* ---------- marking desk ---------- */
const deskState={open:false,task:null,list:[],idx:0,mode:null,bands:[],focus:0,reason:'',comment:'',audio:null,group:false,playing:false,recording:false};
const SEGS=[['A2',2],['A2+',2.5],['B1',3],['B1+',3.5],['B2',4],['B2+',4.5]];
const segLabel=v=>{const s=SEGS.find(x=>x[1]===v);return s?s[0]:bandName(v)};
const essayFor=m=>{const t=taskById[m.task];if(t.type==='Speaking')return null;return ESSAYS[parseInt(m.id.slice(1))%ESSAYS.length]};
const confFor=m=>{const e=essayFor(m);const base=e?e.conf:SPEECH.conf;return Math.round((base+((parseInt(m.id.slice(1))%7)-3)*0.02)*100)/100};
const critFor=m=>{const e=essayFor(m);return (e?e.crit:SPEECH.crit)};
const scoreFromBands=b=>Math.round(40+((b.reduce((a,x)=>a+x,0)/b.length)-2)*22);
function openDesk(taskId,subId){const t=taskById[taskId]||S.assigned.find(x=>x.id===taskId);if(!t)return;let list=SUBS.filter(m=>m.task===taskId);if(!list.length){toast('No submissions yet for this task.');return}
 list=list.sort((a,b)=>{const sa=subState(a)==='aze'?0:1,sb=subState(b)==='aze'?0:1;if(sa!==sb)return sa-sb;return confFor(a)-confFor(b)});
 deskState.open=true;deskState.task=t;deskState.list=list;deskState.idx=subId?Math.max(0,list.findIndex(m=>m.id===subId)):0;deskState.group=false;loadSub();

 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();saveNext();return}

 if(k==='j'){nav(1)}else if(k==='k'){nav(-1)}else if(e.key==='Enter'){setMode('accept')}else if(k==='e'){setMode('adjust')}else if(k==='d'){setMode('replace')}else if(k==='c'){const c=document.getElementById('cmt');if(c)c.focus()}else if(/^[1-6]$/.test(k)){if(deskState.mode==='accept'||!deskState.mode)setMode('adjust');deskState.bands[deskState.focus]=SEGS[+k-1][1];drawDesk()}else if(e.key==='ArrowDown'){deskState.focus=Math.min(deskState.bands.length-1,deskState.focus+1);drawDesk()}else if(e.key==='ArrowUp'){deskState.focus=Math.max(0,deskState.focus-1);drawDesk()}else if(k==='g'){deskState.group=!deskState.group;drawDesk()}}

function saveNext(){if(!deskState.mode){toast('Choose Accept, Adjust or Replace first.');return}if(!commitSub())return;const done=deskState.list.filter(m=>S.decisions[m.id]).length;const total=deskState.list.length;const remaining=deskState.list.map((m,i)=>i).filter(i=>!S.decisions[deskState.list[i].id]&&subState(deskState.list[i])==='aze');
 if(remaining.length){deskState.idx=remaining[0];loadSub();drawDesk();toast(`Saved. ${remaining.length} left in this task.`)}else{const ov=deskState.list.filter(m=>S.decisions[m.id]&&S.decisions[m.id].mode!=='accept').length;drawDesk();toast(`Task complete: ${done} reviewed, ${ov} adjusted or replaced, about 85 seconds per script. Publish from the queue when ready.`)}}
function drawDesk(){const d=document.getElementById('desk');if(!d||!deskState.open)return;const t=deskState.task;const c=clsById[t.cls];const m=deskState.list[deskState.idx];const s=stById[m.student];const e=essayFor(m);const crit=critFor(m);const conf=confFor(m);const dec=S.decisions[m.id];const reviewed=deskState.list.filter(x=>S.decisions[x.id]||subState(x)==='released').length;const isSpeak=t.type==='Speaking';
 const hi=deskState.hi;

 else if(isSpeak){left=`<div class="paper"><div class="prompt"><b>Task.</b> ${t.title}. Speak for one to two minutes about a journey you remember. Say where you went, why, and whether you would go again.</div><div class="meta"><span>${s.name}</span><span>Submitted ${ago(m.submittedAgo)}${m.late?' (late)':''}</span><span>1:48</span><span>Attempt 1 of 1</span></div><div class="player"><button class="iconbtn" id="play">${ic(deskState.playing?'pause':'play')}</button><span id="ptime">${deskState.playing?'0:23':'0:00'} / 1:48</span><span>·</span><span>Playback 1.0×</span><span>·</span><span>Click a word to hear it</span></div><div class="wave" id="wave">${Array.from({length:90},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.7)*30+Math.cos(i*0.6)*10)}px" class="${deskState.playing&&i<20?'played':''}"></i>`).join('')}</div><div class="transcript">${SPEECH.words.map((w,i)=>`<span class="${SPEECH.low[i]||'c3'} ${hi===i?'cur':''}" data-w="${i}" title="${SPEECH.low[i]==='c1'?'Low pronunciation confidence':SPEECH.low[i]==='c2'?'Word stress or final sound':''}">${w}</span>`).join('')}</div><div class="typekey"><span><i style="border-color:#E5484D"></i>Low pronunciation confidence</span><span><i style="border-color:#F5A623"></i>Stress or final sound</span></div></div>`}
 else{let idx=0;const html=esc(e.text).replace(/\{([^|]+)\|([a-z]+)\|([^}]+)\}/g,(_,w,ty,fix)=>{const i=idx++;return`<mark class="${ty} ${hi===i?'hi':''}" data-m="${i}" title="${ERRTYPES[ty]}: ${esc(fix)}">${w}</mark>`}).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');left=`<div class="paper ${S.deskPlain?'plain':''}"><div class="prompt"><b>Task.</b> ${t.title}. Write 140 to 190 words to a company about a product or service you paid for. Say what the problem was, how it affected you, and what you want the company to do.</div><div class="meta"><span>${s.name}</span><span>Submitted ${ago(m.submittedAgo)}${m.late?' (late)':''}</span><span>${e.text.split(/\s+/).length} words</span><span>Attempt 1 of 1</span><button class="btn sm ghost" id="plain">${S.deskPlain?'Show error marks':'Hide error marks'}</button></div><p>${html}</p><div class="typekey">${Object.entries(ERRTYPES).map(([k,v])=>`<span><i style="border-color:${ERRCOL[k]}"></i>${v}</span>`).join('')}</div></div>`}
 const over=segLabel(Math.round((deskState.bands.reduce((a,b)=>a+b,0)/deskState.bands.length)*2)/2);
 const stLabel=dec?(dec.state==='released'?'Returned to student':`Reviewed (${dec.mode})`):subState(m)==='released'?'Returned to student':'Awaiting your review';
 const bank=COMMENT_BANK;
 d.innerHTML=`<div class="dh"><button class="back" id="dback">${ic('left')}Back to queue</button><div class="title"><b>${t.title}</b><span>${c.name} · Unit ${t.unit} · ${t.type} · sorted by lowest AZE confidence first</span></div><div class="nav"><button class="btn sm ${deskState.group?'primary':''}" id="grp" title="Group by band (G)">${ic('users')}Group by band</button><button class="iconbtn" id="prev" title="Previous (K)">${ic('left')}</button><select id="pick">${deskState.list.map((x,i)=>`<option value="${i}" ${i===deskState.idx?'selected':''}>${stById[x.student].name}${S.decisions[x.id]?' ✓':subState(x)==='released'?' ✓':''}</option>`).join('')}</select><button class="iconbtn" id="next" title="Next (J)">${ic('chev')}</button><span class="cnt">${reviewed} of ${deskState.list.length} reviewed</span><button class="iconbtn" id="dkeys" title="Shortcuts (?)">${ic('kbd')}</button></div></div>
 <div class="db"><div class="dl">${left}</div><div class="split"></div><div class="dr">
  <div class="state">${avatar(s.name,1)}<b>${s.name}</b><span>·</span>${lvlPill(c.level)}<span style="margin-left:auto">${pill(stLabel,dec||subState(m)==='released'?'ok':'warn')}</span></div>
  <div class="aze"><div class="ah">${ic('star','ic')}<b>AZE proposal</b><span class="conf">Confidence ${conf.toFixed(2)} ${conf<0.7?'· check carefully':''}</span></div><div class="overall"><span class="big">${over}</span><div><div><b>Overall band</b> ${deskState.mode==='accept'||!deskState.mode?'as proposed':deskState.mode==='adjust'?'adjusted by you':'replaced by you'}</div><div class="st">Score ${deskState.mode==='accept'||!deskState.mode?m.score:scoreFromBands(deskState.bands)} / 100 · pass ${LEVELS[c.level].pass}</div></div></div>
  ${crit.map((cr,i)=>`<div class="crit ${deskState.focus===i?'focus':''}" style="${deskState.focus===i?'background:var(--violet-50)':''}"><div class="cr"><b>${cr[0]}</b><div class="segs ${deskState.mode==='adjust'||deskState.mode==='replace'?'':'locked'}">${SEGS.map(([l,v],k)=>`<button class="${deskState.bands[i]===v?'on':''} ${cr[1]===v&&deskState.bands[i]!==v?'ai':''}" data-b="${i}|${v}" title="${l} (key ${k+1})">${l}</button>`).join('')}</div></div><div class="cm">${cr[2]} ${cr[3]!=null&&!isSpeak?`<span class="evch" data-ev="${cr[3]}">${ic('eye','ic')} evidence</span>`:isSpeak&&i===2?`<span class="evch" data-evw="10">${ic('eye','ic')} hear it</span>`:''}</div></div>`).join('')}
  <div class="decide"><button class="btn ${deskState.mode==='accept'?'on':''}" data-mode="accept">${ic('check')}Accept<span class="k"><kbd>↵</kbd></span></button><button class="btn ${deskState.mode==='adjust'?'on':''}" data-mode="adjust">Adjust<span class="k"><kbd>E</kbd></span></button><button class="btn ${deskState.mode==='replace'?'on':''}" data-mode="replace">Replace<span class="k"><kbd>D</kbd></span></button></div>
  ${deskState.mode==='replace'?`<div class="field" style="padding:0 12px 12px"><label>Why are you replacing the AZE mark? (stored to improve marking)</label><input class="input" id="reason" value="${esc(deskState.reason)}" placeholder="e.g. Task not addressed: this is a description, not a complaint"></div>`:''}</div>
  <div class="field"><label>Feedback to the student</label><div class="qchips">${['Good paragraphing','Check past tense verbs','Add a deadline to the request','Word stress: practise with audio'].map(q=>`<button data-q="${q}">${q}</button>`).join('')}</div><div class="cb-wrap"><textarea class="input" id="cmt" rows="3" placeholder="Type, or start typing to search your comment bank">${esc(deskState.comment)}</textarea><div class="cb-sug hidden" id="sug"></div></div><span class="hint">Comment bank follows you across classes. Audio feedback is transcribed automatically.</span></div>

  <div style="display:flex;gap:8px"><button class="btn ${deskState.recording?'danger':''}" id="rec">${ic('mic')}${deskState.recording?'Stop (0:07)':'Record audio'}</button><button class="btn" id="attach">${ic('clip')}Attach</button><button class="btn" id="revise" title="Send back for a second attempt">Return for revision</button></div>
 </div></div>
 <div class="dfoot"><span class="st" id="dst">${dec?'Saved '+ago(0):deskState.mode?'Not saved yet':'Choose Accept, Adjust or Replace. Keys: J K to move, 1 to 6 to set a band, C for comment.'}</span><button class="btn" id="skip">Skip</button><button class="btn primary" id="savenext">Save and next<span class="k"><kbd>⌘↵</kbd></span></button></div>`;
 d.querySelector('#dback').onclick=closeDesk;d.querySelector('#prev').onclick=()=>nav(-1);d.querySelector('#next').onclick=()=>nav(1);d.querySelector('#pick').onchange=e=>{deskState.idx=+e.target.value;loadSub();drawDesk()};d.querySelector('#dkeys').onclick=openShortcuts;d.querySelector('#grp').onclick=()=>{deskState.group=!deskState.group;drawDesk()};
 d.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
 d.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(!(deskState.mode==='adjust'||deskState.mode==='replace')){setMode('adjust')}const [i,v]=b.dataset.b.split('|');deskState.bands[+i]=+v;deskState.focus=+i;drawDesk()});
 d.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{deskState.hi=+b.dataset.ev;drawDesk();const mk=d.querySelector(`mark[data-m="${b.dataset.ev}"]`);if(mk)mk.scrollIntoView({block:'center',behavior:'smooth'})});

 d.querySelectorAll('mark[data-m]').forEach(mk=>mk.onclick=()=>{deskState.hi=+mk.dataset.m;drawDesk()});
 d.querySelectorAll('[data-w]').forEach(w=>w.onclick=()=>{deskState.hi=+w.dataset.w;drawDesk()});
 const pl=d.querySelector('#plain');if(pl)pl.onclick=()=>{S.deskPlain=!S.deskPlain;drawDesk()};
 const play=d.querySelector('#play');if(play)play.onclick=()=>{deskState.playing=!deskState.playing;drawDesk()};

 const cmt=d.querySelector('#cmt'),sug=d.querySelector('#sug');cmt.oninput=()=>{deskState.comment=cmt.value;const v=cmt.value.split(/\n/).pop().trim().toLowerCase();if(v.length>=2){const hits=bank.filter(b=>b.toLowerCase().includes(v)).slice(0,5);sug.innerHTML=hits.map(h=>`<button>${h}</button>`).join('');sug.classList.toggle('hidden',!hits.length);sug.querySelectorAll('button').forEach(b=>b.onclick=()=>{cmt.value=cmt.value.replace(/[^\n]*$/,b.textContent+' ');deskState.comment=cmt.value;sug.classList.add('hidden');cmt.focus()})}else sug.classList.add('hidden')};cmt.onblur=()=>setTimeout(()=>sug.classList.add('hidden'),150);
 d.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const full=bank.find(x=>x.toLowerCase().includes(b.dataset.q.toLowerCase().split(':')[0].slice(0,12)))||b.dataset.q;cmt.value=(cmt.value?cmt.value.trimEnd()+'\n':'')+full;deskState.comment=cmt.value;if(!deskState.mode)setMode('accept')});
 d.querySelector('#rec').onclick=()=>{if(deskState.recording){deskState.recording=false;deskState.audio={len:'0:07',text:'Nice work on the structure. Listen to how I say "travelled" and "changed": the -ed sound is short. Try reading your second paragraph aloud.'};if(!deskState.mode)deskState.mode='accept';drawDesk()}else{deskState.recording=true;drawDesk()}};

 d.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{const band=b.dataset.confirm;let n=0;deskState.list.forEach(x=>{const cr=critFor(x);const avg=cr.reduce((a,z)=>a+z[1],0)/cr.length;if(segLabel(Math.round(avg*2)/2)===band&&!S.decisions[x.id]&&subState(x)==='aze'){S.decisions[x.id]={mode:'accept',bands:cr.map(z=>z[1]),score:x.score,state:'reviewed',comment:'',changed:false,at:Date.now()};n++}});drawDesk();toast(`Confirmed ${n} scripts at ${band}. Open any of them to override.`,{fn:()=>{deskState.list.forEach(x=>{if(S.decisions[x.id]&&S.decisions[x.id].at&&Date.now()-S.decisions[x.id].at<9000&&S.decisions[x.id].mode==='accept')delete S.decisions[x.id]});drawDesk()}})});
 /* resizable split */

}
