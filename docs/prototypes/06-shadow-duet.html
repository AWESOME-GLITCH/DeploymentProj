<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shadow duet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
/* Shadow duet, prototype 6. Pronunciation by shadowing: Maya says the line with a
   word-by-word highlight and a bouncing rhythm dot; on the second pass the learner
   speaks along and the two voices are drawn as two ink waveforms that line up.
   Look of 26 Oct: one tangerine block, Maya cropped big (Open Peeps, CC0), a cream
   speech bubble, ink stickers, one ink pill. Blobert (board request) tidies any word
   that slips. Characters are inlined from docs/design/cast, never redrawn. */

:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink); --pill:var(--ink); --on-pill:#FFFFFF;
  --field:var(--paper);
  --spring:cubic-bezier(.2,1.4,.4,1);
}
[data-theme="dark"]{
  --page:#121212; --on-page:var(--cream); --pill:var(--cream); --on-pill:var(--ink); --field:#1E1E1E;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif; font-weight:600;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background 300ms ease,color 300ms ease;
}

/* ---------- the phone: 390 x 844, nothing scrolls ---------- */
.app{
  position:fixed; inset:0; width:100%; max-width:430px; margin:0 auto;
  display:flex; flex-direction:column; gap:10px;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
}

/* ---------- top: three thick segments, one per line, and the theme switch ---------- */
.top{display:flex; align-items:center; gap:10px; height:36px; flex:0 0 auto}
.prog{flex:1; display:flex; gap:8px}
.seg{
  flex:1; height:13px; border-radius:99px; border:3px solid var(--on-page);
  position:relative; overflow:hidden; opacity:.3; transition:opacity 220ms ease;
}
.seg i{position:absolute; inset:0; width:0; background:var(--on-page); transition:width 420ms var(--spring)}
.seg.live,.seg.done{opacity:1}
.seg.done i{width:100%}
.theme{
  width:44px; height:44px; border:none; border-radius:99px; background:transparent;
  color:var(--on-page); display:grid; place-items:center; cursor:pointer; padding:0; margin-right:-8px;
  -webkit-tap-highlight-color:transparent;
}
.theme svg{width:22px; height:22px; display:block}
.theme:active{transform:scale(.9)}
.theme .moon{display:none}
[data-theme="dark"] .theme .sun{display:none}
[data-theme="dark"] .theme .moon{display:block}

/* ---------- the block card ---------- */
.card{
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  border-radius:28px; background:var(--tangerine); color:var(--ink);
  animation:cardIn 360ms var(--spring) both;
  transition:background 320ms ease;
}
.card.end{background:var(--mint)}
@keyframes cardIn{from{opacity:0; transform:translateY(16px) scale(.96)} to{opacity:1; transform:none}}

.head{position:absolute; left:22px; right:22px; top:18px; z-index:3; pointer-events:none}
h1{
  margin:0; font-weight:800; font-size:38px; line-height:1.05; letter-spacing:-1px;
  animation:popIn 350ms var(--spring) both;
}
.sub{margin:8px 0 0; font-size:17px; font-weight:700; line-height:1.3; max-width:22ch; display:none}
.card.end .sub{display:block; animation:popIn 350ms var(--spring) 60ms both}
@keyframes popIn{0%{opacity:0; transform:translateY(10px) scale(.92)} 70%{transform:scale(1.04)} 100%{opacity:1; transform:none}}

/* ---------- Maya: oversized, cropped by the card ---------- */
.maya{
  position:absolute; left:-151px; top:72px; width:520px; height:520px; z-index:1;
  transform-origin:50% 100%; transition:transform 320ms var(--spring);
}
.maya svg{position:absolute; inset:0; width:100%; height:100%; opacity:0}
.maya svg.on{opacity:1}
.maya.breathe{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-6px) rotate(-.6deg)}}
.card.listening .maya{transform:translateX(10px) scale(1.05) rotate(-2deg)}
.card.glad .maya{transform:scale(1.04) rotate(1deg)}
.card.end .maya{display:none}

/* ---------- the "You did it" doodle ---------- */
.doodle{display:none; position:absolute; left:-30px; right:-30px; top:108px; bottom:-30px; z-index:1}
.doodle svg{width:100%; height:100%; display:block}
.card.end .doodle{display:block; animation:popIn 380ms var(--spring) 120ms both}

/* ---------- stickers, ink only ---------- */
.stk{position:absolute; z-index:5; pointer-events:none; color:var(--ink); display:none}
.stk svg{display:block}
.stk.show{display:block; animation:popIn 320ms var(--spring) both}
.twinkle{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)} 45%{transform:scale(1.2) rotate(12deg)} 70%{transform:scale(.94) rotate(-5deg)}}
.stk-star{top:30px; right:26px}
.card.end .stk-star{top:40px; right:30px}
.stk-sound{top:420px; left:300px}
.stk-ear{top:360px; left:306px}
.stk-heart{bottom:230px; left:30px}
.card.end .stk-heart{bottom:auto; top:150px; left:30px}
/* the reward: one of five, pops by her cheek */
.pop{position:absolute; z-index:7; top:236px; left:288px; opacity:0; pointer-events:none}
.pop.go{animation:burst 420ms var(--spring) both}
@keyframes burst{0%{opacity:0; transform:scale(.2) rotate(-30deg)} 65%{opacity:1; transform:scale(1.15) rotate(8deg)} 100%{opacity:1; transform:scale(1) rotate(0)}}

/* ---------- the bubble: her line, the duet, the three bars ---------- */
.bubble{
  position:absolute; left:14px; right:14px; bottom:14px; z-index:4;
  background:var(--cream); color:var(--ink);
  border:3px solid var(--ink); border-radius:24px; box-shadow:0 5px 0 var(--ink);
  padding:22px 18px 16px; min-height:118px;
  display:flex; flex-direction:column; justify-content:center;
  animation:popIn 340ms var(--spring) both;
}
.bubble::before{
  content:""; position:absolute; top:-15px; left:150px; width:24px; height:24px;
  background:var(--cream); border-left:3px solid var(--ink); border-top:3px solid var(--ink);
  transform:rotate(45deg); border-radius:4px 0 0 0;
}
.card.end .bubble{display:none}
.line{margin:0; font-size:23px; line-height:1.55; font-weight:800; letter-spacing:-.3px}
.w{opacity:.3; transition:opacity 140ms ease; display:inline-block}
.w.said,.bubble.preview .w{opacity:1}
.w.now{
  opacity:1; transition:none; background:var(--ink); color:var(--cream);
  border-radius:9px; padding:1px 6px; margin:0 -3px;
  animation:wordPop 220ms var(--spring) both;
}
.w.fix{opacity:1; box-shadow:0 4px 0 var(--ink)}
.w.gone{opacity:0}
@keyframes wordPop{from{transform:scale(.86)} to{transform:scale(1)}}
/* the rhythm dot hops to the word being said */
.dot{
  position:absolute; left:0; top:0; width:13px; height:13px; border-radius:99px;
  background:var(--ink); opacity:0; pointer-events:none;
  transition:transform 180ms var(--spring),opacity 140ms ease;
}
.dot.on{opacity:1}
.dot.hop{animation:hop 240ms var(--spring) both}
@keyframes hop{0%{margin-top:0} 45%{margin-top:-10px} 100%{margin-top:0}}

/* two ink waveforms, hers above the line and yours below it, so they line up */
.waves{display:none; margin-top:12px; grid-template-columns:44px 1fr; align-items:end; column-gap:6px}
.bubble.duet .waves{display:grid; animation:popIn 300ms var(--spring) both}
.lab{font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; line-height:1}
.lab-up{align-self:end; padding-bottom:4px}
.lab-down{align-self:start; padding-top:4px}
.row{display:flex; gap:3px; height:34px}
.row.up{align-items:flex-end}
.row.down{align-items:flex-start}
.row i{flex:1; display:block; height:3px; min-width:0; border-radius:4px; background:var(--ink); transition:height 200ms var(--spring); opacity:.28}
.row i.on{opacity:1}
.row.down i.on{opacity:.9}
.mid{grid-column:2; height:3px; background:var(--ink); border-radius:2px; margin:2px 0}

/* three ink bars, never a percentage */
.score{display:none; margin-top:14px; gap:9px}
.bubble.result .score{display:grid}
.sc{display:grid; grid-template-columns:76px 1fr; align-items:center; gap:10px; animation:popIn 300ms var(--spring) both}
.sc:nth-child(2){animation-delay:60ms}
.sc:nth-child(3){animation-delay:120ms}
.sc b{font-size:13px; font-weight:800; letter-spacing:.3px}
.track{height:16px; border-radius:99px; border:3px solid var(--ink); overflow:hidden}
.fill{display:block; height:100%; width:0; background:var(--ink); border-radius:99px; transition:width 420ms var(--spring)}

/* ---------- Blobert: the only one who handles a mistake ---------- */
.blob{
  position:absolute; right:34px; bottom:var(--bb,140px); width:156px; height:143px; z-index:6;
  opacity:0; transform:translateX(180px); pointer-events:none;
}
.blob svg{width:100%; height:100%; display:block; overflow:visible}
/* his flat fill is the screen's cream so he reads on tangerine; the file stays untouched */
.blob #body > path:first-of-type, .blob #arm-left circle, .blob #arm-right circle{fill:var(--cream)}
.blob #body{transform-box:fill-box; transform-origin:50% 100%}
.blob #eyes{transform-box:fill-box; transform-origin:50% 50%; animation:blink 3.2s ease-in-out infinite}
.blob #arm-right, .blob #broom{transform-box:view-box; transform-origin:184px 120px}
/* the broom's own rotate(-24 216 148) is kept inside the CSS transform, so the sweep adds to it */
.blob #broom{transform:translate(32px,28px) rotate(-24deg) translate(-32px,-28px)}
.blob #mouth{transform-box:fill-box; transform-origin:50% 20%}
.blob #stars{opacity:0}
@keyframes blink{0%,91%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
.blob.in{animation:blobIn 220ms var(--spring) both}
.blob.in #body{animation:wobble 520ms ease-in-out infinite}
.blob.out{animation:blobOut 150ms ease-in both}
@keyframes blobIn{from{opacity:0; transform:translateX(180px) rotate(8deg)} to{opacity:1; transform:translateX(0) rotate(0)}}
@keyframes blobOut{from{opacity:1; transform:translateX(0)} to{opacity:0; transform:translateX(180px)}}
@keyframes wobble{0%,100%{transform:scaleX(1) scaleY(1)} 50%{transform:scaleX(1.05) scaleY(.96)}}
/* gag 1: sweep */
.blob[data-gag="sweep"].act #arm-right{animation:sweepArm 360ms ease-in-out both}
.blob[data-gag="sweep"].act #broom{animation:sweepBroom 360ms ease-in-out both}
@keyframes sweepArm{0%{transform:rotate(0)} 50%{transform:rotate(60deg)} 100%{transform:rotate(10deg)}}
@keyframes sweepBroom{
  0%{transform:rotate(0) translate(32px,28px) rotate(-24deg) translate(-32px,-28px)}
  50%{transform:rotate(60deg) translate(32px,28px) rotate(-24deg) translate(-32px,-28px)}
  100%{transform:rotate(10deg) translate(32px,28px) rotate(-24deg) translate(-32px,-28px)}}
/* gag 2: eat it and burp a star */
.blob[data-gag="eat"] #broom{opacity:0}
.blob[data-gag="eat"].act #mouth{animation:chomp 360ms ease-in-out both}
.blob[data-gag="eat"].act #body{animation:gulp 360ms ease-in-out both}
@keyframes chomp{0%{transform:scaleY(1)} 30%{transform:scaleY(1.6)} 60%{transform:scaleY(.6)} 100%{transform:scaleY(1)}}
@keyframes gulp{0%{transform:scale(1)} 40%{transform:scale(1.08,.94)} 70%{transform:scale(.96,1.08)} 100%{transform:scale(1)}}
/* gag 3: mop it into a puddle */
.blob[data-gag="mop"] #broom{transform:translate(32px,28px) rotate(150deg) translate(-32px,-28px)}
.blob[data-gag="mop"].act #arm-right{animation:mopArm 360ms ease-in-out both}
.blob[data-gag="mop"].act #broom{animation:mopBroom 360ms ease-in-out both}
@keyframes mopArm{0%,100%{transform:rotate(0)} 25%{transform:rotate(22deg)} 75%{transform:rotate(-16deg)}}
@keyframes mopBroom{
  0%,100%{transform:rotate(0) translate(32px,28px) rotate(150deg) translate(-32px,-28px)}
  25%{transform:rotate(22deg) translate(32px,28px) rotate(150deg) translate(-32px,-28px)}
  75%{transform:rotate(-16deg) translate(32px,28px) rotate(150deg) translate(-32px,-28px)}}
.blob.wave #arm-left{transform-box:view-box; transform-origin:62px 128px; animation:waveArm 160ms ease-in-out 2 both}
@keyframes waveArm{0%,100%{transform:rotate(0)} 50%{transform:rotate(-40deg)}}
/* the word he clears: one exit per gag, under 400 ms */
.w.g-sweep{animation:gSweep 340ms ease-in both}
.w.g-eat{animation:gEat 340ms ease-in both}
.w.g-mop{animation:gMop 340ms ease-in both}
@keyframes gSweep{0%{opacity:1} 100%{opacity:0; transform:translate(-130px,-46px) rotate(-22deg)}}
@keyframes gEat{0%{opacity:1} 100%{opacity:0; transform:translate(120px,-50px) scale(.15)}}
@keyframes gMop{0%{opacity:1} 60%{opacity:.6; transform:translateY(6px) scaleY(.3)} 100%{opacity:0; transform:translateY(8px) scaleY(.1)}}
/* his sound, a sticker: a "hup", a sweep, a burp */
.hup{position:absolute; z-index:8; right:96px; bottom:calc(var(--bb,140px) + 64px); opacity:0; pointer-events:none}
.hup.go{animation:burst 380ms var(--spring) both}

/* ---------- dock: one ink pill, plus the typed fallback icon ---------- */
.dock{flex:0 0 auto; display:flex; gap:10px; align-items:center}
.btn{
  position:relative; flex:1; height:56px; border:none; border-radius:99px;
  background:var(--pill); color:var(--on-pill); font:inherit; font-weight:700; font-size:18px;
  display:flex; align-items:center; justify-content:center; gap:10px; padding:0 22px;
  cursor:pointer; transition:transform 180ms var(--spring),opacity 200ms ease; -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.97)}
.btn.waiting{opacity:.5; cursor:default}
.btn .go{position:absolute; right:22px; font-size:22px; font-weight:800; line-height:1}
.btn .go.off{display:none}
.btn.live::before{
  content:""; position:absolute; inset:-6px; border-radius:99px;
  border:3px solid var(--on-page); opacity:.35; animation:ring 1.3s ease-out infinite;
}
@keyframes ring{0%{transform:scale(.97); opacity:.4} 100%{transform:scale(1.08); opacity:0}}
.icon{
  flex:0 0 56px; width:56px; height:56px; border-radius:99px; border:3px solid var(--on-page);
  background:transparent; color:var(--on-page); display:grid; place-items:center; cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent; transition:transform 180ms var(--spring);
}
.icon:active{transform:scale(.94)}
.icon svg{width:26px; height:26px; display:block}
.icon .x{display:none}
.dock.typing .icon .kb{display:none}
.dock.typing .icon .x{display:block}
.typed{display:none; flex:1; min-width:0; gap:8px}
.dock.typing .typed{display:flex}
.dock.typing .btn{display:none}
.typed input{
  flex:1; min-width:0; height:56px; border:3px solid var(--on-page); border-radius:99px;
  background:var(--field); color:var(--on-page); font:inherit; font-weight:700; font-size:16px; padding:0 18px;
}
.typed input::placeholder{color:var(--on-page); opacity:.45}
.typed button{
  height:56px; padding:0 20px; border:none; border-radius:99px; background:var(--pill);
  color:var(--on-pill); font:inherit; font-weight:700; font-size:16px; cursor:pointer;
}

:focus-visible{outline:3px solid var(--on-page); outline-offset:3px; border-radius:99px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .maya.breathe,.twinkle,.blob #eyes,.blob.in #body,.btn.live::before{animation:none !important}
  .card,h1,.sub,.bubble,.stk.show,.sc,.bubble.duet .waves,.doodle{animation-duration:1ms !important}
  .blob.in{animation:fadeIn 160ms ease both} .blob.out{animation:fadeOut 160ms ease both}
  .w.g-sweep,.w.g-eat,.w.g-mop{animation:fadeOut 240ms ease both}
  .dot.hop{animation:none}
  .maya,.row i,.fill,.seg i,.dot{transition-duration:120ms}
  @keyframes fadeIn{from{opacity:0; transform:none} to{opacity:1; transform:none}}
  @keyframes fadeOut{from{opacity:1} to{opacity:0}}
}
@media (max-height:780px){
  h1{font-size:34px}
  .maya{width:470px; height:470px; left:-130px; top:66px}
  .line{font-size:21px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="top">
    <div class="prog" id="prog" role="progressbar" aria-label="Line 1 of 3" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
      <span class="seg live"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span>
    </div>
    <button class="theme" id="theme" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
    </button>
  </div>

  <section class="card" id="card" aria-live="polite">
    <div class="head">
      <h1 id="h1">Listen first</h1>
      <p class="sub" id="sub"></p>
    </div>

    <!-- Maya: Open Peeps (CC0) via scripts/lp/cast.mjs, inlined, never redrawn -->

<script>
(function(){
  "use strict";

  /* ---------------- three lines to shadow, at a cafe ---------------- */
  const LINES = [
    { text:"Could I have the bill, please?", keys:["could","have","bill","please"], stress:[.62,.42,.74,.36,1,.86] },
    { text:"Two coffees, please.",           keys:["two","coffees","please"],       stress:[.9,1,.78] },
    { text:"Do you have oat milk?",          keys:["do","have","oat","milk"],       stress:[.5,.42,.7,.92,1] }
  ];
  const CAN = "You can now ask for the bill.";
  const GAGS = ["sweep","eat","mop"];
  const GAG_SOUND = { sweep:"squiggle", eat:"star", mop:"cloud" };
  const REWARDS = ["star","heart","sparkle","squiggle","cloud"];

  const el = (id) => document.getElementById(id);
  const card = el("card"), h1 = el("h1"), sub = el("sub"), maya = el("maya");
  const bubble = el("bubble"), line = el("line"), dot = el("dot");
  const rowUp = el("rowUp"), rowDown = el("rowDown"), score = el("score");
  const prog = el("prog"), pop = el("pop"), hup = el("hup"), blob = el("blob");
  const stkSound = el("stkSound"), stkEar = el("stkEar"), stkHeart = el("stkHeart");
  const dock = el("dock"), go = el("go"), goLabel = el("goLabel"), goArrow = el("goArrow");
  const kb = el("kb"), typed = el("typed"), typedIn = el("typedIn"), typedGo = el("typedGo");
  const poses = {};
  maya.querySelectorAll("svg").forEach(s => { poses[s.dataset.pose] = s; });

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canHear = !!SR;

  let lineNo = 0, tries = 0, phase = "intro", wordTimer = null, mouthTimer = null, skipLine = null;
  let lastGag = -1, lastReward = -1, spans = [], barsUp = [], barsDown = [];
  const totals = [];

  /* ---------------- Maya's face ---------------- */
  function face(name){
    Object.keys(poses).forEach(k => poses[k].classList.toggle("on", k === name));
  }
  function mood(m){
    card.classList.remove("listening","glad");
    stkSound.classList.remove("show"); stkEar.classList.remove("show");
    clearInterval(mouthTimer);
    maya.classList.toggle("breathe", !reduced && m !== "speaking");
    if (m === "speaking"){
      /* talk and idle swapped at about 8 Hz while she speaks */
      let open = false;
      face("talk");
      mouthTimer = setInterval(() => { open = !open; face(open ? "idle" : "talk"); }, 125);
      stkSound.classList.add("show");
    } else if (m === "listening"){
      face("listen"); card.classList.add("listening"); stkEar.classList.add("show");
    } else if (m === "glad"){
      face("happy"); card.classList.add("glad");
    } else if (m === "wow"){
      face("wow"); card.classList.add("glad");
    } else if (m === "oops"){
      face("oops");
    } else {
      face("idle");
    }
  }

  /* ---------------- the two ink waveforms ---------------- */
  const N = 30;
  function jitter(i){ const x = Math.sin(i * 12.9898 + 7.1) * 43758.5453; return .66 + .34 * (x - Math.floor(x)); }
  /* each word owns a run of bars; the hump inside the run is the word's stress */
  function slots(){
    const words = LINES[lineNo].text.split(" ");
    const total = words.reduce((a,w) => a + w.length + 1, 0);
    let out = [], acc = 0;
    words.forEach((w,i) => {
      const n = Math.max(2, Math.round(N * (w.length + 1) / total));
      for (let k = 0; k < n && out.length < N; k++) out.push({ word:i, t:(k + .5) / n });
    });
    while (out.length < N) out.push({ word:words.length - 1, t:.95 });
    return out;
  }
  function heights(scale, shift){
    const S = LINES[lineNo].stress;
    return slots().map((s,i) => {
      const t = s.t - (shift ? shift[s.word] : 0);
      const gate = (t <= 0 || t >= 1) ? 0 : Math.sin(Math.PI * t);
      return Math.max(3, Math.round(3 + 31 * S[s.word] * (scale ? scale[s.word] : 1) * Math.pow(gate, .6) * jitter(i)));
    });
  }
  function buildWaves(){
    rowUp.innerHTML = ""; rowDown.innerHTML = "";
    barsUp = []; barsDown = [];
    for (let i = 0; i < N; i++){
      const a = document.createElement("i"), b = document.createElement("i");
      rowUp.appendChild(a); rowDown.appendChild(b); barsUp.push(a); barsDown.push(b);
    }
  }
  function paintRow(bars, hs, upTo){
    const sl = slots();
    bars.forEach((b,i) => {
      const on = sl[i].word <= upTo;
      b.classList.toggle("on", on);
      b.style.height = (on ? hs[i] : 3) + "px";
    });
  }

  /* ---------------- she says the line, word by word ---------------- */
  function paintLine(){
    const words = LINES[lineNo].text.split(" ");
    line.innerHTML = words.map((w,i) => '<span class="w" data-i="' + i + '">' + w + "</span>").join(" ");
    spans = Array.prototype.slice.call(line.querySelectorAll(".w"));
  }
  function moveDot(span){
    if (!span){ dot.classList.remove("on"); return; }
    const x = span.offsetLeft + span.offsetWidth / 2 - 6.5;
    const y = span.offsetTop - 15;
    dot.style.transform = "translate(" + x + "px," + y + "px)";
    dot.classList.add("on");
    if (!reduced){ dot.classList.remove("hop"); void dot.offsetWidth; dot.classList.add("hop"); }
  }

  function speakLine(rate, duet, done){
    mood("speaking");
    let over = false, i = 0;
    const hsUp = heights(null, null), hsYou = heights(null, null).map(h => Math.round(h * (.8 + .2 * Math.random())));
    const end = () => {
      if (over) return;
      over = true;
      clearTimeout(wordTimer);
      spans.forEach(s => { s.classList.remove("now"); s.classList.add("said"); });
      dot.classList.remove("on");
      if (window.speechSynthesis){ try { window.speechSynthesis.cancel(); } catch(e){} }
      if (done) done();
    };
    skipLine = end;
    const step = () => {
      spans.forEach((s,k) => { s.classList.toggle("now", k === i); if (k < i) s.classList.add("said"); });
      if (i >= spans.length){ end(); return; }
      moveDot(spans[i]);
      if (duet){ paintRow(barsUp, hsUp, i); paintRow(barsDown, hsYou, i); }
      const w = spans[i].textContent;
      i++;
      wordTimer = setTimeout(step, (reduced ? 150 : 200) + w.length * (58 / rate));
    };
    clearTimeout(wordTimer);
    step();
    if (window.speechSynthesis){
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(LINES[lineNo].text);
        u.lang = "en-GB"; u.rate = rate;
        window.speechSynthesis.speak(u);
      } catch(e){}
    }
  }

  /* ---------------- pass one: Maya alone ---------------- */
  function startLine(){
    phase = "maya";
    tries = 0;
    card.classList.remove("end");
    bubble.classList.remove("duet","result","preview");
    pop.classList.remove("go");
    stkHeart.classList.remove("show");
    paintProg(0);
    paintLine();
    buildWaves();
    h1.textContent = "Listen first";
    setButton("Maya is saying it", true, false);
    closeTyped();
    speakLine(1, false, yourTurn);
  }

  /* ---------------- pass two: the learner shadows her ---------------- */
  function yourTurn(){
    phase = "ready";
    mood("idle");
    spans.forEach(s => s.classList.remove("said","fix"));
    paintProg(.5);
    h1.textContent = "Say it with me";
    setButton(canHear ? "Say it with her" : "Type it with her", false, true);
  }

  function setButton(label, waiting, arrow){
    goLabel.textContent = label;
    go.classList.toggle("waiting", !!waiting);
    goArrow.classList.toggle("off", !arrow);
    go.setAttribute("aria-disabled", waiting ? "true" : "false");
  }

  let rec = null, startedAt = 0;
  function duet(){
    if (!canHear){ openTyped(); return; }
    phase = "duet";
    startedAt = Date.now();
    go.classList.add("live");
    setButton("Listening", false, false);
    bubble.classList.remove("result"); bubble.classList.add("duet");
    let heard = "";
    try {
      rec = new SR();
      rec.lang = "en-GB"; rec.interimResults = true; rec.maxAlternatives = 1;
      rec.onresult = (ev) => {
        let live = "";
        for (let i = 0; i < ev.results.length; i++) live += " " + ev.results[i][0].transcript;
        heard = live;
      };
      rec.onerror = () => { go.classList.remove("live"); openTyped(); };
      rec.onend = () => {
        go.classList.remove("live");
        if (phase !== "duet") return;
        const said = heard.trim();
        if (!said){ openTyped(); return; }
        judge(said, Date.now() - startedAt);
      };
      rec.start();
    } catch(e){
      go.classList.remove("live"); openTyped(); return;
    }
    /* she says the line again while the learner shadows her */
    speakLine(1, true, () => {
      mood("listening");
      setTimeout(() => { if (phase === "duet" && rec){ try { rec.stop(); } catch(e){} } }, 800);
    });
  }

  function openTyped(){
    if (phase === "maya" || phase === "intro" || phase === "end") return;
    phase = "typing";
    mood("listening");
    dock.classList.add("typing");
    kb.setAttribute("aria-pressed", "true"); kb.setAttribute("aria-label", "Back to speaking");
    typedIn.value = "";
    typedIn.placeholder = LINES[lineNo].text;
    typedIn.focus();
  }
  function closeTyped(){
    dock.classList.remove("typing");
    kb.setAttribute("aria-pressed", "false"); kb.setAttribute("aria-label", "Type it instead");
  }

  /* ---------------- scoring: three ink bars, never a percentage ---------------- */
  function norm(s){ return s.toLowerCase().replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim(); }
  function judge(said, ms){
    phase = "result";
    closeTyped();
    go.classList.remove("live");
    const L = LINES[lineNo];
    const heard = norm(said), model = norm(L.text);
    const hw = heard ? heard.split(" ") : [], mw = model.split(" ");
    const scale = [], shift = [];
    let hitCount = 0, slip = -1;
    mw.forEach((w,i) => {
      const hit = hw.some(h => h === w || (w.length > 3 && h.indexOf(w.slice(0,4)) === 0));
      if (hit) hitCount++; else if (slip < 0) slip = i;
      scale.push(hit ? 1 : .28); shift.push(hit ? 0 : .22);
    });
    const hits = L.keys.filter(k => hw.some(h => h === k || (k.length > 3 && h.indexOf(k.slice(0,4)) === 0)));
    const words = hits.length / L.keys.length;
    const sounds = Math.min(1, (hitCount / mw.length) * .8 + words * .3);
    const lenGap = Math.abs(hw.length - mw.length) / Math.max(4, mw.length);
    const paceGap = ms ? Math.min(.6, Math.abs(ms - 2600) / 5200) : 0;
    const rhythm = Math.max(.24, 1 - lenGap - paceGap);

    /* the learner's wave is redrawn with what landed: a slipped word sits low and late */
    bubble.classList.add("duet");
    paintRow(barsUp, heights(null, null), 99);
    paintRow(barsDown, heights(scale, shift), 99);
    showBars(sounds, rhythm, words);

    const high = words >= .67 && sounds >= .5;
    if (high || tries >= 1){
      totals.push([sounds, rhythm, words]);
      if (high) wellDone(sounds + rhythm + words > 2.6); else tidyUp(slip < 0 ? longest(mw) : slip);
    } else {
      tries++;
      tidyUp(slip < 0 ? longest(mw) : slip);
    }
  }
  function longest(mw){ let b = 0; mw.forEach((w,i) => { if (w.length > mw[b].length) b = i; }); return b; }
  function band(v){ return v >= .75 ? "strong" : v >= .45 ? "growing" : "getting started"; }
  function showBars(s, r, w){
    const rows = [["Sounds", s], ["Rhythm", r], ["Words", w]];
    score.innerHTML = rows.map(x =>
      '<div class="sc"><b>' + x[0] + '</b><div class="track" role="img" aria-label="' + x[0] + ": " + band(x[1]) + '"><i class="fill"></i></div></div>'
    ).join("");
    bubble.classList.remove("duet"); bubble.classList.add("result");
    const fills = score.querySelectorAll(".fill");
    rows.forEach((x,i) => setTimeout(() => { fills[i].style.width = Math.round(22 + x[1] * 72) + "%"; }, 120 + i * 60));
  }

  /* high bars: a sticker pops by her cheek, one of five, never the same twice */
  function wellDone(wow){
    mood(wow ? "wow" : "glad");
    h1.textContent = wow ? "Spot on" : "Nice rhythm";
    paintReward();
    pop.classList.add("go");
    paintProg(1);
    setButton("Next line", true, false);
    setTimeout(() => {
      pop.classList.remove("go");
      lineNo++;
      if (lineNo >= LINES.length) finish(); else startLine();
    }, reduced ? 500 : 1500);
  }

  /* low bars: Blobert tidies the word that slipped, then the calm, slow replay */
  function tidyUp(wordIndex){
    phase = "tidy";
    mood("oops");
    h1.textContent = "Nearly";
    setButton("One moment", true, false);
    const target = spans[wordIndex] || spans[0];
    runGag(target, () => {
      target.classList.remove("gone");
      target.classList.add("fix");
      spans.forEach(s => s.classList.remove("said"));
      bubble.classList.remove("result","duet");
      h1.textContent = "Slowly now";
      speakLine(.75, false, () => {
        target.classList.remove("fix");
        if (tries > 1 || totals.length > lineNo){
          lineNo++;
          if (lineNo >= LINES.length) finish(); else startLine();
        } else {
          yourTurn();
        }
      });
    });
  }

  /* ---------------- Blobert: pop in, look, one gag, wave, slide out, under 900 ms ---- */
  let forcedGag = null;
  function pickGag(){
    let i;
    if (forcedGag){ i = GAGS.indexOf(forcedGag); forcedGag = null; }
    else { do { i = Math.floor(Math.random() * GAGS.length); } while (i === lastGag); }
    lastGag = i; return GAGS[i];
  }
  function runGag(target, done){
    const gag = pickGag();
    blob.dataset.gag = gag;
    blob.classList.remove("in","act","wave","out");
    /* he stands on the bubble's top edge, by the word he is clearing */
    blob.style.setProperty("--bb", (bubble.offsetHeight + 4) + "px");
    if (reduced){
      blob.classList.add("in");
      setTimeout(() => { target.classList.add("g-" + gag); }, 160);
      setTimeout(() => { target.classList.add("gone"); target.classList.remove("g-" + gag); blob.classList.remove("in"); if (done) done(); }, 560);
      return;
    }
    blob.classList.add("in");                                                 /* 0    springs in, 220 ms */
    setTimeout(() => {                                                        /* 300  the gag, 360 ms */
      blob.classList.add("act");
      target.classList.add("g-" + gag);
    }, 300);
    setTimeout(() => {                                                        /* 560  his sound, a sticker */
      popSound(GAG_SOUND[gag]);
    }, gag === "eat" ? 620 : 420);
    setTimeout(() => {                                                        /* 660  the word is gone, he waves */
      target.classList.add("gone"); target.classList.remove("g-" + gag);
      blob.classList.remove("act"); blob.classList.add("wave");
    }, 660);
    setTimeout(() => blob.classList.add("out"), 760);                         /* 760  slides out, 150 ms */
    setTimeout(() => {                                                        /* 900  gone */
      blob.classList.remove("in","wave","out"); hup.classList.remove("go");
      if (done) done();
    }, 900);
  }

  /* ---------------- stickers ---------------- */
  const SHAPES = {
    heart: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M11.70 21.60 C1.55 13.37 3.13 3.90 12.04 7.91 C20.23 3.07 22.74 13.47 12.42 21.99 Z" fill="#121212"/></svg>',
    star: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M12.48 0.87 L14.44 9.47 L22.88 12.09 L15.09 14.25 L12.37 23.47 L9.71 15.01 L1.13 11.98 L9.19 9.70 Z" fill="#121212"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M10.76 3.02 L12.25 9.79 L19.09 10.99 L12.00 12.67 L10.87 18.73 L10.03 12.41 L2.94 11.20 L9.58 9.64 Z" fill="#121212"/><circle cx="19.5" cy="18.5" r="2.1" fill="#121212"/><circle cx="4.5" cy="20" r="1.4" fill="#121212"/></svg>',
    squiggle: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M2.31 15.75 C5.50 5.33 9.88 20.60 13.26 11.50 C14.96 6.92 18.76 10.45 22.47 7.11" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" width="SZ" height="SZ"><path d="M6.70 18.92 C0.64 19.31 0.77 11.11 7.49 11.67 C7.69 5.95 15.78 4.44 17.88 10.71 C22.65 9.84 23.95 18.82 17.25 19.12 Z" fill="#121212"/></svg>'
  };
  const shape = (k, sz) => SHAPES[k].replace(/SZ/g, sz);
  function paintReward(){
    let i; do { i = Math.floor(Math.random() * REWARDS.length); } while (i === lastReward);
    lastReward = i;
    pop.innerHTML = shape(REWARDS[i], 76);
  }
  function popSound(kind){
    hup.innerHTML = shape(kind, 34);
    hup.classList.remove("go"); void hup.offsetWidth; hup.classList.add("go");
  }

  /* ---------------- "You did it": another block colour, a full-body doodle ---------------- */
  function finish(){
    phase = "end";
    mood("idle");
    clearInterval(mouthTimer);
    card.classList.add("end");
    h1.textContent = "You did it";
    sub.textContent = CAN;
    stkHeart.classList.add("show");
    paintProg(1, true);
    setButton("Again", false, true);
    closeTyped();
  }

  /* ---------------- progress: three thick segments ---------------- */
  function paintProg(part, all){
    const segs = prog.children;
    for (let i = 0; i < segs.length; i++){
      const done = all || i < lineNo;
      segs[i].classList.toggle("done", done);
      segs[i].classList.toggle("live", !all && i === lineNo);
      segs[i].firstElementChild.style.width = done ? "100%" : (i === lineNo ? Math.round(part * 100) + "%" : "0");
    }
    prog.setAttribute("aria-valuenow", all ? 3 : lineNo);
    prog.setAttribute("aria-label", all ? "All three lines done" : "Line " + (lineNo + 1) + " of 3");
  }

  function reset(){
    lineNo = 0; tries = 0; lastGag = -1; lastReward = -1; totals.length = 0;
    phase = "intro";
    card.classList.remove("end","listening","glad");
    bubble.classList.remove("duet","result");
    bubble.classList.add("preview");
    stkHeart.classList.remove("show");
    paintLine();
    buildWaves();
    mood("idle");
    paintProg(0);
    h1.textContent = "Say it with me";
    setButton("Start", false, true);
    closeTyped();
  }

  /* ---------------- one pill drives everything ---------------- */
  go.addEventListener("click", () => {
    if (phase === "intro"){ startLine(); return; }
    if (phase === "end"){ reset(); startLine(); return; }
    if (phase === "ready"){ duet(); return; }
    if (phase === "duet"){ if (rec){ try { rec.stop(); } catch(e){} } return; }
    if (phase === "maya" && skipLine) skipLine();
  });
  kb.addEventListener("click", () => {
    if (dock.classList.contains("typing")){
      closeTyped();
      if (phase === "typing"){ phase = "ready"; mood("idle"); }
      go.focus();
    } else {
      if (phase === "duet" && rec){ phase = "ready"; try { rec.abort(); } catch(e){} go.classList.remove("live"); }
      if (phase === "ready" || phase === "typing") openTyped();
    }
  });
  typedGo.addEventListener("click", sendTyped);
  typedIn.addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });
  function sendTyped(){
    const v = typedIn.value.trim();
    if (!v) return;
    bubble.classList.add("duet");
    judge(v, 0);
  }

  /* ---------------- light and dark ---------------- */
  const theme = el("theme");
  theme.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    theme.setAttribute("aria-pressed", dark ? "false" : "true");
    theme.setAttribute("aria-label", dark ? "Switch to dark mode" : "Switch to light mode");
  });

  /* ---------------- hooks so the prototype can be driven in a browser check ---------------- */
  window.addEventListener("lp:auto", (e) => {
    const ok = !(e.detail && e.detail.correct === false);
    if (phase === "end"){ reset(); startLine(); }
    if (phase === "intro") startLine();
    const t = LINES[lineNo].text.split(" ");
    if (phase === "maya" && skipLine) skipLine();
    if (phase === "ready" || phase === "typing" || phase === "duet"){
      if (rec){ try { rec.abort(); } catch(e2){} }
      bubble.classList.add("duet");
      judge(ok ? LINES[lineNo].text : t.filter((w,i) => i !== Math.min(2, t.length - 1) && i !== t.length - 1).join(" "), 2600);
    }
  });
  window.__duet = {
    start: () => { if (phase === "end") reset(); startLine(); },
    skip: () => { if (skipLine) skipLine(); },
    answer: (text) => judge(text, 2600),
    shadow: () => {                /* the duet pass without a real mic */
      phase = "duet";
      go.classList.add("live");
      setButton("Listening", false, false);
      bubble.classList.remove("result"); bubble.classList.add("duet");
      speakLine(1, true, () => mood("listening"));
    },
    gag: (which, word) => { forcedGag = which || null; tidyUp(word == null ? 4 : word); },
    finish: () => { totals.length = 0; totals.push([.8,.7,1]); lineNo = 3; finish(); },
    state: () => phase,
    line: () => lineNo
  };

  reset();
})();
</script>
