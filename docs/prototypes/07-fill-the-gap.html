<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fill the gap - Learning Path prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ---------- tokens (board brief, 26 Oct) ---------- */
  :root {
    --sun: #FFD93D;
    --lilac: #CDB8FF;
    --tangerine: #FF5A2D;
    --mint: #A8F0C6;
    --sky: #BFE3FF;
    --ink: #121212;
    --cream: #FFF7E8;
    --paper: #FFFFFF;

    --page: var(--cream);
    --on-page: var(--ink);
    --chip: var(--paper);
    --on-chip: var(--ink);
    --line: var(--ink);
    --ring: var(--cream);

    --spring: cubic-bezier(.2, 1.4, .4, 1);
    --r-card: 28px;
  }

  [data-theme="dark"] {
    --page: #121212;
    --on-page: var(--cream);
    --chip: #1E1E1E;
    --on-chip: var(--cream);
    --line: var(--cream);
    --ring: #121212;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }

  body {
    background: var(--page);
    color: var(--on-page);
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 240ms ease, color 240ms ease;
  }

  /* ---------- phone frame ---------- */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    max-height: 100dvh;
    overflow: hidden;
    background: var(--page);
    display: flex;
    flex-direction: column;
    padding: 16px 20px 20px;
    transition: background 240ms ease;
  }

  /* ---------- top: one thick progress bar and the theme toggle ---------- */
  .top { display: flex; align-items: center; gap: 14px; height: 44px; flex: 0 0 auto; }

  .bar { flex: 1 1 auto; height: 18px; border-radius: 99px; border: 3px solid var(--line); overflow: hidden; }
  .bar i {
    display: block; height: 100%;
    background: var(--line); border-radius: 99px;
    transform-origin: left; transform: scaleX(.06);
    transition: transform 360ms var(--spring);
  }

  .toggle {
    appearance: none; border: 3px solid var(--line); background: transparent; color: var(--on-page);
    width: 48px; height: 44px; border-radius: 99px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto; transition: transform 220ms var(--spring);
  }
  .toggle:active { transform: scale(.92); }
  .toggle svg { width: 19px; height: 19px; display: block; }
  [data-theme="light"] .toggle .sun-i { display: none; }
  [data-theme="dark"] .toggle .moon { display: none; }

  /* ---------- headline and the one line ---------- */
  .head { flex: 0 0 auto; margin-top: 10px; }
  h1 { font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
  .sub { margin: 4px 0 0; font-size: 16px; font-weight: 600; opacity: .72; min-height: 22px; }

  /* ---------- the cafe card: Leo, big, holding the line as a bubble ---------- */
  .card {
    position: relative; flex: 1 1 auto; min-height: 0;
    margin-top: 14px;
    border-radius: var(--r-card); border: 3px solid var(--ink);
    background: var(--lilac); color: var(--ink);
    overflow: hidden;
    animation: pop 380ms var(--spring) backwards;
  }

  @keyframes pop {
    0% { opacity: 0; transform: translateY(14px) scale(.95) }
    70% { opacity: 1; transform: translateY(0) scale(1.03) }
    100% { opacity: 1; transform: none }
  }

  /* Leo: seven faces stacked, one on; the whole figure breathes */
  .leo {
    position: absolute; left: -104px; bottom: -64px;
    width: 484px; height: 484px;
    pointer-events: none;
    transform-origin: 50% 100%;
    animation: breathe 3.2s ease-in-out infinite;
  }
  .leo.lean { animation: none; transform: translateX(10px) rotate(-3deg); transition: transform 240ms var(--spring); }
  .leo.jump { animation: jump 360ms var(--spring); }
  @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.014) translateY(-3px) } }
  @keyframes jump { 0% { transform: translateY(0) } 45% { transform: translateY(-16px) scale(1.02) } 100% { transform: translateY(0) } }

  .face { position: absolute; inset: 0; opacity: 0; }
  .face.on { opacity: 1; }
  .art { width: 100%; height: 100%; display: block; }

  /* the bubble: the line with a dashed gap, Leo holds it up */
  .bubble {
    position: absolute; left: 16px; right: 16px; top: 16px;
    height: 152px;
    border-radius: 22px; border: 3px solid var(--ink);
    background: var(--cream);
    padding: 14px 16px;
    display: flex; align-items: center;
    animation: pop 360ms var(--spring) 60ms backwards;
  }
  .bubble::before, .bubble::after {
    content: ""; position: absolute; left: 40px; bottom: -27px;
    border: 14px solid transparent; border-top: 14px solid var(--ink); border-bottom: 0;
  }
  .bubble::after { bottom: -22px; border-top-color: var(--cream); }

  .sentence { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.4; letter-spacing: -.02em; }
  .sentence .w { white-space: nowrap; }

  .gap {
    display: inline-block; vertical-align: -8px;
    min-width: 94px; height: 40px; padding: 0 10px;
    border-radius: 14px; border: 3px dashed var(--ink);
    text-align: center; line-height: 34px;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .gap b { font-weight: 800; display: inline-block; }
  .gap.filled { border-style: solid; background: var(--lilac); animation: land 340ms var(--spring); }
  .gap.filled.wrong { background: var(--paper); }
  .gap.hint { border-style: dashed; background: transparent; }
  .gap.hint b { opacity: .38; }
  @keyframes land { 0% { transform: scale(1.18) } 100% { transform: scale(1) } }

  /* hear it again: a small ink badge on the bubble corner */
  .hear {
    position: absolute; right: -8px; bottom: -10px;
    width: 46px; height: 46px; border: 3px solid var(--cream); border-radius: 99px;
    background: var(--ink); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 220ms var(--spring);
  }
  .hear:active { transform: scale(.92); }
  .hear svg { width: 22px; height: 22px; }
  .card.busy .hear { opacity: 0; transition: opacity 120ms ease; }

  /* stickers, placed with intent, twinkling */
  .stk { position: absolute; pointer-events: none; animation: twinkle 4s ease-in-out infinite; }
  .stk svg { display: block; width: 100%; height: 100%; }
  .stk-star { right: 18px; top: 186px; width: 38px; height: 38px; }
  .stk-spark { right: 60px; top: 240px; width: 26px; height: 26px; animation-delay: 1.3s; }
  .stk-squig { right: 22px; bottom: 34px; width: 54px; height: 30px; animation-delay: 2.4s; }
  .stk-heart { left: 20px; top: 214px; width: 26px; height: 26px; animation-delay: 3.1s; }
  @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0) } 50% { transform: scale(1.16) rotate(8deg) } }

  /* ---------- the word chips, big ink pills ---------- */
  .chips { flex: 0 0 auto; display: flex; gap: 12px; margin-top: 16px; height: 76px; }

  .chip {
    appearance: none; font-family: inherit;
    flex: 1 1 0; min-width: 0; height: 76px;
    border: 3px solid var(--line); border-radius: 99px;
    background: var(--chip); color: var(--on-chip);
    font-size: 21px; font-weight: 800; letter-spacing: -.01em;
    cursor: pointer;
    animation: pop 340ms var(--spring) backwards;
    transition: transform 260ms var(--spring), opacity 200ms ease;
  }
  .chip:nth-child(1) { animation-delay: 120ms; }
  .chip:nth-child(2) { animation-delay: 180ms; }
  .chip:nth-child(3) { animation-delay: 240ms; }
  .chip:active { transform: scale(.95); }
  @media (hover: hover) { .chip:hover { transform: translateY(-3px); } }
  .chip.taken { opacity: 0; transform: scale(.9); pointer-events: none; }
  .chip.gone { visibility: hidden; pointer-events: none; }

  /* the chip flies to the gap: a clone, so the row does not jump */
  .flyer {
    position: absolute; margin: 0;
    border: 3px solid var(--ink); border-radius: 99px;
    background: var(--paper); color: var(--ink);
    font-size: 21px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    z-index: 6; pointer-events: none;
    transition: transform 360ms var(--spring), width 360ms var(--spring), height 360ms var(--spring), font-size 360ms ease, border-radius 360ms ease;
  }

  /* ---------- Blobert: the only one who handles a mistake ---------- */
  .blobert {
    position: absolute; right: -8px; top: 96px;
    width: 176px; height: 162px;
    z-index: 5; pointer-events: none;
    display: none;
    transform: translateX(240px);
  }
  .blobert.show { display: block; }
  .bl { width: 100%; height: 100%; display: block; overflow: visible; }
  .blobert.flip .bl { transform: scaleX(-1); }

  .blobert.in { animation: bl-in 220ms var(--spring) forwards; }
  .blobert.look { transform: translateX(0) rotate(-6deg); transition: transform 120ms ease-out; }
  .blobert.out { animation: bl-out 140ms ease-in forwards; }
  @keyframes bl-in { 0% { transform: translateX(240px) rotate(10deg) } 100% { transform: translateX(0) rotate(0) } }
  @keyframes bl-out { 0% { transform: translateX(0) } 100% { transform: translateX(240px) rotate(8deg) } }

  /* his groups: body wobbles, eyes blink, broom sweeps */
  #body { transform-box: fill-box; transform-origin: 50% 90%; animation: wobble 2.6s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: scale(1, 1) } 50% { transform: scale(1.04, .96) rotate(-2deg) } }
  #eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 3.4s steps(1) infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 94%, 98% { transform: scaleY(.1) } }
  #broom, #bin { display: none; }
  #sweep-arm { transform-box: fill-box; transform-origin: 10% 20%; }
  #arm-left { transform-box: fill-box; transform-origin: 90% 10%; }
  #stars { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
  #mouth { transform-box: fill-box; transform-origin: 50% 20%; }
  #lid { transform-box: fill-box; transform-origin: 100% 100%; }

  .blobert[data-gag="sweep"] #broom { display: block; }
  .blobert[data-gag="sweep"] #sweep-arm { animation: sweep 360ms ease-in-out; }
  @keyframes sweep { 0% { transform: rotate(30deg) } 55% { transform: rotate(-40deg) } 100% { transform: rotate(-10deg) } }

  .blobert[data-gag="eat"] #mouth { animation: chomp 360ms ease-in-out; }
  @keyframes chomp { 0% { transform: scale(1) } 30% { transform: scale(1.5, 2.1) } 60% { transform: scale(1.1, .6) } 100% { transform: scale(1) } }
  .blobert[data-gag="eat"] #body { animation: gulp 360ms ease-in-out; }
  @keyframes gulp { 0% { transform: scale(1) } 45% { transform: scale(1.14, .9) } 75% { transform: scale(.94, 1.1) } 100% { transform: scale(1) } }

  .blobert[data-gag="bin"] #bin { display: block; }
  .blobert[data-gag="bin"] #lid { animation: lid 360ms var(--spring); }
  @keyframes lid { 0% { transform: rotate(0) } 35% { transform: rotate(-70deg) } 100% { transform: rotate(0) } }

  /* his sound is a sticker: the burp star, the sweep sparkle */
  .blobert.burp #stars { animation: burp 380ms var(--spring) forwards; }
  @keyframes burp { 0% { opacity: 0; transform: scale(.2) translateY(16px) } 100% { opacity: 1; transform: scale(1.3) translateY(-10px) } }
  .blobert.wave #arm-left { animation: wave 180ms ease-in-out 2; }
  @keyframes wave { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(-40deg) } }

  /* what the wrong word does, one per gag, 360 ms */
  .gap.g-sweep b { animation: g-sweep 360ms ease-in 60ms forwards; }
  @keyframes g-sweep { to { transform: translate(-240px, 8px) rotate(-30deg); opacity: 0 } }
  .gap.g-eat b { animation: g-eat 320ms ease-in 40ms forwards; }
  @keyframes g-eat { to { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: .2 } }
  .gap.g-bin b { animation: g-bin 360ms ease-in forwards; }
  @keyframes g-bin { 40% { transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .35 - 30px)) rotate(12deg); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0 } }

  /* ---------- reward sticker by the gap ---------- */
  .pop-sticker { position: absolute; width: 54px; height: 54px; z-index: 7; opacity: 0; pointer-events: none; }
  .pop-sticker.go { animation: stick 420ms var(--spring) forwards; }
  @keyframes stick { 0% { opacity: 0; transform: scale(.2) rotate(-30deg) } 100% { opacity: 1; transform: scale(1) rotate(0) } }

  /* ---------- focus ---------- */
  :focus { outline: none; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring), 0 0 0 7px var(--line); }

  /* ---------- the you-can-now card ---------- */
  .done {
    position: absolute; inset: 16px 20px 96px;
    border-radius: var(--r-card); border: 3px solid var(--ink);
    background: var(--mint); color: var(--ink);
    padding: 26px 24px 0;
    display: none; overflow: hidden; z-index: 8;
  }
  .done.show { display: block; animation: pop 380ms var(--spring) both; }
  .done h2 { font-size: 38px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin: 0; max-width: 250px; }
  .done p { margin: 10px 0 0; font-size: 16px; font-weight: 600; }
  .done-art { position: absolute; left: -150px; width: 650px; height: 488px; bottom: -34px; pointer-events: none; animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  .done-art .art { width: 100%; height: 100%; }
  .done .stk-star { right: 26px; top: 196px; width: 60px; height: 60px; }
  .done .stk-spark { right: 112px; top: 262px; width: 34px; height: 34px; }
  .done .stk-heart { left: 30px; top: 214px; width: 32px; height: 32px; }

  .again {
    position: absolute; left: 20px; right: 20px; bottom: 20px;
    appearance: none; border: 0; height: 56px; border-radius: 99px;
    background: var(--ink); color: #fff;
    font-family: inherit; font-size: 17px; font-weight: 700;
    display: none; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; z-index: 8; transition: transform 220ms var(--spring);
  }
  [data-theme="dark"] .again { background: var(--cream); color: var(--ink); }
  .again.show { display: inline-flex; animation: pop 380ms var(--spring) 120ms backwards; }
  .again:active { transform: scale(.96); }

  .is-done .head, .is-done .card, .is-done .chips, .is-done .top { visibility: hidden; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    .leo, .done-art, .stk, #body, #eyes { animation: none !important; }
    .card, .chip, .gap, .bubble { opacity: 1 !important; transform: none !important; }
    .blobert.in, .blobert.out { animation: none; }
    .blobert.show { transform: none; opacity: 1; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="top">
    <div class="bar" id="bar" role="img" aria-label="Round 1 of 3"><i id="barFill"></i></div>
    <button class="toggle" id="themeBtn" type="button" aria-label="Switch to dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.2 8.2 0 0 1 9.6 4 8.4 8.4 0 1 0 20 14.5Z" /></svg>
      <svg class="sun-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.4" /><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" /></svg>
    </button>
  </div>

  <div class="head">
    <h1>Fill the gap</h1>
    <p class="sub" id="sub">Tap the missing word.</p>
  </div>

  <section class="card" id="card" aria-label="Leo at the cafe, holding the line to finish">

  var faces = {};

  var round = 0;

  /* ---------- Leo's face ---------- */
  function setFace(name) {
    Object.keys(faces).forEach(function (k) { faces[k].classList.toggle("on", k === name); });
  }

  function stopMouth() {
    if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
  }

  /* talk and idle swap on a syllable beat while the line is spoken */
  function mouth(ms, after) {

    var open = false;
    var t0 = performance.now();

      }
    }, 150);
  }

  /* ---------- speech: the line is read out, the words are always on screen ---------- */
  function pickVoice() {
    if (!canSpeak) return;
    var list = synth.getVoices() || [];
    voice = list.filter(function (v) { return /en[-_]GB/i.test(v.lang); })[0] ||
            list.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }

  if (canSpeak) {
    pickVoice();
    synth.addEventListener("voiceschanged", pickVoice);
  }

  function fullLine(r) {
    var words = r.before.concat([r.answer], r.after);
    return words.join(" ").replace(/\s+([.?,!])/g, "$1");
  }

  function speak(rate, after) {
    var text = fullLine(ROUNDS[round]);
    var words = text.split(" ").length;
    var est = (words * 330 + 420) / (rate || 1);
    mouth(est, after);
    if (!canSpeak) return;
    try { synth.cancel(); } catch (e) {}
    var u = new window.SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    if (voice) u.voice = voice;
    u.rate = rate || 1;
    u.pitch = 1.04;
    try { synth.speak(u); } catch (e) {}
  }

  /* ---------- the board ---------- */
  function paintBar() {
    var n = Math.min(round, ROUNDS.length);
    barFill.style.transform = "scaleX(" + Math.max(0.06, n / ROUNDS.length) + ")";
    bar.setAttribute("aria-label", "Round " + Math.min(round + 1, ROUNDS.length) + " of " + ROUNDS.length);
  }

  function word(w) {
    var s = document.createElement("span");
    s.className = "w";
    s.textContent = w;
    return s;
  }

  function buildSentence() {
    var r = ROUNDS[round];
    sentence.textContent = "";
    r.before.forEach(function (w) { sentence.appendChild(word(w)); sentence.appendChild(document.createTextNode(" ")); });
    gapEl = document.createElement("span");
    gapEl.className = "gap";
    gapEl.id = "gap";
    gapEl.setAttribute("aria-label", "the missing word");
    var unit = document.createElement("span");
    unit.className = "w";
    unit.appendChild(gapEl);
    sentence.appendChild(unit);
    r.after.forEach(function (w) {
      if (/^[.?,!]$/.test(w)) { unit.appendChild(word(w)); return; }
      sentence.appendChild(document.createTextNode(" "));
      sentence.appendChild(word(w));
    });
    sentence.setAttribute("aria-label", r.before.concat(["blank"], r.after).join(" "));
  }

  function buildChips() {
    chips.textContent = "";
    ROUNDS[round].chips.forEach(function (w) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = w;
      b.addEventListener("click", function () { choose(b, w); });
      chips.appendChild(b);
    });
  }

  function chipList() { return Array.prototype.slice.call(chips.querySelectorAll(".chip")); }

  /* ---------- a chip springs into the gap, with overshoot ---------- */
  function flyIntoGap(chip, w, wrong, then) {
    var from = chip.getBoundingClientRect();
    var box = phone.getBoundingClientRect();

    // size the gap for the word first, so the flyer lands on its final spot
    gapEl.classList.remove("hint");
    gapEl.innerHTML = "<b></b>";
    gapEl.querySelector("b").textContent = w;
    gapEl.querySelector("b").style.visibility = "hidden";
    var to = gapEl.getBoundingClientRect();

    var fly = document.createElement("p");
    fly.className = "flyer";
    fly.textContent = w;
    fly.style.left = (from.left - box.left) + "px";
    fly.style.top = (from.top - box.top) + "px";
    fly.style.width = from.width + "px";
    fly.style.height = from.height + "px";
    phone.appendChild(fly);
    chip.classList.add("taken");

    var dx = to.left - from.left + (to.width - from.width) / 2;
    var dy = to.top - from.top + (to.height - from.height) / 2;

    requestAnimationFrame(function () {
      fly.style.transform = "translate(" + dx + "px," + dy + "px)";
      fly.style.width = to.width + "px";
      fly.style.height = to.height + "px";
      fly.style.fontSize = "26px";
      fly.style.borderRadius = "14px";
    });

    later(function () {
      gapEl.classList.add("filled");
      if (wrong) gapEl.classList.add("wrong");
      gapEl.querySelector("b").style.visibility = "";
      fly.remove();
      then();
    }, reduced ? 20 : 360);
  }

  function popReward() {
    var i = Math.floor(Math.random() * 6);
    if (i === lastSticker) i = (i + 1 + Math.floor(Math.random() * 5)) % 6;
    lastSticker = i;
    var g = gapEl.getBoundingClientRect();
    var box = phone.getBoundingClientRect();
    popSticker.querySelector("use").setAttribute("href", "#st-" + i);
    popSticker.style.left = (g.right - box.left - 16) + "px";
    popSticker.style.top = (g.top - box.top - 40) + "px";
    popSticker.classList.remove("go");
    void popSticker.offsetWidth;
    popSticker.classList.add("go");
  }

  /* ---------- Blobert clears the wrong word, one gag, never twice in a row ---------- */
  function blobertClears(chip) {
    var i = Math.floor(Math.random() * GAGS.length);
    if (i === lastGag) i = (i + 1 + Math.floor(Math.random() * (GAGS.length - 1))) % GAGS.length;
    lastGag = i;
    var gag = GAGS[i];
    var t0 = performance.now();

    setFace("oops");
    leo.classList.add("lean");

    card.classList.add("busy");
    blobert.dataset.gag = "";
    blobert.className = "blobert show" + (gag === "sweep" ? " flip" : "");
    void blobert.offsetWidth;
    blobert.classList.add("in");

    later(function () {                       // 220 ms: he looks at the wrong word
      blobert.classList.remove("in");
      blobert.classList.add("look");
    }, 220);

    later(function () {                       // 300 ms: the gag, 360 ms
      blobert.dataset.gag = gag;
      var g = gapEl.getBoundingClientRect();
      var b = blobert.getBoundingClientRect();
      var tx, ty;
      if (gag === "eat") {                    // the word goes into his mouth
        tx = (b.left + b.width * 0.5) - (g.left + g.width / 2);
        ty = (b.top + b.height * 0.58) - (g.top + g.height / 2);
      } else {                                // the word drops into the bin
        tx = (b.left + b.width * 0.16) - (g.left + g.width / 2);
        ty = (b.top + b.height * 0.8) - (g.top + g.height / 2);
      }
      gapEl.style.setProperty("--dx", tx + "px");
      gapEl.style.setProperty("--dy", ty + "px");
      gapEl.classList.add("g-" + gag);
      if (gag === "eat") later(function () { blobert.classList.add("burp"); }, 300);
    }, 300);

    later(function () { blobert.classList.add("wave"); }, 620);

    later(function () {                       // 760 ms: he slides out
      blobert.classList.remove("look", "wave");
      blobert.classList.add("out");
    }, 760);

    later(function () {
      blobert.className = "blobert";
      blobert.dataset.gag = "";
      card.classList.remove("busy");
      chip.classList.add("gone");
      if (window.console) console.log("Blobert gag " + gag + ": " + Math.round(performance.now() - t0) + " ms");
    }, 900);

    /* then the calm correction: the right word shown faintly, the line again, slower */
    later(function () {
      leo.classList.remove("lean");
      gapEl.className = "gap hint";
      gapEl.style.removeProperty("--dx");
      gapEl.style.removeProperty("--dy");
      gapEl.innerHTML = "<b></b>";
      gapEl.querySelector("b").textContent = ROUNDS[round].answer;
      sub.textContent = "Listen, then tap it.";
      speak(0.75, "listen");
      locked = false;
    }, 950);
  }

  /* ---------- a turn ---------- */
  function choose(chip, w) {
    if (locked) return;
    locked = true;
    stopMouth();

    if (w !== ROUNDS[round].answer) {
      live.textContent = "Not that one. Blobert is clearing it.";
      setFace("wow");
      flyIntoGap(chip, w, true, function () { blobertClears(chip); });
      return;
    }

    chipList().forEach(function (c) { if (c !== chip) c.classList.add("taken"); });
    sub.textContent = "Yes. That is the polite way.";
    live.textContent = "Yes. " + fullLine(ROUNDS[round]);

    flyIntoGap(chip, w, false, function () {
      popReward();
      setFace("happy");
      leo.classList.remove("lean");
      leo.classList.add("jump");
      later(function () { leo.classList.remove("jump"); }, 380);
      later(function () { speak(1, "happy"); }, 420);
    });

    later(function () {
      round += 1;
      if (round >= ROUNDS.length) { finish(); return; }
      newRound();
    }, 2500);
  }

  function newRound() {
    paintBar();
    buildSentence();
    buildChips();
    popSticker.classList.remove("go");
    sub.textContent = ROUND_LINES[round] || ROUND_LINES[0];
    setFace("idle");
    locked = false;
    later(function () { speak(1); }, 480);
  }

  function finish() {
    paintBar();
    stopMouth();
    phone.classList.add("is-done");
    done.classList.add("show");
    againBtn.classList.add("show");
    done.setAttribute("aria-hidden", "false");
    live.textContent = "You can now ask politely.";
    againBtn.focus();
  }

  function restart() {
    clearLater();
    phone.classList.remove("is-done");
    done.classList.remove("show");
    againBtn.classList.remove("show");
    done.setAttribute("aria-hidden", "true");
    round = 0;
    newRound();
  }

  /* ---------- controls ---------- */
  hearBtn.addEventListener("click", function () { speak(1); });
  againBtn.addEventListener("click", restart);

  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    var dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    themeBtn.setAttribute("aria-label", dark ? "Switch to dark mode" : "Switch to light mode");
  });

  /* left and right across the chips; Enter and Space come free with buttons */
  chips.addEventListener("keydown", function (e) {
    var step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!step) return;
    var list = chipList().filter(function (c) { return !c.classList.contains("gone"); });
    var i = list.indexOf(document.activeElement);
    if (i < 0) return;
    var n = i + step;
    if (n < 0 || n >= list.length) return;
    e.preventDefault();
    list[n].focus();
  });

  /* tester hook, same shape as the app */
  window.addEventListener("lp:auto", function (e) {
    var right = !(e.detail && e.detail.correct === false);
    var list = chipList().filter(function (c) { return !c.classList.contains("gone"); });
    var want = list.filter(function (c) {
      return right ? c.textContent === ROUNDS[round].answer : c.textContent !== ROUNDS[round].answer;
    })[0];
    if (want) want.click();
  });

  /* ---------- go ---------- */
  newRound();
})();
</script>
</body>
</html>
