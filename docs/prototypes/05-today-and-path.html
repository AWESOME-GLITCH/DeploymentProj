<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>Today and the path - Learning Path prototype</title>
<!-- Characters: Open Peeps and Open Doodles (both CC0, Pablo Stanley), recoloured to the brief and inlined from docs/design/cast/. Blobert is custom. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --sun:#FFD93D; --lilac:#CDB8FF; --tangerine:#FF5A2D; --mint:#A8F0C6; --sky:#BFE3FF;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink);
  --road-edge:var(--ink); --road-surface:var(--paper); --road-done:var(--sun);
  --mark-fill:var(--paper); --mark-ink:var(--ink);
  --tag-bg:var(--ink); --tag-fg:var(--cream);
  --chip:rgba(18,18,18,.55); --chip-line:rgba(18,18,18,.28);
  --spring:cubic-bezier(.2,1.4,.4,1);
  --ease:cubic-bezier(.2,.8,.3,1);
}
html[data-theme="dark"]{
  --page:#121212; --on-page:#FFF7E8;
  --road-edge:var(--cream); --road-surface:#121212;
  --mark-fill:#121212; --mark-ink:var(--cream);
  --tag-bg:var(--cream); --tag-fg:var(--ink);
  --chip:rgba(255,247,232,.6); --chip-line:rgba(255,247,232,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-weight:600; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  transition:background .3s var(--ease), color .3s var(--ease);
}
.app{
  position:relative; width:min(390px,100vw); height:100%; max-height:844px;
  display:flex; flex-direction:column; overflow:hidden; background:var(--page);
  padding:10px 20px 0;
}
@media (min-width:430px) and (min-height:880px){
  .app{height:844px;border-radius:40px;box-shadow:0 30px 80px rgba(18,18,18,.22)}
}
:focus-visible{outline:3px solid var(--on-page);outline-offset:3px}
.card :focus-visible,.lesson :focus-visible{outline-color:var(--ink)}

/* ---------------------------------------------------------------- top chrome */
.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex:0 0 auto}
.chip{
  position:relative;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;
  border:2px dashed var(--chip-line);border-radius:999px;background:none;color:var(--chip);
  font:800 10.5px/1 inherit;font-family:inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
.chip:after{content:"";position:absolute;inset:-5px -6px}
.chip b{color:var(--on-page);font-weight:800}
.chip:active{transform:scale(.96)}
.round{
  width:44px;height:44px;border-radius:50%;border:3px solid var(--on-page);background:none;
  color:var(--on-page);display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .35s var(--spring);
}
.round:active{transform:scale(.9)}
.round svg{width:20px;height:20px}
.round .sun-i{display:none}
html[data-theme="dark"] .round .sun-i{display:block}
html[data-theme="dark"] .round .moon{display:none}

/* ---------------------------------------------------------------- the card */
.card{
  position:relative;flex:0 0 auto;height:446px;margin-top:8px;
  border:3px solid var(--ink);border-radius:28px;padding:22px 22px 20px;
  background:var(--sun);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
  transition:background .3s var(--ease);
}
.card[data-tone="lilac"]{background:var(--lilac)}
.card[data-tone="mint"]{background:var(--mint)}
h1{font:800 40px/1.05 inherit;letter-spacing:-.025em;margin:0;position:relative;z-index:2}
.line{font:600 16px/1.35 inherit;margin:7px 0 0;max-width:26ch;position:relative;z-index:2}
.spacer{flex:1 1 auto}
.pill{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:56px;border:0;border-radius:999px;background:var(--ink);color:#fff;
  font:700 17px/1 inherit;font-family:inherit;cursor:pointer;flex:0 0 auto;
  transition:transform .35s var(--spring);
}
.pill:active{transform:scale(.965)}
.pill .go{font-size:20px;font-weight:800;transition:transform .35s var(--spring)}
.pill:hover .go{transform:translateX(4px)}

/* the oversized character, cropped by the card */
.hero{position:absolute;z-index:1;pointer-events:none;display:none}
.hero svg{display:block;width:100%;height:100%}
.card[data-state="today"] .hero--coffee{display:block;width:426px;height:320px;left:-24px;top:94px}
.card[data-state="back"] .hero--stroll{display:block;width:440px;height:330px;left:10px;top:80px}
.breathe{transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.018) rotate(-.6deg)}}

/* stickers: ink, few, placed with intent */
.sticker{position:absolute;z-index:2;pointer-events:none;display:none}
.sticker svg{display:block;width:100%;height:100%;fill:var(--ink)}
.card[data-state="today"] .st-today,.card[data-state="back"] .st-back,.card[data-state="done"] .st-done{display:block}
.twinkle{animation:twinkle 4s var(--ease) infinite}
.twinkle.b{animation-delay:1.3s}.twinkle.c{animation-delay:2.4s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.7) rotate(-14deg);opacity:.8}}

/* session end: coach avatar + week bar */
.coach{display:none;width:76px;height:76px;border:3px solid var(--ink);border-radius:50%;overflow:hidden;
  background:var(--paper);position:relative;z-index:2;flex:0 0 auto}
.coach svg{display:block;width:150%;height:150%;margin:-12% 0 0 -25%}
.card[data-state="done"] .coach{display:block}
.card[data-state="done"] h1{font-size:34px;margin-top:14px}
.week{display:none;gap:7px;align-items:flex-end;margin-top:auto;position:relative;z-index:2}
.card[data-state="done"] .week{display:flex}
.week i{flex:1;display:block;border:3px solid var(--ink);border-radius:9px;background:transparent;
  height:28px;transition:height .4s var(--spring),background .3s var(--ease)}
.week i.on{background:var(--ink);height:48px}
.week i.now{height:48px;background:var(--ink)}
.week-days{display:none;gap:7px;margin:8px 0 14px;position:relative;z-index:2}
.card[data-state="done"] .week-days{display:flex}
.week-days span{flex:1;text-align:center;font:700 11.5px/1 inherit;opacity:.8}
.week-days span.now{opacity:1;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.card[data-state="done"] .line{margin-bottom:0}

/* ---------------------------------------------------------------- the path */
.path{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-top:12px;
  transition:transform .36s var(--ease),opacity .3s var(--ease)}
.kicker{font:800 11.5px/1 inherit;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:0 0 0 4px;flex:0 0 auto}
.road-box{position:relative;flex:1 1 auto;min-height:0}
.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.road .edge{fill:none;stroke:var(--road-edge);stroke-width:40;stroke-linecap:round;stroke-linejoin:round}
.road .surface{fill:none;stroke:var(--road-surface);stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.road .done{fill:none;stroke:var(--road-done);stroke-width:34;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke-dasharray .4s var(--ease),stroke .3s var(--ease)}
.road .dashes{fill:none;stroke:var(--road-edge);stroke-width:3;stroke-linecap:round;stroke-dasharray:6 12;opacity:.55}
.lm{stroke:var(--mark-ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;fill:var(--mark-fill)}
.lm .solid{fill:var(--mark-ink);stroke:none}
.lm-g{transform-box:fill-box;transform-origin:center;transition:transform .35s var(--spring)}
.lm-next .lm-g{transform:scale(1.25)}
.lm-ahead{opacity:.85}
.pulse{fill:none;stroke:var(--mark-ink);stroke-width:3;opacity:.4;transform-box:fill-box;transform-origin:center;
  animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
.tag rect{fill:var(--tag-bg)}
.tag text{fill:var(--tag-fg);font:800 13px/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em}
.tag .leader{fill:none;stroke:var(--tag-bg);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 7}
.lm-label{fill:var(--on-page);font:800 12.5px/1 "Plus Jakarta Sans",system-ui,sans-serif;opacity:.7}
.tick circle{fill:var(--mark-ink)}
.tick path{fill:none;stroke:var(--mark-fill);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}

/* Blobert, who dusted the path (Welcome back only) */
.blobert{position:absolute;display:none;width:80px;height:72px;left:0;top:26px;z-index:3;pointer-events:none}
.app[data-state="back"] .blobert{display:block}
.blobert svg{display:block;width:100%;height:100%;overflow:visible}
.blobert .wobble{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(.965) scaleX(1.025)}}
.blobert .hi{transform-box:fill-box;transform-origin:100% 0;animation:hi 2.4s var(--ease) infinite}
@keyframes hi{0%,100%{transform:rotate(0)}15%{transform:rotate(-38deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(-40deg)}60%{transform:rotate(0)}}
.dust{position:absolute;display:none;left:78px;top:60px;width:60px;height:40px;pointer-events:none}
.app[data-state="back"] .dust{display:block}
.dust i{position:absolute;bottom:4px;left:0;width:12px;height:12px;border-radius:50%;border:3px solid var(--on-page);
  opacity:0;animation:dust 2.4s var(--ease) infinite}
.dust i:nth-child(2){left:16px;width:8px;height:8px;animation-delay:.5s}
.dust i:nth-child(3){left:30px;width:15px;height:15px;animation-delay:1.1s}
@keyframes dust{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.85}100%{opacity:0;transform:translate(22px,-24px) scale(1.15)}}

/* ---------------------------------------------------------------- tab bar */
.tabs{flex:0 0 auto;display:flex;gap:8px;margin:12px 0 14px;transition:transform .36s var(--ease),opacity .3s var(--ease)}
.tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:52px;
  border:3px solid var(--on-page);border-radius:999px;background:none;color:var(--on-page);cursor:pointer;
  font:700 14px/1 inherit;font-family:inherit;padding:0;
  transition:background .25s var(--ease),color .25s var(--ease),transform .35s var(--spring);
}
.tab svg{width:20px;height:20px;flex:0 0 auto}
.tab[aria-selected="true"]{background:var(--on-page);color:var(--page)}
.tab:active{transform:scale(.95)}

/* ---------------------------------------------------------------- lesson shell */
.lesson{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:12px 20px 20px;
  background:var(--sun);color:var(--ink);visibility:hidden;
  clip-path:inset(var(--ct,62px) var(--cr,20px) var(--cb,334px) var(--cl,20px) round 28px);
}
.lesson.is-on{visibility:visible;animation:expand .4s var(--spring) both}
.lesson.is-off{visibility:visible;animation:expand .32s var(--ease) reverse both}
@keyframes expand{from{clip-path:inset(var(--ct,62px) var(--cr,20px) var(--cb,334px) var(--cl,20px) round 28px)}
  to{clip-path:inset(0 0 0 0 round 0)}}
.lesson-top{display:flex;align-items:center;gap:14px;height:44px;flex:0 0 auto;margin-bottom:6px}
.bar{flex:1;height:12px;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink);width:0;transition:width .4s var(--spring)}
.close{width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;margin-left:-10px;padding:0}
.close svg{width:22px;height:22px}
.step{font:800 11.5px/1 inherit;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:8px 0 6px}
.lesson h1{font-size:36px}
.lesson .line{max-width:22ch}
.stage{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center;gap:0}
.say{display:flex;align-items:center;gap:14px}
.say .coach{display:block;width:96px;height:96px;background:var(--paper)}
.say .coach svg{width:150%;height:150%;margin:-12% 0 0 -25%}
.bubble{
  position:relative;flex:1;border:3px solid var(--ink);border-radius:24px;background:var(--paper);
  padding:16px 18px;font:800 22px/1.15 inherit;letter-spacing:-.02em;color:var(--ink);
}
.bubble:before{content:"";position:absolute;left:-13px;top:38px;width:18px;height:18px;background:var(--paper);
  border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble small{display:block;font:600 13px/1.2 inherit;opacity:.6;margin-top:6px;letter-spacing:0}
.lesson .hero{display:block;position:relative;left:auto;top:auto;width:auto;height:auto;flex:1 1 auto;min-height:0;margin:4px -30px 0}
.lesson .hero svg{width:100%;height:100%}
.heard{
  border:3px dashed var(--ink);border-radius:22px;padding:14px 18px;font:700 16px/1.2 inherit;text-align:center;
  min-height:54px;display:flex;align-items:center;justify-content:center;margin:0 0 14px;flex:0 0 auto;
  transition:background .25s var(--ease)
}
.heard.good{border-style:solid;background:var(--paper)}
.pop-star{position:absolute;right:22px;top:40%;width:84px;height:84px;pointer-events:none;opacity:0;z-index:5}
.pop-star svg{width:100%;height:100%;fill:var(--ink)}
.pop-star.go{animation:popstar .5s var(--spring) both}
@keyframes popstar{0%{opacity:0;transform:scale(.2) rotate(-24deg)}55%{opacity:1;transform:scale(1.1) rotate(6deg)}100%{opacity:0;transform:scale(1.3) rotate(10deg)}}

/* ---------------------------------------------------------------- motion */
.pop{animation:pop .36s var(--spring) both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.away .path,.away .tabs{transform:translateY(140px);opacity:0}
.away .card{transition:none}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .breathe,.twinkle,.pulse,.blobert .wobble,.blobert .hi,.dust i{animation:none!important}
  .dust i{opacity:.5}
}

/* other tabs: Path and Me */
.view{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.app[data-tab="today"] #v-today,.app[data-tab="path"] #v-path,.app[data-tab="me"] #v-me{display:flex}
.page-head{flex:0 0 auto;padding:10px 2px 0}
.page-head h1{font-size:36px}
#v-path .path{padding-top:8px}
.me-card{margin-top:10px;height:auto;flex:0 0 auto;padding-bottom:22px}
.me-card .week,.me-card .week-days{display:flex}
.me-card .week{margin-top:20px}
.me-card .coach svg{width:150%;height:150%;margin:-12% 0 0 -25%}
.me-card .line{max-width:none}
.text-btn{display:block;margin:0 auto;background:none;border:0;color:currentColor;opacity:.85;
  font:700 15px/1 inherit;font-family:inherit;cursor:pointer;padding:14px 16px;text-decoration:underline;
  text-underline-offset:4px;text-decoration-thickness:2px}
</style>
</head>
<body>
<div class="app" id="app" data-state="today" data-tab="today">

  <div class="top">
    <button class="chip" id="demo" type="button" aria-label="Demo: switch state">demo · <b id="demo-name">Today</b></button>
    <button class="round" id="theme" type="button" aria-label="Switch to dark mode">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      <svg class="sun-i" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/></g></svg>
    </button>
  </div>

  <!-- ============================================================ TODAY -->
  <div class="view" id="v-today">

function buildRoad(el,{done,next,labels,tone,shape='wide'}){
  const R=ROADS[shape], W=R.W, H=R.H;
  el.innerHTML=`<svg class="road" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Your path: ${STOPS.map(s=>s.label).join(', ')}">
    <path class="edge" d="${R.d}"/><path class="surface" d="${R.d}"/>
    <path class="done" pathLength="100" d="${R.d}" stroke-dasharray="0 100"/>
    <path class="dashes" d="${R.d}"/><g class="marks"></g></svg>`;
  const svg=el.querySelector('svg'), marks=svg.querySelector('.marks'), guide=svg.querySelector('.edge');
  const L=guide.getTotalLength();
  const road=[]; for(let i=0;i<=160;i++) road.push(guide.getPointAtLength(i/160*L));
  const pts=STOPS.map(s=>guide.getPointAtLength(s.t*L));
  const taken=[];
  /* find a spot for a w by h box near p that stays inside, clears the other stops and, if it can, the road */
  function place(p,w,h,big){
    let best=null;
    for(let a=0;a<16;a++){
      const ang=a/16*Math.PI*2, dx=Math.cos(ang), dy=Math.sin(ang);
      for(const r of (big?[58,72,88]:[38,48])){
        const cx=p.x+dx*(r+Math.abs(dx)*w/2*0.6), cy=p.y+dy*(r+Math.abs(dy)*h/2*0.6);
        if(cx-w/2<2||cx+w/2>W-2||cy-h/2<2||cy+h/2>H-2) continue;
        let score=-r*0.08-(dy>0?3:0);
        for(const q of pts){ if(q!==p&&Math.abs(q.x-cx)<w/2+22&&Math.abs(q.y-cy)<h/2+22) score-=60; }
        for(const q of road){ if(Math.abs(q.x-cx)<w/2+14&&Math.abs(q.y-cy)<h/2+14) score-=1.2; }
        for(const t of taken){ if(Math.abs(t.x-cx)<(t.w+w)/2+8&&Math.abs(t.y-cy)<(t.h+h)/2+8) score-=60; }
        if(!best||score>best.score) best={score,cx,cy};
      }
    }
    if(!best) best={cx:p.x,cy:p.y-56};
    taken.push({x:best.cx,y:best.cy,w,h});
    return {x:best.cx-p.x,y:best.cy-p.y};
  }
  STOPS.forEach((s,i)=>{
    const p=pts[i];
    const g=document.createElementNS(SVGNS,'g');
    const isNext=i===next, isDone=i<next;
    g.setAttribute('class','stop'+(isNext?' lm-next':'')+(i>next?' lm-ahead':''));
    g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    let inner='';
    if(isNext) inner+=`<circle class="pulse" r="28"/>`;
    inner+=`<g class="lm-g"><g class="lm">${ICONS[s.icon]}</g>${isDone?
      `<g class="tick" transform="translate(13,-13)"><circle r="9"/><path d="M-4,0.3 L-1.3,3.1 L4.1,-3.2"/></g>`:''}</g>`;
    if(isNext){
      const text=s.label+' · next', w=text.length*7.6+26, o=place(p,w,32,true);
      const len=Math.hypot(o.x,o.y), ux=o.x/len, uy=o.y/len;
      const edge=Math.min(len-4, len-Math.min(w/2*Math.abs(ux)+16*Math.abs(uy),len));
      inner+=`<g class="tag"><path class="leader" d="M${(ux*26).toFixed(1)},${(uy*26).toFixed(1)} L${(ux*(len-20)).toFixed(1)},${(uy*(len-20)).toFixed(1)}"/>
        <rect x="${(o.x-w/2).toFixed(1)}" y="${(o.y-16).toFixed(1)}" width="${w.toFixed(0)}" height="32" rx="16"/>
        <text x="${o.x.toFixed(1)}" y="${(o.y+5).toFixed(1)}" text-anchor="middle">${text}</text></g>`;
    }else if(labels){
      const w=s.label.length*7.4+6, o=place(p,w,18,false);
      inner+=`<text class="lm-label" x="${o.x.toFixed(1)}" y="${(o.y+4.5).toFixed(1)}" text-anchor="middle">${s.label}</text>`;
    }
    g.innerHTML=inner; marks.appendChild(g);
  });
  const d=svg.querySelector('.done');
  d.style.stroke=tone;
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.setAttribute('stroke-dasharray',`${done} 100`)));
}

/* ------------------------------------------------------------------ states */
const app=document.getElementById('app'), card=document.getElementById('card');
const SCENES={
  today:{name:'Today',        tone:'sun',   head:'Today',        line:'Ten minutes. Order at a cafe.', btn:'Start', done:30, next:2},
  back: {name:'Welcome back', tone:'lilac', head:'Welcome back', line:'Blobert tidied your path.',     btn:'Start', done:30, next:2},
  done: {name:'Session end',  tone:'mint',  head:'You can now order at a cafe', line:'Nice work. Same time tomorrow.', btn:'Done', done:54, next:3}
};
const ORDER=['today','back','done'];
const TONE={sun:'var(--sun)',lilac:'var(--lilac)',mint:'var(--mint)'};
let state='today', tab='today';
function paint(){
  const s=SCENES[state];
  app.dataset.state=state; card.dataset.state=state; card.dataset.tone=s.tone;
  document.getElementById('head').textContent=s.head;
  document.getElementById('line').textContent=s.line;
  document.getElementById('start-label').textContent=s.btn;
  document.getElementById('demo-name').textContent=s.name;
  document.getElementById('path-line').textContent=state==='done'?'Next stop: the station.':'Next stop: the cafe.';
  replay(card);
  buildRoad(document.getElementById('road-today'),{done:s.done,next:s.next,labels:false,tone:TONE[s.tone]});
}
function replay(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
document.getElementById('demo').addEventListener('click',()=>{
  state=ORDER[(ORDER.indexOf(state)+1)%ORDER.length]; paint();
});

/* -------------------------------------------------------------------- tabs */
const TABICON={
  today:'<path d="M12 3v2.4M12 18.6V21M4.2 12H2m20 0h-2.2M5.6 5.6 4 4m14.4 1.6L20 4M5.6 18.4 4 20m14.4-1.6L20 20"/><circle cx="12" cy="12" r="4.4"/>',
  path :'<path d="M5 20c0-4 6-3 6-7s-5-3-5-6 4-3 8-3"/><circle cx="18.5" cy="5" r="2"/><circle cx="5.5" cy="20" r="2"/>',
  me   :'<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.4-4 4.3-5.6 7.5-5.6s6.1 1.6 7.5 5.6"/>'
};
document.getElementById('tabs').innerHTML=['today','path','me'].map(k=>
  `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k==='today'}" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TABICON[k]}</svg>${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
function go(t){
  tab=t; app.dataset.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  const view=document.getElementById('v-'+t);
  view.querySelectorAll('.pop').forEach(replay);
  if(t==='path'){const s=SCENES[state];buildRoad(document.getElementById('road-path'),{done:s.done,next:s.next,labels:true,tone:TONE[s.tone],shape:'tall'});}
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b) go(b.dataset.tab);});

/* ------------------------------------------------------------------- theme */
function setTheme(mode){
  document.documentElement.dataset.theme=mode;
  document.querySelector('meta[name=theme-color]').content=mode==='dark'?'#121212':'#FFF7E8';
  document.getElementById('theme').setAttribute('aria-label',mode==='dark'?'Switch to light mode':'Switch to dark mode');
  document.getElementById('me-theme').textContent=mode==='dark'?'Light mode':'Dark mode';
}
const toggleTheme=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
document.getElementById('theme').addEventListener('click',toggleTheme);
document.getElementById('me-theme').addEventListener('click',toggleTheme);

/* ------------------------------------------------------------------ lesson */
const lesson=document.getElementById('lesson'), heard=document.getElementById('heard');
let lastSticker=-1, busy=false;
function openLesson(){
  if(state==='done'){state='today';paint();return;}
  const r=card.getBoundingClientRect(), a=app.getBoundingClientRect();
  lesson.style.setProperty('--ct',(r.top-a.top)+'px');
  lesson.style.setProperty('--cl',(r.left-a.left)+'px');
  lesson.style.setProperty('--cr',(a.right-r.right)+'px');
  lesson.style.setProperty('--cb',(a.bottom-r.bottom)+'px');
  lesson.style.background=TONE[SCENES[state].tone];
  lesson.classList.remove('is-off'); lesson.classList.add('is-on'); lesson.setAttribute('aria-hidden','false');
  app.classList.add('away');
  lesson.querySelectorAll('.pop').forEach(replay);
  heard.textContent='Tap the button and say it'; heard.classList.remove('good');
  document.getElementById('say-label').textContent='Say it';
  document.getElementById('lesson-bar').style.width='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('lesson-bar').style.width='33%';}));
  setTimeout(()=>document.getElementById('say').focus({preventScroll:true}),420);
}
function closeLesson(toDone){
  lesson.classList.remove('is-on'); lesson.classList.add('is-off'); lesson.setAttribute('aria-hidden','true');
  app.classList.remove('away');
  setTimeout(()=>{lesson.classList.remove('is-off');},340);
  if(toDone){state='done';paint();}
  document.getElementById('start').focus({preventScroll:true});
}
function popSticker(){
  const keys=Object.keys(ST); let i; do{i=Math.floor(Math.random()*keys.length);}while(i===lastSticker);
  lastSticker=i; const el=document.getElementById('pop-star');
  el.innerHTML=stickerSvg(keys[i]); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
document.getElementById('start').addEventListener('click',openLesson);
document.getElementById('me-start').addEventListener('click',()=>{go('today');openLesson();});
document.getElementById('lesson-close').addEventListener('click',()=>closeLesson(false));
document.getElementById('say').addEventListener('click',()=>{
  if(busy) return; busy=true;
  heard.textContent='“A flat white, please.”'; heard.classList.add('good');
  document.getElementById('lesson-bar').style.width='100%';
  document.getElementById('say-label').textContent='Lovely';
  popSticker();
  setTimeout(()=>{busy=false;closeLesson(true);},900);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&lesson.classList.contains('is-on')) closeLesson(false);
  if(e.key.toLowerCase()==='d'&&!lesson.classList.contains('is-on')&&e.target.tagName!=='INPUT') document.getElementById('demo').click();
});

/* window hooks for the demo script */
window.lp={setState(s){state=s;paint();},go,openLesson,closeLesson,setTheme};
paint();
</script>
