<!doctype html>
<!--
  Talk with Maya - Learning Path prototype 01.

  Design note
  The one idea: the screen is Maya's face. One block colour, her cropped by the
  card so she fills it, and one black pill. The state of the turn is written on
  her and on the colour, never in a label: sun while she asks, sky while she
  waits with the listen face and the lean-in, mint when it lands. A learner with
  no English can tell whose turn it is from across the room.

  Deliberately left out: a progress percentage, a score, a "you said" readout, a
  second button, a card inside the card, any red. The three ink bars arrive once
  at the end and never during a turn, so a turn is a conversation and not a test.

  Standalone: open this file in a phone browser. Built from docs/prototypes/src/01-talk-with-maya.html
  by `node docs/prototypes/src/build.mjs 01-talk-with-maya`, which inlines the pre-rendered cast.
  Cast art: Open Peeps by Pablo Stanley (CC0), pre-rendered in the palette by scripts/lp/cast.mjs.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>Talk with Maya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFD93D; --sky:#BFE3FF; --mint:#A8F0C6; --tangerine:#FF5A2D;
  --ink:#121212; --cream:#FFF7E8; --paper:#FFFFFF;
  --page:var(--cream); --on-page:var(--ink);
  --pill:var(--ink); --on-pill:var(--cream);
  --block:var(--sun);
  --spring:cubic-bezier(.22,.9,.3,1.12);
}
html[data-theme="dark"]{
  --page:#121212; --on-page:var(--cream);
  --pill:var(--cream); --on-pill:var(--ink);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overflow:hidden}
body{
  margin:0; background:var(--page); color:var(--on-page);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition:background .34s ease, color .34s ease;
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
:focus-visible{outline:3px solid var(--on-page); outline-offset:3px; border-radius:6px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- shell ---------- */
.phone{
  width:min(100vw,430px); height:100dvh; max-height:100dvh;
  display:flex; flex-direction:column; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
}

/* ---------- top strip: turn progress + theme ---------- */
.top{display:flex; align-items:center; gap:14px; height:28px; flex:none}
.prog{display:flex; gap:6px; flex:1}
.seg{
  height:10px; flex:1; border-radius:99px; border:2.5px solid var(--on-page); background:transparent;
  transition:background .3s var(--spring);
}
.seg.on{background:var(--on-page)}
.theme{
  width:34px; height:34px; margin-right:-4px; border-radius:99px;
  border:2.5px solid var(--on-page); display:grid; place-items:center; flex:none;
}
.theme svg{width:17px; height:17px; display:block}
.theme .moon{display:block} .theme .sun{display:none}
html[data-theme="dark"] .theme .moon{display:none}
html[data-theme="dark"] .theme .sun{display:block}

/* ---------- the card ---------- */
.card{
  position:relative; flex:1; min-height:0; overflow:hidden;
  border:3px solid var(--ink); border-radius:28px; background:var(--block); color:var(--ink);
  transition:background .42s ease;
  animation:cardIn .5s var(--spring) both;
}
@keyframes cardIn{from{opacity:0; transform:translateY(16px) scale(.97)} to{opacity:1; transform:none}}
.card[data-state="listen"]{--block:var(--sky)}
.card[data-state="good"]{--block:var(--mint)}

.head{position:relative; z-index:3; padding:22px 22px 0}
h1{
  margin:0; font-weight:800; font-size:35px; line-height:1.04; letter-spacing:-.02em;
  animation:rise .36s var(--spring) both;
}
.lede{margin:10px 0 0; font-size:16px; line-height:1.35; max-width:16em; animation:rise .36s var(--spring) .05s both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

/* speech bubble */
.bubble{
  position:relative; margin:14px 0 0; padding:13px 16px 14px;
  background:var(--cream); border:3px solid var(--ink); border-radius:22px;
  box-shadow:5px 5px 0 var(--ink);
  font-size:20px; font-weight:700; line-height:1.28; letter-spacing:-.01em;
  animation:bubbleIn .34s var(--spring) both;
}
@keyframes bubbleIn{from{opacity:0; transform:translateY(10px) scale(.95)} to{opacity:1; transform:none}}
.bubble:after,.bubble:before{content:""; position:absolute; width:0; height:0; border-style:solid}
.bubble:before{left:30px; bottom:-19px; border-width:19px 15px 0 0; border-color:var(--ink) transparent transparent transparent}
.bubble:after{left:34px; bottom:-13px; border-width:13px 10px 0 0; border-color:var(--cream) transparent transparent transparent}
.bubble.mine{background:var(--paper)}
.bubble.mine:after{border-top-color:var(--paper)}
.w{opacity:.32; transition:opacity .12s linear; display:inline-block}
.w.said{opacity:1}
.w.now{opacity:1; animation:wordPop .22s var(--spring); text-decoration:underline; text-decoration-thickness:4px; text-underline-offset:4px}
@keyframes wordPop{from{transform:scale(.9)} 60%{transform:scale(1.07)} to{transform:scale(1)}}
.card[data-state="listen"] .w,.card[data-state="done"] .w{opacity:1}

/* ---------- Maya ---------- */
.scene{
  position:absolute; z-index:1; left:50%; bottom:-38px; width:600px; height:600px;
  margin-left:-300px; pointer-events:none;
  transform-origin:50% 85%;
  transition:transform .42s var(--spring);
  animation:popIn .55s var(--spring) both;
}
@keyframes popIn{from{opacity:0; transform:translateY(34px) scale(.9)} to{opacity:1; transform:none}}
.card[data-state="listen"] .scene{transform:translateY(16px) scale(1.07) rotate(-2.5deg)}
.card[data-state="good"] .scene{transform:translateY(-6px) scale(1.04)}
.card[data-state="miss"] .scene{transform:translateY(10px) scale(1.05) rotate(2deg)}
/* No disc behind her: the card is one block colour and she is cropped straight into it. */
.sway{width:100%; height:100%; animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.1deg) translateY(0)} 50%{transform:rotate(1.1deg) translateY(-5px)}}
.face{position:absolute; inset:0; opacity:0}
.face.on{opacity:1}
.art{width:100%; height:100%; display:block}

/* ---------- stickers ---------- */
.stick{position:absolute; z-index:2; color:var(--ink); pointer-events:none}
.stick svg{display:block}
.tw{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)} 42%{transform:scale(1.2) rotate(11deg)} 68%{transform:scale(.93) rotate(-5deg)}}
.s-star{top:96px; right:20px}
.s-squiggle{top:170px; left:14px; animation-delay:.9s}
.s-heart{bottom:26px; right:24px; animation-delay:1.8s}
.s-ear{top:214px; right:30px; opacity:0; transform:scale(.5); transition:opacity .26s, transform .34s var(--spring)}
.card[data-state="listen"] .s-ear{opacity:1; transform:none}
.s-note{top:150px; right:46px; opacity:0; transform:scale(.5)}
.card[data-state="speak"] .s-note{opacity:1; transform:none; animation:note 1.5s ease-in-out infinite}
@keyframes note{0%{opacity:0; transform:translate(0,6px) scale(.7)} 30%{opacity:1} 100%{opacity:0; transform:translate(16px,-26px) scale(1.05)}}
.burst{
  position:absolute; z-index:4; top:120px; left:50%; margin-left:-64px; width:128px; height:128px;
  opacity:0; pointer-events:none;
}
.burst.go{animation:burst .72s var(--spring) both}
@keyframes burst{0%{opacity:0; transform:scale(.3) rotate(-30deg)} 55%{opacity:1; transform:scale(1.16) rotate(10deg)} 100%{opacity:0; transform:scale(1.3) rotate(16deg)}}

/* ---------- score bars (end card) ---------- */
.bars{
  position:absolute; z-index:4; left:14px; right:14px; bottom:14px; padding:16px 18px 18px;
  background:var(--cream); border:3px solid var(--ink); border-radius:22px;
  box-shadow:5px 5px 0 var(--ink); display:none;
  animation:bubbleIn .4s var(--spring) .1s both;
}
.card[data-state="done"] .bars{display:block}
.bar + .bar{margin-top:12px}
.bar b{display:block; font-size:13px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; margin-bottom:5px}
.track{height:18px; border:3px solid var(--ink); border-radius:99px; background:var(--paper); overflow:hidden}
.fill{display:block; height:100%; width:0; background:var(--ink); border-radius:99px; transition:width .85s var(--spring)}

/* ---------- dock ---------- */
.dock{flex:none; display:flex; flex-direction:column; align-items:center; gap:8px}
.pill{
  position:relative; width:100%; height:58px; border-radius:99px;
  background:var(--pill); color:var(--on-pill);
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:19px; font-weight:800; letter-spacing:-.01em;
  transition:transform .14s var(--spring), opacity .2s;
}
.pill:active{transform:translateY(2px) scale(.985)}
/* Dimmed, but the label still clears 4.5:1 against the pill. */
.pill[disabled]{opacity:.68; cursor:default; box-shadow:none}
.pill .chev{font-size:22px; line-height:1; margin-top:-2px}
.pill svg{width:22px; height:22px; display:block}
.pill .ring{
  position:absolute; inset:-3px; border-radius:99px; border:3px solid var(--pill); opacity:0; pointer-events:none;
}
.pill.live .ring{animation:ring 1.5s ease-out infinite}
.pill.live .ring.b{animation-delay:.75s}
@keyframes ring{0%{opacity:.5; transform:scale(1)} 100%{opacity:0; transform:scale(1.14)}}
.minor{height:26px; font-size:15px; font-weight:700; text-decoration:underline; text-underline-offset:4px; opacity:.85}
.typed{display:none; width:100%; gap:8px}
.typed.show{display:flex}
.typed input{
  flex:1; min-width:0; height:50px; padding:0 16px; border-radius:99px;
  border:3px solid var(--on-page); background:var(--paper); color:var(--ink);
  font:inherit; font-size:17px; font-weight:700;
}
.typed button{
  height:50px; padding:0 20px; border-radius:99px; background:var(--pill); color:var(--on-pill);
  font-size:16px; font-weight:800; flex:none;
}
.hide{display:none !important}

@media (prefers-reduced-motion:reduce){
  .sway,.tw,.pill.live .ring,.card[data-state="speak"] .s-note{animation:none !important}
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.12s !important}
}
@media (max-height:700px){
  h1{font-size:30px} .bubble{font-size:18px} .scene{bottom:-78px}
}
</style>
</head>

      <span id="goIcon" class="hide" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="8.2" y="1.8" width="7.6" height="13" rx="3.8" fill="currentColor"/><path d="M4.8 11.2a7.2 7.2 0 0 0 14.4 0M12 18.4V22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
      <span id="goLabel">Start</span>
      <span class="chev" id="goChev" aria-hidden="true">&#187;</span>
    </button>
    <div class="typed" id="typed">
      <label class="sr" for="typedIn">Type what you would say</label>
      <input id="typedIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer">
      <button id="typedGo">Say it</button>
    </div>
    <button class="minor hide" id="minor">Type it instead</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var TURNS = [
    { maya: "Hello! What would you like?", you: "A coffee, please.",  praise: "Lovely!",  face: "happy" },
    { maya: "Here or take away?",          you: "Take away, please.", praise: "Spot on!", face: "wow"   },
    { maya: "Anything else?",              you: "No, thank you.",     praise: "That's it!", face: "laugh" }
  ];

  var el = function (id) { return document.getElementById(id); };
  var card = el("card"), headline = el("headline"), lede = el("lede");
  var bubble = el("bubble"), bubbleText = el("bubbleText"), scene = el("scene");
  var go = el("go"), goLabel = el("goLabel"), goIcon = el("goIcon"), goChev = el("goChev");
  var minor = el("minor"), typed = el("typed"), typedIn = el("typedIn"), typedGo = el("typedGo");
  var prog = el("prog"), burst = el("burst"), bars = el("bars");
  var faces = {};
  [].forEach.call(document.querySelectorAll(".face"), function (f) { faces[f.dataset.face] = f; });

  var turn = 0, scores = [], timers = [], mouth = null, rec = null, listening = false, missed = false;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- small helpers ---------- */
  function clearTimers() { timers.forEach(clearTimeout); timers = []; stopMouth(); }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function setFace(name) {
    for (var k in faces) faces[k].classList.toggle("on", k === name);
  }
  function stopMouth() { if (mouth) { clearInterval(mouth); mouth = null; } }
  function setState(s) { card.dataset.state = s; }
  function syllables(word) {
    var w = word.toLowerCase().replace(/[^a-z]/g, "");
    if (!w) return 1;
    var m = w.replace(/e$/, "").match(/[aeiouy]{1,2}/g);
    return Math.max(1, m ? m.length : 1);
  }

  /* ---------- the card ---------- */
  function say(text, mine) {
    bubble.classList.remove("hide");
    bubble.classList.toggle("mine", !!mine);
    bubbleText.innerHTML = "";
    var words = text.split(" ");
    words.forEach(function (w, i) {
      var s = document.createElement("span");
      s.className = "w";
      s.textContent = w;
      bubbleText.appendChild(s);
      if (i < words.length - 1) bubbleText.appendChild(document.createTextNode(" "));
    });
    return [].slice.call(bubbleText.querySelectorAll(".w"));
  }

  function speakAloud(text, rate) {
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = rate || 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* no voice available: the karaoke line still carries the turn */ }
  }

  /* Maya speaks: words light up one by one and the mouth swaps on the syllable beat. */
  function mayaSays(text, rate, done) {
    clearTimers();
    setState("speak");
    setFace("idle");
    var words = say(text, false);
    speakAloud(text, rate);
    var at = 0, beat = 125 / (rate || 1);
    (function next(i) {
      if (i >= words.length) {
        // `at` has accumulated the whole line by now: wait for the last word, then hand over.
        later(function () { stopMouth(); setFace("idle"); done(); }, at + 420 / (rate || 1));
        return;
      }
      var hold = (190 + syllables(words[i].textContent) * 150) / (rate || 1);
      later(function () {
        if (i) { words[i - 1].classList.remove("now"); words[i - 1].classList.add("said"); }
        words[i].classList.add("now");
        stopMouth();
        var open = false;
        setFace("talk");
        if (!reduced) {
          mouth = setInterval(function () { open = !open; setFace(open ? "idle" : "talk"); }, beat);
        }
        later(function () { stopMouth(); setFace("idle"); }, hold - 60);
      }, at);
      at += hold + 80;
      next(i + 1);
    })(0);
    later(function () {
      if (words.length) { words[words.length - 1].classList.remove("now"); words[words.length - 1].classList.add("said"); }
    }, at);
  }

  /* ---------- scoring: three honest-ish signals, never a percentage ---------- */
  function norm(s) { return s.toLowerCase().replace(/[^a-z' ]/g, "").replace(/\s+/g, " ").trim(); }
  function lev(a, b) {
    var prev = [], i, j, cur;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur = [i];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }
  function lcs(a, b) {
    var t = [], i, j;
    for (i = 0; i <= a.length; i++) { t[i] = []; for (j = 0; j <= b.length; j++) t[i][j] = 0; }
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
      t[i][j] = a[i - 1] === b[j - 1] ? t[i - 1][j - 1] + 1 : Math.max(t[i - 1][j], t[i][j - 1]);
    }
    return t[a.length][b.length];
  }
  function score(said, target) {
    var a = norm(said), b = norm(target);
    var aw = a.split(" ").filter(Boolean), bw = b.split(" ").filter(Boolean);
    var hit = bw.filter(function (w) { return aw.indexOf(w) > -1; }).length;
    var words = bw.length ? hit / bw.length : 0;
    var as = a.replace(/ /g, ""), bs = b.replace(/ /g, "");
    var sounds = Math.max(0, 1 - lev(as, bs) / Math.max(1, bs.length));
    var order = bw.length ? lcs(aw, bw) / bw.length : 0;
    var len = 1 - Math.min(1, Math.abs(aw.length - bw.length) / Math.max(2, bw.length));
    return { sounds: sounds, rhythm: order * 0.55 + len * 0.45, words: words };
  }

  /* ---------- turn flow ---------- */
  function setProg() {
    [].forEach.call(prog.children, function (s, i) { s.classList.toggle("on", i <= turn); });
    prog.setAttribute("aria-label", "Turn " + Math.min(turn + 1, TURNS.length) + " of " + TURNS.length);
  }

  function button(label, opts) {
    opts = opts || {};
    goLabel.textContent = label;
    go.disabled = !!opts.off;
    goIcon.classList.toggle("hide", !opts.mic);
    goChev.classList.toggle("hide", !opts.chev);
    go.classList.toggle("live", !!opts.live);
  }

  function askTurn() {
    setProg();
    missed = false;
    lede.classList.add("hide");
    headline.textContent = "Maya asks";
    button("Listen", { off: true });
    minor.classList.add("hide");
    typed.classList.remove("show");
    mayaSays(TURNS[turn].maya, 1, yourTurn);
  }

  function replay() {
    headline.textContent = "Once more";
    button("Listen", { off: true });
    mayaSays(TURNS[turn].maya, 0.75, yourTurn);
  }

  function yourTurn() {
    setState("listen");
    setFace("listen");
    headline.textContent = "Your turn";
    say(TURNS[turn].you, true);
    button("Say it", { mic: true });
    minor.classList.remove("hide");
    go.onclick = startListening;
  }

  function startListening() {
    if (listening) { stopListening(); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    button("Listening", { mic: true, live: true });
    listening = true;
    if (!SR) { useTyping(); return; }
    try {
      rec = new SR();
      rec.lang = "en-GB"; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = function (e) { listening = false; judge(e.results[0][0].transcript); };
      rec.onerror = function () { listening = false; useTyping(); };
      rec.onend = function () { if (listening) { listening = false; useTyping(); } };
      rec.start();
      later(function () { if (listening) stopListening(); }, 7000);
    } catch (e) { listening = false; useTyping(); }
  }

  function stopListening() {
    listening = false;
    try { if (rec) rec.stop(); } catch (e) { /* already stopped */ }
    useTyping();
  }

  function useTyping() {
    button("Say it", { mic: true });
    typed.classList.add("show");
    minor.classList.add("hide");
    typedIn.focus();
  }

  function judge(said) {
    clearTimers();
    try { if (rec) rec.abort(); } catch (e) { /* nothing to abort */ }
    listening = false;
    typed.classList.remove("show");
    typedIn.value = "";
    minor.classList.add("hide");
    var s = score(said, TURNS[turn].you);
    var avg = (s.sounds + s.rhythm + s.words) / 3;

    if (avg < 0.62) {
      missed = true;
      setState("miss");
      setFace("oops");
      headline.textContent = "Nearly";
      say(TURNS[turn].you, true);
      button("Again", { off: true });
      later(replay, 1300);
      return;
    }

    scores.push(s);
    setState("good");
    setFace(TURNS[turn].face);
    headline.textContent = TURNS[turn].praise;
    say(TURNS[turn].you, true);
    [].forEach.call(bubbleText.querySelectorAll(".w"), function (w) { w.classList.add("said"); });
    if (!reduced) { burst.classList.remove("go"); void burst.offsetWidth; burst.classList.add("go"); }
    speakAloud(TURNS[turn].praise, 1);
    button(turn === TURNS.length - 1 ? "See how you did" : "Next", { chev: true });
    go.onclick = function () {
      turn += 1;
      if (turn >= TURNS.length) finish(); else askTurn();
    };
  }

  function finish() {
    clearTimers();
    setProg();
    setState("done");
    setFace("happy");
    headline.textContent = "You did it";
    bubble.classList.add("hide");
    lede.classList.add("hide");
    button("Again", { chev: true });
    var avg = function (k) {
      if (!scores.length) return 0.7;
      return scores.reduce(function (t, s) { return t + s[k]; }, 0) / scores.length;
    };
    ["sounds", "rhythm", "words"].forEach(function (k, i) {
      var pct = Math.round(Math.max(0.3, Math.min(1, avg(k))) * 100);
      later(function () { el("f" + i).style.width = pct + "%"; }, 160 + i * 110);
    });
    go.onclick = restart;
  }

  function restart() {
    clearTimers();
    turn = 0; scores = []; missed = false;
    ["f0", "f1", "f2"].forEach(function (id) { el(id).style.width = "0"; });
    askTurn();
  }

  /* ---------- wiring ---------- */
  go.onclick = function () { restart(); };
  minor.onclick = useTyping;
  typedGo.onclick = function () { if (typedIn.value.trim()) judge(typedIn.value); };
  typedIn.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); if (typedIn.value.trim()) judge(typedIn.value); }
  });

  el("theme").onclick = function () {
    var dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    this.setAttribute("aria-pressed", String(!dark));
    document.querySelector('meta[name="theme-color"]').content = dark ? "#FFF7E8" : "#121212";
  };

  /* Board and test hooks: drive the prototype without a microphone. */
  window.PROTO = {
    start: restart,
    answer: function (text) { judge(text || TURNS[turn].you); },
    turn: function () { return turn; },
    state: function () { return card.dataset.state; }
  };
})();
</script>
</body>
</html>
